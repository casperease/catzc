# ---
# catzc:
#   derived:
#     path: automation/Catzc.Azure/configs/identity-tokens.yml
#     kind: config
# ---

# A hermetic logic test must never name these live identities; it uses the fixture each suggestion names instead.
# [comment:1](/docs/references/automation/catzc-azure/configs/identity-tokens.yml.md#comment1)
tokens:
  - config: customer
    path: customers
    take: keys
    kind: customer-key
    suggest: a fixture customer (acme / globex)
  - config: customer
    path: customers.*.shortcode
    kind: customer-shortcode
    suggest: a fixture shortcode (ac / gx)
  - config: azure
    path: org
    kind: org
    suggest: the fixture org (tst)
  - config: azure
    path: subscriptions
    take: keys
    kind: subscription
    suggest: a fixture subscription (core_lower / acme_lower)
  # Words like test and dev are ambiguous, so they match only when bound to an identity parameter, hence match: position.
  # [comment:2](/docs/references/automation/catzc-azure/configs/identity-tokens.yml.md#comment2)
  - config: azure
    path: environments
    take: keys
    kind: environment
    suggest: a fixture environment (alpha / beta / gamma / delta)
    match: position
    skip_when: per_subscription
  - config: azure
    path: environments.*.shortcode
    kind: environment-shortcode
    suggest: a fixture env shortcode (al / bt)
    match: position
    skip_when: per_subscription
