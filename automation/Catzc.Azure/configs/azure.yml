# yaml-language-server: $schema=.not-azure-schema.json
# (Pins an empty, match-anything schema.
# [comment:1](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment1)

# Global Azure identity for the templating system.
# [comment:2](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment2)

# Vertical / organization shortcode — global, one per repo.
# [ADR-AZ-NAMING](/docs/adr/azure/azure-naming-standard.md)
# [comment:3](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment3)
org: zct

# Minimum Bicep CLI version required to build/deploy templates.
# [comment:4](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment4)
bicep_min_version: "0.43.8"

# policy_enforcement — the enforcementMode of the policy assignments the templates make, per environment class: Default (enforce) or...
# [ADR-AZ-DATAMOD#11](/docs/adr/azure/azure-data-model.md#rule-adr-az-datamod11)
# [comment:5](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment5)

tenants:
  placeholder:
    id: fa0e0000-7e0a-0700-1d00-000000000000

# Customer DEFINITIONS live in configs/customer.yml (the catalogue), not here — see.
# [ADR-AZ-CUSTOMER](/docs/adr/azure/azure-customer-model.md)
# [comment:6](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment6)

# Environments.
# [ADR-AZ-NAMING](/docs/adr/azure/azure-naming-standard.md)
# [comment:7](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment7)
environments:
  dev:
    shortcode: de
    region: westeurope
    region_code: weu
  test:
    shortcode: te
    region: westeurope
    region_code: weu
  preprod:
    shortcode: pp
    region: westeurope
    region_code: weu
  prod:
    shortcode: pr
    region: westeurope
    region_code: weu
  # Per-subscription environments (per_subscription: true) — exactly one per subscription (the sub's identity env), used by...
  # [comment:8](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment8)
  nsub:
    shortcode: ns
    region: westeurope
    region_code: weu
    per_subscription: true
  psub:
    shortcode: ps
    region: westeurope
    region_code: weu
    per_subscription: true

# Subscriptions.
# [ADR-AZ-DATAMOD](/docs/adr/azure/azure-data-model.md), [ADR-AZ-NAMING](/docs/adr/azure/azure-naming-standard.md)
# [comment:9](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment9)
subscriptions:
  # The shared platform pair — the only non-customer subscriptions, so every root config's env resolves to exactly one of them (nonprod...
  # [comment:10](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment10)
  shared_nonprod:
    id: 50a0ed00-de00-50b0-0000-000000000000
    tenant: placeholder
    environments:
      - dev
      - test
      - nsub
  shared_prod:
    id: 50a0ed00-000d-50b0-0000-000000000000
    tenant: placeholder
    environments:
      - preprod
      - prod
      - psub
  # Customer subscriptions — carry a `customer` key; their configs live under the configuration/<customer>/ subfolder.
  # [comment:11](/docs/references/automation/catzc-azure/configs/azure.yml.md#comment11)
  apex_nonprod:
    id: a0e00000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: apex
    environments:
      - dev
      - test
      - nsub
  apex_prod:
    id: a0e00000-000d-50b0-0000-000000000000
    tenant: placeholder
    customer: apex
    environments:
      - preprod
      - prod
      - psub
  nova_nonprod:
    id: 000a0000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: nova
    environments:
      - dev
      - test
      - nsub
  flux_nonprod:
    id: f1000000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: flux
    environments:
      - dev
      - test
      - nsub
