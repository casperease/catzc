# Only full-path is built: selecting manifest-glob or per-folder throws NotImplemented, as a mode needs proof from pwsh and bash.
# [ADR-REPO-CONTRACT#8](/docs/adr/repository/api-contracts.md#rule-adr-repo-contract8)
# [comment:2](/docs/references/automation/catzc-base-contracts/configs/contracts.yml.md#comment2)
addressing: full-path

# A dot-prefixed root is named here because contracts/ holds no dot-prefixed folder; an unnamed module takes the repository root.
# [ADR-REPO-CONTRACT#2](/docs/adr/repository/api-contracts.md#rule-adr-repo-contract2),
# [ADR-REPO-CONTRACT#10](/docs/adr/repository/api-contracts.md#rule-adr-repo-contract10)
# [comment:3](/docs/references/automation/catzc-base-contracts/configs/contracts.yml.md#comment3)
target_roots:
  Catzc.Tooling.Github: .github
