# glossary.yml — the Catzc.Base.ModuleSystem glossary source: the vocabulary of what ships and how it advances —
# deployable-units, the release candidates built from them, and the environments' occupants ([ADR-REPO-VOCAB](/docs/adr/repository/controlled-vocabulary.md)).
# Every option is defaulted: all five checks, the whole repository, every text surface
# ([ADR-REPO-VOCAB#2](/docs/adr/repository/controlled-vocabulary.md#rule-adr-repo-vocab2)). Checked by Test-Glossary.
concepts:
  deployable-unit:
    key: deployable_unit
    domain: design
    defined_by: ADR-DSGN-TRACK#5
    short: What ships — a whole track or a reduced composition — bound one-to-one to its pipeline.
    realized_by: { kind: config-key, pattern: "automation/Catzc.Base.Globs/configs/globs.yml" }
    contrasts:
      release candidate:
        A release candidate is one commit's tagged, immutable build of a deployable-unit; a deployable-unit is the composition that ships,
        whichever commit is built.
      track:
        A track is a root concern, one root folder; a deployable-unit is what ships, composed from a whole track or a reduced part of one.
  release candidate:
    key: release_candidate
    domain: flow
    defined_by: ADR-FLOW-CD#14
    short: The immutable, tagged artifact a CI component builds from one commit — versioned, never rebuilt, promotable toward production.
    realized_by: { kind: prose-only }
    contrasts:
      deployable-unit:
        A deployable-unit is the composition that ships, whichever commit is built; a release candidate is one commit's tagged, immutable
        build of it.
      occupant:
        An occupant is the commit an environment holds; a release candidate is the artifact built from it, the same bytes wherever it is
        deployed.
      test run: A test run executes tests; a release candidate is the artifact a release-candidate test run verifies.
      test suite: A test suite is the declared selection of tests that verifies a change; a release candidate is the artifact under test.
      published artifact:
        A published artifact is any file handed across a stage boundary; a release candidate is the tagged build that gets promoted.
    avoid:
      - { phrase: release-candidate suite, say: release-candidate test run }
  published artifact:
    key: published_artifact
    domain: automation
    defined_by: ADR-AUTO-PATH#10
    short: A file one stage produces and a later stage downloads and consumes — carried by ArtifactRef, anchored on its artifact root.
    realized_by: { kind: type, pattern: "Catzc.Base.Objects.ArtifactRef" }
    contrasts:
      release candidate:
        A release candidate is the tagged build that gets promoted; a published artifact is any file handed across a stage boundary.
      contract asset:
        A contract asset is a checked-in file that states what the repository boundary requires, frozen with its unit's release; a published
        artifact is a file one stage produces and a later stage consumes within a run.
  occupant:
    key: occupant
    domain: design
    defined_by: ADR-DSGN-LIFE#5
    short: The one commit an always-on environment holds, deployed there as its release candidate — named by its environment.
    realized_by: { kind: prose-only }
    contrasts:
      release candidate:
        A release candidate is the artifact, the same bytes wherever it is deployed; an occupant is the commit one environment holds.
    avoid:
      - { phrase: current occupant, say: occupant (the <environment> occupant) }
      - { phrase: current occupants, say: occupants }
      - { phrase: resident commit, say: occupant }
  track:
    key: track
    domain: design
    defined_by: ADR-DSGN-TRACK#1
    short: A named repository root concern — one root folder, named by it, classified core, external port, adapter, or verification.
    realized_by: { kind: prose-only }
    contrasts:
      verification track: A verification track is one class of track — test-only, shipping nothing; a track is any root concern.
      deployable-unit:
        A deployable-unit is what ships, composed from a whole track or a reduced part of one; a track is the root concern itself, one root
        folder.
      file language:
        A file language is the kind of text a file holds, named by its extension; a track is the root folder the file lives in, and its
        tech-stack is a set of file languages.
      root file:
        A root file is a tracked file no track holds, at the repository root or under out/; a track is a root folder and every file under
        it.
  root file:
    key: root_file
    domain: design
    defined_by: ADR-DSGN-TRACK#7
    short: A tracked file no track holds — at the repository root itself, or under out/ — the world map's own row.
    realized_by: { kind: prose-only }
    contrasts:
      track: A track is a root folder and every file under it; a root file is a tracked file outside every track.
      unlisted file:
        An unlisted file is a tracked file outside every file language, whatever its track; a root file is one outside every track, whatever
        its file language.
  file language:
    key: file_language
    domain: design
    defined_by: ADR-DSGN-TRACK#6
    short:
      The language a tracked file is written in, named by its extension — PowerShell, C#, YAML, Bicep, Markdown, Python; a track's
      tech-stack is a set of them.
    realized_by: { kind: prose-only }
    contrasts:
      track: A track is a root folder and the concern it holds; a file language is the kind of text one file holds, wherever it lives.
      language zone:
        A language zone is one of the design, test, and live registers of identities; a file language is the kind of text one file holds.
      unlisted file:
        An unlisted file is a tracked file no file language names — no extension, or one no entry lists; a file language is a registered
        kind of text, named by its extensions.
  unlisted file:
    key: unlisted_file
    domain: design
    defined_by: ADR-DSGN-TRACK#8
    short: A tracked file no file language names — no extension, or one no entry lists — the world map's own column.
    realized_by: { kind: prose-only }
    contrasts:
      file language:
        A file language is a registered kind of text, named by its extensions; an unlisted file is a tracked file whose extension none of
        them lists.
      root file:
        A root file is a tracked file outside every track; an unlisted file is a tracked file outside every file language, whatever its
        track.
  world map:
    key: world_map
    domain: design
    defined_by: ADR-DSGN-TRACK#9
    short:
      The repository drawn as tracks crossed with file languages, plus a row for the root files and a column for the unlisted files — every
      tracked file in exactly one cell.
    realized_by: { kind: prose-only }
    contrasts:
      cell:
        A cell is one row crossed with one column; the world map is the whole grid of them, computed from the registries and the git index.
  cell:
    key: cell
    domain: design
    defined_by: ADR-DSGN-TRACK#10
    short: One row crossed with one column of the world map — the tracked files of one track in one file language, and their count.
    realized_by: { kind: prose-only }
    contrasts:
      world map: The world map is the whole grid; a cell is one intersection of it, holding the files of one track in one file language.
      stack violation:
        A stack violation is a cell holding a live file outside its track's file languages; a cell is any intersection, allowed or not.
      lit cell: A lit cell is a cell a highlight selects; a cell is any intersection, lit or not.
  stack violation:
    key: stack_violation
    domain: design
    defined_by: ADR-DSGN-TRACK#11
    short:
      A world-map cell holding a live file whose file language its track does not declare — the second tech-stack ADR-DSGN-TRACK#3 forbids.
    realized_by: { kind: prose-only }
    contrasts:
      cell: A cell is any intersection of the world map; a stack violation is a cell that breaks its track's tech-stack.
      lit cell:
        A lit cell is selected by a highlight and says nothing about the stack; a stack violation is a finding, marked whatever the
        highlight.
  lit cell:
    key: lit_cell
    domain: design
    defined_by: ADR-DSGN-TRACK#12
    short: A world-map cell a highlight selects — an ADR code or a set of files names the files it concerns, and their cells light.
    realized_by: { kind: prose-only }
    contrasts:
      cell: A cell is any intersection of the world map; a lit cell is one a highlight selects.
      stack violation:
        A stack violation is a finding about a cell's files; a lit cell is a selection, made by a highlight, that never judges the cell.
