# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.ModuleSystem/configs/files.yml
#     kind: config
# ---

# Package names are globally unique because a package is the unit -ExcludePackages drops; only modules owning extras appear.
# [comment:1](/docs/references/automation/catzc-base-modulesystem/configs/files.yml.md#comment1)
modules:
  .internal:
    packages:
      entrypoint:
        - importer.ps1
  Catzc.Base.TypesSystem:
    packages:
      csproj:
        - automation/.internal/assets/Catzc.Types.csproj
        - catzc.sln
  Catzc.Base.Repository:
    packages:
      root_configs:
        - .editorconfig
        - .gitattributes
        - .markdownlint.yml
        - .markdownlintignore
        - .prettierrc.yml
        - .prettierignore
        - automation/.internal/assets/PSScriptAnalyzerSettings.psd1
        - cspell.yml
        - .cspell
        - dotnet-tools.json
      gitignore:
        - .gitignore
