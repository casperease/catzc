# files.yml — module -> packages, for Copy-Automation (Catzc.Base.ModuleSystem).
# [comment:1](/docs/references/automation/catzc-base-modulesystem/configs/files.yml.md#comment1)
modules:
  .internal:
    packages:
      entrypoint:
        - importer.ps1
  Catzc.Base.TypesSystem:
    packages:
      csproj:
        - automation/.internal/assets/Catzc.Types.csproj
        - catzc.sln
  Catzc.Base.Repository:
    packages:
      root_configs:
        - .editorconfig
        - .gitattributes
        - .markdownlint.yml
        - .markdownlintignore
        - .prettierrc.yml
        - .prettierignore
        - automation/.internal/assets/PSScriptAnalyzerSettings.psd1
        - cspell.yml
        - .cspell
        - dotnet-tools.json
      gitignore:
        - .gitignore
