  # Edges to Base, to the Catzc.Azure root and to Tooling are declared per member under modules, not in this DAG.
  # [comment:3](/docs/references/automation/catzc-base-modulesystem/configs/dependencies.yml.md#comment3)
  AzureExt:
    Catzc.Azure.Cli: []
    Catzc.Azure.DevOps: [Catzc.Azure.Cli]
    Catzc.Azure.DevOps.BuildValidation: [Catzc.Azure.DevOps]
    Catzc.Azure.Firewall: [Catzc.Azure.Cli]
    Catzc.Azure.Templates: [Catzc.Azure.Cli]

  # Provisioning reaches the per-tool installers by dynamic dispatch, so no static edge shows, yet it may depend on them.
  # [comment:4](/docs/references/automation/catzc-base-modulesystem/configs/dependencies.yml.md#comment4)
  Tooling:
    Catzc.Tooling.Core: []
    Catzc.Tooling.Environment: []
    Catzc.Tooling.Python: [Catzc.Tooling.Core]
    Catzc.Tooling.Node: [Catzc.Tooling.Core]
    Catzc.Tooling.Toolchain: [Catzc.Tooling.Core]
    Catzc.Tooling.Provisioning: [Catzc.Tooling.Core, Catzc.Tooling.Python, Catzc.Tooling.Node, Catzc.Tooling.Toolchain]

