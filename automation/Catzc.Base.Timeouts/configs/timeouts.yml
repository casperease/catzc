# Time safeguards — how long a call may run before it is stopped. Loaded by Get-Config -Config timeouts and
# validated by the TimeoutsConfig type; read through Get-TimeoutSeconds. Every value is a positive whole number
# of seconds: there is no "no limit" value, so every call runs inside a safeguard.
#
# Consumers:
#   - Invoke-Executable (streamed mode) kills a child process that outlives its limit;
#   - Invoke-WithTimeout / Assert-CompletesWithin stop a script block that outlives its limit;
#   - the Claude Code PreToolUse hook (.claude/hooks/Assert-BashTimeout.ps1) caps every foreground Bash call an
#     agent makes at default_seconds.
#
# The default is deliberately tight while the blockers are tuned: a call that legitimately needs longer gets an
# entry under `executables`, not a raised default.

# The limit for any call without a more specific entry below.
default_seconds: 10

# Per-executable limits, keyed by the executable's name without directory or extension (`dotnet`, not
# `C:\...\dotnet.exe`). These are the tools whose ordinary runs outlast the default.
executables:
  pwsh: 1800 # isolated test runs (Test-InIsolation) and snapshot imports
  dotnet: 600 # builds
  npm: 600 # package installs
  npx: 600 # first-run package fetches
  uv: 600 # Python toolchain and package installs
  poetry: 600 # dependency resolution and installs
  python: 600 # arbitrary scripts
  pyspark: 3600 # interactive sessions
  java: 600 # arbitrary programs
  terraform: 1800 # plan / apply
  az: 1800 # deployments
  winget: 1800 # installs
  brew: 1800 # installs
  sudo: 1800 # system package installs
  tar: 300 # archive extraction
  gh: 120 # API calls over the network
