# Time safeguards — how long a call may run before it is stopped. Loaded by Get-Config -Config timeouts and
# validated by the TimeoutsConfig type; read through Get-TimeoutSeconds. Every value is a positive whole number
# of seconds: there is no "no limit" value, so every call runs inside a safeguard.
#
# Consumers:
#   - Invoke-Executable (streamed mode) kills a child process that outlives its limit;
#   - Invoke-WithTimeout / Assert-CompletesWithin stop a script block that outlives its limit;
#   - the Claude Code PreToolUse hook (.claude/hooks/Assert-BashTimeout/, a C# program Build-BashTimeoutHook
#     publishes on import) bounds every Bash call an agent makes, foreground and background.
#
# Limits are keyed by environment (devbox | pipeline) and shell (bash | pwsh):
#
#   limits:
#     <devbox|pipeline>:
#       bash: { foreground: <s>, background: <s> }   # the hook's limits for a Claude/agent Bash call
#       pwsh: <s>                                    # Invoke-WithTimeout and Invoke-Executable without an entry
#
# Every key is optional: the sensible defaults are declared once, on TimeoutsConfig, so this file states only what
# has been tuned. The devbox defaults are deliberately tight while the blockers are tuned: a call that
# legitimately needs longer gets an entry under `executables` or a budget, not a raised default.

# Per-executable limits, keyed by the executable's name without directory or extension (`dotnet`, not
# `C:\...\dotnet.exe`). These are the tools whose ordinary runs outlast the default.
executables:
  pwsh: 1800 # isolated test runs (Test-InIsolation) and snapshot imports
  dotnet: 600 # builds
  npm: 600 # package installs
  npx: 600 # first-run package fetches
  uv: 600 # Python toolchain and package installs
  poetry: 600 # dependency resolution and installs
  python: 600 # arbitrary scripts
  pyspark: 3600 # interactive sessions
  java: 600 # arbitrary programs
  terraform: 1800 # plan / apply
  az: 1800 # deployments
  winget: 1800 # installs
  brew: 1800 # installs
  sudo: 1800 # system package installs
  tar: 300 # archive extraction
  gh: 120 # API calls over the network
  cspell: 120 # whole-repo spell check: 6.4 s alone, killed at 10 s under the parallel test load (probe 2026-10-14)
  prettier: 120 # whole-repo format check: 4.4 s alone, near the default under load
  markdownlint-cli2: 120 # whole-repo lint: 2.1 s alone, kept clear of the default under load
  bash: 1800 # Linux/macOS install scripts (dotnet-install.sh downloads the SDK)
  dpkg: 600 # Linux package removal
  go: 900 # module downloads, go vet and go test runs: the first compile of the Go runtime alone takes over 9 s
