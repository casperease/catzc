# Root config registry — repository-root files fully managed by the source-of-truth automation.
# [ADR-AUTO-PATH](/docs/adr/automation/path-representation.md), [ADR-REPO-ROOTCFG](/docs/adr/repository/generated-root-configs.md)
# [comment:1](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment1)
files:
  - target: PSScriptAnalyzerSettings.psd1
    source: automation/.internal/assets/PSScriptAnalyzerSettings.psd1
    copyAsLink: true
    optIn: true
  # importer.ps1 has TWO valid source-of-truth forms, swapped by editing this entry alone: generator: New-Importer — the live form: the...
  # [comment:2](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment2)
  - target: importer.ps1
    generator: New-Importer
    committed: true
    optIn: true
  # importer.sh — the bash (and zsh) entry: sourced, it defines the `cats` dispatcher that runs catzc commands through pwsh.
  # [ADR-AUTO-ENGINE](/docs/adr/automation/execution-engines.md)
  # [comment:3](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment3)
  - target: importer.sh
    source: automation/Catzc.Base.RootConfig/assets/root/importer.sh
    comment: hash
    committed: true
    optIn: true
  # The three generated.vscode/ files are gitignored generated copies (committed: false) — the editor greys them and a fresh clone...
  # [comment:4](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment4)
  - target: .vscode/settings.json
    generator: New-VSCodeSettings
    optIn: true
  - target: .vscode/extensions.json
    generator: New-VSCodeExtensions
    optIn: true
  - target: .vscode/launch.json
    generator: New-VSCodeLaunch
    optIn: true
  # The Azure Pipelines schema the extension validates our.yaml against (wired via azure-pipelines.customSchemaFile in vscode-settings.yml).
  # [comment:5](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment5)
  - target: .vscode/azure-pipelines-schema.json
    generator: New-VSCodePipelineSchema
    optIn: true
  # The Go test workspace (Catzc.Base.Languages, New-GoWorkspace): go.work at the repository root, and one go.mod per Go test module...
  # [comment:6](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment6)
  - target: go.work
    generator: New-GoWorkspace
    optIn: true
  - target: "*/tests/*/go.mod"
    generator: New-GoWorkspace
    optIn: true
  # The Python test workspace (Catzc.Base.Languages, New-PythonProject): the uv workspace root pyproject.toml in the Python root...
  # [comment:7](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment7)
  - target: "*/pyproject.toml"
    generator: New-PythonProject
    optIn: true
  - target: "*/tests/*/pyproject.toml"
    generator: New-PythonProject
    optIn: true
  - target: .vscode/markdown-preview-dark.css
    source: automation/Catzc.Base.VSCode/assets/markdown-preview-dark.css
    copyAsLink: true
    optIn: true
  - target: .editorconfig
    source: automation/Catzc.Base.RootConfig/assets/root/.editorconfig
    copyAsLink: true
    optIn: true
  - target: .markdownlint.yml
    source: automation/Catzc.Base.RootConfig/assets/root/.markdownlint.yml
    copyAsLink: true
    optIn: true
  # The ignore files and cspell.yml stay generated COPIES until the symlink path is verified on Linux (the tools may resolve relative...
  # [comment:8](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment8)
  - target: .markdownlintignore
    source: automation/Catzc.Base.RootConfig/assets/root/.markdownlintignore
    comment: hash
    optIn: true
  - target: .prettierrc.yml
    source: automation/Catzc.Base.RootConfig/assets/root/.prettierrc.yml
    copyAsLink: true
    optIn: true
  - target: .prettierignore
    source: automation/Catzc.Base.RootConfig/assets/root/.prettierignore
    comment: hash
    optIn: true
  # The nested ignore for the generated.cspell/ dictionaries.
  # [comment:9](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment9)
  - target: .cspell/.gitignore
    source: automation/Catzc.Base.RootConfig/assets/root/.cspell/.gitignore
    comment: hash
    optIn: true
  - target: cspell.yml
    source: automation/Catzc.Base.RootConfig/assets/root/cspell.yml
    comment: hash
    optIn: true
  # JSON has no comment syntax (and the dotnet manifest parser rejects // line comments), so the managed-file marker travels IN the...
  # [comment:10](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment10)
  - target: dotnet-tools.json
    source: automation/Catzc.Base.RootConfig/assets/root/dotnet-tools.json
    copyAsLink: true
    optIn: true
  # MSBuild's solution parser requires the 'Format Version' line at the top, so the managed-file note lives inside the source's own '#'...
  # [comment:11](/docs/references/automation/catzc-base-rootconfig/configs/rootconfig.yml.md#comment11)
  - target: catzc.sln
    source: automation/Catzc.Base.RootConfig/assets/root/catzc.sln
    copyAsLink: true
    optIn: true
  - target: .gitattributes
    source: automation/Catzc.Base.RootConfig/assets/root/.gitattributes
    comment: hash
    committed: true
    optIn: true
  - target: .gitignore
    generator: New-GitIgnore
    committed: true
    optIn: true
