version: "0.2"
language: en,en-GB
# This is the repository's ONE spelling config (the root cspell.yml is a managed copy-in of this source — see rootconfig.yml).
# [comment:1](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment1)
noConfigSearch: true
ignorePaths:
  - .git/**
  - automation/.vendor/**
  # Every other vendored tree, such as the bats-core runner under the Bash root.
  - "**/.vendor/**"
  # Vendored, downloaded third-party install scripts (.NET Foundation dotnet-install.*) — never authored here, and they carry...
  # [comment:2](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment2)
  - "**/assets/scripts/dotnet-install.*"
  - "**/types/.compiled/**"
  # Per-slot template configs hold Azure resource names assembled by the naming convention (deweuzctexpedapst: env, region, org,...
  # [ADR-AUTO-SPELL#4](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell4),
  # [ADR-AZ-DATAMOD#6](/docs/adr/azure/azure-data-model.md#rule-adr-az-datamod6)
  # [comment:3](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment3)
  - infrastructure/templates/**/configuration/**
  # IDE-only C# project (Catzc.Types.csproj) MSBuild output — transient, gitignored, never authored.
  - obj/**
  - bin/**
  - cspell.yml
  - "**/*.dll"
  - "**/*.pdb"
  - "**/*.p7s"
  - "**/*.exe"
  - "**/*.png"
  - "**/*.pdf"
# GUID literals are not words: the managed-GUID gate (Catzc.Base.QualityGates configs/guids.yml, Get-RepositoryGuids) is their single...
# [comment:4](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment4)
ignoreRegExpList:
  - /\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b/g
# Approved-vocabulary dictionaries — one per registry category — generated from the terminology registry...
# [ADR-AUTO-SPELL#6](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell6),
# [ADR-AUTO-SPELL](/docs/adr/automation/spell-out-names.md),
# [ADR-AUTO-SPELL#5](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell5),
# [ADR-AUTO-SPELL#8](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell8)
# [comment:5](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment5)
dictionaryDefinitions:
  - name: catzc-terms-product
    path: ./.cspell/product.txt
  - name: catzc-terms-abbreviation
    path: ./.cspell/abbreviation.txt
  - name: catzc-terms-fixture
    path: ./.cspell/fixture.txt
  - name: catzc-terms-azure-live
    path: ./.cspell/azure-live.txt
  - name: catzc-terms-adr-example
    path: ./.cspell/adr-example.txt
  - name: catzc-terms-adr
    path: ./.cspell/adr.txt
  - name: catzc-terms-ado
    path: ./.cspell/ado.txt
  - name: catzc-terms-azure
    path: ./.cspell/azure.txt
  - name: catzc-terms-tool
    path: ./.cspell/tool.txt
  - name: catzc-terms-platform
    path: ./.cspell/platform.txt
  - name: catzc-terms-powershell
    path: ./.cspell/powershell.txt
  - name: catzc-terms-coined
    path: ./.cspell/coined.txt
  - name: catzc-terms-person
    path: ./.cspell/person.txt
dictionaries:
  - catzc-terms-product
  - catzc-terms-abbreviation
  - catzc-terms-fixture
  - catzc-terms-azure-live
  - catzc-terms-adr-example
  - catzc-terms-adr
  - catzc-terms-ado
  - catzc-terms-azure
  - catzc-terms-tool
  - catzc-terms-platform
  - catzc-terms-powershell
  - catzc-terms-coined
  - catzc-terms-person
languageSettings:
  - languageId: powershell
    dictionaries:
      # cspell's built-in PowerShell dictionary.
      # [ADR-AUTO-SPELL#2](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell2),
      # [ADR-AUTO-SPELL#5](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell5)
      # [comment:6](/docs/references/automation/catzc-base-rootconfig/assets/root/cspell.yml.md#comment6)
      - powershell
  - languageId: markdown
    dictionaries:
      - powershell
      - csharp
      - dotnet
  - languageId: csharp
    dictionaries:
      - csharp
      - dotnet
    words:
      - slnx
