# The single config for how this repository exports itself as the installable, versioned Catzc build.
#
# Build-Modules / Export-Catzc read their defaults from here (Get-Config -Config exporter); explicit params
# override for ad-hoc builds. Because every read routes through the Get-Config / Resolve-ConfigEntry seam,
# Pester tests swap in a fixture exporter.yml to vary these options without touching the shipped config — the
# repo keeps exactly one real export config. Validated on load by Assert-ExporterConfig.
# See docs/adr/automation/platform-bundle.md.

# Versions (Resolve-CatzcBuildVersion turns -Version auto into one of these):
#   direct_install_version — numeric MAJOR.MINOR.PATCH placeholder every devbox build carries
#                            (out/automation/build/Catzc/<v>/); obviously not a real number, and a rebuild
#                            overwrites it in place. A pipeline build never uses it.
#   version                — numeric MAJOR.MINOR of a pipeline build; its PATCH is the first-parent commit count
#                            of the built commit, so the same commit always gets the same version.
direct_install_version: 6.6.666
version: '0.1'

# The default build shape:
#   default_profile — the module set to build when neither -Module nor -ModuleProfile is given (a profiles.yml
#                     key: full builds everything).
#   vendor_policy   — runtime ships only the runtime-required vendored module (powershell-yaml); full also
#                     ships Pester/PSScriptAnalyzer for a build that runs the test suite.
default_profile: full
vendor_policy: runtime

# Package identity and metadata — Build-Modules hands these to the build engine, which writes them into the
# build's top-level Catzc.psd1 (the manifest Install-PSResource and the PowerShell Gallery read). module_guid is
# the module's stable identity across versions (a registered managed GUID, ADR-AUTO-GUIDS).
module_guid: 211b36c7-f7eb-4f3c-93f5-9132b535fa56
package:
  author: Casper Leon Nielsen
  company: Catzc
  description: Catzc (cats) — a zero-ceremony PowerShell 7 module system, packaged as an installable, content-addressed bundle.
  tags:
    - catzc
    - cats
    - powershell
    - automation
    - module-system
    - azure
    - azure devops
    - azure cli
    - azure bicep
    - azure infrastructure templates
  project_uri: https://github.com/casperease/catzc
  license_uri: https://github.com/casperease/catzc/blob/main/LICENSE
