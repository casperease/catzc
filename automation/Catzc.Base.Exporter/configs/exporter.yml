# Tests swap in a fixture exporter.yml through the Get-Config seam, so the repo keeps exactly one real export config.
# [ADR-AUTO-BUNDLE](/docs/adr/automation/platform-bundle.md)
# [comment:1](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment1)

# A devbox build always carries this obviously fake version, so a rebuild overwrites it in place; a pipeline never uses it.
# [comment:2](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment2)
direct_install_version: 6.6.666

# Each bundle versions on its own line, so no bundle's version ever moves another's.
# [comment:3](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment3)
bundles:
  full:
    profile: full
    version: "0.1"
    max_files: 480
    max_bytes: 6800000
  azure:
    profile: azure
    version: "0.1"
    max_files: 460
    max_bytes: 6700000
  minimal:
    profile: minimal
    version: "0.1"
    max_files: 290
    max_bytes: 2950000
default_bundle: full

# module_guid is the module's stable identity across versions; the package block feeds the top-level Catzc.psd1.
# [ADR-AUTO-GUIDS](/docs/adr/automation/managed-guids.md)
# [comment:4](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment4)
module_guid: 211b36c7-f7eb-4f3c-93f5-9132b535fa56
package:
  author: Casper Leon Nielsen
  company: Catzc
  description: Catzc (cats) — a zero-ceremony PowerShell 7 module system, packaged as an installable, content-addressed bundle.
  tags:
    - catzc
    - cats
    - powershell
    - automation
    - module-system
    - azure
    - azure devops
    - azure cli
    - azure bicep
    - azure infrastructure templates
  project_uri: https://github.com/casperease/catzc
  license_uri: https://github.com/casperease/catzc/blob/main/LICENSE
