# The single config for how this repository exports itself as the installable, versioned Catzc build.
# [ADR-AUTO-BUNDLE](/docs/adr/automation/platform-bundle.md)
# [comment:1](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment1)

# direct_install_version — the numeric MAJOR.MINOR.PATCH placeholder every devbox build carries...
# [comment:2](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment2)
direct_install_version: 6.6.666

# The named bundles.
# [comment:3](/docs/references/automation/catzc-base-exporter/configs/exporter.yml.md#comment3)
bundles:
  full:
    profile: full
    version: "0.1"
    max_files: 480
    max_bytes: 6800000
  azure:
    profile: azure
    version: "0.1"
    max_files: 460
    max_bytes: 6700000
  minimal:
    profile: minimal
    version: "0.1"
    max_files: 290
    max_bytes: 2950000
default_bundle: full

