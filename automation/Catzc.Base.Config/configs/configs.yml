# Config registry for Get-Config: every shipped config's C# config type (Test-ShippedConfigs checks that each
# shipped configs/<name>.yml has an entry and loads, and that each entry names a shipped config).
#
#   <config-name>:
#     type: <C# FQN>         # construct [FQN]::new($dict) — maps + validates
#
# The registry validates ITSELF: the 'configs' config (this file) is validated by the C# type below.
# Get-ConfigRegistry constructs it on load.
configs:
  configs:
    type: Catzc.Base.Config.ConfigsConfig
  terminology:
    type: Catzc.Base.QualityGates.TerminologyConfig
  links:
    type: Catzc.Base.QualityGates.LinksConfig
  test-policy:
    type: Catzc.Base.QualityGates.TestPolicyConfig
  readme:
    type: Catzc.Base.Docs.DocsConfig
  rootconfig:
    type: Catzc.Base.RootConfig.RootConfigFiles
  gitignore:
    type: Catzc.Base.Git.GitIgnoreConfig
  globs:
    type: Catzc.Base.Globs.GlobsConfig
  adrs:
    type: Catzc.Base.Docs.AdrsConfig
  agents:
    type: Catzc.Base.Docs.AgentsConfig
  glossary:
    type: Catzc.Base.Docs.GlossaryConfig
  reports:
    type: Catzc.Base.Reports.ReportsConfig
  output-formats:
    type: Catzc.Base.Reports.OutputFormatsConfig
  tools:
    type: Catzc.Tooling.Core.ToolsConfig
  dependencies:
    type: Catzc.Base.ModuleSystem.DependenciesConfig
  files:
    type: Catzc.Base.ModuleSystem.FilesConfig
  profiles:
    type: Catzc.Base.ModuleSystem.ProfilesConfig
  analyzer-adr-map:
    type: Catzc.Base.QualityGates.AnalyzerAdrMapConfig
  vendor:
    type: Catzc.Base.Vendor.VendorConfig
  timeouts:
    type: Catzc.Base.Timeouts.TimeoutsConfig
  timeout-exemptions:
    type: Catzc.Base.Timeouts.TimeoutExemptionsConfig
  guids:
    type: Catzc.Base.QualityGates.GuidsConfig
  exporter:
    type: Catzc.Base.Exporter.ExporterConfig
  vscode-extensions:
