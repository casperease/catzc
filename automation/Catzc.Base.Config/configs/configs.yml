  vscode-launch:
    type: Catzc.Base.VSCode.VscodeLaunchConfig
  key-handler-bindings:
    type: Catzc.Tooling.KeyHandler.KeyHandlerBindingsConfig
  key-handler-supported:
    type: Catzc.Tooling.KeyHandler.KeyHandlerSupportedConfig
  variants:
    type: Catzc.Base.Variants.VariantsConfig
  customer:
