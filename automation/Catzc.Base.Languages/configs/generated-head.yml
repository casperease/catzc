# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.Languages/configs/generated-head.yml
#     kind: config
#     language: yaml
#     filekind: yml
#     track: automation
#     module: Catzc.Base.Languages
# ---

# The keys of the generated-file head in writing order; source follows path so no word before it reads as a qualifier of the glossary's source term.
keys:
  - path
  - source
  - kind
  - language
  - filekind
  - track
  - module
  - generator
