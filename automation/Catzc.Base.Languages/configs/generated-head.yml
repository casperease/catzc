# The keys of the generated-file head in writing order; the body hash opens it as in every imprinted block, and source follows path so no
# word before it reads as a qualifier of the glossary's source term.
keys:
  - with_body_sha
  - path
  - source
  - kind
  - subkind
  - language
  - filetype
  - track
  - tracktype
  - vendor
  - module
  - moduletype
  - generator
