# ---
# catzc:
#   immutable:
#     path: automation/Catzc.Base.Languages/configs/file-carriers.yml
#     folder: configs
#     name: file-carriers
#     filetype: yml
#     kind: config
#     language: yaml
#     track: automation
#     tracktype: modules
#     module: Catzc.Base.Languages
#     moduletype: pwsh-folder
#     catzc_bundle: azure
#   edges:
#     page: docs/references/automation/catzc-base-languages/configs/file-carriers.yml.md
# ---

carriers:
  # Front matter is the Markdown convention, and the reserved catzc key is the block.
  markdown: { carrier: front-matter }

  # An editor that reads skills validates the top level of a capability's front matter and leaves `metadata` free, so the block nests there.
  capability: { files: [".claude/skills/**/SKILL.md"], carrier: front-matter, key: metadata.catzc }

  # A block-comment head at the top holding the same front matter a Markdown file has; a #Requires or help block may follow it.
  powershell: { carrier: comment-head, block: ["<#", "#>"] }
  csharp: { carrier: comment-head, block: ["/*", "*/"] }
  yaml: { carrier: comment-head, line: "#" }
  pipeline-yaml: { carrier: comment-head, line: "#" }
  bicep: { carrier: comment-head, line: "//" }
  go: { carrier: comment-head, line: "//" }

  # The shebang or the encoding line must stay among the first lines, so the head follows it.
  python: { carrier: comment-head, line: "#", anchor: after-shebang }
  bash: { carrier: comment-head, line: "#", anchor: after-shebang }

  # XML carries no block, for the reason it states; HTML takes its block below the doctype, which must stay first.
  xml: { carrier: none, reason: "an XML comment may not contain '--', so the front matter fence would make the file invalid" }
  html: { carrier: comment-head, block: ["<!--", "-->"], anchor: after-prolog }
  # A processing instruction may hold the fence the comment may not, and MSBuild reads a project that opens with one.
  msbuild-project:
    { files: ["automation/.internal/assets/Catzc.Types.csproj"], carrier: comment-head, block: ["<?catzc", "?>"], anchor: after-prolog }
  css: { carrier: comment-head, block: ["/*", "*/"] }

  # The byte order mark, a blank line and the format line stay first, and the head follows them.
  solution: { carrier: comment-head, line: "#", anchor: after-preamble, preamble_lines: 2 }

  # JSON has no comments, so the block is an ignored property, as dotnet-tools.json already carries its marker.
  json: { carrier: property, property: "//" }

  # The generated editor files are JSON with comments, so a line-comment head fits where a property would show as an unknown setting.
  jsonc: { files: [".vscode/settings.json", ".vscode/extensions.json", ".vscode/launch.json"], carrier: comment-head, line: "//" }

  jsonl: { carrier: none, reason: "one record per line by definition, so a head would be a record" }
  stamp: { carrier: none, reason: "a stamp is written whole by the generator that records it, and its value is the file" }
  asset: { carrier: none, reason: "a binary file, so the description beside it carries what a reader needs" }

  # Classes of files that belong to no language.
  diagram:
    files: ["docs/.assets/**/*.drawio.png"]
    carrier: sidecar
    sidecar: "{base}.md"
    # The block of a diagram lives in the description beside it; a diagram without one is listed with the reason, never skipped.
    exclude:
      "docs/.assets/azure/azure-name-assembly.drawio.png": "no description page has been written yet"
      "docs/.assets/commits-quality/10-commits-story.drawio.png": "no description page has been written yet"
      "docs/.assets/commits-quality/commit-lifecycle-states.drawio.png": "no description page has been written yet"
      "docs/.assets/commits-quality/state-changes.drawio.png": "no description page has been written yet"
      "docs/.assets/commits-quality/sync-point.drawio.png": "no description page has been written yet"
  dotfile:
    {
      files: ["**/.editorconfig", "**/.gitignore", "**/.gitattributes", "**/.prettierignore", "**/.markdownlintignore"],
      carrier: comment-head,
      line: "#",
    }
  word-list: { files: [".cspell/*.txt"], carrier: comment-head, line: "#" }
  json-schema: { files: ["**/azure-pipelines-schema.json"], carrier: property, property: "$comment" }
  toml: { files: ["**/*.toml"], carrier: comment-head, line: "#" }
  go-workspace: { files: ["**/go.work", "**/go.mod"], carrier: comment-head, line: "//" }
  lock-file: { files: ["**/*.lock"], carrier: none, reason: "written whole by the package manager that owns it" }
  placeholder: { files: ["**/.gitkeep"], carrier: comment-head, line: "#" }
  delimited-data: { files: ["**/*.csv", "**/*.tsv"], carrier: none, reason: "a header row and records only, so a head would be a record" }
  license: { files: ["**/LICENSE", "**/LICENSE.txt"], carrier: none, reason: "legal text kept verbatim" }
  build-output:
    { files: ["**/*.dll", "**/*.pdb", "**/*.p7s"], carrier: none, reason: "a compiled or signed binary whose identity is its hash" }
