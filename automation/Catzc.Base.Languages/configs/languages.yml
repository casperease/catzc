# The file-language registry — every file language the repository's tracked files are written in, each named by its
# extensions ([ADR-DSGN-TRACK#6](/docs/adr/design/tracks.md#rule-adr-dsgn-track6)). A track's tech-stack is the set of
# file languages it declares in variants.yml (`tracks:`); this registry makes that set checkable. Every extension
# belongs to exactly one file language; an extension no entry lists has no file language.
#
# Formatting is configured here, not programmed
# ([ADR-PRIN-CONFIG#1](/docs/adr/principles/configure-not-program.md#rule-adr-prin-config1)): an entry names the
# formatter engine for its files, and Format-Code (Catzc.Base.QualityGates) runs it; Test-Formatting checks the same
# entries. Supporting a language on an existing engine is one line here. A language with nothing to format says why.
# The editor reads the same entries: the root-config generator sets each language's VS Code default formatter to its
# engine's extension and recommends that extension, so Format Document and Format-Code run the same engine
# ([ADR-REPO-FORMAT#8](/docs/adr/repository/uniform-formatting.md#rule-adr-repo-format8)).
#
# Per engine (engines:):
#   vscode_extension  the VS Code extension that runs the engine in the editor; omitted = the editor has none
#   settings          the repository files whose content decides what the engine writes — its configuration and the
#                     tool registry whose pin names its version; a change to one invalidates Format-Code's result cache
#                     for that engine; omitted = none
#
# Per language (languages:):
#   extensions       the extensions that name the language, lowercase, each with its leading dot
#   formatter        the formatter engine: prettier | gofmt | ruff | psscriptanalyzer | dotnet-format | bicep
#   no_formatter     instead of formatter: why the language has none (exactly one of the two)
#   vscode_language  the VS Code language id of its files; omitted = the language's own name
#   adr_folder       its ADR folder under docs/adr/; omitted = none
#   checks           the quality gates Test-Change runs over a changed file of the language, in this order; a gate
#                    with a -Path parameter is given the changed files, any other runs whole and its issues are kept
#                    when they name a changed file; omitted = none
#
# The defaults and the engine list are declared once on Catzc.Base.Languages.LanguagesConfig
# ([ADR-AUTO-DEFAULT#6](/docs/adr/automation/sensible-defaults.md#rule-adr-auto-default6)). Loaded via
# Get-Config -Config languages and read through Get-FileLanguage.
#
# YAML is two file languages: executable pipeline YAML is `.yaml`, configuration data is `.yml`
# ([ADR-PIPE-NAME#6](/docs/adr/pipelines/pipeline-naming-and-placement.md#rule-adr-pipe-name6)).
engines:
  # Prettier, for every language that names it; the extension reads the same .prettierrc.yml and .editorconfig.
  prettier:
    vscode_extension: esbenp.prettier-vscode
    settings:
      - automation/Catzc.Base.RootConfig/assets/root/.prettierrc.yml
      - automation/Catzc.Base.RootConfig/assets/root/.prettierignore
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
      - automation/Catzc.Base.Execution/configs/tools.yml
  # gofmt through the Go extension, which runs the managed go the settings generator injects as go.goroot.
  gofmt:
    vscode_extension: golang.go
    settings:
      - automation/Catzc.Base.Execution/configs/tools.yml
  # ruff through the Ruff extension, with the pinned ruff from the Python test workspace's environment.
  ruff:
    vscode_extension: charliermarsh.ruff
    settings:
      - automation/Catzc.Base.Languages/configs/python.yml
      - automation/Catzc.Base.Execution/configs/tools.yml
  # PSScriptAnalyzer's formatter through the PowerShell extension, whose codeFormatting settings (vscode-settings.yml)
  # mirror the analyzer settings file. The vendored module's manifest names its version.
  psscriptanalyzer:
    vscode_extension: ms-vscode.powershell
    settings:
      - automation/.internal/assets/PSScriptAnalyzerSettings.psd1
      - automation/.vendor/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
  # dotnet format's whitespace pass, driven by .editorconfig — the same rules the C# extension's formatter applies.
  dotnet-format:
    vscode_extension: ms-dotnettools.csharp
    settings:
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
      - automation/Catzc.Base.Execution/configs/tools.yml
  # The Bicep CLI at the tools.yml pin (Install-Bicep); the Bicep extension runs the same formatter.
  bicep:
    vscode_extension: ms-azuretools.vscode-bicep
    settings:
      - automation/Catzc.Base.Execution/configs/tools.yml
languages:
  powershell:
    extensions: [.ps1, .psm1, .psd1]
    formatter: psscriptanalyzer
    adr_folder: pwsh
    checks: [Test-ScriptAnalyzer, Test-Formatting, Test-Spelling, Test-Links]
  csharp:
    extensions: [.cs]
    formatter: dotnet-format
    adr_folder: automation/BCL
    checks: [Test-Formatting, Test-Spelling, Test-Links]
  pipeline-yaml:
    extensions: [.yaml]
    formatter: prettier
    vscode_language: azure-pipelines
    adr_folder: pipelines
    checks: [Test-Formatting, Test-Spelling, Test-Links]
  yaml:
    extensions: [.yml]
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling, Test-Links]
  markdown:
    extensions: [.md]
    formatter: prettier
    checks: [Test-Markdownlint, Test-MarkdownTitle, Test-Formatting, Test-Spelling, Test-Links]
  bicep:
    extensions: [.bicep]
    formatter: bicep
    checks: [Test-Formatting, Test-Spelling]
  python:
    extensions: [.py]
    formatter: ruff
    adr_folder: automation/python
    checks: [Test-PythonLint, Test-Formatting, Test-Spelling]
  json:
    extensions: [.json]
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling]
  jsonl:
    extensions: [.jsonl]
    no_formatter: one record per line by definition, so there is no layout to format
  go:
    extensions: [.go]
    formatter: gofmt
    adr_folder: automation/go
    checks: [Test-Formatting, Test-Spelling]
  bash:
    extensions: [.sh, .bats]
    no_formatter: no engine is configured for Bash yet
    adr_folder: automation/bash
    checks: [Test-ShellScripts]
  xml:
    extensions: [.ps1xml, .xml, .xsd, .dtd, .csproj]
    no_formatter: no engine is configured for XML; .editorconfig and the editor's XML extension cover its layout
  html:
    extensions: [.html]
    formatter: prettier
    checks: [Test-Formatting]
  css:
    extensions: [.css]
    formatter: prettier
    checks: [Test-Formatting]
  solution:
    extensions: [.sln]
    no_formatter: the Visual Studio solution format is written by Visual Studio and dotnet sln, not formatted by hand
  stamp:
    extensions: [.stamp]
    no_formatter: a build stamp is written whole by the generator that records it
  asset:
    extensions: [.png, .pdf, .gz]
    no_formatter: binary files
