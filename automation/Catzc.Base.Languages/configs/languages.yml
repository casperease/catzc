# ---
# catzc:
#   immutable:
#     repo_status: clean
#     path: automation/Catzc.Base.Languages/configs/languages.yml
#     folder: configs
#     name: languages
#     filetype: yml
#     kind: config
#     language: yaml
#     track: automation
#     tracktype: modules
#     module: Catzc.Base.Languages
#     moduletype: pwsh-folder
#     catzc_bundle: azure
#   edges:
#     page: docs/references/automation/catzc-base-languages/configs/languages.yml.md
# ---

formatters:
  # Prettier, for every language that names it; the extension reads the same .prettierrc.yml and .editorconfig.
  prettier:
    vscode_extension: esbenp.prettier-vscode
    settings:
      - automation/Catzc.Base.RootConfig/assets/root/.prettierrc.yml
      - automation/Catzc.Base.RootConfig/assets/root/.prettierignore
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
      - automation/Catzc.Base.Execution/configs/tools.yml#prettier
      - automation/Catzc.Base.Execution/configs/tools.yml#node_js
  # gofmt through the Go extension, which runs the managed go the settings generator injects as go.goroot.
  gofmt:
    vscode_extension: golang.go
    settings:
      - automation/Catzc.Base.Execution/configs/tools.yml#go
  # ruff through the Ruff extension, with the pinned ruff from the Python test workspace's environment.
  ruff:
    vscode_extension: charliermarsh.ruff
    settings:
      - automation/Catzc.Base.Languages/configs/python.yml
      - automation/Catzc.Base.Execution/configs/tools.yml#uv
      - automation/Catzc.Base.Execution/configs/tools.yml#python
  psscriptanalyzer:
    vscode_extension: ms-vscode.powershell
    settings:
      - automation/.internal/assets/PSScriptAnalyzerSettings.psd1
      - automation/.vendor/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
  # dotnet format's whitespace pass, driven by .editorconfig — the same rules the C# extension's formatter applies.
  dotnet-format:
    vscode_extension: ms-dotnettools.csharp
    settings:
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
      - automation/Catzc.Base.Execution/configs/tools.yml#dotnet
  # The Bicep CLI at the tools.yml pin (Install-Bicep); the Bicep extension runs the same formatter.
  bicep:
    vscode_extension: ms-azuretools.vscode-bicep
    settings:
      - automation/Catzc.Base.Execution/configs/tools.yml#bicep
# Imprint steps run after every language's formatter: the global list over every language, a language's own list over its files only.
imprint: [comments, file-meta]
steps:
  # Before file-meta, so a page the move writes gets its meta block in the same run.
  comments:
    settings:
      - automation/Catzc.Base.QualityGates/configs/comments.yml
      - automation/Catzc.Base.QualityGates/configs/links.yml
      - automation/Catzc.Base.RootConfig/assets/root/.editorconfig
  file-meta:
    settings:
      - automation/Catzc.Base.QualityGates/configs/file-meta.yml
      - automation/Catzc.Base.Languages/configs/file-carriers.yml
      - automation/Catzc.Base.Languages/configs/languages.yml
languages:
  powershell:
    extensions: [.ps1, .psm1, .psd1]
    formatter: psscriptanalyzer
    adr_folder: pwsh
    checks: [Test-ScriptAnalyzer, Test-Formatting, Test-Spelling, Test-Links, Test-Comments]
    imprint: [ps-help]
    layout:
      - { folder: ".", role: public-function, extensions: [.ps1], shipped: false }
      - { folder: ".", role: manifest, extensions: [.psd1], live: false, shipped: false }
      - { folder: private, role: private-function, shipped: false }
  csharp:
    extensions: [.cs]
    formatter: dotnet-format
    adr_folder: automation/BCL
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-Comments]
    imprint: [csharp-namespace]
    layout:
      - { folder: types, role: type }
  pipeline-yaml:
    extensions: [.yaml]
    formatter: prettier
    vscode_language: azure-pipelines
    adr_folder: pipelines
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-Comments]
  yaml:
    extensions: [.yml]
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-Comments, Test-AgentDefinitions]
    layout:
      - { folder: configs, role: config }
  markdown:
    extensions: [.md]
    formatter: prettier
    checks: [Test-Markdownlint, Test-MarkdownTitle, Test-Formatting, Test-Spelling, Test-Links, Test-AgentDefinitions, Test-Plans]
    layout:
      - { folder: ".", role: readme, extensions: [.md], live: false, shipped: false }
  bicep:
    extensions: [.bicep]
    formatter: bicep
    checks: [Test-Formatting, Test-Spelling, Test-Comments]
  python:
    extensions: [.py]
    formatter: ruff
    adr_folder: automation/python
    checks: [Test-PythonLint, Test-Formatting, Test-Spelling]
  json:
    extensions: [.json]
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling]
  jsonl:
    extensions: [.jsonl]
    no_formatter: one record per line by definition, so there is no layout to format
  go:
    extensions: [.go]
    formatter: gofmt
    adr_folder: automation/go
    checks: [Test-Formatting, Test-Spelling]
  bash:
    extensions: [.sh, .bats]
    no_formatter: no engine is configured for Bash yet
    adr_folder: automation/bash
    checks: [Test-ShellScripts]
  xml:
    extensions: [.ps1xml, .xml, .xsd, .dtd, .csproj]
    no_formatter: no engine is configured for XML; .editorconfig and the editor's XML extension cover its layout
  html:
    extensions: [.html]
    formatter: prettier
    checks: [Test-Formatting]
  css:
    extensions: [.css]
    formatter: prettier
    checks: [Test-Formatting]
  solution:
    extensions: [.sln]
    no_formatter: the Visual Studio solution format is written by Visual Studio and dotnet sln, not formatted by hand
  stamp:
    extensions: [.stamp]
    no_formatter: a build stamp is written whole by the generator that records it
  asset:
    extensions: [.png, .pdf, .gz]
    no_formatter: binary files
