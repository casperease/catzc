# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.Docs/configs/readme.yml
#     kind: yaml-config
#     language: yaml
#     track: automation
#     module: Catzc.Base.Docs
#     relatives:
#       page: docs/references/automation/catzc-base-docs/configs/readme.yml.md
# ---

patterns:
  - glob: automation/*
    source: docs/references/automation/{kebab}.md
mappings:
  - folder: docs/adr
    source: docs/adr/index.md
  - folder: pipelines
    source: docs/references/pipelines.md
  - folder: infrastructure
    source: docs/references/infrastructure/overview.md
  - folder: infrastructure/modules
    source: docs/references/infrastructure/modules.md
  - folder: infrastructure/templates/foundation
    source: docs/references/infrastructure/foundation.md
  - folder: infrastructure/templates/discovery
    source: docs/references/infrastructure/discovery.md
  - folder: infrastructure/templates/expedition
    source: docs/references/infrastructure/expedition.md
  - folder: out
    source: docs/references/out.md
  - folder: .cspell
    source: docs/references/cspell.md
  - folder: contracts
    source: docs/references/contracts.md
  - folder: pipelines/jobs
    source: docs/references/pipelines/template-folders.md
  - folder: pipelines/stages
    source: docs/references/pipelines/template-folders.md
  - folder: pipelines/variables
    source: docs/references/pipelines/template-folders.md
