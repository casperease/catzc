# A folder not covered here keeps a hand-authored, committed README, and is un-ignored in .gitignore.
# [ADR-AUTO-PATH](/docs/adr/automation/path-representation.md), [ADR-REPO-README](/docs/adr/repository/generated-readmes.md)
# [comment:1](/docs/references/automation/catzc-base-docs/configs/readme.yml.md#comment1)
patterns:
  - glob: automation/*
    source: docs/references/automation/{kebab}.md
mappings:
  # Source and README share a folder, so no link is rebased and index.md's relative links hold as written.
  # [ADR-REPO-README#6](/docs/adr/repository/generated-readmes.md#rule-adr-repo-readme6)
  # [comment:2](/docs/references/automation/catzc-base-docs/configs/readme.yml.md#comment2)
  - folder: docs/adr
    source: docs/adr/index.md
  - folder: pipelines
    source: docs/references/pipelines.md
  - folder: infrastructure
    source: docs/references/infrastructure/overview.md
  - folder: infrastructure/modules
    source: docs/references/infrastructure/modules.md
  - folder: infrastructure/templates/foundation
    source: docs/references/infrastructure/foundation.md
  - folder: infrastructure/templates/discovery
    source: docs/references/infrastructure/discovery.md
  - folder: infrastructure/templates/expedition
    source: docs/references/infrastructure/expedition.md
  # Every folder with a .gitkeep needs a reference article, because the generic .gitkeep points readers at this README.
  # [comment:3](/docs/references/automation/catzc-base-docs/configs/readme.yml.md#comment3)
  - folder: out
    source: docs/references/out.md
  - folder: .cspell
    source: docs/references/cspell.md
  - folder: contracts
    source: docs/references/contracts.md
  - folder: pipelines/jobs
    source: docs/references/pipelines/template-folders.md
  - folder: pipelines/stages
    source: docs/references/pipelines/template-folders.md
  - folder: pipelines/variables
    source: docs/references/pipelines/template-folders.md
