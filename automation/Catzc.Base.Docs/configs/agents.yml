# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.Docs/configs/agents.yml
#     kind: yaml-config
#     language: yaml
#     track: automation
#     module: Catzc.Base.Docs
#     relatives:
#       page: docs/references/automation/catzc-base-docs/configs/agents.yml.md
# ---

standard: catzc-worker
agents:
  # The standard agent: one task from a coordinator's brief, each file verified with the gates before the next.
  - name: catzc-worker
    supported_by: [ADR-REPO-AGENTS#4, ADR-PRIN-REDUCEVAR#3, ADR-PROC-BUILTIN#3]
    checks:
      - Invoke-TestFile
      - Test-ScriptAnalyzer
      - Test-Spelling
      - Format-Types
      - Format-Code
      - Test-Links
      - Test-Glossary
      - Build-Readme
      - Build-Glossary
      - Build-AdrIndex
      - Test-GeneratedFiles

  # Authors new diagrams in the visual grammar and lands the approved ones under docs/.assets/, embedded in their ADRs.
  - name: drawio-diagram-waves
    supported_by: [ADR-DSGN-VISUAL#1, ADR-DSGN-VISUAL#4, ADR-REPO-FOLDERS#5]
    checks: [Test-CheckedInBinaries, Test-Links]

  # Changes labels and styles inside existing docs/.assets/ diagrams so they match the decisions they draw.
  - name: write-drawio-files
    supported_by: [ADR-DSGN-VISUAL#4, ADR-REPO-FOLDERS#5]
    checks: [Test-CheckedInBinaries]

  # Shows the diagram review state on one shared page; it publishes from out/ and runs no catzc check.
  - name: print-artifacts
    supported_by: [ADR-DORA-VISUAL#1, ADR-DORA-VISUAL#3]
    checks: []

  # Builds the inspiration module to the inspiration policy.
  - name: build-inspiration-module
    supported_by: [ADR-REPO-INSPIRE#1, ADR-REPO-INSPIRE#3]
    checks: [Invoke-TestFile, Test-ShippedConfigs, Test-ModuleDependency]

  # Measures what a session cost and why, and proposes the changes; it writes only to out/ and runs no catzc check.
  - name: session-cost-audit
    supported_by: [ADR-PRIN-NOWASTE#1, ADR-PROC-KAIZEN#2, ADR-AUTO-FAILFAST#7]
    checks: []

  # Makes the test suite faster under the timeouts.yml roofs without losing any test or assertion, one measured file at a time.
  - name: test-optimization
    supported_by: [ADR-AUTO-TEST#21, ADR-AUTO-TEST#19, ADR-AUTO-TEST#22, ADR-PRIN-NOWASTE#1]
    checks: [Invoke-TestFile, Test-ScriptAnalyzer]
