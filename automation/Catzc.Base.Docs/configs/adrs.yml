# adrs.yml — the AUTHORED source of the ADR domain structure (RULES ↔ domains wiring).
#
# Single source of truth for how the decision space is organised and cited. It declares:
#   domains:  one per docs/adr/<area>/ folder — the unit the dependency graph connects. Each carries a
#             `code` (2-4 letter DEFAULT domain code that composes the citation ADR-<code>-<NAME>), a `role`
#             (its function in the system), a `description` (the reader-facing paragraph rendered under the
#             domain's heading in index.md), and `depends_on` (the acyclic domain DAG, rendered via
#             Get-AdrDomainEdges | ConvertTo-AdrDomainDiagram, mirroring the module dependency graph). Each also
#             declares its row of the value-chain stack (`stack`: PRIN, DSGN, AUTO, PIPE, or CLOUD) and its default
#             value-chain concerns (`concern`: a list of automation, build, quality-control, release, deploy, access),
#             [ADR-DSGN-TRACK#14](/docs/adr/design/tracks.md#rule-adr-dsgn-track14) and
#             [ADR-DSGN-TRACK#15](/docs/adr/design/tracks.md#rule-adr-dsgn-track15).
#   rulesets: within a domain, keyed by INTERNAL kebab name (= the ADR file slug). Each declares its full
#             EXTERNAL citation code (`ADR-<DC>-<NAME>`, fully spelled) and, when the code body is a
#             registered spelling token, its `terminology` link into the `adr:` category of terminology.yml.
#             `code` may be set on a LEAF to OVERRIDE the domain default; the validator asserts the external's
#             DC-segment equals the effective code (`^[A-Z]{2,4}$`). `concern` may be set on a LEAF to OVERRIDE
#             the domain default, only when the ADR's place in the value chain differs from its domain's.
#
# Loaded via Get-Config -Config adrs; validated by its config type, AdrsConfig. index.md is a generated projection of
# this file (Build-AdrIndex) — see [ADR-REPO-README](/docs/adr/repository/generated-readmes.md) pattern.

domains:
  thesis:
    code: THES # domain default — composes ADR-THES-<NAME>
    role: framing # what catzc is for and how it solves it — the decision every other domain serves
    description: >-
      What catzc is for and how it solves it: delivery is slow because its truth is spread across disjoint stores, so catzc collapses them
      into one source of truth, the repository, with one change process. The repository is the configuration record and answers queries
      through the tooling; inside the trunk everything is at HEAD, and versions exist only at the repository boundary, as pins. It describes
      the product and rests on the DORA research, the authoritative source, and the principles state its mechanics, so every other domain
      cites it (`ADR-THES-*`) through them.
    depends_on: [research]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # the thesis spans the whole value chain
    rulesets:
      one-source-of-truth: { external: ADR-THES-ONETRUTH, terminology: onetruth }

  principles:
    code: PRIN # domain default — composes ADR-PRIN-<NAME>
    role: axioms # the non-negotiable design axioms every other domain specialises
    description: >-
      The design axioms every other domain specialises: everything as code, configure don't program, reduce variability, reduce waste,
      poka-yoke, and one living version. They specialise the thesis, catzc's product description, and rest on the DORA research, the
      authoritative source; no domain later in the order overrides them, and every other domain cites them (`ADR-PRIN-*`) as the reason for
      its own decisions.
    depends_on: [research, thesis]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # axioms every concern specialises
    rulesets:
      everything-as-code: { external: ADR-PRIN-EAC, terminology: eac }
      configure-not-program: { external: ADR-PRIN-CONFIG, concern: [automation] }
      reduce-variability: { external: ADR-PRIN-REDUCEVAR, terminology: reducevar }
      reduce-waste: { external: ADR-PRIN-NOWASTE, terminology: nowaste }
      poka-yoke: { external: ADR-PRIN-POKAYOKE, terminology: pokayoke, concern: [quality-control] }
      one-living-version: { external: ADR-PRIN-ONELIVE, terminology: onelive, concern: [release] }

  process:
    code: PROC
    # our own continuously-improved way of working ([ADR-PROC-KAIZEN](/docs/adr/process/inspect-and-adapt.md)); Design/Exploration + ASM
    role: optimisable
    description: >-
      How the team works: the Agile Manifesto's values and principles, lean flow as the Toyota Production System maps to software, and one
      shared vocabulary of flow terms. Unlike the fixed axioms, the process is itself inspected and improved (`ADR-PROC-KAIZEN`); the
      design, flow, and implementation domains put its practices into effect — stopping the line, building quality in, pulling work, and
      draining queues.
    depends_on: [research, principles]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # how the team works, along the whole chain
    rulesets:
      agile: { external: ADR-PROC-AGILE }
      agile-values: { external: ADR-PROC-VALUES }
      agile-principles: { external: ADR-PRIN-PROCESS, code: PRIN } # leaf override: PRIN code, though the folder defaults to PROC
      process-terms: { external: ADR-PROC-LEANTERMS, terminology: leanterms }
      lean: { external: ADR-PROC-LEAN }
      holding-the-line: { external: ADR-PROC-ANDON, terminology: andon, concern: [quality-control] }
      build-quality-in: { external: ADR-PROC-BUILTIN, concern: [quality-control] }
      observe-work: { external: ADR-PROC-OBSERVEWIP, terminology: observewip }
      pull-work: { external: ADR-PROC-PULLWORK, terminology: pullwork }
      queues-cost-money: { external: ADR-PROC-QUEUECOST, terminology: queuecost }
      inspect-and-adapt: { external: ADR-PROC-KAIZEN, terminology: kaizen }

  design:
    code: DSGN
    role: architecture # how the platform is shaped
    description: >-
      How the platform is shaped: tracks as the repository's root concerns, a thin CLI platform over a vendor substrate, safe self-service,
      the commit lifecycle and its stable sync point, the audited server remote with pull-request ingress, the visual grammar of the
      value-chain diagrams, and the toolset's two run modes (source and build). It builds on research, principles, and process; the flow and
      implementation domains realise it.
    depends_on: [research, principles, process]
    stack: DSGN
    concern: [automation] # the shape of the platform itself
    rulesets:
      tracks: { external: ADR-DSGN-TRACK }
      thin-platforms: { external: ADR-DSGN-THINPLAT, terminology: thinplat, concern: [automation, deploy] }
      self-service: { external: ADR-DSGN-SELFSERV, terminology: selfserv, concern: [deploy, access] }
      visual-design: { external: ADR-DSGN-VISUAL, concern: [quality-control, release, deploy] }
      commit-lifecycle: { external: ADR-DSGN-LIFE, concern: [quality-control, release, deploy] }
      server-remote-integration: { external: ADR-DSGN-REMOTE, concern: [build, quality-control] }
      run-modes: { external: ADR-DSGN-RUNMODE, terminology: runmode, concern: [automation, build] }
      module-aspects: { external: ADR-DSGN-ASPECT, concern: [automation, build] }

  flow:
    # compound domain code — the root ADR cites [ADR-FLOW-CD](/docs/adr/flow/cd-discipline-and-promotion-flow.md), the
    # rest `ADR-FLOW-CD-<NAME>`
    code: FLOW-CD
    role: architecture # the platform-agnostic flow model that ADO (PIPE) and GitHub (GH) implement
    description: >-
      The vendor-neutral delivery-flow model: continuous integration as a discipline with a 5–10 minute integration budget, the closed set
      of pipeline types (CRON, CI, CD, CDe, DEPLOY, INPUT) keyed together by one immutable tagged artifact, how pipelines invoke automation
      and detect their context, and how globsets project into native trigger filters. The pipelines (Azure DevOps) and github domains
      implement it.
    depends_on: [research, principles, process, design]
    stack: DSGN
    concern: [build, quality-control, release, deploy] # the delivery flow from integration to production
    rulesets:
      cd-discipline-and-promotion-flow: { external: ADR-FLOW-CD }
      pipeline-runner-pattern: { external: ADR-FLOW-CD-RUNNER, concern: [automation] }
      pipeline-detection: { external: ADR-FLOW-CD-DETECT, concern: [automation] }
      pipeline-types: { external: ADR-FLOW-CD-TYPE }
      durable-sha-globs: { external: ADR-FLOW-CD-GLOBS, concern: [automation] }

  automation:
    code: AUTO
    role: implementation # the CLI/module system that enacts the decisions
    description: >-
      The catzc CLI and module system and the rules for building it: devbox/pipeline parity, one function per file, open/closed growth,
      fail-fast assertions, idempotency, caching, path forms, system, module, and internal asset dependencies, test automation, and the
      merged, installable build, stated for any execution engine. Language layers live in `BCL/` (native C# types) and `go/`, `python/`, and
      `bash/` (black-box test artifacts). It turns the research, principles, process, and design domains into enforced code; the pwsh domain
      realises it in PowerShell, and the pipelines, github, and azure domains build on it.
    depends_on: [research, principles, process, design]
    stack: AUTO
    concern: [automation] # the module system: loading, configuration, globsets
    rulesets:
      devbox-pipeline-parity: { external: ADR-AUTO-PARITY }
      uv-python-handler: { external: ADR-AUTO-UVPY, terminology: uvpy }
      log-before-invoke: { external: ADR-AUTO-PRELOG, terminology: prelog }
      retry-as-last-resort: { external: ADR-AUTO-RETRY }
      open-closed-architecture: { external: ADR-AUTO-EXTEND }
      zero-ceremony-poka-yoke: { external: ADR-AUTO-ZERO }
      never-depend-on-pwd: { external: ADR-AUTO-NOPWD, terminology: nopwd }
      avoid-deep-nesting: { external: ADR-AUTO-NONEST, terminology: nonest }
      test-automation: { external: ADR-AUTO-TEST, concern: [quality-control] }
      cross-platform: { external: ADR-AUTO-XPLAT, terminology: xplat }
      single-responsibility-functions: { external: ADR-AUTO-ONEJOB, terminology: onejob }
      caching: { external: ADR-AUTO-CACHE }
      tracked-files-from-the-index: { external: ADR-AUTO-TRACKED }
      sensible-defaults: { external: ADR-AUTO-DEFAULT }
      fail-fast-with-asserts: { external: ADR-AUTO-FAILFAST, terminology: failfast }
      idempotent-state-functions: { external: ADR-AUTO-IDEM, terminology: idem }
      use-proper-package-managers: { external: ADR-AUTO-PKGMGR, terminology: pkgmgr }
      effective-in-enterprises: { external: ADR-AUTO-ENTERP, terminology: enterp }
      controlling-systemwide-deps: { external: ADR-AUTO-DEPS, terminology: deps }
      tool-removal-lifecycle: { external: ADR-AUTO-REMOVE }
      controlling-module-dependencies: { external: ADR-AUTO-DEPM, terminology: depm }
      environment-variables: { external: ADR-AUTO-ENVVAR, terminology: envvar }
      path-representation: { external: ADR-AUTO-PATH }
      protected-globs: { external: ADR-REPO-PROTGLOB, code: REPO, terminology: protglob }
      managed-guids: { external: ADR-AUTO-GUIDS, terminology: guids }
      platform-bundle: { external: ADR-AUTO-BUNDLE, concern: [build, release] }
      internal-asset-dependencies: { external: ADR-AUTO-ASSETDEP, terminology: assetdep, concern: [automation, build] }
      console-output-matters: { external: ADR-AUTO-CONSOLE }
      spell-out-names: { external: ADR-AUTO-SPELL, concern: [quality-control] }
      dry-run: { external: ADR-AUTO-DRYRUN, terminology: dryrun }
      native-csharp-types: { external: ADR-AUTO-TYPES, concern: [automation, build] }
      test-artifacts: { external: ADR-AUTO-GO, concern: [quality-control] }
      python-test-artifacts: { external: ADR-AUTO-PY, concern: [quality-control] }
      bash-test-artifacts: { external: ADR-AUTO-BASH, concern: [quality-control] }
      execution-engines: { external: ADR-AUTO-ENGINE }

  pwsh:
    code: PWSH
    role: implementation # one execution engine's realisation of the automation rules
    description: >-
      PowerShell 7 as one of catzc's execution engines: how the automation rules are realised in pwsh — module files and manifests,
      parameter and error design, streams and console output, caching in script scope, working directory and environment mechanics,
      cross-platform pwsh, the analyzer, and Pester. It applies the engine-agnostic `automation/` rules to one engine and never redefines
      them.
    depends_on: [research, principles, process, design, automation]
    stack: AUTO
    concern: [automation] # the pwsh engine of the module system
    rulesets:
      pwsh-engine: { external: ADR-PWSH-ENGINE }
      one-function-per-file: { external: ADR-PWSH-ONEFUNC, terminology: onefunc }
      use-ps1-not-psm1: { external: ADR-PWSH-USEPS, terminology: useps }
      dynamic-module-manifests: { external: ADR-PWSH-MANIFEST }
      module-path-hygiene: { external: ADR-PWSH-MODPATH, terminology: modpath }
      vendor-toolset-dependencies: { external: ADR-PWSH-VENDOR }
      prepost-extension-modules: { external: ADR-PWSH-PREPOST, terminology: prepost }
      error-handling: { external: ADR-PWSH-ERROR }
      assert-idioms: { external: ADR-PWSH-ASSERT }
      announce-state-changes: { external: ADR-PWSH-ANNOUNCE }
      avoid-using-semicolons: { external: ADR-PWSH-NOSEMI, terminology: nosemi }
      prefer-foreach-over-foreach-object: { external: ADR-PWSH-FOREACH }
      automatic-variable-pitfalls: { external: ADR-PWSH-AUTOVAR, terminology: autovar }
      respect-pwsh-verb-rules: { external: ADR-PWSH-VERBS }
      prefer-dryrun-over-shouldprocess: { external: ADR-PWSH-DRYRUN }
      identifier-names: { external: ADR-PWSH-NAMES }
      powershell-formatting: { external: ADR-PWSH-FORMAT, concern: [quality-control] }
      environment-variable-mechanics: { external: ADR-PWSH-ENV }
      parameter-design: { external: ADR-PWSH-PARAM }
      working-directory-mechanics: { external: ADR-PWSH-PWD }
      cross-platform-powershell: { external: ADR-PWSH-XPLAT }
      script-scope-caching: { external: ADR-PWSH-CACHE }
      pester-testing: { external: ADR-PWSH-PESTER, concern: [quality-control] }
      hosting-csharp-types: { external: ADR-PWSH-TYPES, concern: [automation, build] }

  configuration:
    code: CONF
    role: implementation # how configuration is loaded, addressed, and validated across modules
    description: >-
      How a module's `configs/<name>.yml` files are read, validated, and addressed: one public reader, `Get-Config`, that discovers a config
      by its global name, caches it per file, and validates it in its owning module's scope, plus `global.<config>.<key>` addresses that
      point into committed config by reference. It gives every implementation domain its single way to read configuration.
    depends_on: [research, principles]
    stack: AUTO
    concern: [automation] # reading configuration
    rulesets:
      module-config-loading: { external: ADR-CONF-LOADING }
      config-value-addressing: { external: ADR-CONF-ADDRESSING }

  pipelines:
    code: PIPE
    role: implementation # minimal ADO extensions over the general flow model (ADR-FLOW-*)
    description: >-
      The Azure DevOps extensions to the flow model: how ADO REST calls select and prove their credentials, how PowerShell sets pipeline
      output variables, how pipelines and template folders are named and placed under `pipelines/`, and when an ADO YAML template is
      warranted. It binds the vendor-neutral `flow/` rules to Azure DevOps without redefining them; `github/` is its GitHub counterpart.
    depends_on: [research, principles, process, design, automation, flow]
    stack: PIPE
    concern: [build, quality-control, release, deploy] # the Azure DevOps pipelines that carry the delivery flow
    rulesets:
      dual-authentication: { external: ADR-PIPE-AUTH, concern: [access] }
      pipeline-variables: { external: ADR-PIPE-VAR }
      pipeline-naming-and-placement: { external: ADR-PIPE-NAME }
      custom-template-discipline: { external: ADR-PIPE-TEMPLATE }

  github:
    code: GH
    role: implementation # minimal GitHub extensions over the general flow model (.github/workflows placement, etc.)
    description: >-
      The GitHub extensions to the flow model: the manually dispatched release workflow that builds the catzc package and publishes it to
      GitHub Releases, GitHub Packages, and optionally the PowerShell Gallery. It applies the `flow/` rules to GitHub Actions under
      `.github/workflows/` and publishes the bundle the automation domain defines; `pipelines/` is its Azure DevOps counterpart.
    depends_on: [research, principles, process, design, automation, flow]
    stack: PIPE
    concern: [build, release] # the workflow that builds and publishes the package
    rulesets:
      github-release: { external: ADR-GH-RELEASE }

  azure:
    code: AZ
    role: implementation # the Azure vendor substrate model
    description: >-
      The Azure substrate model catzc deploys onto: the identity data model (`azure.yml` tenants, environments, and subscriptions), the
      per-template configuration tree under `infrastructure/templates/`, the customer catalogue (`customer.yml`), the network IP plan
      (`network.yml`), and the deterministic resource-naming standard. It applies the principles and design domains to one vendor, enforced
      by the `Catzc.Azure*` modules.
    depends_on: [research, principles, design, automation]
    stack: CLOUD
    concern: [deploy] # the substrate catzc deploys onto
    rulesets:
      azure-data-model: { external: ADR-AZ-DATAMOD, terminology: datamod, concern: [deploy, access] }
      azure-network-model: { external: ADR-AZ-NETWORK }
      azure-naming-standard: { external: ADR-AZ-NAMING }
      prefer-az-cli: { external: ADR-AZ-CLI, concern: [deploy, access] }
      az-session-verification: { external: ADR-AZ-SESSION, terminology: sesverify, concern: [access] }
      azure-customer-model: { external: ADR-AZ-CUSTOMER }
      landing-zones: { external: ADR-AZ-LZ }

  repository:
    code: REPO
    role: implementation # how the repository tree itself is organised and generated
    description: >-
      How the repository tree is laid out, formatted, and generated: conventional folder names at every level, the single `out/` output
      directory, one formatting standard for every file type, contracts at the repository boundary, in both directions, under `contracts/`,
      READMEs and root configs generated from one source, fictional documentation examples, the separation of design, test, and live
      vocabulary, the controlled vocabulary of defined terms, repo-wide variants, the sub-agent definitions and the rules behind each, and
      sibling repositories read for ideas, never as a reference implementation.
    depends_on: [research, principles, design]
    stack: AUTO
    concern: [automation] # the repository tree the tooling lays out and generates
    rulesets:
      conventional-folders: { external: ADR-REPO-FOLDERS }
      dedicated-output-directory: { external: ADR-REPO-OUTDIR, terminology: outdir }
      output-formats: { external: ADR-REPO-OUTFMT, terminology: outfmt }
      uniform-formatting: { external: ADR-REPO-FORMAT, concern: [quality-control] }
      api-contracts: { external: ADR-REPO-CONTRACT, concern: [release] }
      generated-readmes: { external: ADR-REPO-README }
      generated-root-configs: { external: ADR-REPO-ROOTCFG, terminology: rootcfg }
      documentation-examples: { external: ADR-REPO-EXAMPLE }
      repo-variants: { external: ADR-REPO-VARIANT }
      domain-language-separation: { external: ADR-REPO-LANG }
      controlled-vocabulary: { external: ADR-REPO-VOCAB, concern: [quality-control] }
      markdown-links: { external: ADR-REPO-LINK, concern: [quality-control] }
      agent-definitions: { external: ADR-REPO-AGENTS }
      inspiration: { external: ADR-REPO-INSPIRE }

  research:
    code: DORA # 4-letter domain code; composes ADR-DORA-<NAME> — a concise, precise capability name (no doraXXX body)
    role: reference # trusted external validation points (DORA) — depended-on-by, never a dependency
    description: >-
      The repository's core theoretical construct: the DORA research program, held as one ADR-style record per DORA capability, each with
      its own `ADR-DORA-<NAME>` rule codes, beside the cross-referenceable research reference in `docs/references/dora/`. It is trusted
      external validation — every other domain depends on it and it depends on none; the others cite it through their `dora-explains.md`
      files and `ADR-DORA-*` citations.
    depends_on: []
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # capabilities measured across the whole chain
    # terminology tokens (the shared `dora` code token + any non-word name bodies) are reconciled in Stage 2.
    rulesets:
      ai-accessible-internal-data: { external: ADR-DORA-AIDATA, concern: [access] }
      clear-and-communicated-ai-stance: { external: ADR-DORA-AISTANCE }
      healthy-data-ecosystems: { external: ADR-DORA-DATAECO }
      platform-engineering: { external: ADR-DORA-PLATFORM, concern: [automation] }
      user-centric-focus: { external: ADR-DORA-USERFOCUS }
      version-control: { external: ADR-DORA-VCS, concern: [automation] }
      working-in-small-batches: { external: ADR-DORA-SMALLBATCH }
      code-maintainability: { external: ADR-DORA-MAINTAIN, concern: [automation, build] }
      continuous-delivery: { external: ADR-DORA-CD, concern: [build, quality-control, release, deploy] }
      continuous-integration: { external: ADR-DORA-CI, concern: [build, quality-control] }
      database-change-management: { external: ADR-DORA-DBCHANGE, concern: [deploy] }
      deployment-automation: { external: ADR-DORA-DEPLOY, concern: [deploy] }
      documentation-quality: { external: ADR-DORA-DOCS }
      flexible-infrastructure: { external: ADR-DORA-FLEXINFRA, concern: [deploy] }
      loosely-coupled-teams: { external: ADR-DORA-LOOSETEAMS }
      monitoring-and-observability: { external: ADR-DORA-OBSERV, concern: [access] }
      pervasive-security: { external: ADR-DORA-SECURITY }
      streamlining-change-approval: { external: ADR-DORA-APPROVAL, concern: [release] }
      test-automation: { external: ADR-DORA-TESTAUTO, concern: [quality-control] }
      test-data-management: { external: ADR-DORA-TESTDATA, concern: [quality-control] }
      trunk-based-development: { external: ADR-DORA-TRUNK, concern: [build] }
      customer-feedback: { external: ADR-DORA-FEEDBACK, concern: [access] }
      monitoring-systems: { external: ADR-DORA-MONITOR, concern: [access] }
      proactive-failure-notification: { external: ADR-DORA-FAILALERT, concern: [access] }
      work-visibility-in-value-stream: { external: ADR-DORA-WORKVIS }
      visual-management: { external: ADR-DORA-VISUAL }
      wip-limits: { external: ADR-DORA-WIP }
      teams-empowered-to-choose-tools: { external: ADR-DORA-TOOLCHOICE, concern: [automation] }
      generative-organizational-culture: { external: ADR-DORA-CULTURE }
      job-satisfaction: { external: ADR-DORA-JOBSAT }
      learning-culture: { external: ADR-DORA-LEARNING }
      team-experimentation: { external: ADR-DORA-EXPERIMENT }
      transformational-leadership: { external: ADR-DORA-LEADERSHIP }
      well-being: { external: ADR-DORA-WELLBEING }
