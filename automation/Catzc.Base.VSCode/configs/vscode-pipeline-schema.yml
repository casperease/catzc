# Azure Pipelines schema — the authored SOURCE OF TRUTH for.vscode/azure-pipelines-schema.json, the schema the...
# [ADR-REPO-ROOTCFG](/docs/adr/repository/generated-root-configs.md)
# [comment:1](/docs/references/automation/catzc-base-vscode/configs/vscode-pipeline-schema.yml.md#comment1)
$schema: http://json-schema.org/draft-07/schema#
title: Azure Pipelines (catzc, relaxed)
type: object
# Top level is a full pipeline OR any template fragment (parameters/steps/jobs/stages/variables only), so the root stays open...
# [comment:2](/docs/references/automation/catzc-base-vscode/configs/vscode-pipeline-schema.yml.md#comment2)
properties:
  name: { type: string }
  trigger: {}
  pr: {}
  schedules: { type: array }
  parameters: {}
  variables: {}
  resources: { type: object }
  pool: {}
  extends: { type: object }
  stages: { type: array, items: { type: object } }
  jobs: { type: array, items: { type: object } }
  steps: { $ref: "#/definitions/steps" }
definitions:
  steps:
    type: array
    items: { $ref: "#/definitions/step" }
  step:
    # One loose object shape for every step kind — no oneOf/anyOf across task variants, because that branch fan-out is exactly the...
    # [comment:3](/docs/references/automation/catzc-base-vscode/configs/vscode-pipeline-schema.yml.md#comment3)
    type: object
    properties:
      # A real task reference (Name@Major) OR a template expression — never the exact-version anyOf.
      task: { type: string, pattern: '^([A-Za-z0-9_.]+@[0-9]+|\$\{\{.+\}\})$' }
      inputs: { type: object }
      displayName: { type: string }
      name: { type: string }
      condition: { type: string }
      continueOnError: {}
      enabled: {}
      timeoutInMinutes: {}
      retryCountOnTaskFailure: {}
      env: { type: object }
      script: { type: string }
      pwsh: {}
      powershell: { type: string }
      bash: { type: string }
      template: { type: string }
      parameters: {}
      checkout: { type: string }
      download: {}
      publish: { type: string }
      workingDirectory: { type: string }
      failOnStderr: {}
      target: {}
