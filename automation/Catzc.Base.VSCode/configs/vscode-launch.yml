# VS Code launch-profile registry — the single authored source for.vscode/launch.json.
# [ADR-REPO-ROOTCFG](/docs/adr/repository/generated-root-configs.md)
# [comment:1](/docs/references/automation/catzc-base-vscode/configs/vscode-launch.yml.md#comment1)
version: "0.2.0"
configurations:
  # Debug the module system end to end: dot-source the importer under the PowerShell debugger, from the repository root, so breakpoints...
  # [comment:2](/docs/references/automation/catzc-base-vscode/configs/vscode-launch.yml.md#comment2)
  - name: Debug Module
    type: PowerShell
    request: launch
    script: ${workspaceFolder}/importer.ps1
    cwd: ${workspaceFolder}
