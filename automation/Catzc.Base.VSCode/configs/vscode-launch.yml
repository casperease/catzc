# Edit this file, never launch.json: the editor reads a gitignored copy that Build-RootConfig regenerates from it.
# [ADR-REPO-ROOTCFG](/docs/adr/repository/generated-root-configs.md)
# [comment:1](/docs/references/automation/catzc-base-vscode/configs/vscode-launch.yml.md#comment1)
version: "0.2.0"
configurations:
  # Launching from the repository root is what lets breakpoints in any module function bind after the importer is dot-sourced.
  # [comment:2](/docs/references/automation/catzc-base-vscode/configs/vscode-launch.yml.md#comment2)
  - name: Debug Module
    type: PowerShell
    request: launch
    script: ${workspaceFolder}/importer.ps1
    cwd: ${workspaceFolder}
