# VS Code workspace-settings registry — the single authored source for.vscode/settings.json.
# [ADR-REPO-ROOTCFG](/docs/adr/repository/generated-root-configs.md)
# [comment:1](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment1)
settings:
  # Markdown settings (built-in preview)
  markdown.preview.fontFamily: "Consolas, 'Courier New', monospace"
  markdown.styles:
    - .vscode/markdown-preview-dark.css
  markdown.preview.lineHeight: 1.6
  markdown.preview.fontSize: 14
  markdown.preview.scrollPreviewWithEditor: true
  markdown.preview.scrollEditorWithPreview: true
  markdown.preview.markEditorSelection: true

  # Markdown link validation while editing — early feedback for what Test-Links gates: dangling files and bad heading fragments are...
  # [ADR-REPO-LINK#2](/docs/adr/repository/markdown-links.md#rule-adr-repo-link2)
  # [comment:2](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment2)
  markdown.validate.enabled: true
  markdown.validate.fileLinks.enabled: warning
  markdown.validate.fragmentLinks.enabled: warning
  markdown.validate.fileLinks.markdownFragmentLinks: warning
  # Off: VS Code reads every footnote use ([^1]) as an undefined reference link; markdownlint MD052 already gates real reference links
  # [comment:3](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment3)
  markdown.validate.referenceLinks.enabled: ignore
  # Offer to rewrite relative links in .md files when a linked file or folder is moved or renamed
  markdown.updateLinksOnFileMove.enabled: prompt
  markdown.updateLinksOnFileMove.enableForDirectories: true

  # Markdown Preview Enhanced settings
  markdown-preview-enhanced.previewTheme: one-dark.css
  markdown-preview-enhanced.codeBlockTheme: one-dark.css

  # PowerShell: use pwsh 7 for the Integrated Console
  powershell.powerShellDefaultVersion: PowerShell (x64)

  # PowerShell: use project PSScriptAnalyzer settings for analysis (squiggles)
  powershell.scriptAnalysis.settingsPath: ./automation/.internal/assets/PSScriptAnalyzerSettings.psd1

  # PowerShell: "Format Document" uses these codeFormatting settings — NOT the psd1 — so they must be kept in sync with...
  # [comment:4](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment4)
  powershell.codeFormatting.pipelineIndentationStyle: IncreaseIndentationForFirstPipeline
  # Expand aliases on format — the psd1 enforces PSAvoidUsingCmdletAliases.
  powershell.codeFormatting.autoCorrectAliases: true
  # Leave casing alone — PSUseCorrectCasing is disabled in the psd1 (false positives on Pester params).
  powershell.codeFormatting.useCorrectCasing: false
  # Vertically align hashtable key/value pairs on format.
  # [comment:5](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment5)
  powershell.codeFormatting.alignPropertyValuePairs: true
  # Break one-line blocks (if ($x) {...
  # [comment:6](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment6)
  powershell.codeFormatting.ignoreOneLineBlock: false
  # Honour .editorconfig / 4-space indent; don't let VS Code guess indentation from file contents.
  "[powershell]":
    editor.detectIndentation: false
    editor.tabSize: 4
    editor.insertSpaces: true

  # Exclude vendored modules and generated module manifests from search.
  # [comment:7](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment7)
  search.exclude:
    automation/.vendor: true
    automation/**/*.psd1: true
    automation/.internal/assets/PSScriptAnalyzerSettings.psd1: false

  # Do not watch/reformat generated manifests — they are regenerated by the importer, not hand-edited.
  # [comment:8](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment8)
  files.watcherExclude:
    "**/automation/**/*.psd1": true
    "**/automation/.internal/assets/PSScriptAnalyzerSettings.psd1": false
    "**/python/.venv/**": true
    "**/node_modules/**": true

  # The formatter of [markdown] — and of every language languages.yml gives a formatter engine — is injected by the generator from that...
  # [ADR-REPO-FORMAT#8](/docs/adr/repository/uniform-formatting.md#rule-adr-repo-format8)
  # [comment:9](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment9)
  "[markdown]":
    editor.quickSuggestions:
      comments: "on"
      strings: "on"
      other: "on"
    editor.wordWrap: "off"

  # Treat LICENSE files as plain text so markdownlint ignores them.yml -> generic YAML,.yaml -> Azure Pipelines YAML.markdownlintignore...
  # [comment:10](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment10)
  files.associations:
    "**/LICENSE": plaintext
    "**/*.yml": yaml
    "**/*.yaml": azure-pipelines
    "**/.markdownlintignore": ignore
    "**/out/**/*.log": ansi

  # Route *.drawio.png to VS Code's built-in image preview editor (viewType imagePreview.previewEditor, from the bundled media-preview...
  # [comment:11](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment11)
  workbench.editorAssociations:
    "*.drawio.png": imagePreview.previewEditor

  # Prettier formats.yaml (ADO pipeline) files, the engine languages.yml names for pipeline-yaml.
  # [comment:12](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment12)
  prettier.documentSelectors:
    - "**/*.yaml"

  # Azure Pipelines extension: validate.yaml against OUR generated schema, not the extension's bundled one.
  # [comment:13](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment13)
  azure-pipelines.customSchemaFile: ./.vscode/azure-pipelines-schema.json

  # Code links in comments — `` — are repository-rooted markdown links, which core VS Code does not link outside.md files.
  # [ADR-REPO-LINK#3](/docs/adr/repository/markdown-links.md#rule-adr-repo-link3)
  # [comment:14](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment14)
  regexrobin.rules:
    - regex: '\[[^\]\r\n]+\]\(/(docs/adr/[^)#\s]+\.md)(#[^)\s]*)?\)'
      editor:
        - link: "file:///${workspaceFolder}/$1"
          hoverMessage: "Open $1$2"

  # Go (the golang.go extension and gopls): the tools run with GOTOOLCHAIN=local, so the editor never downloads the toolchain go.work...
  # [ADR-AUTO-GO#6](/docs/adr/automation/go/go-test-artifacts.md#rule-adr-auto-go6)
  # [comment:15](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment15)
  go.toolsEnvVars:
    GOTOOLCHAIN: local

  # Python (the ms-python extension): the generator injects python.defaultInterpreterPath, the Python test project's environment, so the...
  # [ADR-AUTO-PY#4](/docs/adr/automation/python/python-test-artifacts.md#rule-adr-auto-py4)
  # [comment:16](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment16)
  python.terminal.activateEnvironment: false
  python-envs.terminal.autoActivationType: "off"
  # The test explorer discovers the Python tests with pytest, from the tests folder of the test project.
  python.testing.pytestEnabled: true
  python.testing.pytestArgs:
    - python/tests

  # C# Dev Kit loads the IDE-only catzc.sln at the root, never a project it finds on its own.
  dotnet.defaultSolution: catzc.sln

  # Spell checking — the single repo dictionary lives in /cspell.yml (auto-discovered by Code Spell Checker; the extension is recommended...
  # [comment:17](/docs/references/automation/catzc-base-vscode/configs/vscode-settings.yml.md#comment17)
  cSpell.enabled: true
  # Information = blue squiggle (Error = red, Warning = yellow).
  cSpell.diagnosticLevel: Information
