winget:
  version: "1"
  command: winget
  # OS-provided (Windows App Installer) — asserted and kept on PATH, never installed by the toolchain.
  # [comment:1](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment1)
  system_provided: true
  windows_only: true
  version_command: "winget --version"
  version_pattern: "v(?<ver>[\\d.]+)"
  session_path_hints:
    - "%LOCALAPPDATA%\\Microsoft\\WindowsApps"

bash:
  # Bash 5.
  # [comment:2](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment2)
  version: "5"
  command: bash
  system_provided: true
  version_command: "bash --version"
  version_pattern: "version (?<ver>[\\d.]+)"
  # Located by these candidate paths (no process start), then PATH — never by the bare name alone: on Windows `bash` on PATH is usually...
  # [comment:3](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment3)
  windows_probes:
    - "%LOCALAPPDATA%\\Programs\\Git\\bin\\bash.exe"
    - "%LOCALAPPDATA%\\Git\\bin\\bash.exe"
    - "%ProgramFiles%\\Git\\bin\\bash.exe"
  windows_pipeline_probes:
    - "%ProgramFiles%\\Git\\bin\\bash.exe"
  unix_probes:
    - "/opt/homebrew/bin/bash"
    - "/usr/local/bin/bash"
    - "/bin/bash"
    - "/usr/bin/bash"
  unix_pipeline_probes:
    - "/usr/bin/bash"
    - "/bin/bash"
  probe_excludes:
    - "%SystemRoot%\\System32\\bash.exe"
    - "%LOCALAPPDATA%\\Microsoft\\WindowsApps\\bash.exe"

zsh:
  # zsh 5 — the third execution engine and the checker of the repository's *.zsh scripts (Test-ShellScripts runs `zsh -n`, ).
  # [ADR-AUTO-ENGINE](/docs/adr/automation/execution-engines.md),
  # [ADR-AUTO-BASH#6](/docs/adr/automation/bash/bash-test-artifacts.md#rule-adr-auto-bash6)
  # [comment:4](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment4)
  version: "5"
  command: zsh
  # Windows: Install-Zsh installs the MSYS2 zsh package pinned below, verified against its SHA-256 before anything is extracted, into the...
  # [comment:5](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment5)
  depends_on: bash
  linux_admin_only: true
  apt_package: "zsh"
  msys2_url: "https://repo.msys2.org/msys/x86_64/zsh-5.9.2-1-x86_64.pkg.tar.zst"
  msys2_sha256: "9a134200a152d90a0f1820d6aa74c3369d8539c068b523852549d74b16739fa8"
  windows_install_dir: "Git"
  version_command: "zsh --version"
  version_pattern: "^zsh (?<ver>[\\d.]+)"
  # Located by these candidate paths (no process start), then PATH: Install-Zsh leaves PATH alone.
  # [comment:6](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment6)
  windows_probes:
    - "%LOCALAPPDATA%\\Git\\usr\\bin\\zsh.exe"
    - "%LOCALAPPDATA%\\Programs\\Git\\usr\\bin\\zsh.exe"
  windows_pipeline_probes:
    - "%ProgramFiles%\\Git\\usr\\bin\\zsh.exe"
  unix_probes:
    - "/opt/homebrew/bin/zsh"
    - "/usr/local/bin/zsh"
    - "/bin/zsh"
    - "/usr/bin/zsh"
  unix_pipeline_probes:
    - "/usr/bin/zsh"
    - "/bin/zsh"

python:
  # 3.13, not the latest (3.14): stay one release behind the bleeding edge so dependents that lag the newest Python still work.
  # [comment:7](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment7)
  version: "3.13"
  command: python
  # Provisioned by uv (`uv python install <version> --default`) — user-space, cross-platform, installing a global python/python3 shim...
  # [comment:8](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment8)
  depends_on: uv
  uv_python: true
  version_command: "python --version"
  version_pattern: "^Python (?<ver>.+)$"

dotnet:
  version: "10.0"
  command: dotnet
  # Installed via vendored install scripts — no package manager, no admin.
  # [comment:9](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment9)
  script_install: true
  windows_install_dir: "Microsoft\\dotnet"
  # Which dotnet home this session runs when several exist (the managed home, then every PATH dir holding dotnet — on Windows a...
  # [comment:10](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment10)
  session_host_probes:
    - "sdk/{version}"
    - "shared/Microsoft.NETCore.App/{version}"
  version_command: "dotnet --version"
  version_pattern: "^(?<ver>.+)$"

az_cli:
  version: "2.87"
  # Devbox lever (local-only version relaxation).
  # [comment:11](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment11)
  devbox_version: "2.84"
  command: az
  # Installed user-space into a DEDICATED uv venv (uv venv + uv pip install azure-cli) — no admin on any platform.
  # [comment:12](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment12)
  depends_on: uv
  uv_venv: azure-cli
  # azure-cli 2.87 supports Python only up to 3.13.
  # [comment:13](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment13)
  max_python: "3.13"
  # azure-cli's dependency tree pins a pre-release (azure-batch beta), which uv refuses by default.
  uv_allow_prerelease: true
  version_command: "az version --output tsv"
  version_pattern: "^(?<ver>[^\t]+)"
  # The dedicated venv's script dir — the janitor keeps it on PATH each load so `az` resolves across sessions.
  session_path_hints:
    - "%LOCALAPPDATA%\\catzc\\venvs\\az_cli\\Scripts"

poetry:
  version: "2.4"
  command: poetry
  # Installed user-space via uv (`uv tool install poetry`) in an isolated env with uv's own Python — depends_on uv (not python), which uv...
  # [comment:14](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment14)
  depends_on: uv
  uv_tool: poetry
  version_command: "poetry --version"
  version_pattern: "^Poetry \\(version (?<ver>.+)\\)$"

node_js:
  # Node 24 (current LTS).
  # [comment:15](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment15)
  version: "24"
  command: node
  depends_on: winget
  winget_id: "OpenJS.NodeJS.LTS"
  winget_scope: user
  brew_formula: "node@{0}"
  # Linux: the distro `nodejs` package lags the pin badly (Ubuntu jammy ships Node 12), so Install-NodeJs configures the NodeSource apt...
  # [comment:16](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment16)
  apt_package: "nodejs"
  # apt-get needs root; the Windows (winget --scope user) and macOS (brew) installs are user-space, so the elevation requirement is...
  # [comment:17](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment17)
  linux_admin_only: true
  version_command: "node --version"
  version_pattern: "^v(?<ver>.+)$"
  # nvm-for-windows exposes the active node via this symlink; the janitor points the session at it when winget node is absent, so an nvm...
  # [comment:18](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment18)
  session_path_hints:
    - "%ProgramFiles%\\nodejs"

cspell:
  version: "10"
  command: cspell
  depends_on: node_js
  npm_package: cspell
  version_command: "cspell --version"
  version_pattern: "^(?<ver>[\\d.]+)"

markdownlint:
  version: "0.23"
  command: markdownlint-cli2
  depends_on: node_js
  npm_package: markdownlint-cli2
  # markdownlint-cli2 --version prints a banner ("markdownlint-cli2 v0.22.1 (markdownlint v0.40.0)"), so the pattern captures the digits...
  # [comment:19](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment19)
  version_command: "markdownlint-cli2 --version"
  version_pattern: "v(?<ver>[\\d.]+)"

prettier:
  version: "3"
  command: prettier
  depends_on: node_js
  npm_package: prettier
  version_command: "prettier --version"
  version_pattern: "^(?<ver>[\\d.]+)"

terraform:
  version: "1.15"
  command: terraform
  depends_on: winget
  winget_id: "Hashicorp.Terraform"
  winget_scope: user
  brew_formula: "hashicorp/tap/terraform"
  # Linux: HashiCorp apt repo must be configured first.
  # [comment:20](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment20)
  linux_admin_only: true
  version_command: "terraform --version"
  version_pattern: "^Terraform v(?<ver>[\\d.]+)"

java:
  version: "25"
  command: java
  depends_on: winget
  winget_id: "Microsoft.OpenJDK.{0}"
  # Microsoft.OpenJDK.25 ships only a machine-scope (wix) installer — there is no user-scope installer, so a `--scope user` install finds...
  # [comment:21](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment21)
  admin_only: true
  brew_formula: "openjdk@{0}"
  apt_package: "openjdk-{0}-jdk"
  version_command: "java --version"
  version_pattern: "(?<ver>[\\d.]+)"

go:
  # Go 1.27, the current stable minor; Install-Go takes its newest patch.
  # [comment:22](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment22)
  version: "1.27"
  command: go
  # Installed by Install-Go from the official go.dev archive, verified against the SHA-256 the go.dev release feed publishes, into a...
  # [comment:23](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment23)
  script_install: true
  version_command: "go version"
  version_pattern: "go version go(?<ver>[\\d.]+)"
  # Located by the managed home's binary first, then PATH.
  # [comment:24](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment24)
  windows_probes:
    - "%LOCALAPPDATA%\\go\\bin\\go.exe"
  unix_probes:
    - "%HOME%/.go/bin/go"

shellcheck:
  # ShellCheck 0.11 — the analyzer for the repository's shell scripts (*.sh, the importer.sh dispatcher), run by the Test-ShellScripts...
  # [ADR-AUTO-ENGINE](/docs/adr/automation/execution-engines.md)
  # [comment:25](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment25)
  version: "0.11"
  command: shellcheck
  depends_on: winget
  winget_id: "koalaman.shellcheck"
  winget_scope: user
  brew_formula: "shellcheck"
  linux_admin_only: true
  version_command: "shellcheck --version"
  version_pattern: "version: (?<ver>[\\d.]+)"
  # The user-scope winget portable lands in its package folder, which winget adds to the user PATH; probed first, so a fresh install is...
  # [comment:26](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment26)
  windows_probes:
    - "%LOCALAPPDATA%\\Microsoft\\WinGet\\Packages\\koalaman.shellcheck_Microsoft.Winget.Source_8wekyb3d8bbwe\\shellcheck.exe"

bicep:
  # The Bicep CLI 0.48 — the bicep formatter engine Format-Code runs over the infrastructure templates (`bicep format`, languages.yml).
  # [comment:27](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment27)
  version: "0.48"
  command: bicep
  depends_on: winget
  winget_id: "Microsoft.Bicep"
  winget_scope: user
  brew_formula: "azure/bicep/bicep"
  version_command: "bicep --version"
  version_pattern: "Bicep CLI version (?<ver>[\\d.]+)"
  # The user-scope winget portable lands in its package folder, which winget adds to the user PATH; probed first, so a fresh install is...
  # [comment:28](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment28)
  windows_probes:
    - "%LOCALAPPDATA%\\Microsoft\\WinGet\\Packages\\Microsoft.Bicep_Microsoft.Winget.Source_8wekyb3d8bbwe\\bicep.exe"
  # Linux: the verified release binary Install-Bicep places in the user bin, probed before PATH is re-read.
  unix_probes:
    - "%HOME%/.local/bin/bicep"

uv:
  version: "0.11"
  command: uv
  # depends_on winget only for the fresh-machine winget bootstrap; a standalone uv self-updates (Install-Uv).
  depends_on: winget
  # Astral's uv — the standard Python handler: it provisions Python and runs Python-based CLIs in isolated environments.
  # [comment:29](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment29)
  winget_id: "astral-sh.uv"
  winget_scope: user
  brew_formula: "uv"
  version_command: "uv --version"
  version_pattern: "uv (?<ver>[\\d.]+)"

py_spark:
  version: "4.1"
  command: pyspark
  # Installed with `uv pip install --python <pin> pyspark` INTO the uv-managed Python, so it stays importable; depends_on python for...
  # [comment:30](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment30)
  depends_on: python
  pip_package: pyspark
  # Runtime needs Java, which is admin_only — so PySpark is provisioned in the same elevated run as Java, and the non-elevated provision...
  # [comment:31](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment31)
  admin_only: true
  # Read the version from package metadata — no heavy `import pyspark` (which spins up the JVM gateway), just the installed dist-info.
  # [comment:32](/docs/references/automation/catzc-base-execution/configs/tools.yml.md#comment32)
  version_command: 'python -c "from importlib.metadata import version; print(version(''pyspark''))"'
  version_pattern: "^(?<ver>[\\d.]+)$"
