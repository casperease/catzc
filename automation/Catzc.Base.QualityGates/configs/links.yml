# Link alignment settings for Format-Links / Test-Links ([ADR-REPO-LINK#8](/docs/adr/repository/markdown-links.md#rule-adr-repo-link8)).
#
# Every key is optional: an omitted key takes the sensible default declared once on
# Catzc.Base.QualityGates.LinksConfig
# ([ADR-AUTO-DEFAULT#6](/docs/adr/automation/sensible-defaults.md#rule-adr-auto-default6)), and a Format-Links parameter overrides the
# resolved value per call ([ADR-PWSH-PARAM#4](/docs/adr/pwsh/parameter-design.md#rule-adr-pwsh-param4)).

# How an aligned comment line that outgrows its limit is wrapped: break (continue the comment on a new line
# before the link, never inside it) or off (leave it long and report it). Default: break.
wrap: break

# Per-extension line-limit overrides, e.g. { .ps1: 120 }. Default: none — the repository's .editorconfig
# max_line_length decides, so the limit is not stated twice.
line_limit: {}

# The limit for an extension .editorconfig gives no max_line_length. Default: 140 (the prose target).
default_line_limit: 140

# The string-citation check: a rule citation in a code string literal is spelled ADR-<CODE>#<n>, never with a ':'
# outside a '### Rule' heading ([ADR-REPO-LINK#5](/docs/adr/repository/markdown-links.md#rule-adr-repo-link5)).
#   mode    gate (default: every finding fails Test-Links) or report (findings are listed and never fail it)
#   exempt  glob -> why its files may spell the ':' form on purpose; default none
string_citations:
  exempt:
    automation/Catzc.Base.QualityGates/tests/Format-Links.Tests.ps1: its fixtures carry the ':' form the aligner respells
    automation/Catzc.Base.QualityGates/tests/Test-Links.Tests.ps1: its fixtures carry the ':' form the gate reports
    automation/Catzc.Base.QualityGates/tests/Get-TestRuleTags.Tests.ps1: a ':' test tag is the malformed tag it proves is refused
    automation/Catzc.Base.QualityGates/tests/Get-TestTagViolations.Tests.ps1: a ':' test tag is the malformed tag it proves is reported
    automation/Catzc.Base.QualityGates/tests/types/AnalyzerAdrMapConfig.Tests.ps1:
      a ':' citation is the malformed mapping it proves is refused
    automation/Catzc.Base.Docs/tests/types/GlossaryConfig.Tests.ps1: a ':' citation is the malformed defined_by it proves is refused
    automation/Catzc.Base.Docs/tests/Get-CatsAdrRuleIds.Tests.ps1:
      its fixtures are rule ids in registry form, the '### Rule' heading key Get-CatsAdrRuleIds returns
    automation/Catzc.Base.Docs/tests/Get-CatsAdrRules.Tests.ps1:
      its fixtures are rule ids in registry form, the '### Rule' heading key Get-CatsAdrRules returns
    automation/Catzc.Base.Docs/tests/Get-GlossaryRuleStatements.Tests.ps1:
      its fixtures are rule ids in registry form, the '### Rule' heading key its statements are keyed by
    automation/Catzc.Base.Docs/tests/Show-Cats.Tests.ps1:
      its Get-CatsAdrRules mocks return rule ids in registry form, the '### Rule' heading key
    automation/Catzc.Base.Docs/tests/Test-AgentDefinitions.Tests.ps1:
      its Get-CatsAdrRuleIds mock returns rule ids in registry form, the '### Rule' heading key
    automation/Catzc.Base.QualityGates/tests/Test-AnalyzerAdrMap.Tests.ps1:
      its Get-CatsAdrRuleIds mocks return rule ids in registry form, the '### Rule' heading key
    automation/Catzc.Base.Docs/tests/Update-AdrCitation.Tests.ps1:
      its rule-map fixtures carry rule ids in registry form, the '### Rule' heading key a rule map is keyed by
    automation/Catzc.Base.Docs/tests/types/GitHubAnchor.Tests.ps1: a ':' citation is the '### Rule' heading text it proves is slugged
    automation/Catzc.Base.Maps/tests/types/CitationScanner.Tests.ps1: a ':' citation is the form it proves is canonicalised to '#'
    automation/Catzc.Base.Maps/tests/types/ValueChainHighlight.Tests.ps1: a ':' citation is the form it proves a highlight request accepts
    automation/Catzc.Base.Maps/tests/types/WorldMapBuilder.Tests.ps1: a ':' citation is the form it proves the scan reads
    automation/Catzc.Base.Maps/tests/types/WorldMapHighlight.Tests.ps1: a ':' citation is the form it proves a highlight request accepts
