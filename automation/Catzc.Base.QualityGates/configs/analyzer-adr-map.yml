# Maps each ENABLED PSScriptAnalyzer rule that enforces an ADR rule to the rule id(s) it enforces, cited in
# the [index](/docs/adr/index.md) '#' form (ADR-<CODE>#<n>). This is the source for the 'pssa-rule' enforcer kind in the
# Test-Automation rule-coverage report (Get-AnalyzerAdrCoverage): a rule listed here is credited as
# mechanically enforced on every run, because the L2 PSScriptAnalyzer gate runs inside Test-Automation.
#
# Both kinds appear: the custom Measure-* rules (automation/.scriptanalyzer/*.psm1) and the enabled built-ins.
# A rule that maps to no ADR is simply absent. Every custom analyzer rule MUST appear here (integrity-tested),
# so a new custom rule cannot ship unmapped; a built-in appears only when it genuinely enforces an ADR and is
# enabled in PSScriptAnalyzerSettings.psd1. Shape is validated at load (the AnalyzerAdrMapConfig type); id
# existence is checked by an integrity test, not at load (so config load stays hermetic — the
# [ADR-AZ-CUSTOMER#3](/docs/adr/azure/azure-customer-model.md#rule-adr-az-customer3)
# pattern).
analyzers:
  # Custom rules (automation/.scriptanalyzer)
  Measure-VariableCasing: [ADR-PWSH-FORMAT#4]
  Measure-NeverDependOnPwd: [ADR-AUTO-NOPWD#1, ADR-PWSH-PWD#2]
  Measure-FunctionLength: [ADR-AUTO-ONEJOB#4]
  Measure-NoWriteErrorOrWarning: [ADR-PWSH-ERROR#3, ADR-PWSH-ERROR#5]
  Measure-NoAzModuleNaming: [ADR-AZ-CLI#3]
  Measure-NoAutomaticVariableMisuse: [ADR-PWSH-AUTOVAR#1]
  Measure-NoForEachObjectControlFlow: [ADR-PWSH-FOREACH#3]
  Measure-NoRawVsoCommand: [ADR-PIPE-VAR#1]
  Measure-NoRawPipelineDetection: [ADR-FLOW-CD-DETECT#1]
  Measure-NoRawInformationStream: [ADR-PWSH-ANNOUNCE#7]
  Measure-NoRawConsoleWrite: [ADR-PWSH-ANNOUNCE#1]
  Measure-AnnounceStateChange: [ADR-AUTO-CONSOLE#11, ADR-AUTO-CONSOLE#12]
  Measure-PersistentWriteThroughSeam: [ADR-AUTO-TEST#33]
  Measure-SpellOutIdentifiers: [ADR-PWSH-NAMES#1]
  Measure-NoScriptRootAnchor: [ADR-PWSH-PWD#4, ADR-AUTO-ASSETDEP#1]
  Measure-NoEnvRepositoryRoot: [ADR-AUTO-NOPWD#6]
  Measure-ParameterFillIn: [ADR-PWSH-PARAM#4]
  Measure-PrimaryArgumentPosition: [ADR-PWSH-PARAM#2]
  Measure-NoOptionalBooleanParameter: [ADR-PWSH-PARAM#3]
  Measure-NoSwitchDefaultOn: [ADR-PWSH-PARAM#3]
  Measure-NoUnsafeFirstIndex: [ADR-PWSH-ERROR#8]
  Measure-NoBareCacheEntryRead: [ADR-PWSH-CACHE#4]

  # Enabled built-in rules that enforce an ADR
  PSUseApprovedVerbs: [ADR-PWSH-VERBS#1]
  PSAvoidSemicolonsAsLineTerminators: [ADR-PWSH-NOSEMI#1]
  PSPlaceOpenBrace: [ADR-PWSH-FORMAT#2]
