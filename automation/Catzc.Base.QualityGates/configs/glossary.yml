# glossary.yml — the Catzc.Base.QualityGates glossary source: the vocabulary of the quality gates this module owns — the
# test vocabulary of Test-Automation and the link vocabulary of Test-Links ([ADR-REPO-VOCAB](/docs/adr/repository/controlled-vocabulary.md)). Every option is defaulted: all five
# checks, the whole repository, every text surface
# ([ADR-REPO-VOCAB#2](/docs/adr/repository/controlled-vocabulary.md#rule-adr-repo-vocab2)). Checked by Test-Glossary.
concepts:
    tier:
        key: tier
        domain: automation
        defined_by: ADR-AUTO-TEST#13
        short: A test's level, L0 to L3 — one mandatory tag that sets what the test may touch and when it runs.
        realized_by: { kind: tag, pattern: 'L0|L1|L2|L3' }
        contrasts:
            category: A category says what a test reads (logic or integrity); a tier says what it may touch and when it runs.
            phase: A phase is when a test's file runs within a run (parallel, greedy, serial); a tier is what the test may touch.
            test suite: A test suite is a declared selection of modules up to a top tier; a tier is one level a single test carries.
            vertical test: A vertical test is an L2 or L3 test that cuts from its ring through to the core; a tier names the ring, any test has one.
        avoid:
            - { phrase: L2 suite, say: the L2 tests / the L2 tier }
            - { phrase: L2 test suite, say: the L2 tests / the L2 tier }
            - { phrase: L3 suites, say: the L3 tests / the L3 tier }
    category:
        key: category
        domain: automation
        defined_by: ADR-AUTO-TEST#1
        short: A test's kind, logic or integrity — one mandatory tag saying whether it runs on fixtures or reads the shipped assets.
        realized_by: { kind: tag, pattern: 'logic|integrity' }
        contrasts:
            tier: A tier says what a test may touch and when it runs; a category says what it reads (logic or integrity).
        avoid:
            - { phrase: integrity suite, say: the integrity tests }
    test run:
        key: test_run
        domain: automation
        defined_by: ADR-AUTO-TEST#34
        short: One invocation of Test-Automation, Test-CatzcBuild, or Invoke-TestFile over a selection of test files, in one slot, with one report.
        realized_by: { kind: artifact, pattern: 'out/test-*/*/run.json' }
        contrasts:
            release candidate: A release candidate is the artifact a release-candidate test run verifies; a test run executes tests.
            all tests: All tests is every test in the repository, at rest; a test run executes one selection of them, possibly all.
            test suite: A test suite is a declared selection at rest; a test run executes a selection, a test suite or an ad-hoc one.
        avoid:
            - { phrase: source suite, say: source run }
            - { phrase: build suite, say: build run }
            - { phrase: build suites, say: build runs }
            - { phrase: both suites, say: both runs (the source run and the build run) }
            - { phrase: two suites, say: two test runs (the source run and the build run) }
    gate:
        key: gate
        domain: flow
        defined_by: ADR-FLOW-CD#13
        short: A check whose verdict decides whether work may proceed — automated (a quality gate, the CI gate) or human (RC, RBC).
        realized_by: { kind: prose-only }
        forms: [quality, CI, RC, RBC, release, manual, PR, merge, commit, approval, production, push]
        contrasts:
            quality gate: A quality gate is one automated check of the repository; a gate is any decision point, human or automated.
    quality gate:
        key: quality_gate
        domain: automation
        defined_by: ADR-AUTO-TEST#35
        short: A gate checking one property of the whole repository automatically — one Test-<subject> function that reports through Write-QualityGateReport and throws once with every issue.
        realized_by: { kind: function, pattern: 'Write-QualityGateReport' }
        relations:
            kind_of: [gate]
        contrasts:
            gate: A gate is any decision point, human or automated; a quality gate is one automated check of the repository.
            build verification test: The BVT certifies a commit by running the quality gates together; a quality gate is one check inside it.
        avoid:
            - { phrase: analyzer suite, say: the analyzer quality gate (Test-ScriptAnalyzer) }
    test file:
        key: test_file
        domain: automation
        defined_by: ADR-AUTO-PESTER#5
        short: One *.Tests.ps1 file under a module's tests/ — one per function, named Verb-Noun.Tests.ps1 (or for a C# type under tests/types/).
        realized_by: { kind: file-pattern, pattern: 'automation/*/tests/**/*.Tests.ps1' }
        contrasts:
            test block: A test block is a Describe or Context inside a test file; a test file is the file that holds them.
        avoid:
            - { phrase: cross-cutting suite, say: cross-cutting test file }
    test block:
        key: test_block
        domain: automation
        defined_by: ADR-AUTO-PESTER#8
        short: A Describe or Context in a test file — a named group of tests whose tags and setup apply to everything inside it.
        realized_by: { kind: function, pattern: 'Describe|Context' }
        relations:
            part_of: [test file]
        contrasts:
            test file: A test file is the *.Tests.ps1 file; a test block is a Describe or Context inside it.
            test: A test is one It that passes or fails; a test block groups tests and carries their shared tags and setup.
    test:
        key: test
        domain: automation
        defined_by: ADR-AUTO-PESTER#8
        short: One Pester It — the smallest unit that passes or fails, counted by every report row, rule citation, and timing.
        realized_by: { kind: function, pattern: 'It' }
        relations:
            part_of: [test block]
        contrasts:
            test block: A test block groups tests and carries their shared tags and setup; a test is one It that passes or fails.
    phase:
        key: phase
        domain: automation
        defined_by: ADR-AUTO-TEST#26
        short: One of a test run's three scheduling stages, in order — parallel shards, greedy, serial — chosen per file by the serial/greedy tags.
        realized_by: { kind: tag, pattern: 'serial|greedy' }
        contrasts:
            tier: A tier is what a test may touch; a phase is when its file runs within a run (parallel, greedy, serial).
    build verification test:
        key: bvt
        domain: automation
        defined_by: ADR-AUTO-TEST#24
        short: The BVT — the gate that certifies a commit by running the quality gates together, before and after the commit reaches master.
        realized_by: { kind: prose-only }
        relations:
            kind_of: [gate]
        contrasts:
            quality gate: A quality gate is one check inside the BVT; the BVT certifies a commit by running the quality gates together.
    all tests:
        key: all_tests
        domain: automation
        defined_by: ADR-AUTO-TEST#36
        short: Every test in the repository — every test file of every module, at every tier and category; what a test run selects at its defaults.
        realized_by: { kind: function, pattern: 'Test-Automation' }
        contrasts:
            test run: A test run executes one selection of tests, possibly all; all tests is every test in the repository, at rest.
            test suite: A test suite is a named selection, usually a few modules up to a tier; all tests is every test there is.
        avoid:
            - { phrase: the test suite, say: all tests }
            - { phrase: pester suite, say: all tests }
            - { phrase: pester test suite, say: all tests }
            - { phrase: full suite, say: all tests }
    test suite:
        key: test_suite
        domain: automation
        defined_by: ADR-AUTO-TEST#37
        short: A named, declared selection of tests that runs as one unit — a globset's verify scope in globs.yml (modules up to a tier), run with Test-Automation -Suite.
        realized_by: { kind: config-key, pattern: 'automation/Catzc.Base.Globs/configs/globs.yml' }
        contrasts:
            all tests: All tests is every test there is; a test suite is a named selection, usually a few modules up to a tier.
            test run: A test run executes a selection, a test suite or an ad-hoc one; a test suite is the declared selection at rest.
            tier: A tier is one level a single test carries; a test suite selects whole modules up to a top tier.
            release candidate: A release candidate is the artifact under test; a test suite is the declared selection of tests that verifies a change.
    vertical test:
        key: vertical_test
        domain: automation
        defined_by: ADR-AUTO-TEST#38
        short: An L2 or L3 test that cuts from an outer ring of the test onion (local tools; outside state) through to the core, the code alone.
        realized_by: { kind: tag, pattern: 'L2|L3' }
        contrasts:
            tier: A tier names a test's outermost ring and every test has one; a vertical test is an L2 or L3 test, one that crosses a ring.
    markdown link:
        key: markdown_link
        domain: repository
        defined_by: ADR-REPO-LINK#1
        short: A link inside a rendered .md file, written relative to that file so it resolves the same on GitHub and in VS Code.
        realized_by: { kind: function, pattern: Test-Links }
        contrasts:
            code link: A code link lives in a comment of a non-markdown file and is repository-rooted; a markdown link lives in a .md file and is relative to it.
    code link:
        key: code_link
        domain: repository
        defined_by: ADR-REPO-LINK#1
        short: An ADR citation in a code comment, written as a repository-rooted markdown link whose text is the citation code.
        realized_by: { kind: function, pattern: Format-Links }
        contrasts:
            markdown link: A markdown link lives in a .md file and is relative to it; a code link lives in a comment of a non-markdown file and is repository-rooted.
