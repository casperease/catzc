# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.QualityGates/configs/file-meta.yml
#     kind: config
#     language: yaml
#     filetype: yml
#     track: automation
#     module: Catzc.Base.QualityGates
#     moduletype: pwsh-folder-module
#     bundle: azure
#     relatives:
#       page: docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md
# ---

kinds:
  # The repository-relative path of every file that carries a block, first so it is written first; a Markdown H1 is the title.
  file-path:
    keys: [path]

  # The kind of the file by its role, and its subkind when it has one, from the file-kinds registry.
  file-kind:
    keys: [kind, subkind]

  # The file language of the file, from the languages registry by its extension; a file no language lists carries none.
  file-language:
    keys: [language]

  # The file type of the file, the extension of its name, which tells the sorts of file inside one language apart (ps1 from psm1 and psd1).
  file-type:
    keys: [filetype]

  # The track whose root folder holds the file, from the tracks registry; a root file, which no track holds, carries none.
  track:
    keys: [track]

  # The module the file is placed in, from the module-types registry; a file placed in no module carries none.
  module-name:
    keys: [module]

  # The type of that module, from the module-types registry (pwsh-folder-module, settings-module, pipeline-module, …).
  module-type:
    keys: [moduletype]

  # The smallest built bundle that holds the module, from the exporter registry; a file in no module of a bundle carries none.
  bundle:
    keys: [bundle]

  # The file that writes a generated comment page, so the head names its writer; the path is the setting, and the file must exist.
  generator:
    select: [{ classes: [comment-page] }]
    settings:
      generator: automation/Catzc.Base.QualityGates/Export-Comments.ps1

  # The hash of the body below the front matter, so it changes exactly when the file does.
  body-sha:
    keys: [body_sha]
    select: [{ languages: [markdown] }]

  # Whether a PowerShell function file is public or private, from the module's private folder.
  visibility:
    keys: [visibility]
    select: [{ classes: [function] }]

  relatives:
    settings:
      relations:
        - name: page
          rules:
            - { paths: ["{page}"] }
        - name: test
          rules:
            - { classes: [type], paths: ["automation/{module}/tests/types/{stem}.Tests.ps1"] }
            - { classes: [function], paths: ["automation/{module}/tests/{stem}.Tests.ps1"] }

  # The rules an ADR defines in its own rule headings, spelled as citations; they are no citation of the ADR, so adrs never lists them.
  adr-defines:
    keys: [defines]
    select: [{ classes: [adr], languages: [markdown] }]

  # The ADR codes a file cites; a code class also lists bare domain codes and keeps what its head holds (domain_ and held_classes default).
  adr-codes:
    keys: [adrs]
    select: [{ languages: [markdown] }, { classes: [type, function] }, { classes: [test, fixture], languages: [powershell] }]

  # Every link a Markdown file points out of itself, one spelling, sorted; a link that stays inside the file is not listed. Last: the longest key.
  links:
    select: [{ languages: [markdown] }]
