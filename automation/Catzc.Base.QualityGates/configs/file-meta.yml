# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.QualityGates/configs/file-meta.yml
#     kind: yaml-config
# ---

# The meta-kind registry: each entry is one kind of derived fact imprinted into a file's meta block, with defaults on FileMetaKind.
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment1)
kinds:
  # The repository-relative path of every file that carries a block, first so it is written first; a Markdown H1 is the title.
  file-path:
    keys: [path]

  # The class of the file, the first class whose globs match its path, or other.
  file-kind:
    keys: [kind]
    settings:
      classes:
        - { class: pester-test, files: ["**/tests/**/*.Tests.ps1"] }
        - { class: python-test, files: ["**/tests/**/*.py"] }
        - { class: shell-test, files: ["**/tests/**/*.bats", "**/tests/**/*.sh"] }
        - { class: go-test, files: ["**/tests/**/*.go"] }
        - { class: test-asset, files: ["**/tests/**"] }
        - { class: csharp-type, files: ["automation/**/types/*.cs"] }
        # A function file is told by its role, from the folder and its verb, before it is told by its visibility.
        - { class: gate-function, files: ["automation/Catzc.*/Test-*.ps1"] }
        - { class: writer-function, files: ["automation/Catzc.*/Build-*.ps1", "automation/Catzc.*/New-*.ps1"] }
        - { class: assert-function, files: ["automation/Catzc.*/Assert-*.ps1"] }
        - { class: format-function, files: ["automation/Catzc.*/Format-*.ps1"] }
        - { class: fact-function, files: ["automation/Catzc.*/private/Get-*FileMetaFact.ps1"] }
        - { class: public-function, files: ["automation/Catzc.*/*.ps1"] }
        - { class: private-function, files: ["automation/Catzc.*/private/*.ps1"] }
        - { class: analyzer-rule, files: ["automation/.scriptanalyzer/**"] }
        - { class: internal-module, files: ["automation/.internal/*.psm1"] }
        - { class: bicep-template, files: ["infrastructure/templates/**/*.bicep"] }
        - {
            class: bicep-template-config,
            files: ["infrastructure/templates/**/configuration/**/*.yml", "infrastructure/templates/*/options.yml"],
          }
        - { class: bicep-module, files: ["infrastructure/modules/*.bicep"] }
        - { class: yaml-config, files: ["automation/**/configs/*.yml"] }
        - { class: pipeline-template, files: ["pipelines/*/*.yaml"] }
        - { class: pipeline, files: ["pipelines/*.yaml", ".github/workflows/*.yml"] }
        - { class: claude-hook, files: [".claude/hooks/**"] }
        - { class: asset, files: ["automation/**/assets/**"] }
        - { class: python-script, files: ["**/*.py"] }
        - { class: shell-script, files: ["**/*.sh"] }
        - { class: powershell-script, files: ["**/*.ps1"] }
        - { class: drawio-kit, files: [".claude/drawio/**"] }
        - { class: claude-agent, files: [".claude/agents/**"] }
        - { class: claude-skill, files: [".claude/skills/**"] }
        - { class: adr, files: ["docs/adr/**"] }
        # A comment page keeps its source file's name and extension plus.md, so the name marks it; it wins over reference.
        # [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment2)
        - {
            class: comment-page,
            files:
              [
                "docs/references/**/*.ps1.md",
                "docs/references/**/*.psm1.md",
                "docs/references/**/*.psd1.md",
                "docs/references/**/*.cs.md",
                "docs/references/**/*.yml.md",
                "docs/references/**/*.yaml.md",
                "docs/references/**/*.bicep.md",
              ],
          }
        - { class: reference, files: ["docs/references/**"] }
        - { class: how-to, files: ["docs/how-to/**"] }
        - { class: explanation, files: ["docs/explanation/**"] }
        - { class: asset-description, files: ["docs/.assets/**"] }
        - { class: readme, files: ["**/README.md"] }
        - { class: index, files: ["docs/index.md"] }

  # The hash of the body below the front matter, so it changes exactly when the file does.
  body-sha:
    keys: [body_sha]
    files: ["**/*.md"]

  # The module a code file belongs to, the folder under automation.
  module-name:
    keys: [module]
    files:
      - "automation/**/types/*.cs"
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"

  # Whether a PowerShell function file is public or private, from the module's private folder.
  visibility:
    keys: [visibility]
    files:
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"

  # The rules an ADR defines in its own rule headings, spelled as citations; they are no citation of the ADR, so adrs never lists them.
  adr-defines:
    keys: [defines]
    files: ["docs/adr/**/*.md"]

  # The ADR codes the file cites, its comment page's too, sorted and without duplicates, less the rules it defines; a long key, so late.
  # [comment:3](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment3)
  adr-codes:
    keys: [adrs]
    files:
      - "**/*.md"
      - "automation/**/types/*.cs"
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"
      - "automation/**/tests/**/*.ps1"
    settings:
      domain_files:
        - "automation/**/types/*.cs"
        - "automation/Catzc.*/*.ps1"
        - "automation/Catzc.*/private/*.ps1"
        - "automation/**/tests/**/*.ps1"
      held_files:
        - "automation/**/types/*.cs"
        - "automation/Catzc.*/*.ps1"
        - "automation/Catzc.*/private/*.ps1"
        - "automation/**/tests/**/*.ps1"

  # Every link a Markdown file points out of itself, one spelling, sorted; a link that stays inside the file is not listed. Last: the longest key.
  links:
    files: ["**/*.md"]
