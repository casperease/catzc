# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.QualityGates/configs/file-meta.yml
#     kind: config
#     language: yaml
#     filekind: yml
#     track: automation
#     module: Catzc.Base.QualityGates
#     relatives:
#       page: docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md
# ---

# The file classes, in precedence order: a file is the first class whose globs match it, or other. The one place file-meta names globs.
classes:
  # A comment page is marked by its name, the source file's plus .md; first, since a test's page sits under tests/.
  - {
      class: comment-page,
      files:
        [
          "docs/references/**/*.ps1.md",
          "docs/references/**/*.psm1.md",
          "docs/references/**/*.psd1.md",
          "docs/references/**/*.cs.md",
          "docs/references/**/*.yml.md",
          "docs/references/**/*.yaml.md",
          "docs/references/**/*.bicep.md",
        ],
    }
  # A class names the role of a file and never its language, track or module: those are the keys language, track and module of its head.
  - {
      class: test,
      files: ["**/tests/**/*.Tests.ps1", "**/tests/**/*.py", "**/tests/**/*.bats", "**/tests/**/*.sh", "**/tests/**/*.go"],
    }
  - { class: fixture, files: ["**/tests/**"] }
  - { class: type, files: ["automation/**/types/*.cs"] }
  # A function file is told by its role, from the folder and its verb, before it is told by its visibility.
  - { class: gate, files: ["automation/Catzc.*/Test-*.ps1"] }
  - { class: writer, files: ["automation/Catzc.*/Build-*.ps1", "automation/Catzc.*/New-*.ps1"] }
  - { class: assert, files: ["automation/Catzc.*/Assert-*.ps1"] }
  - { class: formatter, files: ["automation/Catzc.*/Format-*.ps1"] }
  - { class: fact, files: ["automation/Catzc.*/private/Get-*FileMetaFact.ps1"] }
  - { class: function, files: ["automation/Catzc.*/*.ps1", "automation/Catzc.*/private/*.ps1"] }
  - { class: analyzer-rule, files: ["automation/.scriptanalyzer/**"] }
  - { class: internal, files: ["automation/.internal/*.psm1"] }
  - { class: template, files: ["infrastructure/templates/**/*.bicep"] }
  - {
      class: template-config,
      files: ["infrastructure/templates/**/configuration/**/*.yml", "infrastructure/templates/*/options.yml"],
    }
  - { class: template-module, files: ["infrastructure/modules/*.bicep"] }
  - { class: config, files: ["automation/**/configs/*.yml"] }
  - { class: pipeline-template, files: ["pipelines/*/*.yaml"] }
  - { class: pipeline, files: ["pipelines/*.yaml", ".github/workflows/*.yml"] }
  - { class: hook, files: [".claude/hooks/**"] }
  - { class: asset, files: ["automation/**/assets/**"] }
  - { class: script, files: ["**/*.py", "**/*.sh", "**/*.ps1"] }
  - { class: drawio-kit, files: [".claude/drawio/**"] }
  - { class: agent, files: [".claude/agents/**"] }
  - { class: skill, files: [".claude/skills/**"] }
  - { class: adr, files: ["docs/adr/**"] }
  - { class: reference, files: ["docs/references/**"] }
  - { class: how-to, files: ["docs/how-to/**"] }
  - { class: explanation, files: ["docs/explanation/**"] }
  - { class: asset-description, files: ["docs/.assets/**"] }
  - { class: readme, files: ["**/README.md"] }
  - { class: index, files: ["docs/index.md"] }

# A kind selects files by class and language, never by glob; with no select it applies to every file that carries a head.
kinds:
  # The repository-relative path of every file that carries a block, first so it is written first; a Markdown H1 is the title.
  file-path:
    keys: [path]

  # The class of the file, from the classes above.
  file-kind:
    keys: [kind]

  # The file language of the file, from the languages registry by its extension; a file no language lists carries none.
  file-language:
    keys: [language]

  # The file kind of the file, the extension of its name, which tells the sorts of file inside one language apart (ps1 from psm1 and psd1).
  file-extension:
    keys: [filekind]

  # The track whose root folder holds the file, from the tracks registry; a root file, which no track holds, carries none.
  track:
    keys: [track]

  # The module the file is placed in, the folder under the automation track's root; a file placed in no module carries none.
  module-name:
    keys: [module]

  # The file that writes a generated comment page, so the head names its writer; the path is the setting, and the file must exist.
  generator:
    select: [{ classes: [comment-page] }]
    settings:
      generator: automation/Catzc.Base.QualityGates/Export-Comments.ps1

  # The hash of the body below the front matter, so it changes exactly when the file does.
  body-sha:
    keys: [body_sha]
    select: [{ languages: [markdown] }]

  # Whether a PowerShell function file is public or private, from the module's private folder.
  visibility:
    keys: [visibility]
    select: [{ classes: [gate, writer, assert, formatter, fact, function] }]

  # The few files a file points at, as at most eight relations with fixed names; one is written only when its file exists.
  relatives:
    settings:
      relations:
        - name: page
          rules:
            - { paths: ["{page}"] }
        - name: test
          rules:
            - { classes: [type], paths: ["automation/{module}/tests/types/{stem}.Tests.ps1"] }
            - { classes: [gate, writer, assert, formatter, fact, function], paths: ["automation/{module}/tests/{stem}.Tests.ps1"] }
        - name: source
          rules:
            - { classes: [test], paths: ["automation/{module}/types/{stem}.cs"] }
            - { classes: [test], paths: ["automation/{module}/{stem}.ps1", "automation/{module}/private/{stem}.ps1"] }

  # The rules an ADR defines in its own rule headings, spelled as citations; they are no citation of the ADR, so adrs never lists them.
  adr-defines:
    keys: [defines]
    select: [{ classes: [adr], languages: [markdown] }]

  # The ADR codes a file cites; a code class also lists bare domain codes and keeps what its head holds (domain_ and held_classes default).
  adr-codes:
    keys: [adrs]
    select:
      [
        { languages: [markdown] },
        { classes: [type, gate, writer, assert, formatter, fact, function] },
        { classes: [test, fixture], languages: [powershell] },
      ]

  # Every link a Markdown file points out of itself, one spelling, sorted; a link that stays inside the file is not listed. Last: the longest key.
  links:
    select: [{ languages: [markdown] }]
