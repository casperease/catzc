# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.QualityGates/configs/file-meta.yml
#     kind: config
# ---

# The meta-kind registry: each entry is one kind of derived fact imprinted into a file's meta block, with defaults on FileMetaKind.
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment1)
kinds:
  # The repository-relative path of every file that carries a block, first so it is written first; a Markdown H1 is the title.
  file-path:
    keys: [path]

  # The class of the file, the first class whose globs match its path, or other.
  file-kind:
    keys: [kind]
    settings:
      classes:
        - { class: test, files: ["**/tests/**"] }
        - { class: type, files: ["automation/**/types/*.cs"] }
        - { class: function, files: ["automation/Catzc.*/*.ps1", "automation/Catzc.*/private/*.ps1"] }
        - { class: template, files: ["infrastructure/templates/**/*.bicep"] }
        - { class: template-config, files: ["infrastructure/templates/**/configuration/**/*.yml"] }
        - { class: config, files: ["automation/**/configs/*.yml"] }
        - { class: script, files: ["**/*.py", "**/*.sh"] }
        - { class: agent, files: [".claude/agents/**"] }
        - { class: skill, files: [".claude/skills/**"] }
        - { class: adr, files: ["docs/adr/**"] }
        # A comment page keeps its source file's name and extension plus.md, so the name marks it; it wins over reference.
        # [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment2)
        - {
            class: comment-page,
            files:
              [
                "docs/references/**/*.ps1.md",
                "docs/references/**/*.psm1.md",
                "docs/references/**/*.psd1.md",
                "docs/references/**/*.cs.md",
                "docs/references/**/*.yml.md",
                "docs/references/**/*.yaml.md",
                "docs/references/**/*.bicep.md",
              ],
          }
        - { class: reference, files: ["docs/references/**"] }
        - { class: how-to, files: ["docs/how-to/**"] }
        - { class: explanation, files: ["docs/explanation/**"] }
        - { class: asset-description, files: ["docs/.assets/**"] }
        - { class: readme, files: ["**/README.md"] }

  # The hash of the body below the front matter, so it changes exactly when the file does.
  body-sha:
    keys: [body_sha]
    files: ["**/*.md"]

  # The module a code file belongs to, the folder under automation.
  module-name:
    keys: [module]
    files:
      - "automation/**/types/*.cs"
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"

  # Whether a PowerShell function file is public or private, from the module's private folder.
  visibility:
    keys: [visibility]
    files:
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"

  # The ADR codes the file cites, its comment page's too, sorted and without duplicates; last, because the list is the one long key.
  # [comment:3](/docs/references/automation/catzc-base-qualitygates/configs/file-meta.yml.md#comment3)
  adr-codes:
    keys: [adrs]
    files:
      - "**/*.md"
      - "automation/**/types/*.cs"
      - "automation/Catzc.*/*.ps1"
      - "automation/Catzc.*/private/*.ps1"
    settings:
      domain_files:
        - "automation/**/types/*.cs"
        - "automation/Catzc.*/*.ps1"
        - "automation/Catzc.*/private/*.ps1"
