# The source checks Test-SourceConventions runs beside its naming conventions.
# [ADR-AUTO-DEFAULT#6](/docs/adr/automation/sensible-defaults.md#rule-adr-auto-default6)
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/source-conventions.yml.md#comment1)

# The engine set is declared once, in the ExecutionEngines model, and never restated.
# [ADR-AUTO-ENGINE#1](/docs/adr/automation/execution-engines.md#rule-adr-auto-engine1),
# [ADR-AUTO-ENGINE#6](/docs/adr/automation/execution-engines.md#rule-adr-auto-engine6)
# [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/source-conventions.yml.md#comment2)
engine_set:
  exempt:
    automation/Catzc.Base.Engines/types/**: the model itself, the one place the engines are declared
    automation/Catzc.Base.Engines/tests/**: the model's own tests pin the names it declares
    "**/tests/assets/engine-cases/**": the engine-case tables carry one column per engine by design
  count_phrases:
    - '\b{count} (?:execution )?engines\b'
  name_phrases:
    - '\b{name}(?:(?:,? and |,? or |, |/| \| ){name})+\b'
    - '\[{name}\]'

# A logic (L0) test's fixture data uses neutral ADR codes, never one the ADR index declares.
# [ADR-AUTO-TEST#3](/docs/adr/automation/test-automation.md#rule-adr-auto-test3)
# [comment:3](/docs/references/automation/catzc-base-qualitygates/configs/source-conventions.yml.md#comment3)
neutral_codes:
  exempt:
    automation/.scriptanalyzer/tests/NoScriptRootAnchor.Tests.ps1: it asserts the analyzer's exact message, which cites its real rule
    automation/Catzc.Azure.DevOps/tests/Test-Pipelines.Tests.ps1: it asserts the gate's exact messages, which cite its real rules
    automation/Catzc.Azure.Templates/tests/Build-Bicep.Integrity.Tests.ps1:
      an integrity test over the shipped templates; its -Because message names the real rule they meet
    automation/Catzc.Base.Contracts/tests/Get-ContractFreezeFindings.Tests.ps1:
      it asserts the findings' exact messages, which cite their real rule
    automation/Catzc.Base.Contracts/tests/Test-Contracts.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    automation/Catzc.Base.Docs/tests/Get-Glossary*Violations.Tests.ps1:
      they assert the glossary checks' exact messages, which cite their real rules
    automation/Catzc.Base.Globs/tests/types/GlobsConfig.Tests.ps1: it asserts the config's exact errors, which cite their real rule
    automation/Catzc.Base.Maps/tests/Test-ValueChainMap.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    automation/Catzc.Base.Maps/tests/Test-WorldMap.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    automation/Catzc.Base.ModuleSystem/tests/Get-UncoveredInternalAssetDependency.Tests.ps1:
      the citation a covering test carries is the real rule the function looks for
    automation/Catzc.Base.Overlay/tests/Assert-CatzcOverlay.Tests.ps1: it asserts the gate's exact message, which names its real ADR
