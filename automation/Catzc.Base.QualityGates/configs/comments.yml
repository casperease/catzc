# ---
# catzc:
#   derived:
#     path: automation/Catzc.Base.QualityGates/configs/comments.yml
#     kind: yaml-config
# ---

# Every key is optional: an omitted key takes the default declared once on CommentsConfig, so this file lists only deviations.
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment1)

# A language CommentLexer cannot read (python, bash) stays out until the lexer learns it.
# [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment2)
languages: [powershell, yaml, pipeline-yaml, csharp, bicep]

# A comment block with fewer prose lines than this stays in the file. Default: 2.
min_lines: 2

# A listed language replaces its default keep list, while an unlisted language keeps the default.
# [comment:3](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment3)
keep:
  powershell: [".SYNOPSIS", ".EXAMPLE", ".OUTPUTS", ".INPUTS", "#Requires", "#region", "#endregion", "#!", "# cspell:"]
  yaml: ["# yaml-language-server:", "# cspell:"]
  pipeline-yaml: ["# yaml-language-server:", "# cspell:"]
  csharp: ["// <auto-generated", "// cspell:"]
  bicep: ["// cspell:"]

# A head listed here keeps the whole run of comment lines it opens, or the whole block comment whose front matter opens with it.
# [comment:7](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment7)
keep_run:
  powershell: ["# catzc:"]
  yaml: ["# catzc:"]
  pipeline-yaml: ["# catzc:"]
  csharp: ["// catzc:"]
  bicep: ["// catzc:"]

# Dot-prefixed folders never match a wildcard source, so .scriptanalyzer and .internal are named and .vendor (third-party) has no pages.
# [comment:4](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment4)
pages:
  - source: automation/*
    docs: docs/references/automation/{kebab}
  - source: pipelines
    docs: docs/references/pipelines
  - source: infrastructure
    docs: docs/references/infrastructure
  - source: .claude/hooks
    docs: docs/references/automation/claude-hooks
  - source: automation/.scriptanalyzer
    docs: docs/references/automation/scriptanalyzer
  - source: automation/.internal
    docs: docs/references/automation/internal

# Listing this key replaces the default map, so the tests entry is left out here and a test's prose moves like any other file's.
# [comment:5](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment5)
exclude:
  "**/assets/**": an asset is copied or published verbatim elsewhere, where a docs link would be foreign

# The view is a derived copy under out/ and is never committed, so editing it changes nothing.
# [comment:6](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment6)
view: out/annotated
