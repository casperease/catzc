languages: [powershell, yaml, pipeline-yaml, csharp, bicep]

# A comment block with fewer prose lines than this stays in the file. Default: 2.
min_lines: 2

keep:
  powershell: [".SYNOPSIS", ".EXAMPLE", ".OUTPUTS", ".INPUTS", "#Requires", "#region", "#endregion", "#!", "# cspell:"]
  yaml: ["# yaml-language-server:", "# cspell:"]
  pipeline-yaml: ["# yaml-language-server:", "# cspell:"]
  csharp: ["// <auto-generated", "// cspell:"]
  bicep: ["// cspell:"]

keep_run:
  powershell: ["# catzc:"]
  yaml: ["# catzc:"]
  pipeline-yaml: ["# catzc:"]
  csharp: ["// catzc:"]
  bicep: ["// catzc:"]

pages:
  - source: automation/*
    docs: docs/references/automation/{kebab}
  - source: pipelines
    docs: docs/references/pipelines
  - source: infrastructure
    docs: docs/references/infrastructure
  - source: .claude/hooks
    docs: docs/references/automation/claude-hooks
  - source: .claude/drawio
    docs: docs/references/automation/claude-drawio
  - source: .claude/slides
    docs: docs/references/automation/claude-slides
  - source: .github/workflows
    docs: docs/references/pipelines/github-workflows
  - source: automation/.scriptanalyzer
    docs: docs/references/automation/scriptanalyzer
  - source: automation/.internal
    docs: docs/references/automation/internal

exclude:
  asset: an asset is copied or published verbatim elsewhere, where a page of this repository would be foreign
  fixture/input: a test's input is read by the test, verbatim

view: out/annotated
