# Comment-page settings for Export-Comments / Format-Comments / Build-CommentView / Test-Comments.
# [ADR-PRIN-ONELIVE#1](/docs/adr/principles/one-living-version.md#rule-adr-prin-onelive1),
# [ADR-AUTO-DEFAULT#6](/docs/adr/automation/sensible-defaults.md#rule-adr-auto-default6),
# [ADR-PRIN-CONFIG#1](/docs/adr/principles/configure-not-program.md#rule-adr-prin-config1)
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment1)

# The file languages (languages.yml names) whose files carry comment pages.
# [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment2)
languages: [powershell, yaml, pipeline-yaml, csharp, bicep]

# A comment block with fewer prose lines than this stays in the file. Default: 2.
min_lines: 2

# Per language, the comment lines that never move: a prefix of a trimmed comment line (marker included for a line comment), which stays...
# [comment:3](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment3)
keep:
  powershell: [".SYNOPSIS", ".EXAMPLE", ".OUTPUTS", ".INPUTS", "#Requires", "#region", "#endregion", "#!", "# cspell:"]
  yaml: ["# yaml-language-server:", "# cspell:"]
  pipeline-yaml: ["# yaml-language-server:", "# cspell:"]
  csharp: ["// <auto-generated", "// cspell:"]
  bicep: ["// cspell:"]

# Where a file's comment page lives, first match wins.
# [comment:4](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment4)
pages:
  - source: automation/*
    docs: docs/references/automation/{kebab}
  - source: pipelines
    docs: docs/references/pipelines
  - source: infrastructure
    docs: docs/references/infrastructure
  - source: .claude/hooks
    docs: docs/references/automation/claude-hooks

# Files that keep their comments: repository-relative glob (the durable-sha-globs dialect) -> why.
# [comment:5](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment5)
exclude:
  "**/tests/**": a test's prose is its own subject
  "**/assets/**": an asset is copied or published verbatim elsewhere, where a docs link would be foreign

# A residue line that starts with one of these states the obvious and is refused by Format-Comments.
obvious_phrases:
  - this function
  - this script
  - this file
  - this config
  - this type
  - this test
  - a helper
  - helper function
  - helper that
  - returns the result
  - see above
  - see below
  - as the name says

# The gitignored folder, under out/, Build-CommentView writes the annotated view to.
# [ADR-REPO-OUTDIR#1](/docs/adr/repository/dedicated-output-directory.md#rule-adr-repo-outdir1)
# [comment:6](/docs/references/automation/catzc-base-qualitygates/configs/comments.yml.md#comment6)
view: out/annotated
