# Generated cspell word lists derive from this file, so never hand-edit them; every term category must be defined here.
# [ADR-AUTO-SPELL](/docs/adr/automation/spell-out-names.md),
# [ADR-AUTO-SPELL#5](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell5),
# [ADR-AUTO-SPELL#8](/docs/adr/automation/spell-out-names.md#rule-adr-auto-spell8)
# [comment:1](/docs/references/automation/catzc-base-qualitygates/configs/terminology.yml.md#comment1)

# The optional scope only declares a language zone; cspell reads words, not meaning, so every category acts global today.
# [ADR-REPO-LANG](/docs/adr/repository/domain-language-separation.md), [ADR-AUTO-TEST](/docs/adr/automation/test-automation.md),
# [ADR-AUTO-SPELL](/docs/adr/automation/spell-out-names.md)
# [comment:2](/docs/references/automation/catzc-base-qualitygates/configs/terminology.yml.md#comment2)
categories:
  product:
    description: "A real product, tool, protocol, or general technical term this codebase uses that fits no more specific category below."
  abbreviation:
    description: "A short form standing for a full word or phrase; carries expands_to with the full form."
  fixture:
    description:
      "A hermetic TEST token or documentation placeholder — a fixture identity or example value used in tests, doc examples, and
      comment-based-help EXAMPLE blocks, but NEVER in shipped config DATA (a *.yml/*.json/*.bicep under configs/ or infrastructure/). The
      test zone (ADR-REPO-LANG)."
    scope:
      - "**/tests/**"
      - "docs/**"
      - "**/*.ps1"
      - "**/*.psm1"
  azure-live:
    description:
      "A LIVE Azure identity — a real customer, subscription, org, or shipped-template name that the demo config maps to (the live zone,
      ADR-REPO-LANG). Guarded by integrity tests; forbidden in a logic test."
    scope:
      - "automation/Catzc.Azure*/configs/**"
      - "infrastructure/**"
      - "docs/**"
  adr-example:
    description:
      "A DESIGN-zone example token — a discovery-theme name (discovery/expedition/survey, Contoso) or documentation placeholder used only in
      ADRs and reference docs (ADR-REPO-EXAMPLE, ADR-REPO-LANG)."
    scope:
      - "docs/**"
  adr:
    description: "An ADR rule-citation code — the short code naming a docs/adr rule."
  ado:
    description: "Azure DevOps vocabulary: predefined pipeline variables, REST area names, and logging commands."
  azure:
    description: "Azure and cloud infrastructure: regions, resource types, network topology, and environment or subscription tokens."
  tool:
    description: "An external tool, product, package manager, runtime, or file/data format."
  platform:
    description: "Operating-system, .NET, filesystem, registry, or low-level runtime and encoding vocabulary."
  powershell:
    description: "PowerShell language and runtime vocabulary — cmdlet/parameter names, automatic variables, and concepts."
  coined:
    description: "A word this codebase coined — a neologism (adjective, verb, or noun) not found in ordinary usage."
  person:
    description: "A cited author or thinker referenced in the docs."

