# glossary.yml — the Catzc.Azure.Templates glossary source: the vocabulary of the Bicep template configuration this module
# builds and deploys ([ADR-REPO-VOCAB](/docs/adr/repository/controlled-vocabulary.md)). Every option is defaulted: all five
# checks, the whole repository, every text surface
# ([ADR-REPO-VOCAB#2](/docs/adr/repository/controlled-vocabulary.md#rule-adr-repo-vocab2)). Checked by Test-Glossary.
concepts:
  slot:
    key: slot
    domain: azure
    defined_by: ADR-AZ-DATAMOD#2
    short: A Bicep configuration slot — one config file of a template (`<env>[-<slot>].yml`), deploying one subscription's resource group.
    realized_by: { kind: prose-only }
    forms:
      [Bicep, base, configuration, root, template, indexed, special, optional, customer, platform, env, core, subfolder, target, region]
  landing zone:
    key: landing_zone
    domain: azure
    defined_by: ADR-AZ-LZ#1
    short:
      The network, guardrails, and cost control a workload lands in — the CAF application landing zone, deployed once per subscription at
      subscription scope by the discovery template.
    realized_by: { kind: prose-only }
  hub:
    key: hub
    domain: azure
    defined_by: ADR-AZ-LZ#2
    short: The landing zone of a shared subscription — the network every spoke of its tier peers to, holding the private DNS zones.
    realized_by: { kind: prose-only }
    contrasts:
      spoke: A spoke is a customer subscription's landing zone, peered to its hub; a hub is a shared subscription's, listing its spokes.
  spoke:
    key: spoke
    domain: azure
    defined_by: ADR-AZ-LZ#2
    short:
      The landing zone of a customer subscription — peered to the hub of its tier, holding the subnet its workloads' private endpoints use.
    realized_by: { kind: prose-only }
    contrasts:
      hub: A hub is a shared subscription's landing zone, listing its spokes; a spoke is a customer subscription's, peered to its hub.
