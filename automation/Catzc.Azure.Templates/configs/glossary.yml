# glossary.yml — the Catzc.Azure.Templates glossary source: the vocabulary of the Bicep template configuration this module
# builds and deploys ([ADR-REPO-VOCAB](/docs/adr/repository/controlled-vocabulary.md)). Every option is defaulted: all five
# checks, the whole repository, every text surface
# ([ADR-REPO-VOCAB#2](/docs/adr/repository/controlled-vocabulary.md#rule-adr-repo-vocab2)). Checked by Test-Glossary.
concepts:
  slot:
    key: slot
    domain: azure
    defined_by: ADR-AZ-DATAMOD#2
    short: A Bicep configuration slot — one config file of a template (`<env>[-<slot>].yml`), deploying one subscription's resource group.
    realized_by: { kind: prose-only }
    forms:
      [Bicep, base, configuration, root, template, indexed, special, optional, customer, platform, env, core, subfolder, target, region]
  landing zone:
    key: landing_zone
    domain: azure
    defined_by: ADR-AZ-LZ#1
    short:
      The network, guardrails, and cost control a workload lands in — the CAF application landing zone, deployed once per subscription at
      subscription scope by the discovery template.
    realized_by: { kind: prose-only }
  hub:
    key: hub
    domain: azure
    defined_by: ADR-AZ-LZ#2
    short: The landing zone of a shared subscription — the network every spoke of its tier peers to, holding the private DNS zones.
    realized_by: { kind: prose-only }
    contrasts:
      spoke: A spoke is a customer subscription's landing zone, peered to its hub; a hub is a shared subscription's, listing its spokes.
  spoke:
    key: spoke
    domain: azure
    defined_by: ADR-AZ-LZ#2
    short:
      The landing zone of a customer subscription — peered to the hub of its tier, holding the subnet its workloads' private endpoints use.
    realized_by: { kind: prose-only }
    contrasts:
      hub: A hub is a shared subscription's landing zone, listing its spokes; a spoke is a customer subscription's, peered to its hub.
  cloud adoption framework:
    key: cloud_adoption_framework
    domain: azure
    defined_by: ADR-AZ-LZ#1
    short:
      Microsoft's guidance for preparing an Azure estate; its landing-zone design principles and design areas are recorded as vendor
      recommendation in docs/adr/azure/caf/, one rule per recommendation.
    realized_by: { kind: prose-only }
    contrasts:
      well-architected framework:
        The Cloud Adoption Framework shapes the landing zone; the Well-Architected Framework shapes the workload in it.
  management group:
    key: management_group
    domain: azure
    defined_by: ADR-AZ-LZ#1
    short:
      An Azure container above subscriptions for policy and access; this repository deploys no management group and nothing at that level.
    realized_by: { kind: prose-only }
  well-architected framework:
    key: well_architected_framework
    domain: azure
    defined_by: ADR-AZ-LZ#5
    short:
      Microsoft's checklist of a workload's quality in five pillars; each checklist item is a rule in docs/adr/azure/waf/, numbered as
      Microsoft numbers it.
    realized_by: { kind: prose-only }
    contrasts:
      cloud adoption framework:
        The Well-Architected Framework shapes the workload; the Cloud Adoption Framework shapes the landing zone it lands in.
  pillar:
    key: pillar
    domain: azure
    defined_by: ADR-AZ-LZ#5
    short:
      One of the Well-Architected Framework's five qualities — reliability, security, cost optimization, operational excellence, performance
      efficiency — each one ADR in docs/adr/azure/waf/.
    realized_by: { kind: prose-only }
  break-glass login:
    key: break_glass_login
    domain: azure
    defined_by: ADR-AZ-LZ#6
    short: The one SQL login beside a server's Entra ID admin group, its password a Key Vault reference to foundation's vault.
    realized_by: { kind: prose-only }
  caf tags:
    key: caf_tags
    domain: azure
    defined_by: ADR-AZ-CAFNAME#11
    short:
      The six tag keys every resource carries — workload, environment, owner, cost-center, criticality, data-classification; cost-center is
      required by policy.
    realized_by: { kind: prose-only }
  subscription vending:
    key: subscription_vending
    domain: azure
    defined_by: ADR-AZ-CAFRESORG#19
    short:
      Onboarding a subscription by pull request — its azure.yml entry, its range in network.yml, and one config per template; the
      subscription itself is created outside the repository.
    realized_by: { kind: prose-only }
  environment class:
    key: environment_class
    domain: azure
    defined_by: ADR-AZ-DATAMOD#11
    short: Production or non-production — the split that policy enforcement, database SKUs, backups, and budgets are set by.
    realized_by: { kind: prose-only }
