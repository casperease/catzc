# Repo-wide variants — settings fixed for the importer session (see ).
# [ADR-REPO-VARIANT](/docs/adr/repository/repo-variants.md)
# [comment:1](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment1)

# Azure resource-name component order — the segment order every generated resource name uses.
# [ADR-AZ-NAMING](/docs/adr/azure/azure-naming-standard.md)
# [comment:2](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment2)
ado_naming: standard

# Git workspace mode — how changes reach main: main-direct — direct commits to main are allowed (the default; a solo-author trunk)...
# [comment:3](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment3)
git_workspace: main-direct

# Enabled-customer set for the repo: false — no customer deployments; only non-customer templates allowed (the default for a...
# [ADR-AZ-CUSTOMER](/docs/adr/azure/azure-customer-model.md)
# [comment:4](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment4)
have_customers: all

# Aspects — per-track/per-container conventions.
# [ADR-DSGN-ASPECT](/docs/adr/design/module-aspects.md)
# [comment:5](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment5)
aspects:
  automation:
    - live: ["*.ps1", "private/**", "types/**", "configs/**", "assets/**"]
    - tests: ["**"]
  infrastructure:
    - tests: ["**/tests/**"]
    - live: ["**"]

# Tracks — the repository's root concerns, the one declaration of what a track is.
# [ADR-DSGN-TRACK](/docs/adr/design/tracks.md), [ADR-DSGN-TRACK#2](/docs/adr/design/tracks.md#rule-adr-dsgn-track2),
# [ADR-DSGN-TRACK#6](/docs/adr/design/tracks.md#rule-adr-dsgn-track6)
# [comment:6](/docs/references/automation/catzc-base-variants/configs/variants.yml.md#comment6)
tracks:
  automation: { root: automation, class: core, languages: [powershell, csharp, yaml, json, jsonl, bash, xml, css, solution, stamp, asset] }
  infrastructure: { root: infrastructure, class: adapter, languages: [bicep, yaml] }
  pipelines: { root: pipelines, class: adapter, languages: [pipeline-yaml, powershell] }
  docs: { root: docs, class: external-port, languages: [markdown, asset] }
  contracts: { root: contracts, class: external-port, languages: [markdown, pipeline-yaml, yaml] }
  go: { root: go, class: verification, languages: [go] }
  python: { root: python, class: verification, languages: [python] }
  bash: { root: bash, class: verification, languages: [bash] }
  .github: { root: .github, class: external-port, languages: [yaml, markdown] }
  .cspell: { root: .cspell, class: external-port }
  .claude: { root: .claude, class: external-port, languages: [markdown, python, csharp, json, xml, html, powershell] }
