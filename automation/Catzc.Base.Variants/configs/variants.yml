ado_naming: standard

git_workspace: main-direct

have_customers: all

aspects:
  automation:
    - live: ["*.ps1", "private/**", "types/**", "configs/**", "assets/**"]
    - tests: ["**"]
  infrastructure:
    - tests: ["**/tests/**"]
    - live: ["**"]

tracks:
  automation: { root: automation, class: core, languages: [powershell, csharp, yaml, json, jsonl, bash, xml, css, solution, stamp, asset] }
  infrastructure: { root: infrastructure, class: adapter, languages: [bicep, yaml] }
  pipelines: { root: pipelines, class: adapter, languages: [pipeline-yaml, powershell] }
  docs: { root: docs, class: external-port, languages: [markdown, asset] }
  contracts: { root: contracts, class: external-port, languages: [markdown, pipeline-yaml, yaml, json] }
  go: { root: go, class: verification, languages: [go] }
  python: { root: python, class: verification, languages: [python] }
  bash: { root: bash, class: verification, languages: [bash] }
  .github: { root: .github, class: external-port, languages: [yaml, markdown] }
  .cspell: { root: .cspell, class: external-port }
  .claude: { root: .claude, class: external-port, languages: [markdown, python, csharp, json, xml, html, powershell] }
  .unordered: { root: .unordered, class: unordered, languages: [markdown] }
