# The tenant lets Get-AdoAuthorizationHeader keep its az login fallback from minting a token in another directory.
# [comment:1](/docs/references/automation/catzc-azure-devops/configs/ado.yml.md#comment1)

# Azure DevOps organization URL (the REST API host).
organization: "https://dev.azure.com/Catzc"

# Default project (URL-encoded).
project: "CatzcProject"

# A placeholder, the same minted tenant as azure.yml's: replace it with the real tenant per deployment target.
# [comment:2](/docs/references/automation/catzc-azure-devops/configs/ado.yml.md#comment2)
tenant: "fa0e0000-7e0a-0700-1d00-000000000000"
