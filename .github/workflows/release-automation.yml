# ---
# catzc:
#   derived:
#     path: ".github/workflows/release-automation.yml"
#     kind: pipeline
#     language: yaml
#     filekind: yml
#     track: ".github"
# ---

name: Release

# Manual only — the trigger is intentionally NOT wired to push/tag/globset. A release is a deliberate act, so
# it runs on workflow_dispatch and nothing else. Every run BUILDS the artifact (the .nupkg + the PSGallery
# module manifest), freezes the bundle's contracts under contracts/catzc/<version>/ and pushes that commit to the
# trunk (the token needs bypass rights on the branch rule), and uploads the artifact; the publish steps are opt-in and each no-ops without its token, so a run with
# no inputs simply produces the package. GitHub publishing uses the built-in GITHUB_TOKEN (no PSGallery key
# needed); PSGallery publishing needs the PSGALLERY_API_KEY secret and is skipped when it is empty.
# See [ADR-GH-RELEASE](/docs/adr/github/github-release.md).

on:
  workflow_dispatch:
    inputs:
      github_release:
        description: Attach the .nupkg to a GitHub Release (gh + GITHUB_TOKEN)
        type: boolean
        default: true
      github_packages:
        description: Push the package to GitHub Packages (dotnet nuget push + GITHUB_TOKEN)
        type: boolean
        default: false
      psgallery:
        description: Publish to the PowerShell Gallery (needs the PSGALLERY_API_KEY secret; skipped if empty)
        type: boolean
        default: false

permissions:
  contents: write # the frozen-contracts push and gh release create
  packages: write # GitHub Packages push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the NuGet package and the PSGallery manifest
        shell: pwsh
        run: |
          . ./importer.ps1
          $pkg = Export-Catzc -To nuget
          "NUPKG=$($pkg.NuPkg)" >> $env:GITHUB_ENV
          "PKG_VERSION=$($pkg.Version)" >> $env:GITHUB_ENV
          "PKG_MODULE_DIR=$(Split-Path $pkg.Manifest -Parent)" >> $env:GITHUB_ENV
          Write-Host "Built Catzc $($pkg.Version) — $($pkg.FunctionCount) functions — $($pkg.NuPkg)"

      # The release freezes the bundle's contracts: the draft must hold, its copy becomes the released version folder
      # with a .frozen record, and that folder must hold too
      # ([ADR-REPO-CONTRACT#5](/docs/adr/repository/api-contracts.md#rule-adr-repo-contract5)).
      - name: Freeze the contracts for this version
        shell: pwsh
        run: |
          . ./importer.ps1
          Test-Contracts
          Publish-ContractRelease -Unit catzc -Version $env:PKG_VERSION
          Test-Contracts -Version $env:PKG_VERSION

      - name: Commit the frozen contracts to the trunk
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add "contracts/catzc/${PKG_VERSION}"
          git commit -m "Freeze contracts/catzc/${PKG_VERSION} (ADR-REPO-CONTRACT#5)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # The artifact is always produced, even when nothing is published. The path is the one Export-Catzc returned
      # (NUPKG), so the workflow never restates where the package lands.
      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: catzc-nupkg
          path: ${{ env.NUPKG }}
          if-no-files-found: error

      - name: Publish to a GitHub Release (gh CLI + GITHUB_TOKEN)
        if: ${{ inputs.github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          gh release create "v$env:PKG_VERSION" "$env:NUPKG" `
            --target "$env:GITHUB_SHA" `
            --title "Catzc $env:PKG_VERSION" `
            --notes "Catzc $env:PKG_VERSION — installable platform bundle (NuGet package + PSGallery manifest)." `
            --clobber

      - name: Publish to GitHub Packages (dotnet nuget push + GITHUB_TOKEN)
        if: ${{ inputs.github_packages }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          dotnet nuget push "$env:NUPKG" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ github.token }}" `
            --skip-duplicate

      - name: Publish to the PowerShell Gallery (only if the API key is set)
        if: ${{ inputs.psgallery }}
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            Write-Host '::warning::PSGALLERY_API_KEY is empty — skipping the PSGallery publish. The .nupkg and manifest are still built and uploaded.'
            exit 0
          }
          . ./importer.ps1
          Publish-PSResource -Path $env:PKG_MODULE_DIR -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
