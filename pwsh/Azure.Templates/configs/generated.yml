# This module's writers of generated files (Get-GeneratedTarget reads every module's generated.yml).
writers:
  # It prices the cost model's meters from the Azure retail prices API, read outside the tree.
  Update-AzurePriceTable:
    class: snapshot
    check: none
    inputs: [pwsh/Azure.Templates/configs/cost-model.yml]
    outputs: [pwsh/Azure.Templates/assets/cost-prices.json]
  # It writes one configuration file per template, environment and customer from the parameters it is given, which are read outside the tree,
  # so a rolled-off file could not be rendered again.
  Set-BicepTemplateConfiguration:
    class: snapshot
    check: none
    regenerate: "Set-BicepTemplateConfiguration -Template <template> -Environment <environment> -Parameters <parameters>"
    outputs: ["infrastructure/templates/*/configuration/**/*.yml"]
