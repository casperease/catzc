# ---
# catzc:
#   docs: "../../../docs/references/pwsh/catzc-base-variants/configs/variants.yml.md"
#   header: "generated"
# ---

ado_naming: standard

git_workspace: main-direct

have_customers: all

# A code track's aspects are derived from the layout in languages.yml (Get-Aspect), so only the other deployable tracks declare theirs.
aspects:
  infrastructure:
    - tests: ["**/tests/**"]
    - live: ["**"]
  ado-pipelines:
    - tests: ["**/tests/**"]
    - live: ["**"]
  github-workflows:
    - tests: ["**/tests/**"]
    - live: ["**"]
  # The boundary contracts ship as they are, so live is the catch-all; a contract kept for a test asset under tests/ is the tests aspect.
  contracts:
    - tests: ["**/tests/**"]
    - live: ["**"]

tracks:
  # The gitignored build outputs are members too, so a clean finds them in the model; each one's generated fact comes from its
  # generator's target.
  pwsh:
    {
      members:
        [
          pwsh,
          { path: pwsh/*/*.psd1, committed: false },
          { path: pwsh/.compiled/*.dll, committed: false },
          { path: pwsh/.compiled/*.tmp, committed: false },
          { path: pwsh/.internal/assets/bin/**, committed: false },
          { path: pwsh/.internal/assets/obj/**, committed: false },
        ],
      type: modules,
      languages: [powershell, bcl, yaml, json, jsonl, bash, xml, css, javascript, solution, stamp, asset],
      execution_engines: [pwsh],
      namespace: Catzc,
      # The files that name the product, not a module folder, so they keep the namespace on disk: the loaders PowerShell names its
      # modules after, and the types assembly's identity.
      namespace_exempt:
        [
          "pwsh/.internal/Catzc.Internal.*.psm1",
          "pwsh/.compiled/Catzc.Types.*",
          pwsh/.internal/assets/Catzc.Types.csproj,
          pwsh/Base.TypesSystem/assets/Catzc.Types.csproj.xml,
        ],
    }
  pwsh-vendor: { members: [pwsh/.vendor], type: vendored-code }
  infrastructure:
    {
      members: [infrastructure],
      type: infrastructure,
      vendor: azure,
      languages: [bicep, yaml, markdown],
      kinds: { templates: infrastructure/templates, configs: "infrastructure/templates/*/configuration", modules: infrastructure/modules },
    }
  ado-pipelines: { members: [.ado/pipelines], type: pipelines, vendor: ado, languages: [pipeline-yaml, powershell] }
  github-workflows: { members: [.github/workflows], type: pipelines, vendor: github, languages: [yaml] }
  docs: { members: [docs], type: documentation, languages: [markdown, asset, yaml] }
  contracts: { members: [contracts], type: contracts, languages: [markdown, pipeline-yaml, yaml, json] }
  go: { members: [go], type: modules, languages: [go], namespace: catzc, join: "" }
  python: { members: [python], type: modules, languages: [python, html, markdown, xml, yaml], namespace: catzc, join: _ }
  bash: { members: [bash], type: modules, languages: [bash], namespace: catzc, join: "-" }
  bash-vendor: { members: [bash/.vendor], type: vendored-code }
  # The type declarations Install-TypeScript installs for the js track's types gate: downloaded third-party code, never committed.
  .typescript: { members: [{ path: .typescript, committed: false }], type: vendored-code }
  js: { members: [js], type: modules, languages: [javascript, json, asset], kinds: { extensions: js }, namespace: catzc, join: "-" }
  .github: { members: [.github], type: vendor-settings, vendor: github, languages: [yaml, markdown] }
  .cspell: { members: [.cspell], type: vendor-settings, vendor: cspell }
  .claude: { members: [.claude], type: vendor-settings, vendor: claude, languages: [markdown, python, bcl, json, xml, html, powershell] }
  .vscode: { members: [{ path: .vscode, committed: false }], type: vendor-settings, vendor: vscode, languages: [json] }
  .unordered: { members: [.unordered], type: unordered, languages: [markdown] }
