track_types:
  modules:
    definition:
      Deployable modules of one language's track, collected into the bundles files.yml declares; a module with no package ships nothing.
    role: deployable
    admits: [pwsh-folder, pwsh-psm1, python, go, bash, js]
  infrastructure:
    definition: Deployable Bicep templates and reusable Bicep modules, delivered per customer and target.
    role: deployable
    admits: [bicep]
  pipelines:
    definition: The pipeline definitions of one platform for this repository, the platform being the track's vendor.
    role: holder
    admits: [pipeline]
  vendor-settings:
    definition: The settings of one tool the repository configures, the tool being the track's vendor.
    role: holder
    admits: [settings]
  vendored-code:
    definition: Code written by a third party that the repository keeps checked in and does not author.
    role: holder
    admits: [pwsh-folder, bash]
  contracts:
    definition: The repository's boundary contracts, in both directions.
    role: holder
    admits: []
  documentation:
    definition: The decision records, references, guides and diagram assets for the repository's readers.
    role: holder
    admits: []
  unordered:
    definition: Where imports land with their history, one landing address each, until sorted; nothing internal reads or depends on it.
    role: holder
    admits: []
    git:
      attributes: [catzc-unordered]
      why:
        files under the unordered track are imports not yet sorted, held to no domain rule until they move — the content tools (links,
        Markdown titles, source conventions) leave them as they landed (DDR-TRACK-UNORDEREDTRACK).
  output:
    definition: What every run writes, generated and gitignored; the tools operate on it by address, and nothing builds from it.
    role: holder
    admits: []

vendors:
  azure:
    definition: Microsoft Azure, whose Bicep templates and modules the repository keeps for its deployments.
  ado:
    definition: Azure DevOps, whose pipeline definitions the repository keeps.
  github:
    definition: GitHub Actions, whose workflows the repository keeps under .github/workflows.
  ai:
    definition: The AI coding agents, Claude Code among them, whose settings, agents and hooks the repository keeps under .claude.
  cspell:
    definition: The cspell spell checker, whose dictionaries the repository keeps under .cspell.
  vscode:
    definition: Visual Studio Code, whose workspace settings the repository keeps under .vscode.
  git:
    definition:
      Git and its host, whose root configuration (.gitignore, .gitattributes) and repository settings (.github) the repository keeps.
  pwsh:
    definition: PowerShell, whose third-party modules the repository vendors under pwsh/.vendor.
  bash:
    definition: Bash, whose third-party scripts the repository vendors under bash/.vendor.
  typescript:
    definition: TypeScript, whose type declarations the repository installs under .typescript for the js track's types gate.
  editorconfig:
    definition: EditorConfig, whose editor settings the repository keeps in .editorconfig.
  markdownlint:
    definition: The markdownlint linter, whose rules and ignore list the repository keeps at the root.
  prettier:
    definition: The Prettier formatter, whose settings and ignore list the repository keeps at the root.
  dotnet:
    definition: The .NET SDK, whose solution, build properties and tool manifest the repository keeps at the root.
  nuget:
    definition: NuGet, whose feed configuration the repository keeps in nuget.config.
