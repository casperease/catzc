winget:
  version: "1"
  command: winget
  system_provided: true
  windows_only: true
  version_command: "winget --version"
  version_pattern: "v(?<ver>[\\d.]+)"
  session_path_hints:
    - "%LOCALAPPDATA%\\Microsoft\\WindowsApps"

bash:
  version: "5"
  command: bash
  system_provided: true
  version_command: "bash --version"
  version_pattern: "version (?<ver>[\\d.]+)"
  windows_probes:
    - "%LOCALAPPDATA%\\Programs\\Git\\bin\\bash.exe"
    - "%LOCALAPPDATA%\\Git\\bin\\bash.exe"
    - "%ProgramFiles%\\Git\\bin\\bash.exe"
  windows_pipeline_probes:
    - "%ProgramFiles%\\Git\\bin\\bash.exe"
  unix_probes:
    - "/opt/homebrew/bin/bash"
    - "/usr/local/bin/bash"
    - "/bin/bash"
    - "/usr/bin/bash"
  unix_pipeline_probes:
    - "/usr/bin/bash"
    - "/bin/bash"
  probe_excludes:
    - "%SystemRoot%\\System32\\bash.exe"
    - "%LOCALAPPDATA%\\Microsoft\\WindowsApps\\bash.exe"

zsh:
  version: "5"
  command: zsh
  depends_on: bash
  linux_admin_only: true
  apt_package: "zsh"
  msys2_url: "https://repo.msys2.org/msys/x86_64/zsh-5.9.2-1-x86_64.pkg.tar.zst"
  msys2_sha256: "9a134200a152d90a0f1820d6aa74c3369d8539c068b523852549d74b16739fa8"
  windows_install_dir: "Git"
  version_command: "zsh --version"
  version_pattern: "^zsh (?<ver>[\\d.]+)"
  windows_probes:
    - "%LOCALAPPDATA%\\Git\\usr\\bin\\zsh.exe"
    - "%LOCALAPPDATA%\\Programs\\Git\\usr\\bin\\zsh.exe"
  windows_pipeline_probes:
    - "%ProgramFiles%\\Git\\usr\\bin\\zsh.exe"
  unix_probes:
    - "/opt/homebrew/bin/zsh"
    - "/usr/local/bin/zsh"
    - "/bin/zsh"
    - "/usr/bin/zsh"
  unix_pipeline_probes:
    - "/usr/bin/zsh"
    - "/bin/zsh"

python:
  # One release behind the newest on purpose: dependents that lag it keep working, and az_cli's max_python caps the pin.
  version: "3.13"
  command: python
  depends_on: uv
  uv_python: true
  version_command: "python --version"
  version_pattern: "^Python (?<ver>.+)$"

dotnet:
  version: "10.0"
  command: dotnet
  script_install: true
  windows_install_dir: "Microsoft\\dotnet"
  session_host_probes:
    - "sdk/{version}"
    - "shared/Microsoft.NETCore.App/{version}"
  version_command: "dotnet --version"
  version_pattern: "^(?<ver>.+)$"

az_cli:
  version: "2.87"
  # Devbox lever only: a pipeline ignores it and enforces version alone; raise it toward version as upgrades land.
  devbox_version: "2.84"
  command: az
  depends_on: uv
  uv_venv: azure-cli
  max_python: "3.13"
  # azure-cli's dependency tree pins a pre-release (azure-batch beta), which uv refuses by default.
  uv_allow_prerelease: true
  version_command: "az version --output tsv"
  version_pattern: "^(?<ver>[^\t]+)"
  # The dedicated venv's script dir — the janitor keeps it on PATH each load so `az` resolves across sessions.
  session_path_hints:
    - "%LOCALAPPDATA%\\catzc\\venvs\\az_cli\\Scripts"

poetry:
  version: "2.4"
  command: poetry
  depends_on: uv
  uv_tool: poetry
  version_command: "poetry --version"
  version_pattern: "^Poetry \\(version (?<ver>.+)\\)$"

node_js:
  version: "24"
  command: node
  depends_on: winget
  # winget has no versioned NodeJS.24, so this alias moves with each LTS: bump version when the LTS advances.
  winget_id: "OpenJS.NodeJS.LTS"
  winget_scope: user
  brew_formula: "node@{0}"
  apt_package: "nodejs"
  linux_admin_only: true
  version_command: "node --version"
  version_pattern: "^v(?<ver>.+)$"
  session_path_hints:
    - "%ProgramFiles%\\nodejs"

cspell:
  version: "10"
  command: cspell
  depends_on: node_js
  npm_package: cspell
  version_command: "cspell --version"
  version_pattern: "^(?<ver>[\\d.]+)"

markdownlint:
  version: "0.23"
  command: markdownlint-cli2
  depends_on: node_js
  npm_package: markdownlint-cli2
  version_command: "markdownlint-cli2 --version"
  version_pattern: "v(?<ver>[\\d.]+)"

prettier:
  version: "3"
  command: prettier
  depends_on: node_js
  npm_package: prettier
  version_command: "prettier --version"
  version_pattern: "^(?<ver>[\\d.]+)"

typescript:
  version: "6"
  command: tsc
  depends_on: node_js
  npm_package: typescript
  version_command: "tsc --version"
  version_pattern: "Version (?<ver>[\\d.]+)"

# A type-only package has no command of its own: npm reports its installed version.
types_node:
  version: "24"
  command: npm
  depends_on: node_js
  npm_package: "@types/node"
  installed_by: typescript
  version_command: "npm ls --prefix .typescript @types/node --depth=0"
  version_pattern: "@types/node@(?<ver>[\\d.]+)"

# Pinned to the editor version the extension manifests declare (VscodeOwnExtension.DefaultEngine), so the types match what they run against.
types_vscode:
  version: "1.90"
  command: npm
  depends_on: node_js
  npm_package: "@types/vscode"
  installed_by: typescript
  version_command: "npm ls --prefix .typescript @types/vscode --depth=0"
  version_pattern: "@types/vscode@(?<ver>[\\d.]+)"

terraform:
  version: "1.15"
  command: terraform
  depends_on: winget
  winget_id: "Hashicorp.Terraform"
  winget_scope: user
  brew_formula: "hashicorp/tap/terraform"
  linux_admin_only: true
  version_command: "terraform --version"
  version_pattern: "^Terraform v(?<ver>[\\d.]+)"

java:
  version: "25"
  command: java
  depends_on: winget
  winget_id: "Microsoft.OpenJDK.{0}"
  # The OpenJDK package ships only a machine-scope installer, so it needs Administrator.
  admin_only: true
  brew_formula: "openjdk@{0}"
  apt_package: "openjdk-{0}-jdk"
  version_command: "java --version"
  version_pattern: "(?<ver>[\\d.]+)"

go:
  version: "1.27"
  command: go
  script_install: true
  version_command: "go version"
  version_pattern: "go version go(?<ver>[\\d.]+)"
  windows_probes:
    - "%LOCALAPPDATA%\\go\\bin\\go.exe"
  unix_probes:
    - "%HOME%/.go/bin/go"

shellcheck:
  version: "0.11"
  command: shellcheck
  depends_on: winget
  winget_id: "koalaman.shellcheck"
  winget_scope: user
  brew_formula: "shellcheck"
  linux_admin_only: true
  version_command: "shellcheck --version"
  version_pattern: "version: (?<ver>[\\d.]+)"
  windows_probes:
    - "%LOCALAPPDATA%\\Microsoft\\WinGet\\Packages\\koalaman.shellcheck_Microsoft.Winget.Source_8wekyb3d8bbwe\\shellcheck.exe"

bicep:
  version: "0.48"
  command: bicep
  depends_on: winget
  winget_id: "Microsoft.Bicep"
  winget_scope: user
  brew_formula: "azure/bicep/bicep"
  version_command: "bicep --version"
  version_pattern: "Bicep CLI version (?<ver>[\\d.]+)"
  windows_probes:
    - "%LOCALAPPDATA%\\Microsoft\\WinGet\\Packages\\Microsoft.Bicep_Microsoft.Winget.Source_8wekyb3d8bbwe\\bicep.exe"
  # Linux: the verified release binary Install-Bicep places in the user bin, probed before PATH is re-read.
  unix_probes:
    - "%HOME%/.local/bin/bicep"

osv_scanner:
  version: "2.7"
  command: osv-scanner
  depends_on: winget
  winget_id: "Google.OSVScanner"
  winget_scope: user
  brew_formula: "osv-scanner"
  version_command: "osv-scanner --version"
  version_pattern: "osv-scanner version: (?<ver>[\\d.]+)"
  # Linux: the verified release binary Install-OsvScanner places in the user bin, probed before PATH is re-read.
  unix_probes:
    - "%HOME%/.local/bin/osv-scanner"

uv:
  version: "0.11"
  command: uv
  # depends_on winget only for the fresh-machine winget bootstrap; a standalone uv self-updates (Install-Uv).
  depends_on: winget
  winget_id: "astral-sh.uv"
  winget_scope: user
  brew_formula: "uv"
  version_command: "uv --version"
  version_pattern: "uv (?<ver>[\\d.]+)"

py_spark:
  version: "4.1"
  command: pyspark
  depends_on: python
  pip_package: pyspark
  admin_only: true
  version_command: 'python -c "from importlib.metadata import version; print(version(''pyspark''))"'
  version_pattern: "^(?<ver>[\\d.]+)$"
