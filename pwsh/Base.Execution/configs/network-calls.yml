# Every call site that can reach the network, keyed '<file>#<function or pipeline job>' (ADR-AUTO-NET-SITEREGISTRY); a default-path site is an open violation.
sites:
  pwsh/Tooling.Core/Install-Tool.ps1#Install-Tool:
    class: package-install
    trigger: on-request
    gated_by: runs only from the Install-* tooling commands (winget, apt-get, brew)
  pwsh/Tooling.Core/Install-UvTool.ps1#Install-UvTool:
    class: package-install
    trigger: on-request
    gated_by: runs only from the Install-* tooling commands
  pwsh/Tooling.Core/Install-UvVenvTool.ps1#Install-UvVenvTool:
    class: package-install
    trigger: on-request
    gated_by: runs only from the Install-* tooling commands
  pwsh/Tooling.Core/Save-VerifiedDownload.ps1#Save-VerifiedDownload:
    class: package-install
    trigger: on-request
    gated_by: called only by Install-* commands; SHA-256 checked (ADR-AUTO-PKGMGR-VERIFYDOWNLOADS); tests mock Invoke-WebRequest
  pwsh/Tooling.Core/Test-ExpectedPackageManager.ps1#Test-ExpectedPackageManager:
    class: package-install
    trigger: on-request
    gated_by: winget list refreshes its sources; called from Get-ToolsStatus and the install commands only
  pwsh/Tooling.Provisioning/Get-ToolsStatus.ps1#Get-ToolsStatus:
    class: package-install
    trigger: on-request
    gated_by: winget list refreshes its sources; an explicit status command
  pwsh/Tooling.Provisioning/Install-Git.ps1#Install-Git:
    class: package-install
    trigger: on-request
    gated_by: explicit install command; tests mock Invoke-RestMethod
  pwsh/Tooling.Provisioning/Install-Postman.ps1#Install-Postman:
    class: package-install
    trigger: on-request
    gated_by: explicit install command; tests mock Invoke-WebRequest
  pwsh/Tooling.Python/private/Install-PipTool.ps1#Install-PipTool:
    class: package-install
    trigger: on-request
    gated_by: runs only from the Install-* tooling commands
  pwsh/Tooling.Node/Install-NodeJs.ps1#Install-NodeJs:
    class: package-install
    trigger: on-request
    gated_by: explicit install command (apt key download on Linux)
  pwsh/Tooling.Node/Invoke-Npm.ps1#Invoke-Npm:
    class: package-install
    trigger: on-request
    gated_by: called only by the Install-*/Uninstall-* node tool commands
  pwsh/Tooling.Toolchain/Install-Terraform.ps1#Install-Terraform:
    class: package-install
    trigger: on-request
    gated_by: explicit install command (apt key download on Linux)
  pwsh/Tooling.Toolchain/private/Get-GoRelease.ps1#Get-GoRelease:
    class: package-install
    trigger: on-request
    gated_by: called only by Install-Go; tests mock Invoke-RestMethod
  pwsh/Tooling.Toolchain/private/Install-BicepStandalone.ps1#Install-BicepStandalone:
    class: package-install
    trigger: on-request
    gated_by: called only by Install-Bicep; tests mock Invoke-RestMethod
  pwsh/Tooling.Toolchain/private/Install-OsvScannerStandalone.ps1#Install-OsvScannerStandalone:
    class: package-install
    trigger: on-request
    gated_by: called only by Install-OsvScanner
  pwsh/Tooling.Toolchain/private/Install-UvStandalone.ps1#Install-UvStandalone:
    class: package-install
    trigger: on-request
    gated_by: called only by Install-Uv; tests mock Invoke-RestMethod
  pwsh/Tooling.Toolchain/assets/scripts/dotnet-install.ps1#dotnet-install:
    class: package-install
    trigger: on-request
    gated_by: the vendored installer script, run only by Install-Dotnet
  pwsh/Tooling.Toolchain/Test-DependencyAdvisories.ps1#Test-DependencyAdvisories:
    class: package-install
    trigger: on-request
    gated_by: explicit command (uv lock against PyPI, osv-scanner against the advisory database); tests mock both
  pwsh/Base.Vendor/Install-VendorModule.ps1#Install-VendorModule:
    class: package-install
    trigger: on-request
    gated_by: explicit vendoring command (Save-PSResource from the gallery), source tree only
  pwsh/Base.QualityGates/Build-EnglishDictionary.ps1#Build-EnglishDictionary:
    class: package-install
    trigger: on-request
    gated_by: none beyond the explicit command; npx --yes fetches cspell-trie outside the tooling system
  pwsh/Base.QualityGates/private/Invoke-DotnetFormat.ps1#Invoke-DotnetFormat:
    class: package-install
    trigger: offline-guarded
    gated_by: Assert-DotnetOffline and the generated nuget.config hold the implicit restore offline
  pwsh/Base.TypesSystem/Build-AgentHook.ps1#Build-AgentHook:
    class: package-install
    trigger: offline-guarded
    gated_by: Assert-DotnetOffline and the generated nuget.config hold the implicit restore offline
  pwsh/Base.TypesSystem/Invoke-BuildForVsCode.ps1#Invoke-BuildForVsCode:
    class: package-install
    trigger: offline-guarded
    gated_by: Assert-DotnetOffline and the generated nuget.config hold the implicit restore offline
  pwsh/Base.Languages/Invoke-PythonTest.ps1#Invoke-PythonTest:
    class: package-install
    trigger: default-path
    gated_by: none; uv sync resolves and downloads from PyPI on every Python test run
  pwsh/Base.QualityGates/private/Invoke-PythonWorkspaceTool.ps1#Invoke-PythonWorkspaceTool:
    class: package-install
    trigger: default-path
    gated_by: none; uv sync runs before Test-PythonLint and Test-PythonTypes, the Python language checks
  pwsh/Base.Languages/Invoke-GoTest.ps1#Invoke-GoTest:
    class: package-install
    trigger: default-path
    gated_by: none; go mod download runs on every Go test run and the module proxy left on
  pwsh/Azure.Templates/Update-AzurePriceTable.ps1#Update-AzurePriceTable:
    class: price-data
    trigger: on-request
    gated_by: the one refresh command; readers use the checked-in table; tests mock Invoke-RestMethod
  pwsh/Azure.DevOps/Invoke-AdoRestMethod.ps1#Invoke-AdoRestMethod:
    class: ado-api
    trigger: on-request
    gated_by: the one ADO request function, called only by explicit Azure DevOps commands and their pipeline steps; tests mock it
  pwsh/Azure.DevOps/Get-AdoAuthorizationHeader.ps1#Get-AdoAuthorizationHeader:
    class: ado-api
    trigger: on-request
    gated_by: mints the ADO token through az only when no pipeline token or PAT is set (ADR-ADO-AUTH)
  pwsh/Azure.Cli/Invoke-AzCli.ps1#Invoke-AzCli:
    class: azure-control-plane
    trigger: on-request
    gated_by: the one az runner, called by the deploy, session, firewall and orphan commands after ADR-AZ-SESSION's assertions
  pwsh/Azure.Templates/tests/Deploy-Bicep.L3.Tests.ps1#Deploy-Bicep:
    class: azure-control-plane
    trigger: on-request
    gated_by: an L3 test, run only when asked with -MaxLevel 3 (Test-Automation stops at L2 by default) and deploying live with an ambient az session
  pwsh/Base.Git/Get-SyncPoint.ps1#Get-SyncPoint:
    class: git-remote
    trigger: on-request
    gated_by: git ls-remote, called only by Sync-Topic; tests mock Invoke-Executable or use a local bare remote
  pwsh/Base.Git/Sync-Topic.ps1#Sync-Topic:
    class: git-remote
    trigger: on-request
    gated_by: explicit topic command (git fetch)
  pwsh/Base.Git/Push-Topic.ps1#Push-Topic:
    class: git-remote
    trigger: on-request
    gated_by: explicit topic command (git fetch, git push)
  pwsh/Tooling.Github/Reset-GitHubRepository.ps1#Reset-GitHubRepository:
    class: git-remote
    trigger: on-request
    gated_by: explicit publishing command (gh repo create, git push)
  pwsh/Tooling.Github/Publish-CleanHistory.ps1#Publish-CleanHistory:
    class: git-remote
    trigger: on-request
    gated_by: explicit publishing command (git push)
  pwsh/Tooling.Github/private/Assert-RemoteMatchesBranch.ps1#Assert-RemoteMatchesBranch:
    class: git-remote
    trigger: on-request
    gated_by: git ls-remote, called only by the publishing commands
  .ado/pipelines/ci-pwsh.yaml#UnitTests:
    class: package-install
    trigger: pipeline-only
    gated_by: the Install-Cspell and Install-Markdownlint steps, run only on the pipeline agent
  .ado/pipelines/ci-pwsh.yaml#ToolInstallation:
    class: package-install
    trigger: pipeline-only
    gated_by: the Install-* steps and Get-ToolsStatus, run only on the pipeline agent
  .ado/pipelines/ci-pwsh.yaml#AzureAuthTests:
    class: azure-control-plane
    trigger: pipeline-only
    gated_by: the azcli and azps mode steps (az account show, Get-AzContext) under the sc-azure-test service connection, pipeline agent only
