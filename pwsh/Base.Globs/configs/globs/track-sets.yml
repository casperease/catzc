# The derived patterns of every whole track's set that globs.yml declares (FDR-GLOBS-TRACKSETDERIVED).
globsets:
  pwsh:
    include:
      - "importer.ps1"
      - "pwsh/**"
    exclude:
      - "pwsh/*/README.md"
      - "pwsh/.compiled/**"
      - "pwsh/.internal/assets/bin/**"
      - "pwsh/.internal/assets/obj/**"
  infrastructure:
    include:
      - "infrastructure/**"
    exclude:
      - "infrastructure/README.md"
      - "infrastructure/modules/README.md"
      - "infrastructure/templates/discovery/README.md"
      - "infrastructure/templates/expedition/README.md"
      - "infrastructure/templates/foundation/README.md"
