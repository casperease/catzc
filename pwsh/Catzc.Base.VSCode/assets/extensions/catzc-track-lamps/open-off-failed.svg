<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="8" cy="8" r="7.2" stroke-width="1" stroke-dasharray="3 2.2">
    <animateTransform attributeName="transform" type="rotate" from="0 8 8" to="360 8 8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="7.2" cy="7.2" r="2.8"/>
    <line x1="9.3" y1="9.3" x2="11.4" y2="11.4"/>
  </g>
  <circle cx="13.2" cy="2.8" r="2.2" fill="#f85149" stroke="none">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
