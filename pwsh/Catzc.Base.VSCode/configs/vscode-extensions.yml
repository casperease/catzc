# cspell:ignore azuretools azureresourcegroups streetsidesoftware rosshamish kuskus kusto shd101wyy esbenp tomoki redhat Anson Levett iliazeus gopls
recommendations:
  # YAML language support — schema-validated editing of the configs/*.yml registries and pipeline YAML.
  - redhat.vscode-yaml
  # markdownlint in the editor — the same rules the Test-Markdownlint gate enforces (.markdownlint.yml).
  - DavidAnson.vscode-markdownlint
  # Kusto syntax highlighting for KQL snippets in docs and Azure work.
  - rosshamish.kuskus-kusto-syntax-highlighting
  # Azure Pipelines YAML schema for .ado/pipelines/*.yaml.
  - ms-azure-devops.azure-pipelines
  # Azure resource browsing for the deployed templates.
  - ms-azuretools.vscode-azureresourcegroups
  # cspell in the editor — the same dictionaries the Test-Spelling gate uses (cspell.yml + .cspell/).
  - streetsidesoftware.code-spell-checker
  # .editorconfig support — applies the repo-wide formatting baseline on save (uniform-formatting).
  - editorconfig.editorconfig
  # Markdown Preview Enhanced — the preview the vscode-settings registry themes.
  - shd101wyy.markdown-preview-enhanced
  - ibm.output-colorizer
  - iliazeus.vscode-ansi
  - ms-python.python
  # Pylance — pyright in the editor, in the mode the Test-PythonTypes gate runs (python.yml type_checking).
  - ms-python.vscode-pylance
  - ms-dotnettools.csdevkit
  # Bicep — language service and validation for the infrastructure templates.
  - ms-azuretools.vscode-bicep
  # XML — validation for the PowerShell format/type data (.ps1xml), schemas and MSBuild projects.
  - redhat.vscode-xml
  # PDF viewing for reference material in docs.
  - tomoki1207.pdf
  - DanLevett.regex-robin

# The repository's own extensions: each renders to out/vscode-extensions/<name>/ with its script from assets/extensions/<name>.js.
extensions:
  catzc-git-changes:
    displayName: Catzc git changes
    description: >-
      Shades the lines a file changes against HEAD inside the editor: staged lines in one colour, unstaged lines in another, both set in
      workbench.colorCustomizations.
    version: 0.1.1
    activationEvents: [onStartupFinished]
    contributes:
      # The lamps' one mapping (DDR-FILTER-STATEALWAYSSHOWN): staged dark brown, unstaged yellowish.
      colors:
        - id: catzc.gitChanges.stagedBackground
          description: Background of a line whose change against HEAD is staged.
          defaults: { dark: "#7a4a1e40", light: "#7a4a1e40", highContrast: "#7a4a1e59" }
        - id: catzc.gitChanges.unstagedBackground
          description: Background of a line whose change is not staged yet.
          defaults: { dark: "#e0b83a26", light: "#e0b83a40", highContrast: "#e0b83a40" }
  catzc-save-ledger:
    displayName: Catzc save ledger
    description: >-
      Records every save in a catzc checkout to out/editor-saves.jsonl, with its content hash, so the listen mode tells the editor's changes
      from an agent's.
    activationEvents: [onStartupFinished]
  catzc-compiled-info:
    displayName: Catzc compiled build info
    description: >-
      Opens a committed Catzc.Types.<hash>.dll as a short note on what it is and whether it is the current build, instead of the binary
      screen.
    activationEvents: [onCustomEditor:catzc.compiledInfo]
    contributes:
      customEditors:
        - viewType: catzc.compiledInfo
          displayName: Catzc compiled build
          selector:
            - filenamePattern: "**/pwsh/.compiled/*.dll"
          priority: default
  catzc-track-lamps:
    displayName: Catzc track lamps
    version: 0.10.1
    description: >-
      Filter lamps in the Explorer's title row, one per repository filter (filters.yml) and one for a typed list of languages; the tree is
      the union of the lit lamps, and each lamp's colour is its domain's condition: committed, staged, unstaged or failed.
    activationEvents: [onStartupFinished]
    contributes:
      # The open lamp, one lamp per filter of filters.yml, then the languages lamp: each entry naming the repeat is written once per lamp.
      repeat:
        lamp:
          config: filters
          list: filters
          key: name
          title: title
          first: [{ name: open, title: the files open in an editor }]
          plus: [{ name: languages, title: the typed languages }]
      commands:
        - repeat: lamp
          command: catzc.lamps.{lamp}.putOut
          title: "{lamp}, {lamp.title}: shown (click to hide)"
          icon: { light: "media/{lamp}-on.svg", dark: "media/{lamp}-on.svg" }
          category: Catzc lamps
          states: [staged, unstaged, failed, empty]
          state_context: catzc.lamps.state.{lamp}
        - repeat: lamp
          command: catzc.lamps.{lamp}.light
          title: "{lamp}: hidden, filter active (click to show)"
          icon: { light: "media/{lamp}-off.svg", dark: "media/{lamp}-off.svg" }
          category: Catzc lamps
          states: [staged, unstaged, failed, empty]
          state_context: catzc.lamps.state.{lamp}
      menus:
        view/title:
          - repeat: lamp
            command: catzc.lamps.{lamp}.putOut
            when: "view == workbench.explorer.fileView && !catzc.lamps.out.{lamp}"
            group: navigation@9{lamp.position}
          - repeat: lamp
            command: catzc.lamps.{lamp}.light
            when: "view == workbench.explorer.fileView && catzc.lamps.out.{lamp}"
            group: navigation@9{lamp.position}
      configuration:
        title: Catzc track lamps
        properties:
          catzc.trackLamps.filters:
            type: object
            default: {}
            description: Each repository filter's paths and globs, in lamp order, rendered into the settings by Get-RepositoryFilter.
          catzc.trackLamps.languages:
            type: object
            default: {}
            description: Each language's file extensions, rendered into the settings from the languages config.
