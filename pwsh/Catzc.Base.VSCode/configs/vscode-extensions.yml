# cspell:ignore azuretools azureresourcegroups streetsidesoftware rosshamish kuskus kusto shd101wyy esbenp tomoki redhat Anson Levett iliazeus gopls
recommendations:
  # YAML language support — schema-validated editing of the configs/*.yml registries and pipeline YAML.
  - redhat.vscode-yaml
  # markdownlint in the editor — the same rules the Test-Markdownlint gate enforces (.markdownlint.yml).
  - DavidAnson.vscode-markdownlint
  # Kusto syntax highlighting for KQL snippets in docs and Azure work.
  - rosshamish.kuskus-kusto-syntax-highlighting
  # Azure Pipelines YAML schema for pipelines/*.yaml.
  - ms-azure-devops.azure-pipelines
  # Azure resource browsing for the deployed templates.
  - ms-azuretools.vscode-azureresourcegroups
  # cspell in the editor — the same dictionaries the Test-Spelling gate uses (cspell.yml + .cspell/).
  - streetsidesoftware.code-spell-checker
  # .editorconfig support — applies the repo-wide formatting baseline on save (uniform-formatting).
  - editorconfig.editorconfig
  # Markdown Preview Enhanced — the preview the vscode-settings registry themes.
  - shd101wyy.markdown-preview-enhanced
  - ibm.output-colorizer
  - iliazeus.vscode-ansi
  - ms-python.python
  - ms-dotnettools.csdevkit
  # Bicep — language service and validation for the infrastructure templates.
  - ms-azuretools.vscode-bicep
  # XML — validation for the PowerShell format/type data (.ps1xml), schemas and MSBuild projects.
  - redhat.vscode-xml
  # PDF viewing for reference material in docs.
  - tomoki1207.pdf
  - DanLevett.regex-robin

# The repository's own extensions: each renders to out/vscode-extensions/<name>/ with its script from assets/extensions/<name>.js.
extensions:
  catzc-git-changes:
    displayName: Catzc git changes
    description: >-
      Shades the lines a file changes against HEAD inside the editor: staged lines in one colour, unstaged lines in another, both set in
      workbench.colorCustomizations.
    activationEvents: [onStartupFinished]
    contributes:
      colors:
        - id: catzc.gitChanges.stagedBackground
          description: Background of a line whose change against HEAD is staged.
          defaults: { dark: "#f5e17a26", light: "#f5e17a40", highContrast: "#f5e17a40" }
        - id: catzc.gitChanges.unstagedBackground
          description: Background of a line whose change is not staged yet.
          defaults: { dark: "#b8860b40", light: "#b8860b40", highContrast: "#b8860b59" }
  catzc-compiled-info:
    displayName: Catzc compiled build info
    description: >-
      Opens a committed Catzc.Types.<hash>.dll as a short note on what it is and whether it is the current build, instead of the binary
      screen.
    activationEvents: [onCustomEditor:catzc.compiledInfo]
    contributes:
      customEditors:
        - viewType: catzc.compiledInfo
          displayName: Catzc compiled build
          selector:
            - filenamePattern: "**/automation/.compiled/*.dll"
          priority: default
