# cspell:ignore azuretools streetsidesoftware hediet esbenp tomoki redhat Anson gopls
recommendations:
  # YAML language support — schema-validated editing of the configs/*.yml registries and pipeline YAML.
  - redhat.vscode-yaml
  # markdownlint in the editor — the same rules the Test-Markdownlint gate enforces (.markdownlint.yml).
  - DavidAnson.vscode-markdownlint
  # cspell in the editor — the same dictionaries the Test-Spelling gate uses (cspell.yml + .cspell/).
  - streetsidesoftware.code-spell-checker
  - ms-python.python
  # Pylance — pyright in the editor, in the mode the Test-PythonTypes gate runs (python.yml type_checking).
  - ms-python.vscode-pylance
  - ms-dotnettools.csdevkit
  # Bicep — language service and validation for the infrastructure templates.
  - ms-azuretools.vscode-bicep
  # XML — validation for the PowerShell format/type data (.ps1xml), schemas and MSBuild projects.
  - redhat.vscode-xml
  # PDF viewing for reference material in docs.
  - tomoki1207.pdf
  # draw.io — the editor of the .drawio.png diagrams under docs/.assets/.
  - hediet.vscode-drawio

# The repository's own extensions: each renders to out/vscode-extensions/<name>/ from its js track module, js/<name>/extension.js and assets/.
extensions:
  catzc-git-changes:
    displayName: Catzc git changes
    description: >-
      Shades the lines a file changes against HEAD inside the editor: staged lines in one colour, unstaged lines in another, both set in
      workbench.colorCustomizations.
    version: 0.1.2
    activationEvents: [onStartupFinished]
    contributes:
      # The lamps' one mapping ([DDR-FILTER-STATEALWAYSSHOWN](/docs/drs/design/repository-filters.md#rule-ddr-filter-statealwaysshown)): local work in progress is blue-grey, staged dark, unstaged lighter.
      colors:
        - id: catzc.gitChanges.stagedBackground
          description: Background of a line whose change against HEAD is staged.
          defaults: { dark: palette.staged.background, light: palette.staged.background, highContrast: palette.staged.mark/59 }
        - id: catzc.gitChanges.unstagedBackground
          description: Background of a line whose change is not staged yet.
          defaults: { dark: palette.unstaged.background, light: palette.unstaged.mark/40, highContrast: palette.unstaged.mark/40 }
  catzc-file-icons:
    displayName: Catzc file icons
    description: >-
      The cats file icon theme: one icon per file type in the tree, drawn from the lamp glyphs or a generated label, declared in
      file-icons.yml.
    activationEvents: [onStartupFinished]
    contributes:
      iconThemes:
        - id: catzc-file-icons
          label: Catzc file icons
          path: ./media/file-icons.json
  catzc-save-ledger:
    displayName: Catzc save ledger
    description: >-
      Records every save in a catzc checkout to out/editor-saves.jsonl, with its content hash, so the listen mode tells the editor's changes
      from an agent's.
    activationEvents: [onStartupFinished]
  catzc-drs-links:
    displayName: Catzc decision record links
    description: >-
      Opens a markdown link to a repository-root /docs/drs/ path on click, in any file, with its rule fragment kept.
    activationEvents: [onStartupFinished]
  catzc-ansi-logs:
    displayName: Catzc ANSI logs
    description: >-
      Renders the ANSI colours of a log under out/ in the editor: the escapes hidden, the text painted in the terminal colours they name.
    activationEvents: [onStartupFinished]
  catzc-compiled-info:
    displayName: Catzc compiled build info
    description: >-
      Opens a committed Catzc.Types.<hash>.dll as a short note on what it is and whether it is the current build, instead of the binary
      screen.
    activationEvents: [onCustomEditor:catzc.compiledInfo]
    contributes:
      customEditors:
        - viewType: catzc.compiledInfo
          displayName: Catzc compiled build
          selector:
            - filenamePattern: "**/pwsh/.compiled/*.dll"
          priority: default
  catzc-track-lamps:
    displayName: Catzc track lamps
    version: 0.26.0
    description: >-
      Filter lamps in the Explorer's title row, one per repository filter (filters.yml), led by the open lamp; a click steps a lamp off,
      on, veto. The tree is the union of the lit lamps minus the zones of the vetoed ones, and each lamp's colour is its
      domain's condition: committed, staged, unstaged or failed.
    activationEvents: [onStartupFinished]
    contributes:
      # One lamp per filter of filters.yml: each entry naming the repeat is written once per lamp. The open lamp is no switch: it stands
      # before them, always lit, and its one command focuses the next editor.
      repeat:
        lamp:
          config: filters
          list: filters
          key: name
          title: title
      commands:
        - command: catzc.lamps.orchestrate.red
          title: "orchestrator: something failed (click to show every failing file)"
          icon: { light: "media/orchestrator-red.svg", dark: "media/orchestrator-red.svg" }
          category: Catzc lamps
        - command: catzc.lamps.orchestrate.blue
          title: "orchestrator: work in progress, nothing failed so far"
          icon: { light: "media/orchestrator-blue.svg", dark: "media/orchestrator-blue.svg" }
          category: Catzc lamps
        - command: catzc.lamps.orchestrate.green
          title: "orchestrator: all good so far"
          icon: { light: "media/orchestrator-green.svg", dark: "media/orchestrator-green.svg" }
          category: Catzc lamps
        # The open lamp's colour is the condition of the open files; with no editor open its icon is drawn invisible and keeps its place.
        - command: catzc.lamps.open.next
          title: "open, the files open in an editor (click to focus the next editor)"
          icon: { light: "media/open-on.svg", dark: "media/open-on.svg" }
          category: Catzc lamps
          states: [staged, unstaged, failed, empty]
          state_context: catzc.lamps.state.open
        # A click steps a lamp round off -> on -> veto -> off; each command shows the icon of the state it leaves.
        - repeat: lamp
          command: catzc.lamps.{lamp}.veto
          title: "{lamp}, {lamp.title}: shown (click to veto)"
          icon: { light: "media/{lamp}-on.svg", dark: "media/{lamp}-on.svg" }
          category: Catzc lamps
          states: [staged, unstaged, failed, empty]
          state_context: catzc.lamps.state.{lamp}
        - repeat: lamp
          command: catzc.lamps.{lamp}.putOut
          title: "{lamp}: vetoed, its whole zone hidden (click to turn off)"
          icon: { light: "media/{lamp}-veto.svg", dark: "media/{lamp}-veto.svg" }
          category: Catzc lamps
        - repeat: lamp
          command: catzc.lamps.{lamp}.light
          title: "{lamp}: hidden, filter active (click to show)"
          icon: { light: "media/{lamp}-off.svg", dark: "media/{lamp}-off.svg" }
          category: Catzc lamps
          states: [staged, unstaged, failed, empty]
          state_context: catzc.lamps.state.{lamp}
      menus:
        view/title:
          - command: catzc.lamps.orchestrate.red
            when: "view == workbench.explorer.fileView && catzc.lamps.summary != blue && catzc.lamps.summary != green"
            group: navigation@0
          - command: catzc.lamps.orchestrate.blue
            when: "view == workbench.explorer.fileView && catzc.lamps.summary == blue"
            group: navigation@0
          - command: catzc.lamps.orchestrate.green
            when: "view == workbench.explorer.fileView && catzc.lamps.summary == green"
            group: navigation@0
          - command: catzc.lamps.open.next
            when: "view == workbench.explorer.fileView"
            group: navigation@90
          - repeat: lamp
            command: catzc.lamps.{lamp}.veto
            when: "view == workbench.explorer.fileView && catzc.lamps.shown.{lamp} && !catzc.lamps.out.{lamp} && !catzc.lamps.veto.{lamp}"
            group: navigation@9{lamp.position}
          - repeat: lamp
            command: catzc.lamps.{lamp}.putOut
            when: "view == workbench.explorer.fileView && catzc.lamps.shown.{lamp} && catzc.lamps.veto.{lamp}"
            group: navigation@9{lamp.position}
          - repeat: lamp
            command: catzc.lamps.{lamp}.light
            when: "view == workbench.explorer.fileView && catzc.lamps.shown.{lamp} && catzc.lamps.out.{lamp}"
            group: navigation@9{lamp.position}
      configuration:
        title: Catzc track lamps
        properties:
          catzc.trackLamps.filters:
            type: object
            default: {}
            description: Each repository filter's paths and globs, in lamp order, rendered into the settings by Get-RepositoryFilter.
          catzc.trackLamps.owned:
            type: array
            items: { type: string }
            default: []
            description: The files.exclude rows the lamps added, written by the lamps and carried through by the settings generator.
          catzc.trackLamps.failingSources:
            type: array
            items: { type: string }
            default: [Ruff, PSScriptAnalyzer]
            description:
              The diagnostic sources whose Warnings fail a file as an Error does, the linters a quality gate fails on for any finding.
          catzc.trackLamps.trace:
            type: boolean
            default: false
            description:
              Narrate each step (the conditions, the files.exclude written, the census) in the output channel; it is silent otherwise, and a
              warning or an error is always written.
