# cspell:ignore azuretools azureresourcegroups streetsidesoftware rosshamish kuskus kusto shd101wyy esbenp tomoki redhat Anson Levett iliazeus gopls
recommendations:
  # YAML language support — schema-validated editing of the configs/*.yml registries and pipeline YAML.
  - redhat.vscode-yaml
  # markdownlint in the editor — the same rules the Test-Markdownlint gate enforces (.markdownlint.yml).
  - DavidAnson.vscode-markdownlint
  # Kusto syntax highlighting for KQL snippets in docs and Azure work.
  - rosshamish.kuskus-kusto-syntax-highlighting
  # Azure Pipelines YAML schema for .ado/pipelines/*.yaml.
  - ms-azure-devops.azure-pipelines
  # Azure resource browsing for the deployed templates.
  - ms-azuretools.vscode-azureresourcegroups
  # cspell in the editor — the same dictionaries the Test-Spelling gate uses (cspell.yml + .cspell/).
  - streetsidesoftware.code-spell-checker
  # .editorconfig support — applies the repo-wide formatting baseline on save (uniform-formatting).
  - editorconfig.editorconfig
  # Markdown Preview Enhanced — the preview the vscode-settings registry themes.
  - shd101wyy.markdown-preview-enhanced
  - ibm.output-colorizer
  - iliazeus.vscode-ansi
  - ms-python.python
  # Pylance — pyright in the editor, in the mode the Test-PythonTypes gate runs (python.yml type_checking).
  - ms-python.vscode-pylance
  - ms-dotnettools.csdevkit
  # Bicep — language service and validation for the infrastructure templates.
  - ms-azuretools.vscode-bicep
  # XML — validation for the PowerShell format/type data (.ps1xml), schemas and MSBuild projects.
  - redhat.vscode-xml
  # PDF viewing for reference material in docs.
  - tomoki1207.pdf
  - DanLevett.regex-robin

# The repository's own extensions: each renders to out/vscode-extensions/<name>/ with its script from assets/extensions/<name>.js.
extensions:
  catzc-git-changes:
    displayName: Catzc git changes
    description: >-
      Shades the lines a file changes against HEAD inside the editor: staged lines in one colour, unstaged lines in another, both set in
      workbench.colorCustomizations.
    activationEvents: [onStartupFinished]
    contributes:
      colors:
        - id: catzc.gitChanges.stagedBackground
          description: Background of a line whose change against HEAD is staged.
          defaults: { dark: "#f5e17a26", light: "#f5e17a40", highContrast: "#f5e17a40" }
        - id: catzc.gitChanges.unstagedBackground
          description: Background of a line whose change is not staged yet.
          defaults: { dark: "#b8860b40", light: "#b8860b40", highContrast: "#b8860b59" }
  catzc-save-ledger:
    displayName: Catzc save ledger
    description: >-
      Records every save in a catzc checkout to out/editor-saves.jsonl, with its content hash, so the listen mode tells the editor's changes
      from an agent's.
    activationEvents: [onStartupFinished]
  catzc-compiled-info:
    displayName: Catzc compiled build info
    description: >-
      Opens a committed Catzc.Types.<hash>.dll as a short note on what it is and whether it is the current build, instead of the binary
      screen.
    activationEvents: [onCustomEditor:catzc.compiledInfo]
    contributes:
      customEditors:
        - viewType: catzc.compiledInfo
          displayName: Catzc compiled build
          selector:
            - filenamePattern: "**/pwsh/.compiled/*.dll"
          priority: default
  catzc-track-lamps:
    displayName: Catzc track lamps
    version: 0.7.1
    description: >-
      Filter lamps in the Explorer's title row: code (the live aspect), tools (the vendor configuration), tests (everything else) and a
      typed list of languages; a lit lamp shows its files, an unlit one filters them away through files.exclude; every lamp lit shows
      everything.
    activationEvents: [onStartupFinished]
    contributes:
      # Each lamp is two commands, its on icon and its off icon, shown by the context key catzc.lamps.out.<lamp>. The icons are the
      # extension's own SVGs, assets/extensions/catzc-track-lamps/<lamp>-on.svg and <lamp>-off.svg, shipped as media/: a file copied in
      # over one of them replaces that icon. On is a bright green glyph; off, an active filter, a dark green glyph that glows (pulses) in a
      # turning ring.
      commands:
        - command: catzc.lamps.code.putOut
          title: "code, the live modules and configs: shown (click to hide)"
          icon: { light: media/code-on.svg, dark: media/code-on.svg }
          category: Catzc lamps
        - command: catzc.lamps.code.light
          title: "code: hidden, filter active (click to show)"
          icon: { light: media/code-off.svg, dark: media/code-off.svg }
          category: Catzc lamps
        - command: catzc.lamps.tests.putOut
          title: "tests, all neither code nor tools: shown (click to hide)"
          icon: { light: media/tests-on.svg, dark: media/tests-on.svg }
          category: Catzc lamps
        - command: catzc.lamps.tests.light
          title: "tests: hidden, filter active (click to show)"
          icon: { light: media/tests-off.svg, dark: media/tests-off.svg }
          category: Catzc lamps
        - command: catzc.lamps.tools.putOut
          title: "tools, the vendor configuration: shown (click to hide)"
          icon: { light: media/tools-on.svg, dark: media/tools-on.svg }
          category: Catzc lamps
        - command: catzc.lamps.tools.light
          title: "tools: hidden, filter active (click to show)"
          icon: { light: media/tools-off.svg, dark: media/tools-off.svg }
          category: Catzc lamps
        - command: catzc.lamps.generated.putOut
          title: "generated, every generated artifact whatever its lamp: shown (click to hide)"
          icon: { light: media/generated-on.svg, dark: media/generated-on.svg }
          category: Catzc lamps
        - command: catzc.lamps.generated.light
          title: "generated: hidden, filter active over every lamp (click to show)"
          icon: { light: media/generated-off.svg, dark: media/generated-off.svg }
          category: Catzc lamps
        - command: catzc.lamps.languages.putOut
          title: "languages: shown (click to choose languages to hide)"
          icon: { light: media/languages-on.svg, dark: media/languages-on.svg }
          category: Catzc lamps
        - command: catzc.lamps.languages.light
          title: "languages: hidden, filter active (click to show)"
          icon: { light: media/languages-off.svg, dark: media/languages-off.svg }
          category: Catzc lamps
      menus:
        view/title:
          - { command: catzc.lamps.code.putOut, when: "view == workbench.explorer.fileView && !catzc.lamps.out.code", group: navigation@90 }
          - { command: catzc.lamps.code.light, when: "view == workbench.explorer.fileView && catzc.lamps.out.code", group: navigation@90 }
          - { command: catzc.lamps.tests.putOut, when: "view == workbench.explorer.fileView && !catzc.lamps.out.tests", group: navigation@91 }
          - { command: catzc.lamps.tests.light, when: "view == workbench.explorer.fileView && catzc.lamps.out.tests", group: navigation@91 }
          - { command: catzc.lamps.tools.putOut, when: "view == workbench.explorer.fileView && !catzc.lamps.out.tools", group: navigation@92 }
          - { command: catzc.lamps.tools.light, when: "view == workbench.explorer.fileView && catzc.lamps.out.tools", group: navigation@92 }
          - command: catzc.lamps.generated.putOut
            when: "view == workbench.explorer.fileView && !catzc.lamps.out.generated"
            group: navigation@93
          - command: catzc.lamps.generated.light
            when: "view == workbench.explorer.fileView && catzc.lamps.out.generated"
            group: navigation@93
          - command: catzc.lamps.languages.putOut
            when: "view == workbench.explorer.fileView && !catzc.lamps.out.languages"
            group: navigation@94
          - command: catzc.lamps.languages.light
            when: "view == workbench.explorer.fileView && catzc.lamps.out.languages"
            group: navigation@94
      configuration:
        title: Catzc track lamps
        properties:
          catzc.trackLamps.aspects:
            type: object
            default: {}
            description: Each aspect's cover, the fewest paths that hold exactly its files, rendered into the settings by Get-AspectCover.
          catzc.trackLamps.languages:
            type: object
            default: {}
            description: Each language's file extensions, rendered into the settings from the languages config.
          catzc.trackLamps.generated:
            type: array
            default: []
            description: Every generated target's path or glob, rendered into the settings by Get-GeneratedTarget.
          catzc.trackLamps.tools:
            type: array
            default: []
            description:
              The vendor configuration's paths, the vendor tracks' places and the generated root configs, rendered into the settings.
