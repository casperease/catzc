# ---
# catzc:
#   docs: "../../../docs/references/pwsh/catzc-base-globs/configs/file-kinds.yml.md"
#   header: "generated"
# ---

kinds:
  comment-page:
    definition: The page that holds the long comments moved out of one code or config file.
    files:
      - docs/references/**/*.ps1.md
      - docs/references/**/*.psm1.md
      - docs/references/**/*.psd1.md
      - docs/references/**/*.cs.md
      - docs/references/**/*.yml.md
      - docs/references/**/*.yaml.md
      - docs/references/**/*.bicep.md
  contract-asset:
    definition: One file of a contract, whose bytes are what its contract check compares.
    files: ["contracts/*/*/**"]
    git:
      attributes: [catzc-contract, text, eol=lf]
      why:
        contract assets are data on purpose — an asset's bytes are what its contract check compares, so the tools that rewrite or check
        content (links, Markdown titles) leave them as written, and an empty presence asset stays empty. They check out with LF on every
        platform, so a working copy's bytes match the frozen record's hashes (ADR-REPO-CONTRACT-RELEASEDIMMUTABLE,
        ADR-REPO-CONTRACT-CONTRACTASSET).
  test:
    definition: A file that proves the behaviour of the code it sits beside.
    files:
      - "**/tests/**/*.Tests.ps1"
      - "**/tests/**/*.py"
      - "**/tests/**/*.bats"
      - "**/tests/**/*.sh"
      - "**/tests/**/*.go"
  fixture:
    definition: A supporting file of a test that is no test itself, such as sample data.
    subkinds:
      input:
        definition: A fixture kept verbatim in a test's assets folder, as the input the test reads.
        files: ["**/tests/**/assets/**"]
        git:
          attributes: [catzc-fixture]
          why: test fixture trees are data on purpose — the link and Markdown-title tools leave them as written.
    files: ["**/tests/**"]
  type:
    definition: A compiled C# type that a module ships.
    files: ["pwsh/**/types/*.cs"]
  function:
    definition: A PowerShell function of a module, one function to a file.
    subkinds:
      gate:
        definition: A quality gate that checks the repository and reports every issue.
        files: ["pwsh/Catzc.*/Test-*.ps1"]
      writer:
        definition: A function that composes and writes a generated file.
        files: ["pwsh/Catzc.*/Build-*.ps1", "pwsh/Catzc.*/New-*.ps1"]
      assert:
        definition: A function that stops the caller when a condition does not hold.
        files: ["pwsh/Catzc.*/Assert-*.ps1"]
      formatter:
        definition: A function that rewrites a file into its one canonical form.
        files: ["pwsh/Catzc.*/Format-*.ps1"]
      fact:
        definition: A processor that computes one derived fact of a file's meta head.
        files: ["pwsh/Catzc.*/private/Get-*FileMetaFact.ps1"]
    files: ["pwsh/Catzc.*/*.ps1", "pwsh/Catzc.*/private/*.ps1"]
  analyzer-rule:
    definition: A PSScriptAnalyzer rule module that enforces a domain rule.
    files: ["pwsh/.scriptanalyzer/**"]
  module:
    definition: A PowerShell module that is one file, named by the file.
    subkinds:
      internal:
        definition: A loader module of catzc itself, kept under pwsh/.internal.
        files: ["pwsh/.internal/*.psm1"]
  template:
    definition: A Bicep template that deploys one concern.
    subkinds:
      config:
        definition: The settings of a template for one deployment target.
        files:
          [
            "infrastructure/templates/**/configuration/**/*.yml",
            "infrastructure/templates/**/configuration/**/*.bicepparam",
            "infrastructure/templates/*/options.yml",
          ]
      module:
        definition: A reusable Bicep module that templates compose.
        files: ["infrastructure/modules/*.bicep"]
    files: ["infrastructure/templates/**/*.bicep"]
  config:
    definition: >-
      The configuration part of everything as code: a module's YAML config, validated by its C# type, and a deployable template's
      per-environment configuration.
    files:
      - pwsh/**/configs/*.yml
      - python/*/configs/*.yml
      - infrastructure/templates/*/configuration/**
  pipeline-template:
    definition: A reusable pipeline template that pipelines extend.
    files: [".ado/pipelines/*/*.yaml"]
  pipeline:
    definition: A pipeline definition that a delivery platform runs.
    files: [".ado/pipelines/*.yaml", ".github/workflows/*.yml"]
  hook:
    definition: A hook that the assistant tooling runs on an event.
    files: [".claude/hooks/**"]
  asset:
    definition: A file a module ships that is neither code nor config, such as the source of a root file.
    files: ["pwsh/**/assets/**"]
  slides-kit:
    definition: The kit a deck is rendered from, its defaults, its style guide and its patterns.
    files: ["python/catzc_diagrams/assets/slides/**"]
  drawio-kit:
    definition: The tooling that draws and renders the diagrams, its scripts included.
    files: ["python/catzc_diagrams/**"]
  script:
    definition: A standalone script that is no function of a module.
    files: ["**/*.py", "**/*.sh", "**/*.ps1"]
  agent:
    definition: The definition of a sub-agent.
    files: [".claude/agents/**"]
  capability:
    definition: A capability a sub-agent preloads, a skill file with a model floor.
    files: [".claude/skills/**"]
  index:
    definition: The entry page that lists and links what a folder holds.
    files: ["docs/index.md", "docs/drs/index.md"]
  glossary:
    definition: The generated page that defines the terms of the domain rules.
    files: ["docs/drs/glossary.md"]
  # A diagram's declaration comes before the decision records, so a declaration under docs/drs is one too.
  diagram-declaration:
    definition: The declaration a diagram is rendered from, its one source beside the image under .assets.
    files: ["docs/**/.assets/*.drawio.yml"]
  adr:
    definition: A decision record whose numbered rules the code follows.
    files: ["docs/drs/**"]
  # The diagram kinds come before the two trees they live in, so the first match names a diagram, not a page.
  diagram:
    definition: A diagram image of the documentation, drawn in the diagram editor or rendered from a description.
    files: ["docs/**/.assets/**/*.png"]
  slide:
    definition: One slide of a deck, rendered through a pattern of the slides kit.
    files: ["docs/**/*.slide.md"]
  reference:
    definition: A reference page that states facts for lookup.
    subkinds:
      dora:
        definition: A page of the DORA research reference, the delivery capabilities and metrics the decision records are grounded in.
        files: ["docs/references/dora/**"]
      caf:
        definition: A page of the Cloud Adoption Framework reference, the cloud practice the Azure decision records follow.
        files: ["docs/references/caf/**"]
      waf:
        definition: A page of the Well-Architected Framework reference, the workload pillars the Azure decision records follow.
        files: ["docs/references/waf/**"]
    files: ["docs/references/**"]
  how-to:
    definition: A guide to one task, for a reader who knows the basics.
    files: ["docs/how-to/**"]
  explanation:
    definition: A page that explains why something works as it does.
    files: ["docs/explanation/**"]
  readme:
    definition: The README of a folder.
    files: ["**/README.md"]

# The intended overlaps, [earlier, later]: the earlier kind takes most of the later kind's files on purpose, since the later one is the
# catch-all of its tree; a kind mostly shadowed by a pair not listed here fails Test-FileKindReachability.
overlaps:
  - [test, fixture]
  - [comment-page, fixture]
  - [contract-asset, fixture]
  - [fixture, asset]
  - [test, script]
  - [function, script]
  - [slides-kit, drawio-kit]
  - [test, drawio-kit]
  - [fixture, drawio-kit]
  - [config, drawio-kit]
  - [drawio-kit, script]
  - [asset, script]
  - [fixture, script]
  - [analyzer-rule, script]
  - [comment-page, reference]
  - [diagram-declaration, reference]
  - [diagram, reference]
  - [diagram-declaration, explanation]
  - [diagram, explanation]
  - [slide, explanation]
