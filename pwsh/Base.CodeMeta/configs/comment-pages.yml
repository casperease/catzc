pages:
  - source: pwsh/*
    docs: docs/references/pwsh
  - source: .ado/pipelines
    docs: docs/references/ado/pipelines
  - source: infrastructure
    docs: docs/references/infrastructure
  - source: .claude/hooks
    docs: docs/references/pwsh/claude-hooks
  - source: python/*
    docs: docs/references/python
  - source: .github/workflows
    docs: docs/references/github/workflows
  # A <prefix>/* source never matches a dot-prefixed folder, so .scriptanalyzer and .internal are listed by name.
  - source: pwsh/.scriptanalyzer
    docs: docs/references/pwsh/scriptanalyzer
  - source: pwsh/.internal
    docs: docs/references/pwsh/internal

# The folders whose files have no page: vendored scripts we ship but do not write. Test fixture data has no page either.
exclude:
  - pwsh/Tooling.Toolchain/assets/scripts
  - pwsh/Azure.Templates/tests/assets/templates

# The authored pages under a pages docs folder that no source file has.
articles:
  - docs/references/ado/pipelines/template-folders.md
  - docs/references/infrastructure/CLAUDE.md
  - docs/references/infrastructure/_template.md
  - docs/references/infrastructure/discovery.md
  - docs/references/infrastructure/discovery-cost-model.md
  - docs/references/infrastructure/expedition.md
  - docs/references/infrastructure/expedition-cost-model.md
  - docs/references/infrastructure/foundation.md
  - docs/references/infrastructure/foundation-cost-model.md
  - docs/references/infrastructure/index.md
  - docs/references/infrastructure/modules.md
  - docs/references/infrastructure/overview.md
  - docs/references/infrastructure/threat-model.md
  - docs/references/pwsh/CLAUDE.md
  - docs/references/pwsh/index.md
  - docs/references/pwsh/internal/index.md
