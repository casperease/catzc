environments:
  dev:
    vnet_address_space: 10.10.0.0/16
    default_subnet: 10.10.0.0/24
  test:
    vnet_address_space: 10.20.0.0/16
    default_subnet: 10.20.0.0/24
  preprod:
    vnet_address_space: 10.30.0.0/16
    default_subnet: 10.30.0.0/24
  prod:
    vnet_address_space: 10.40.0.0/16
    default_subnet: 10.40.0.0/24

subscriptions:
  # Hubs — the shared platform pair.
  shared_nonprod:
    kind: hub
    vnet_address_space: 10.0.0.0/16
    subnets:
      GatewaySubnet: 10.0.0.0/27
      AzureFirewallSubnet: 10.0.0.64/26
      shared-services: 10.0.1.0/24
  shared_prod:
    kind: hub
    vnet_address_space: 10.1.0.0/16
    subnets:
      GatewaySubnet: 10.1.0.0/27
      AzureFirewallSubnet: 10.1.0.64/26
      shared-services: 10.1.1.0/24
  # Spokes — one per customer subscription, a workload subnet per standard environment it serves.
  apex_nonprod:
    kind: spoke
    vnet_address_space: 10.100.0.0/16
    subnets:
      private-endpoints: 10.100.0.0/24
      dev: 10.100.1.0/24
      test: 10.100.2.0/24
  apex_prod:
    kind: spoke
    vnet_address_space: 10.101.0.0/16
    subnets:
      private-endpoints: 10.101.0.0/24
      preprod: 10.101.1.0/24
      prod: 10.101.2.0/24
  nova_nonprod:
    kind: spoke
    vnet_address_space: 10.102.0.0/16
    subnets:
      private-endpoints: 10.102.0.0/24
      dev: 10.102.1.0/24
      test: 10.102.2.0/24
  flux_nonprod:
    kind: spoke
    vnet_address_space: 10.103.0.0/16
    subnets:
      private-endpoints: 10.103.0.0/24
      dev: 10.103.1.0/24
      test: 10.103.2.0/24
