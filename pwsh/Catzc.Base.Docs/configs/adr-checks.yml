engine_neutrality:
  domains: [automation]
  tokens:
    env-variable: '\$env:'
    pwsh-variable: '\$(?!env:)[A-Za-z_][A-Za-z0-9_]*'
    comparison-operator: '(?<![\w-])-[ci]?(?:not)?(?:eq|ne|gt|lt|ge|le|like|match|contains|in|replace)\b'
    type-literal: '\[(?:[A-Z][A-Za-z0-9]*(?:\.[A-Z][A-Za-z0-9]*)*|switch|bool|string|int|object|hashtable|scriptblock|pscustomobject|ordered)(?:\(\))?\](?!\()'
    pwsh-cmdlet: '\b(?:Join-Path|Split-Path|Test-Path|Resolve-Path|Set-Location|Push-Location|Pop-Location|Set-StrictMode|Write-Host|Write-Output|Write-Error|Write-Warning|Write-Verbose|Write-Information|ForEach-Object|Where-Object|Select-Object|Sort-Object|Group-Object|Measure-Object|Out-Null|Out-String|Invoke-Expression|Get-Content|Set-Content|Get-ChildItem|Get-Item|New-Item|Remove-Item|Copy-Item|Move-Item|ConvertFrom-Json|ConvertTo-Json|Import-Module|Remove-Module|Export-ModuleMember|Get-Command|Get-Module|New-Object|Add-Member|Start-Process|Invoke-Pester)\b'
    common-parameter: '(?<![\w-])-(?:ErrorAction|WarningAction|InformationAction|Verbose|Debug|Confirm)\b'
    pester-block: '\b(?:Describe|Context|It|BeforeAll|BeforeEach|AfterAll|AfterEach|Mock)\b(?=`|\s*\{|\s+[''"])'
    pester-framework: '\bPester\b'
    pwsh-file: '\.ps[md]?1\b'
    dot-source: '\bdot-(?:source[sd]?|sourcing)\b'
    module-manifest: '\b(?:FunctionsToExport|NestedModules|RootModule|RequiredModules)\b'
    should-process: '\b(?:SupportsShouldProcess|ShouldProcess|WhatIf)\b'
    script-block: '\b(?:Script|script) ?block'

dora_coverage:
  exempt:
    research: Each research ADR is the record of one DORA capability and ends with its own Dora explains section.
  # A vendor-checklist ADR answers Microsoft's guidance item by item; it is grounded in that vendor's reference, not in DORA research.
  exempt_folders:
    azure/caf: Each ADR answers the Cloud Adoption Framework landing-zone guidance; docs/references/caf/index.md grounds it.
    azure/waf: Each ADR answers one Well-Architected pillar's checklist; docs/references/waf/index.md grounds it.

# The segment grammar of ADR codes and named rule headings ([ADR-REPO-ADRCODE](/docs/adr/repository/adr-code-language.md)).
code_language:
  mode: gate
