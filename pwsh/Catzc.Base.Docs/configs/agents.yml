standard: catzc-worker
# The roofs Test-AgentDefinitions holds every robot and capability under; the defaults are declared once on AgentsConfig.
roofs:
  agent_body_lines: 20
  capability_lines: 10
# The contracts every robot and capability names under `contracts` in its front matter and reads first.
contracts: [ADR-REPO-AI]
agents:
  # The standard agent: one task from a coordinator's brief, each file verified with the gates before the next.
  - name: catzc-worker
    model_reason: writes code, tests and docs that must pass the analyzer and the gates on the first run, across several files of one brief
    supported_by: [ADR-REPO-AGENTS-STANDARDWORKER, ADR-PRIN-REDUCEVAR-ESSENTIALDIFFERENCESEXPLICIT, ADR-PROC-BUILTIN-GATESAREPARTOFWORK]
    checks:
      - Invoke-TestFile
      - Test-ScriptAnalyzer
      - Test-Spelling
      - Format-Types
      - Format-Code
      - Test-Links
      - Test-Glossary
      - Build-Readme
      - Build-Glossary
      - Build-AdrIndex
      - Test-GeneratedFiles

  # Authors new diagrams in the visual grammar and lands the approved ones under docs/.assets/, embedded in their ADRs.
  - name: drawio-diagram-waves
    supported_by: [ADR-DSGN-VISUAL-LEFTTORIGHTISTIME, ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, ADR-REPO-FOLDERS-DOCUMENTATIONMARKDOWNONLY]
    checks: [Test-CheckedInBinaries, Test-Links]
    model_reason: leads other agents, ranks candidates and writes briefs in the ADRs' exact terms

  # Re-renders a given .drawio.png's model to out/drawio and reports raster-versus-model and source-versus-diagram differences.
  - name: drawio-png
    supported_by: [ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, ADR-REPO-FOLDERS-DOCUMENTATIONMARKDOWNONLY]
    checks: [Test-CheckedInBinaries]

  # Changes labels and styles inside existing docs/.assets/ diagrams so they match the decisions they draw.
  - name: write-drawio-files
    supported_by: [ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, ADR-REPO-FOLDERS-DOCUMENTATIONMARKDOWNONLY]
    checks: [Test-CheckedInBinaries]

  # Shows the diagram review state on one shared page; it publishes from out/ and runs no catzc check.
  - name: print-artifacts
    supported_by: [ADR-DORA-VISUAL-DISPLAYPROCESSSTATE, ADR-DORA-VISUAL-CHOSENWITHTEAM]
    checks: []

  # Builds the inspiration module to the inspiration policy.
  - name: build-inspiration-module
    supported_by: [ADR-REPO-INSPIRE-SIBLINGFORIDEAS, ADR-REPO-INSPIRE-CATZCADRSDECIDE]
    checks: [Invoke-TestFile, Test-ShippedConfigs, Test-ModuleDependency]
    model_reason: writes a typed config, a resolver and their tests that must pass the analyzer and the gates on the first run

  # Measures what a session cost and why, and proposes the changes; it writes only to out/ and runs no catzc check.
  - name: session-cost-audit
    supported_by: [ADR-PRIN-NOWASTE-SEVENWASTES, ADR-PROC-KAIZEN-ADAPTFROMEVIDENCE, ADR-AUTO-FAILFAST-BOUNDEVERYWAIT]
    checks: []

  # Cleans the plans in .claude/plans to the plan rules, one verdict and one file at a time; sonnet because it judges across files.
  - name: plan-clear
    supported_by: [ADR-REPO-PLANS-DONEPLANDELETED, ADR-PRIN-ONELIVE-ONEVERSION, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: [Test-Links, Test-Plans]
    model_reason: judging whether a plan's data is in the tree reads several files against each other

  # Lands a pasted continuation prompt in the plans, nothing discarded, every done claim checked against the tree.
  - name: plan-intake
    supported_by: [ADR-PRIN-ONELIVE-HISTORYINGIT, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: [Test-Links]

  # Runs a decision round over the plans' open questions: recommendation first, every answer recorded with its outcome.
  - name: plan-decide
    supported_by: [ADR-PRIN-CONFIG-DEFAULTANSWERSINSTANCEQUESTIONS, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: [Test-Links]

  # Runs one gate or test file in the background and brings its verdict back verbatim.
  - name: gate-runner
    supported_by: [ADR-AUTO-FAILFAST-BOUNDEVERYWAIT, ADR-AUTO-TEST-QUALITYGATE]
    checks: [Invoke-TestFile, Test-Automation]

  # Repairs the links of a named set of markdown files, one file and one target at a time.
  - name: link-fixer
    supported_by: [ADR-REPO-LINK-KINDBYFILE, ADR-REPO-LINK-ONECITATIONSPELLING]
    checks: [Test-Links, Format-Links]

  # Read-only review of a file set against the rules that govern it, each finding with its rule code.
  - name: adr-reviewer
    supported_by: [ADR-PROC-BUILTIN-GATESAREPARTOFWORK, ADR-REPO-LINK-ONECITATIONSPELLING]
    checks: []
    model_reason: weighs a rule's prose against code across several ADRs and files

  # Keeps the glossary sources in step with the rules that bold each term, one term at a time.
  - name: glossary-keeper
    supported_by: [ADR-REPO-VOCAB-DEFINEDTERM]
    checks: [Test-Glossary, Build-Glossary]

  # Makes the test suite faster under the timeouts.yml roofs without losing any test or assertion, one measured file at a time.
  - name: test-optimization
    supported_by: [ADR-AUTO-TEST-MEASUREFIRST, ADR-AUTO-TEST-SETUPONCE, ADR-AUTO-TEST-COLLAPSEINPUTCLUSTERS, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: [Invoke-TestFile, Test-ScriptAnalyzer]
    model_reason: diagnoses where a test's time goes and changes production code without changing what it proves

  # Drives the master plan's open chunks through the sessions the user started, by message; implements nothing, spawns nothing.
  - name: implementation-orchestrator
    supported_by: [ADR-REPO-PLANS-MASTERANDTASKS, ADR-PROC-PULLWORK-PULLNOTPUSH, ADR-PROC-PULLWORK-LIMITWORKINPROGRESS, ADR-REPO-AI-NEVERDECIDEFORUSER]
    checks: [Test-Plans]
    model_reason:
      maps every session's free-text reply to a task file and chooses the next chunk against the master's order and the files live sessions
      hold
