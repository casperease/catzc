# ---

capabilities:
  # The time safeguard for every shell call and cats command a robot runs.
  - name: catzc-run
    supported_by: [ADR-AUTO-FAILFAST-BOUNDEVERYWAIT]
    checks: []

  # One gate or test file per run, its verdict forwarded verbatim.
  - name: catzc-check
    supported_by: [ADR-AUTO-TEST-QUALITYGATE, ADR-PROC-BUILTIN-GATESAREPARTOFWORK]
    checks: [Invoke-TestFile, Test-Links, Test-AgentDefinitions]

  # How a cats module is built to the domain rules, one file at a time with its tests.
  - name: catzc-module
    supported_by:
      [
        ADR-PWSH-ONEFUNC-ONEFUNCTIONPERFILE,
        ADR-AUTO-DEFAULT-ONERESOLUTIONORDER,
        ADR-AUTO-TEST-DISTINCTFIXTUREIDENTITIES,
        ADR-AUTO-TYPES-SNAKECASEMIRRORSYAML,
      ]
    checks: [Invoke-TestFile, Test-ShippedConfigs, Test-ModuleDependency]

  # Diagnosing and fixing one slow test file by the speed rules, nothing lost.
  - name: test-speed
    supported_by:
      [ADR-AUTO-TEST-MEASUREFIRST, ADR-AUTO-TEST-SETUPONCE, ADR-AUTO-TEST-COLLAPSEINPUTCLUSTERS, ADR-PWSH-PESTER-SYSTEMIOONHOTPATHS]
    checks: [Invoke-TestFile, Test-ScriptAnalyzer]

  # The per-file and end-of-task checks of a delegated change, and the shared files it never edits.
  - name: catzc-verify
    supported_by: [ADR-PROC-BUILTIN-GATESAREPARTOFWORK, ADR-AUTO-TEST-QUALITYGATE, ADR-REPO-AGENTS-STANDARDWORKER]
    checks:
      [
        Invoke-TestFile,
        Test-ScriptAnalyzer,
        Test-Spelling,
        Format-Types,
        Format-Code,
        Test-Links,
        Test-Glossary,
        Build-Readme,
        Build-Glossary,
        Build-AdrIndex,
        Test-GeneratedFiles,
      ]

  # Finding the rules that govern a file set and citing them by code, without sweeping the corpus.
  - name: adr-cite
    supported_by: [ADR-REPO-LINK-ONECITATIONSPELLING]
    checks: []

  # The fixed end-of-run report of every robot.
  - name: report-fixed
    supported_by: [ADR-REPO-AGENTS-STANDARDWORKER]
    checks: []

  # Git as a read-only probe; no state-changing command.
  - name: git-readonly
    supported_by: [ADR-PROC-BUILTIN-GATESAREPARTOFWORK]
    checks: []

  # Check and repair the links of one markdown file, one link at a time.
  - name: md-links
    supported_by: [ADR-REPO-LINK-KINDBYFILE, ADR-REPO-LINK-ONECITATIONSPELLING]
    checks: [Test-Links, Format-Links]

  # Republishing the Diagram Waves Review page from the catalogue on disk, its answers kept.
  - name: artifact-publish
    supported_by: [ADR-DORA-VISUAL-DISPLAYPROCESSSTATE, ADR-DORA-VISUAL-CHOSENWITHTEAM]
    checks: []

  # Put, get, sync, theme and stale-rebuild of a diagram folder from its yml declaration.
  - name: drawio-declaration
    supported_by:
      [ADR-REPO-SLIDES-DECLARATION, ADR-REPO-SLIDES-TWODIRECTIONS, ADR-REPO-SLIDES-CONFLICTNEEDSAPICK, ADR-REPO-SLIDES-THEMESELECTOR]
    checks: [Test-Diagrams]

  # Looking at one diagram PNG in the kit's vocabulary, never a meaning.
  - name: drawio-look
    supported_by: [ADR-DSGN-VISUAL-LEFTTORIGHTISTIME]
    checks: []

  # The wave protocol for authoring new diagrams: bounded fan-out, fixed briefs, one shared kit.
  - name: drawio-waves
    supported_by: [ADR-DSGN-VISUAL-LEFTTORIGHTISTIME, ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, ADR-REPO-FOLDERS-DOCUMENTATIONMARKDOWNONLY]
    checks: [Test-CheckedInBinaries, Test-Links]

  # Fail-forward render of a .drawio.png with its minimaps, on the dark page by default.
  - name: drawio-renderer
    supported_by: [ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE]
    checks: [Test-CheckedInBinaries]

  # The verdict rules for one plan file.
  - name: plan-shape
    supported_by: [ADR-PRIN-ONELIVE-ONEVERSION, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: []

  # Landing a pasted continuation prompt in the plans, nothing discarded.
  - name: plan-intake
    supported_by: [ADR-PRIN-ONELIVE-HISTORYINGIT, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: []

  # A decision round over the plans' open questions.
  - name: plan-decide
    supported_by: [ADR-PRIN-CONFIG-DEFAULTANSWERSINSTANCEQUESTIONS, ADR-PRIN-NOWASTE-SEVENWASTES]
    checks: []

  # Ranking a plan by value and by the docs and tests it needs.
  - name: plan-value
    supported_by: [ADR-PRIN-NOWASTE-SEVENWASTES, ADR-PROC-PULLWORK-PULLNOTPUSH]
    checks: []

  # The message protocol between an orchestrator and the live sessions it drives over the master plan.
  - name: plans-orchestrate
    supported_by: [ADR-PROC-PULLWORK-PULLNOTPUSH, ADR-PROC-PULLWORK-LIMITWORKINPROGRESS, ADR-REPO-AI-NEVERDECIDEFORUSER]
    checks: []

  # How the listen mode's processor reads the listener's notes and keeps its own ledger.
  - name: listen-notes
    supported_by: [ADR-REPO-AI-EDITORISFACT, ADR-AUTO-FAILFAST-BOUNDEVERYWAIT]
    checks: []

  # The listen mode's tiers and its one search over the committed reference.
  - name: listen-tiers
    supported_by: [ADR-REPO-AI-EDITORISFACT, ADR-REPO-PLANS-DECISIONSBECOMERULES]
    checks: []

  # How one note of the editor becomes a pattern and a repository-wide plan.
  - name: listen-insight
    supported_by: [ADR-REPO-AI-EDITORISFACT, ADR-PROC-KAIZEN-ADAPTFROMEVIDENCE, ADR-REPO-PLANS-ONETOPICONEFILE]
    checks: [Test-Plans]

  # The checkpoint a user runs to bring a main session to its finalization phase before clearing it.
  - name: session-finalize
    invoked_by: user
    supported_by: [ADR-REPO-AGENTS-USERSKILL, ADR-REPO-PLANS-OPENSTEP, ADR-PROC-KAIZEN-ADAPTFROMEVIDENCE]
    checks: [Test-Plans]
