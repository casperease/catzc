concepts:
  domain rules:
    key: domain_rules
    domain: repository
    defined_by: ADR-REPO-VOCAB-DOMAINRULES
    short: The repository's conventions and decision records — its ADRs and the rules they state.
    realized_by: { kind: prose-only }
    avoid:
      - { phrase: house rules, say: domain rules / ADR rules }
  workstream:
    key: workstream
    domain: repository
    defined_by: ADR-REPO-OUTDIR-PLANNOTES
    short:
      One labeled section of a plan's work breakdown (`out/plan-*.md`) — its own `### W<n>:` heading, order, and gate — that lands as one
      change.
    realized_by: { kind: prose-only }
  robot:
    key: robot
    domain: repository
    defined_by: ADR-REPO-AGENTS-ROBOTBODYLIMIT
    short:
      A sub-agent in its minimal form — a body of at most the roof's lines on a named model, loading shared know-how from capabilities
      instead of carrying it.
    realized_by: { kind: prose-only }
  capability:
    key: capability
    domain: repository
    defined_by: ADR-REPO-AGENTS-CAPABILITYFILE
    short:
      One `.claude/skills/<domain>-<job>/SKILL.md` file a robot preloads through its `skills` list — at most the roof's lines, with a model
      floor declared once in its metadata.
    realized_by: { kind: prose-only }
  model floor:
    key: model_floor
    domain: repository
    defined_by: ADR-REPO-AGENTS-NAMEDMODEL
    short: The lowest model that performs a capability's steps reliably; no robot that preloads the capability runs below it.
    realized_by: { kind: prose-only }
  domain:
    key: domain
    domain: repository
    defined_by: ADR-REPO-FOLDERS-DOCUMENTATIONMARKDOWNONLY
    short: A group of ADRs — one docs/adr/ subfolder — that adrs.yml declares with its role and the domains it depends on.
    realized_by: { kind: prose-only }
    forms:
      [
        ADR,
        thesis,
        principles,
        process,
        design,
        flow,
        automation,
        bcl,
        pwsh,
        configuration,
        ado,
        github,
        azure,
        repository,
        research,
        axioms,
        architecture,
        implementation,
        optimisable,
        owning,
      ]
    avoid:
      - { phrase: problem domain, say: the problem catzc solves }
    contrasts:
      language zone: A language zone is one of the design, test, and live registers of identities; an ADR domain groups ADRs.
      responsibility domain: A responsibility domain is what one repository is accountable for; an ADR domain groups ADRs.
  language zone:
    key: language_zone
    domain: repository
    defined_by: ADR-REPO-LANG-THREEREGISTERS
    short: One of the three registers — design, test, live — each with its own terminology and identities; a token belongs to exactly one.
    realized_by: { kind: prose-only }
    forms: [language, design, test, live, landing, dns, availability]
    contrasts:
      domain: An ADR domain groups ADRs in one docs/adr/ subfolder; a language zone is a register of identities.
      file language:
        A file language is the kind of text one file holds, named by its extension; a language zone is a register of identities.
  source:
    key: source
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      Where something comes from, always qualified — a source mode, run, or tree; a glossary source; a type, authored, vendor, or dot
      source.
    realized_by: { kind: prose-only }
    forms:
      [
        glossary,
        type,
        authored,
        dot,
        function,
        vendor,
        catzc,
        combined,
        committed,
        shipped,
        tracked,
        fixture,
        comparison,
        primary,
        raw,
        install,
        rule,
        docs,
        derived,
        current,
        real,
        configured,
        public,
        single,
        token,
        relative,
        repo,
        authoritative,
        cross,
        vendored,
        input,
      ]
    verbs: true
    contrasts:
      source of truth:
        The source of truth is the one store that decides what is true about the delivered system, the repository; a source, always
        qualified, names where one thing comes from.
  layer:
    key: layer
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      One stratum of a structure, always qualified — one of the five layers of the automation (automation, contract, language, engine,
      importer; ADR-AUTO-LAYERS-REALISENEVERREDEFINE), or a globset layer (module, fileset).
    realized_by: { kind: prose-only }
    forms:
      [
        contract,
        language,
        engine,
        importer,
        installer,
        config,
        configuration,
        Azure,
        tooling,
        YAML,
        module,
        template,
        templating,
        vendor,
        abstraction,
        analyzer,
        compatibility,
        mapping,
        serialization,
        base,
        design,
        spelling,
        Pester,
        pip,
        path,
        support,
        doctrine,
        globset,
        fileset,
        cross,
        ADR,
        AUTO,
        shaping,
      ]
    verbs: true
    contrasts:
      facet: A facet is one of several parallel views of, or checks on, the same thing; a layer is one level of a stack.
  facet:
    key: facet
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      One of several parallel views of, or checks on, the same thing, none above another — a build facet (types, load, parity, manifest) or
      a module facet (disk, session).
    realized_by: { kind: prose-only }
    forms: [build, types, load, parity, manifest, module, disk, session, runtime]
    verbs: true
    contrasts:
      layer: A layer is one level of a stack, sitting on or containing the next; a facet is a parallel view of the same thing.
  scope:
    key: scope
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      What something reaches, always qualified — a PowerShell scope (module, script, global), an install scope (user, machine), or a
      selection scope (verify, scan, content).
    realized_by: { kind: prose-only }
    forms:
      [
        PowerShell,
        selection,
        module,
        user,
        machine,
        content,
        script,
        verify,
        shared,
        file,
        target,
        scan,
        test,
        persistent,
        category,
        global,
        process,
        Pester,
        default,
        install,
        markdown,
        repo,
        lint,
        child,
        environment,
        subscription,
        report,
        tag,
        declared,
        whole,
        top,
        strict,
        isolated,
        discovery,
        glossary,
        deployment,
        infra,
        radius,
        production,
      ]
    verbs: true
  contract:
    key: contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A binding interface at the repository boundary, held under contracts/ in either direction — provided or depended-on — and proven by
      its owning module's tests.
    realized_by: { kind: prose-only }
    contrasts:
      contract asset:
        A contract asset is one file in an owning module's folder of a unit's contracts/ version folder; a contract is the binding interface
        its assets state together.
  provided contract:
    key: provided_contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A contract an outside consumer may rely on — the repository's only public API, kept while a consumer pins that version of its unit.
    realized_by: { kind: prose-only }
    contrasts:
      depended-on contract:
        A depended-on contract is what an outside platform expects of our files and calls, and it follows that platform; a provided contract
        is a promise to a consumer, kept while the consumer pins that version of its unit.
      pin:
        A pin is the consumer's explicit choice of a version that crosses the repository boundary; a provided contract is the promise catzc
        keeps under that pin.
  depended-on contract:
    key: depended_on_contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A contract an outside platform expects of our files and calls, such as GitHub reading a workflow file; it follows the platform, so a
      platform change is a new draft.
    realized_by: { kind: prose-only }
    contrasts:
      provided contract:
        A provided contract is a promise to an outside consumer, kept while the consumer pins that version of its unit; a depended-on
        contract records what a platform requires and follows the platform.
  contract asset:
    key: contract_asset
    domain: repository
    defined_by: ADR-REPO-CONTRACT-CONTRACTASSET
    short:
      One file in an owning module's folder of a unit's contracts/ version folder, whose path names the real file it constrains and whose
      name picks its kind — a fragment, a schema, a sample payload, or a command contract.
    realized_by: { kind: prose-only }
    contrasts:
      contract:
        A contract is the binding interface at the repository boundary; a contract asset is one checked-in file that states part of it.
      command contract:
        A command contract is the one asset kind that states a command's call interface and is compared with the command's source; a
        contract asset is any file of the five kinds.
      published artifact:
        A published artifact is a file one stage produces and a later stage consumes within a run; a contract asset is a checked-in file
        that states what the repository boundary requires, frozen with its unit's release.
  source of truth:
    key: source_of_truth
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-ONESTOREDECIDES
    short:
      The one store whose content decides what is true about the delivered system — for catzc, the repository, changed through one change
      process.
    realized_by: { kind: prose-only }
    contrasts:
      source:
        A source, always qualified, names where one thing comes from; the source of truth is the one store that decides what is true about
        the delivered system.
      adjacent store:
        An adjacent store is a second store driven one way from the trunk's pipelines, a projection of the truth; the source of truth is the
        record it is driven from.
      truth store:
        A truth store is any store of the three kinds; the source of truth is the one truth store that decides inside a responsibility
        domain, the repository.
  adjacent store:
    key: adjacent_store
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-REPOSITORYISCONFIGURATIONRECORD
    short:
      The one legitimate second store — a repository or service, such as a GitOps or configuration repository, or Azure DevOps Services or
      GitHub SaaS, with its own history, driven one way from the trunk's pipelines and never edited beside it.
    realized_by: { kind: prose-only }
    contrasts:
      source of truth:
        The source of truth is the record everything is driven from; an adjacent store is a one-way projection of it, never a second record.
      fact source: A fact source is owned by a state machine and only read; an adjacent store is driven one way from the trunk's pipelines.
  truth store:
    key: truth_store
    domain: thesis
    defined_by: ADR-THES-STORES-THREEKINDS
    short:
      Any store that holds part of the truth about a delivered system — a version-controlled repository, a fact source, or a state machine.
    realized_by: { kind: prose-only }
    contrasts:
      source of truth:
        The source of truth is the one truth store that decides inside a responsibility domain, the repository; a truth store is any store
        of the three kinds.
  version-controlled repository:
    key: version_controlled_repository
    domain: thesis
    defined_by: ADR-THES-STORES-VERSIONCONTROLLEDREPOSITORY
    short: The kind of truth store whose content is a versioned history of reviewed changes; a git repository is one subgroup of it.
    realized_by: { kind: prose-only }
  responsibility domain:
    key: responsibility_domain
    domain: thesis
    defined_by: ADR-THES-STORES-RESPONSIBILITYDOMAIN
    short:
      The organisation, team, product, or person that one repository is the responsibility boundary for, set by where git's hard security
      controls stop.
    realized_by: { kind: prose-only }
    contrasts:
      domain: A domain is a group of ADRs; a responsibility domain is what one repository is accountable for.
  fact source:
    key: fact_source
    domain: thesis
    defined_by: ADR-THES-STORES-FACTSOURCEREADONLY
    short:
      A state store — a database with a reachable live URL holding state about delivery outside the repository, such as the Azure DevOps
      runtime state — whose state catzc reads only.
    realized_by: { kind: prose-only }
    contrasts:
      adjacent store:
        An adjacent store is driven one way from the trunk's pipelines, such as the Azure DevOps configuration; a fact source is owned by a
        state machine and only read, such as the Azure DevOps runtime state.
      state machine: A state machine is the application that owns and changes a fact source; a fact source is the store catzc reads.
  state machine:
    key: state_machine
    domain: thesis
    defined_by: ADR-THES-STORES-STATEMACHINE
    short:
      An application that owns fact sources and changes their state by its own rules, met by catzc only at a junction, inbound or outbound.
    realized_by: { kind: prose-only }
    contrasts:
      fact source: A fact source is the store catzc reads; a state machine is the application that owns and changes it.
  actionable fact:
    key: actionable_fact
    domain: thesis
    defined_by: ADR-THES-STORES-RECONCILEFACTS
    short:
      A fact found by synchronising truth stores that is verifiable, naming the store, address, and moment it was read, and names the one
      change or report it calls for.
    realized_by: { kind: prose-only }
  query surface:
    key: query_surface
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-TRUTHISQUERYABLE
    short:
      The tooling's Get-* cmdlets, each of which also emits its answer as data (JSON), through which every question about the system's state
      is answered.
    realized_by: { kind: prose-only }
  eac normal form:
    key: eac_normal_form
    domain: thesis
    defined_by: ADR-THES-NORMALFORM-ANYCODEHASNORMALFORM
    short:
      The shape in which the repository can verify any code — verifiable within its enabling constraints and uncontested by its formatters,
      tests, and asserts.
    realized_by: { kind: prose-only }
    contrasts:
      repository normal form:
        The repository normal form is the one language-neutral spelling of a name; the eac normal form is the verifiable shape of a whole
        piece of code.
    avoid:
      - { phrase: "eac's normal form", say: "eac normal form (catzc's own term, not the sibling eac repository's form; ADR-REPO-INSPIRE)" }
  unordered code fragment:
    key: unordered_code_fragment
    domain: thesis
    defined_by: ADR-THES-NORMALFORM-ANYCODEHASNORMALFORM
    short: Code from outside the trunk, in whatever shape its origin left it, that is not yet in eac normal form and decides nothing.
    realized_by: { kind: prose-only }
  enabling constraints:
    key: enabling_constraints
    domain: thesis
    defined_by: ADR-THES-NORMALFORM-ENABLINGCONSTRAINTS
    short: What a repository declares about itself — the sensible defaults, the catzc bundle, and the local configs — and nothing else.
    realized_by: { kind: prose-only }
  uncontested:
    key: uncontested
    domain: thesis
    defined_by: ADR-THES-NORMALFORM-UNCONTESTED
    short: Of code, left unchanged by every formatter and failed by no test or assert of the repository; the fixed point of its checks.
    realized_by: { kind: prose-only }
  fragment migration:
    key: fragment_migration
    domain: thesis
    defined_by: ADR-THES-NORMALFORM-MIGRATIONREACHESTHEFORM
    short: Bringing an unordered code fragment into eac normal form through the one change process.
    realized_by: { kind: prose-only }
  product mono-repository:
    key: product_mono_repository
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      One repository that several teams contribute to for one product, bounded into tracks and deployable-units by path filters; catzc is
      one.
    realized_by: { kind: prose-only }
    contrasts:
      trunk:
        The trunk is the one mainline of a product mono-repository, where everything is at HEAD; the product mono-repository is the
        repository as a whole, with its tracks and deployable-units.
  trunk:
    key: trunk
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      The one mainline of a product mono-repository, where everything is at HEAD — no internal versions, and a shared change lands in one
      commit with all its consumers.
    realized_by: { kind: prose-only }
    contrasts:
      product mono-repository:
        A product mono-repository is the repository as a whole, with its tracks and deployable-units; the trunk is its one mainline.
      pin: A pin is an explicit version at the repository boundary; inside the trunk nothing is pinned, and everything is at HEAD.
  pin:
    key: pin
    domain: thesis
    defined_by: ADR-THES-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      An explicit version, controlled by the consumer, of a dependency that crosses the repository boundary inward, stitched into an
      immutable artifact at build time.
    realized_by: { kind: prose-only }
    contrasts:
      trunk: Inside the trunk everything is at HEAD, with no version; a pin is the one form of synchronisation, at the repository boundary.
      provided contract:
        A provided contract is the promise catzc keeps to a consumer; a pin is the consumer's explicit choice of the version that promise
        holds for.
  config contribution:
    key: config_contribution
    domain: configuration
    defined_by: ADR-CONF-MDCONTRIB-CONFIGCONTRIBUTION
    short:
      One config value, a key path and its value, that an author states in the config part of a tracked Markdown file's meta block and that
      the config reader gathers into the config that opted in to it.
    realized_by: { kind: prose-only }
  meta block:
    key: meta_block
    domain: repository
    defined_by: ADR-REPO-FILEMETA-HEADPOLICY
    short:
      The facts the tooling owns about one tracked file, written into the file's carrier, which is the reserved front-matter key catzc of a
      Markdown file, at the top level or nested at the key path its carrier declares, or the meta head of a code file.
    realized_by: { kind: prose-only }
    contrasts:
      meta kind: The meta block is the block in one file; a meta kind is the registry entry that says what goes in that block across files.
      meta head: The meta block is the facts in any file; the meta head is the form they take in a code file.
  meta kind:
    key: meta_kind
    domain: repository
    defined_by: ADR-REPO-FILEMETA-METAKIND
    short:
      One entry of the meta-kind registry, naming a kind of derived fact imprinted into files, or of config contribution gathered out of
      Markdown files, with the files it applies to, the keys it owns and, for a gather kind, the config it feeds.
    realized_by: { kind: prose-only }
    contrasts:
      meta block: The meta block is the block in one file; a meta kind is the registry entry that says what goes in that block across files.
      role: A role is the part one file plays; a meta kind is a registry entry that says which derived fact goes into a head.
  meta head:
    key: meta_head
    domain: repository
    defined_by: ADR-REPO-CODEMETA-CODEFILEHEAD
    short:
      The leading comment of a code file, whose text is a front matter document with the catzc block, that holds the file's derived facts,
      so it is the form a meta block takes in a C# or PowerShell file.
    realized_by: { kind: prose-only }
    contrasts:
      meta block: The meta block is the facts in any file; the meta head is the form they take in a code file.
      materialization:
        Materialization says when a resource comes into being and how long it holds; a meta head is where a generated file shows its commit
        key, body_sha.
  materialization:
    key: materialization
    domain: automation
    defined_by: ADR-AUTO-MATERIAL-MATERIALIZATION
    short:
      When a knowledge resource comes into being and how long it holds, on-demand (made when asked, held for the call or the session) or
      commit (made at commit, keyed by the scoped sha of its inputs, never changing).
    realized_by: { kind: prose-only }
    contrasts:
      meta head:
        A meta head is the leading comment that holds a file's facts; materialization is the property of a resource that a generated file's
        body_sha makes visible there.
    avoid:
      - { phrase: cached at commit, say: a commit resource }
      - { phrase: materialized view, say: a commit resource }
  place facts:
    key: place_facts
    domain: repository
    defined_by: ADR-REPO-FILEMETA-FILEISNODE
    short:
      The facts under the immutable part of a meta block, which are what the repository's own configuration makes of a file's location, such
      as its path, kind, language, track and module, each read from a registry and never from the file's text.
    realized_by: { kind: prose-only }
    contrasts:
      edge:
        The place facts are properties of the file as a node, read from the repository's configuration; an edge is a named relation leaving
        the file, read from its text.
  edge:
    key: meta_edge
    domain: repository
    defined_by: ADR-REPO-FILEMETA-FILEISNODE
    short:
      One named relation under the edges part of a meta block, from the file to a rule code, a file or a URL, such as defines, cites, links,
      page or test, written on its source only.
    realized_by: { kind: prose-only }
    contrasts:
      place facts:
        An edge is a named relation leaving the file, read from its text; the place facts are properties of the file as a node, read from
        the repository's configuration.
  role:
    key: file_role
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short:
      The part a file plays, such as a test, a function, a config or a decision record, named by the file-kinds registry and never by the
      file's language, track or module.
    realized_by: { kind: prose-only }
    contrasts:
      meta kind: A meta kind is a registry entry that says which derived fact goes into a head; a role is the part one file plays.
      file language: A file language is the sort of text a file holds, named by its extension; a role is what the file is for.
      track: A track is the cluster a file lives in; a role is the part it plays, wherever it lives.
      track type: A track type is the sort of cluster a file lives in; a role is the part the file plays, wherever it lives.
      subkind: A subkind is one narrower role under a role, and a file has at most one; a role is the part itself.
      file type: A file type is how a file's name ends; a role is the part the file plays.
  subkind:
    key: file_subkind
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short: The narrowing of a role, such as a gate among the functions, written under its role in the file-kinds registry.
    realized_by: { kind: prose-only }
    contrasts:
      role: A role is the part a file plays; a subkind is one narrower role under it, and a file has at most one.
      file type: A file type is how a file's name ends; a subkind is a narrower role, whatever the name.
  file type:
    key: file_type
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short: The extension of a file's name, which tells the sorts of file inside one language apart, such as ps1 from psm1 and psd1.
    realized_by: { kind: prose-only }
    contrasts:
      file language: A file language groups the extensions of one kind of text; a file type is the single extension of one file.
      role: A role is the part a file plays; a file type is how its name ends.
      subkind: A subkind is a narrower role, whatever the name; a file type is how a file's name ends.
  staging slot:
    key: staging_slot
    domain: design
    defined_by: ADR-FLOW-CD-LIFE-ONECOMMITPERENVIRONMENT
    short:
      The pre-prod rung: a slot inside the production subscription, inactive until it is activated, never a separate subscription.
    realized_by: { kind: prose-only }
  module type:
    key: module_type
    domain: design
    defined_by: ADR-DSGN-MODTYPE-MODULETYPEISSORT
    short:
      The sort of module, named by the module-types registry, which says where modules of each type are found and how a path in that place
      names its module.
    realized_by: { kind: prose-only }
    contrasts:
      track:
        A track is the cluster of module contents and the concern it holds; a module type is the sort of module found at a place inside or
        across tracks.
      track type: A track type is the sort of cluster a track is; a module type is the sort of module placed in it.
      module: A module is one named unit placed in a track; a module type is the sort of module found at a place, one of a closed set.
      layout: A layout says what a module's own folders hold; a module type says where modules of a sort are found.
  bundle:
    key: bundle
    domain: automation
    defined_by: ADR-AUTO-BUNDLE-BUNDLEISBUILD
    short: The toolset's build, one installable, versioned Catzc package of one named bundle, built from a profile of the exporter registry.
    realized_by: { kind: prose-only }
    contrasts:
      deployable-unit:
        A deployable-unit is what ships from the mono-repository, composed from a whole track or part of one; a bundle is one build of the
        toolset.
  imprint step:
    key: imprint_step
    domain: repository
    defined_by: ADR-REPO-FORMAT-CONFIGUREDFORMATTERS
    short:
      A step the file-language registry lists under imprint, global or for one language, which Format-Code runs after the formatter to write
      one derived fact into the file.
    realized_by: { kind: prose-only }
  catzc:
    key: catzc
    domain: principles
    defined_by: ADR-PRIN-CATS-CATZCISSOURCENAME
    short:
      The source-level name of the system — the Catzc.* module prefix, the C# namespaces, the type-accelerator prefix, and the product token
      in code and precise references.
    realized_by: { kind: prose-only }
    avoid:
      - { phrase: .cats folder, say: .catzc/ }
    contrasts:
      cats: cats is the same system named to a person; catzc is its name to code and to the facts the tooling writes.
  cats:
    key: cats
    domain: principles
    defined_by: ADR-PRIN-CATS-CATSISPERSONNAME
    short: The product's name to a person — the executor outside pwsh, and the word in prose, docs and conversation.
    realized_by: { kind: prose-only }
    contrasts:
      catzc: catzc is the source-level name every module, namespace and path carries; cats is the friendly form a person reads and says.
  automation:
    key: automation
    domain: automation
    defined_by: ADR-AUTO-LAYERS-AUTOMATIONISABSTRACT
    short:
      The abstract, the commands and behaviours the repository offers and the doctrine that governs them, independent of language, shell and
      folder; the ADR domain, the value-chain row and the concern carry the name.
    realized_by: { kind: prose-only }
    contrasts:
      importer: The importer brings a mix of languages, engines and modules into a session; automation is what the loaded modules offer.
    avoid:
      - { phrase: automation folder, say: the pwsh track folder (pwsh/) }
      - { phrase: automation track, say: pwsh track }
      - { phrase: automation modules, say: pwsh modules / catzc modules }
      - { phrase: automation layer, say: automation (the abstract) / the pwsh modules (the code) }
      - { phrase: PowerShell automation, say: pwsh modules / PowerShell code }
  command:
    key: command
    domain: automation
    defined_by: ADR-AUTO-LAYERS-COMMANDISPUBLICFUNCTION
    short: One public function of the module system, the unit a contract describes, written in one implementation language.
    realized_by: { kind: prose-only }
    contrasts:
      command contract:
        A command contract is the asset that states a command's call interface at the boundary; the command is the function that implements
        it.
  command contract:
    key: command_contract
    domain: repository
    defined_by: ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    short:
      A provided contract asset, `<module>/<Verb-Noun>.command.yml` in a unit's version folder, that states one command's call interface in
      the contract language; a command is public exactly when one names it.
    realized_by: { kind: prose-only }
    contrasts:
      command: A command is the function that implements the interface; a command contract is the asset that states it at the boundary.
      contract asset:
        A contract asset is any file of the five kinds; a command contract is the kind that states a command's call interface and is
        compared with the command's source.
  contract language:
    key: contract_language
    domain: repository
    defined_by: ADR-REPO-CMDCONTRACT-CONTRACTLANGUAGE
    short:
      The notation a command contract is written in — YAML with one string per parameter (type, mandatory, default, pipeline) and an output
      type, over a closed type set whose defaults are declared once on the ContractCommand type.
    realized_by: { kind: type, pattern: "Catzc.Base.Contracts.ContractCommand" }
    contrasts:
      implementation language:
        An implementation language is the file language a command's source is written in; the contract language is the notation its call
        interface is stated in.
      file language:
        A file language is the kind of text a file holds, named by its extension; the contract language is a notation inside one YAML file,
        not a file language of its own.
  implementation language:
    key: implementation_language
    domain: automation
    defined_by: ADR-AUTO-LAYERS-COMMANDISPUBLICFUNCTION
    short:
      The file language a command's source is written in, one whose languages.yml entry sets executable, which are PowerShell with its
      hosted C#, Bash, Python and Go.
    realized_by: { kind: prose-only }
    contrasts:
      file language:
        A file language is any language the registry names by extension; an implementation language is one a command is written in.
      contract language:
        The contract language is the notation a command's call interface is stated in; an implementation language is the file language the
        command's source is written in.
    avoid:
      - { phrase: automation language, say: implementation language }
  pwsh:
    key: pwsh
    domain: automation
    defined_by: ADR-AUTO-LAYERS-TOOLSRUNTHROUGHENGINE
    short: The name of the PowerShell track and of the engine that runs it; the PowerShell product itself is called PowerShell in prose.
    realized_by: { kind: prose-only }
    contrasts:
      execution engine: pwsh is one of the three execution engines, and the name the PowerShell track takes from it.
  run mode:
    key: run_mode
    domain: design
    defined_by: ADR-DSGN-RUNMODE-TWORUNMODES
    short: How the toolset is loaded, source mode from a repository root or build mode from a built package; exactly two exist.
    realized_by: { kind: prose-only }
    contrasts:
      importer: The importer decides which modules, languages and engines a session loads; a run mode says where it reads the modules from.
