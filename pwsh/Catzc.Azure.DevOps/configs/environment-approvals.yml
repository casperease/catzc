approver_group:
  name: Prod Approvers
  members:
    - prod-approver@example.com
timeout_hours: 24
# Each unit's release-gate rungs carry the RC and RBC checks: `<unit>-<rung>` for the rungs the rungs registry puts behind rc and rbc.
units:
  - shared
  - apex
  - nova
  - flux
# The prod tier is named by its deploy target (the subscription or the configuration slot), not by a rung, so it is listed here.
prod_environments:
  - shared-psub
  - apex-psub
  - apex-prod
