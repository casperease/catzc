# Prettier configuration — the markdown formatter for this repo (esbenp.prettier-vscode is the
# [markdown] formatter in .vscode/settings.json; Format-Code runs the same engine).
#
# proseWrap: always makes the formatter OWN line length — it wraps prose at printWidth so Markdown
# satisfies markdownlint MD013. Build-WidthConfigs fills printWidth, MD013 and .editorconfig's [*.md]
# max_line_length from the one prose width in file-limits.yml.
#
# .yml (not .yaml) per pipeline-concept
# [FDR-PIPELINE-EXECUTABLEYAMLEXTENSION](/docs/drs/flow/pipeline-concept.md#rule-fdr-pipeline-executableyamlextension) — config
# data our tooling reads, not an executable
# ADO pipeline. Prettier auto-discovers .prettierrc.yml.
printWidth: $width.md
proseWrap: always
# Bicep reads its config as JSON with comments, so the generated head of bicepconfig.json survives the formatter as it does in jsconfig.json.
overrides:
  - files: "**/bicepconfig.json"
    options:
      parser: jsonc
