version: "0.2"
language: en,en-GB
# This is the repository's ONE spelling config: the root cspell.yml is rendered from this template by New-Cspell (see rootconfig.yml).
# Never search for per-folder configs: without this flag cspell would treat a sibling cspell config as the nearest config and resolve
# the ./.cspell/ dictionary paths relative to the wrong folder.
noConfigSearch: true
ignorePaths:
  - .git/**
  - "{{third-party}}"
  - "**/types/.compiled/**"
  # Per-slot template configs hold Azure resource names assembled by the naming convention, one run-together token each for
  # env, region, org, template, customer and type. They are data, not vocabulary
  # ([ADR-AUTO-SPELL-IDENTIFIERSNOTDATA](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-identifiersnotdata)), written
  # statically per slot ([ADR-AZ-DATAMOD-STATICRESOURCENAMES](/docs/drs/azure/azure-data-model.md#rule-adr-az-datamod-staticresourcenames)),
  # so the spelling gate and the editor both skip them here, once.
  - infrastructure/templates/**/configuration/**
  # MSBuild output of the IDE-only C# project and the hooks — transient, gitignored, never authored.
  - "**/obj/**"
  - "**/bin/**"
  # The output directory, the unordered track and the editor's notes are never the repository's vocabulary;
  # READMEs, the decision-record index and the glossary are generated from sources that are checked
  # ([ADR-REPO-README-AUTHOREDSOURCES](/docs/drs/repository/generated-readmes.md#rule-adr-repo-readme-authoredsources)).
  # Test-Spelling and the terminology corpus both read this one list.
  - out/**
  - docs/notes/**
  - .unordered/**
  - "**/README.md"
  - docs/drs/index.md
  - docs/drs/glossary.md
  - cspell.yml
  - "**/*.dll"
  - "**/*.pdb"
  - "**/*.p7s"
  - "**/*.exe"
  - "**/*.png"
  - "**/*.pdf"
# GUID literals are not words: the managed-GUID gate (Catzc.Base.QualityGates configs/guids.yml,
# Get-RepositoryGuids) is their single owner, so cspell never tokenizes their hex fragments. One gate owns
# words, one owns GUIDs. A PowerShell escape (`n, `r, `t) glued to the word after it is no part of that word:
# a backtick that does not open a Markdown code span (line start, space, bracket, emphasis, table pipe before it) is an escape.
ignoreRegExpList:
  - /\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b/g
  - /(?<![\s(\[*_>|/,]|^)`[nrt](?=[a-z])/gm
  # A scratch path under out/ is a name, not words: a drone's folder tag never needs a dictionary entry.
  - /(?<![\w./-])out\/[\w./-]+/g
# Approved-vocabulary dictionaries — one per registry category
# ([ADR-AUTO-SPELL-CATEGORYANDMEANING](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-categoryandmeaning)) — generated from
# the terminology registry (pwsh/Base.QualityGates/configs/terminology/) by Build-TerminologyDictionary. The
# .cspell/<category>.txt lists are GITIGNORED and regenerated at the importer tail (the registry is the
# single source of truth), so run `. ./importer.ps1` once on a fresh clone before cspell can resolve them.
# Never hand-edit the lists; add or remove vocabulary in the registry. See .cspell/README.md and
# [ADR-AUTO-SPELL](/docs/drs/automation/spell-out-names.md)
# ([ADR-AUTO-SPELL-ONEVOCABULARYSOURCE](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-onevocabularysource) and
# [ADR-AUTO-SPELL-LIVEVOCABULARYONLY](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-livevocabularyonly)).
#
# ONE definition + dictionary entry per registry category. This list must match the `categories:` keys in
# terminology.yml — adding a category means adding it in both places (cspell.yml cannot read the registry).
dictionaryDefinitions:
  - name: catzc-terms-product
    path: ./.cspell/product.txt
  - name: catzc-terms-abbreviation
    path: ./.cspell/abbreviation.txt
  - name: catzc-terms-fixture
    path: ./.cspell/fixture.txt
  - name: catzc-terms-azure-live
    path: ./.cspell/azure-live.txt
  - name: catzc-terms-rule-code-example
    path: ./.cspell/rule-code-example.txt
  - name: catzc-terms-rule-code
    path: ./.cspell/rule-code.txt
  # Every segment of every rule code and rule heading, generated from the DRS registry by Build-DrsCodeDictionary.
  - name: catzc-drs-codes
    path: ./.cspell/drs-codes.txt
  - name: catzc-terms-ado
    path: ./.cspell/ado.txt
  - name: catzc-terms-azure
    path: ./.cspell/azure.txt
  - name: catzc-terms-tool
    path: ./.cspell/tool.txt
  - name: catzc-terms-platform
    path: ./.cspell/platform.txt
  - name: catzc-terms-powershell
    path: ./.cspell/powershell.txt
  - name: catzc-terms-coined
    path: ./.cspell/coined.txt
  - name: catzc-terms-person
    path: ./.cspell/person.txt
dictionaries:
  - catzc-terms-product
  - catzc-terms-abbreviation
  - catzc-terms-fixture
  - catzc-terms-azure-live
  - catzc-terms-rule-code-example
  - catzc-terms-rule-code
  - catzc-drs-codes
  - catzc-terms-ado
  - catzc-terms-azure
  - catzc-terms-tool
  - catzc-terms-platform
  - catzc-terms-powershell
  - catzc-terms-coined
  - catzc-terms-person
languageSettings:
  - languageId: powershell
    dictionaries:
      # cspell's built-in PowerShell dictionary. The conventional-abbreviation allow-list
      # ([ADR-AUTO-SPELL-ALLOWEDABBREVIATIONS](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-allowedabbreviations) — cfg, ctx,
      # cmd, repo, …) and all other approved vocabulary live in terminology.yml (single source,
      # [ADR-AUTO-SPELL-ONEVOCABULARYSOURCE](/docs/drs/automation/spell-out-names.md#rule-adr-auto-spell-onevocabularysource)),
      # generated into the .cspell/*.txt dictionaries this config loads globally — never inline here.
      - powershell
  - languageId: markdown
    dictionaries:
      - powershell
      - csharp
      - dotnet
  - languageId: csharp
    dictionaries:
      - csharp
      - dotnet
    words:
      - slnx
