# What the types system writes (Get-GeneratedTarget reads every module's generated.yml): the combined types build, the IDE-only
# project's build output, and the compiled agent hooks.
targets:
  - { path: pwsh/.compiled/**, generator: Catzc.Internal.Loader }
  - { path: pwsh/.internal/assets/bin/**, generator: dotnet build }
  - { path: pwsh/.internal/assets/obj/**, generator: dotnet build }
  - { path: .claude/hooks/bin/**, generator: Build-AgentHook }
  - { path: ".claude/hooks/*/bin/**", generator: Build-AgentHook }
  - { path: ".claude/hooks/*/obj/**", generator: Build-AgentHook }
