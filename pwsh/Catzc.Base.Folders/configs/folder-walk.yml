# Every key is optional: an omitted key takes the default declared once on FolderWalkConfig, and a Get-ChildPath parameter overrides it.

# Read anywhere as global.folder-walk.prune_vendor_in_searches. When true, a search never enters the .vendor folder.
prune_vendor_in_searches: true

# Replaces the default list, never extends it: a pruned name is skipped at every depth, so a tool cache inside a module is never walked.
exclude: [.git, node_modules, out, .terraform, .ruff_cache, .venv]
