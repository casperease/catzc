# The placeholder every devbox build carries, obviously no real number; a rebuild overwrites it in place, and a pipeline never uses it.
direct_install_version: 6.6.666

# Each bundle is a release identity of its own: a mono repo, so no bundle's version moves another's.
bundles:
  full:
    profile: full
    version: "0.1"
    max_files: 480
    max_bytes: 6800000
  azure:
    profile: azure
    version: "0.1"
    max_files: 460
    max_bytes: 6700000
  minimal:
    profile: minimal
    version: "0.1"
    max_files: 290
    max_bytes: 2950000
default_bundle: full

# Package identity, written into the build's top-level Catzc.psd1, the manifest Install-PSResource and the Gallery read.
module_guid: 211b36c7-f7eb-4f3c-93f5-9132b535fa56
package:
  author: Casper Leon Nielsen
  company: Catzc
  description: Catzc (cats) — a zero-ceremony PowerShell 7 module system, packaged as an installable, content-addressed bundle.
  tags:
    - catzc
    - cats
    - powershell
    - automation
    - module-system
    - azure
    - azure devops
    - azure cli
    - azure bicep
    - azure infrastructure templates
  project_uri: https://github.com/casperease/catzc
  license_uri: https://github.com/casperease/catzc/blob/main/LICENSE
