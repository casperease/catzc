executables:
  pwsh: 360 # isolated test runs (Test-InIsolation) and snapshot imports — a full snapshot run takes about 250 s
  dotnet: 600 # builds
  npm: 600 # package installs
  npx: 600 # first-run package fetches
  uv: 600 # Python toolchain and package installs
  poetry: 600 # dependency resolution and installs
  python: 600 # arbitrary scripts
  pyspark: 3600 # interactive sessions
  java: 600 # arbitrary programs
  terraform: 1800 # plan / apply
  az: 1800 # deployments
  winget: 1800 # installs
  brew: 1800 # installs
  sudo: 1800 # system package installs
  tar: 300 # archive extraction
  gh: 120 # API calls over the network
  cspell: 120 # whole-repo spell check: 6.4 s alone, killed at 10 s under the parallel test load (probe 2026-10-14)
  prettier: 120 # whole-repo format check: 4.4 s alone, near the default under load
  markdownlint-cli2: 120 # whole-repo lint: 2.1 s alone, kept clear of the default under load
  bash: 1800 # Linux/macOS install scripts (dotnet-install.sh downloads the SDK)
  dpkg: 600 # Linux package removal
  go: 900 # module downloads, go vet and go test runs: the first compile of the Go runtime alone takes over 9 s
tests:
  engine_start_seconds: 150 # one engine start of a black-box test (import plus one command): two starts and a margin stay under pwsh's 360
  run_list_seconds: 300 # one run of a run list under one engine: an engine start and its few commands, under pwsh's 360
  run_lock_seconds: 120 # the wait for the machine's run lock (Invoke-CatzcCommand): a run that cannot take it stops inside bash's 360
