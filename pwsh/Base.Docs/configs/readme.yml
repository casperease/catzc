# A matched module folder's README is its module article, the page comment-pages.yml derives for it.
patterns:
  - glob: pwsh/*
  - glob: python/*
without_article:
  - folder: python/tests
    reason: the python test packages' tree; a test is documented by the module it tests, so the tree ships no package and needs no README
mappings:
  # The ADR folder's README comes from its own index, same folder, so its relative links need no rebasing (ADR-REPO-README-WORKINGLINKS).
  - folder: docs/drs
    source: docs/drs/index.md
  - folder: .ado/pipelines
    source: docs/references/ado/pipelines.md
  - folder: infrastructure
    source: docs/references/infrastructure/overview.md
  - folder: infrastructure/modules
    source: docs/references/infrastructure/modules.md
  - folder: infrastructure/templates/foundation
    source: docs/references/infrastructure/foundation.md
  - folder: infrastructure/templates/discovery
    source: docs/references/infrastructure/discovery.md
  - folder: infrastructure/templates/expedition
    source: docs/references/infrastructure/expedition.md
  - folder: out
    source: docs/references/out.md
  - folder: .cspell
    source: docs/references/cspell.md
  - folder: contracts
    source: docs/references/contracts.md
  - folder: .ado/pipelines/jobs
    source: docs/references/ado/pipelines/template-folders.md
  - folder: .ado/pipelines/stages
    source: docs/references/ado/pipelines/template-folders.md
  - folder: .ado/pipelines/variables
    source: docs/references/ado/pipelines/template-folders.md
