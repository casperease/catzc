# The roofs Test-AgentDefinitions holds every robot and capability under; the defaults are declared once on AgentsConfig.
roofs:
  agent_body_lines: 20
  capability_lines: 30
# The contracts every robot and capability names under `contracts` in its front matter and reads first.
contracts: [ADR-REPO-AI]

agents:
  # A drone on haiku: runs one job skill a brief names, the skills whose model_floor is haiku.
  - name: drone-haiku
    supported_by: [ADR-REPO-AGENTS-STANDARDDRONE, PDR-REDUCEVAR-EXPLICITDIFFERENCES, WDR-BUILTIN-GATESAREPARTOFWORK]
    checks: [Invoke-TestFile, Format-Code, Test-Links]

  # A drone on sonnet: runs one job skill a brief names, the skills whose model_floor is sonnet.
  - name: drone-sonnet
    model_reason: runs the job skills whose model_floor is sonnet, the jobs that write code or docs that must pass the gates first time
    supported_by: [ADR-REPO-AGENTS-STANDARDDRONE, PDR-REDUCEVAR-EXPLICITDIFFERENCES, WDR-BUILTIN-GATESAREPARTOFWORK]
    checks: [Invoke-TestFile, Format-Code, Test-Links]

  # A drone on opus: runs one job skill a brief names, the skills whose model_floor is opus.
  - name: drone-opus
    model_reason: runs the job skills whose model_floor is opus, the jobs that judge evidence across the whole tree
    supported_by: [ADR-REPO-AGENTS-STANDARDDRONE, PDR-REDUCEVAR-EXPLICITDIFFERENCES, WDR-BUILTIN-GATESAREPARTOFWORK]
    checks: [Invoke-TestFile, Format-Code, Test-Links]

  # A drone on fable: runs one job skill a brief names, the skills whose model_floor is fable.
  - name: drone-fable
    model_reason: runs the job skills whose model_floor is fable, the hardest reasoning a brief can hand over
    supported_by: [ADR-REPO-AGENTS-STANDARDDRONE, PDR-REDUCEVAR-EXPLICITDIFFERENCES, WDR-BUILTIN-GATESAREPARTOFWORK]
    checks: [Invoke-TestFile, Format-Code, Test-Links]
