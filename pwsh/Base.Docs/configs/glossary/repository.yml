concepts:
  domain rules:
    key: domain_rules
    domain: repository
    defined_by: ADR-REPO-VOCAB-DOMAINRULES
    short: The repository's conventions and its decision records and the rules they state.
    realized_by: { kind: prose-only }
    avoid:
      - { phrase: house rules, say: domain rules / DRS rules }
  decision records system:
    key: drs
    domain: repository
    defined_by: ADR-REPO-DRSCODE-DECISIONRECORDSSYSTEM
    short: "The DRS: the one system that holds every decision record, its index and its registry, under docs/drs/."
    realized_by: { kind: prose-only }
  decision record:
    key: decision_record
    domain: repository
    defined_by: ADR-REPO-DRSCODE-DECISIONRECORDSSYSTEM
    short: "One record of the DRS, of exactly one registered record kind, stating its rules and why."
    realized_by: { kind: prose-only }
  record kind:
    key: record_kind
    domain: repository
    defined_by: ADR-REPO-DRSCODE-DECISIONRECORDSSYSTEM
    short:
      "The first segment of a decision record code (ADR, TDR, PDR, WDR, DDR, FDR or EDR), registered in drs.yml; together the XDR kinds."
    realized_by: { kind: prose-only }
  workstream:
    key: workstream
    domain: repository
    defined_by: ADR-REPO-OUTDIR-PLANNOTES
    short:
      One labeled section of a plan's work breakdown (`.claude/plans/plan-*.md`) — its own `### W<n>:` heading, order, and gate — that lands as one
      change.
    realized_by: { kind: prose-only }
  robot:
    key: robot
    domain: repository
    defined_by: ADR-REPO-AGENTS-ROBOTBODYLIMIT
    short:
      A sub-agent in its minimal form — a body of at most the roof's lines on a named model, loading shared know-how from capabilities
      instead of carrying it.
    realized_by: { kind: prose-only }
  capability:
    key: capability
    domain: repository
    defined_by: ADR-REPO-AGENTS-CAPABILITYFILE
    short:
      One `.claude/skills/<domain>-<job>/SKILL.md` file a robot preloads through its `skills` list — at most the roof's lines, with a model
      floor declared once in its metadata.
    realized_by: { kind: prose-only }
  model floor:
    key: model_floor
    domain: repository
    defined_by: ADR-REPO-AGENTS-NAMEDMODEL
    short: The lowest model that performs a capability's steps reliably; no robot that preloads the capability runs below it.
    realized_by: { kind: prose-only }
  domain:
    key: domain
    domain: repository
    defined_by: ADR-REPO-FOLDERS-DOCSMARKDOWNONLY
    short: A group of decision records — one docs/drs/ subfolder — that drs.yml declares with its role and the domains it depends on.
    realized_by: { kind: prose-only }
    forms:
      [
        DRS,
        record,
        thesis,
        principles,
        process,
        design,
        flow,
        automation,
        bcl,
        pwsh,
        configuration,
        ado,
        github,
        azure,
        repository,
        research,
        axioms,
        architecture,
        implementation,
        optimisable,
        owning,
      ]
    avoid:
      - { phrase: problem domain, say: the problem catzc solves }
    contrasts:
      language zone:
        A language zone is one of the design, test, and live registers of identities; a decision-record domain groups decision records.
      responsibility domain:
        A responsibility domain is what one repository is accountable for; a decision-record domain groups decision records.
  language zone:
    key: language_zone
    domain: repository
    defined_by: ADR-REPO-LANG-THREEREGISTERS
    short: One of the three registers — design, test, live — each with its own terminology and identities; a token belongs to exactly one.
    realized_by: { kind: prose-only }
    # landing, dns and availability are Azure's own terms (a CAF landing zone, a private DNS zone, an availability zone), not language zones.
    forms: [language, design, test, live, landing, dns, availability]
    contrasts:
      file language:
        A file language is the kind of text one file holds, named by its extension; a language zone is a register of identities.
  source:
    key: source
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      Where something comes from, always qualified — a source mode, run, or tree; a glossary source; a type, authored, vendor, or dot
      source.
    realized_by: { kind: prose-only }
    forms:
      [
        glossary,
        type,
        authored,
        dot,
        function,
        vendor,
        catzc,
        combined,
        committed,
        shipped,
        tracked,
        fixture,
        comparison,
        primary,
        raw,
        install,
        rule,
        docs,
        derived,
        current,
        real,
        configured,
        public,
        single,
        token,
        relative,
        repo,
        authoritative,
        cross,
        vendored,
        input,
      ]
    verbs: true
    contrasts:
      source of truth:
        The source of truth is the one store that decides what is true about the delivered system, the repository; a source, always
        qualified, names where one thing comes from.
  layer:
    key: layer
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      One stratum of a structure, always qualified — one of the five layers of the automation (automation, contract, language, engine,
      importer; ADR-AUTO-LAYERS-REALISENEVERREDEFINE), or a globset layer (module, fileset).
    realized_by: { kind: prose-only }
    forms:
      [
        contract,
        language,
        engine,
        importer,
        installer,
        config,
        configuration,
        Azure,
        tooling,
        YAML,
        module,
        template,
        templating,
        vendor,
        abstraction,
        analyzer,
        compatibility,
        mapping,
        serialization,
        base,
        design,
        spelling,
        Pester,
        pip,
        path,
        support,
        doctrine,
        globset,
        fileset,
        cross,
        ADR,
        AUTO,
        shaping,
      ]
    verbs: true
    contrasts:
      facet: A facet is one of several parallel views of, or checks on, the same thing; a layer is one level of a stack.
  facet:
    key: facet
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      One of several parallel views of, or checks on, the same thing, none above another — a build facet (types, load, parity, manifest) or
      a module facet (disk, session).
    realized_by: { kind: prose-only }
    forms: [build, types, load, parity, manifest, module, disk, session, runtime]
    verbs: true
  scope:
    key: scope
    domain: repository
    defined_by: ADR-REPO-VOCAB-FAMILYFORMS
    short:
      What something reaches, always qualified — a PowerShell scope (module, script, global), an install scope (user, machine), or a
      selection scope (verify, scan, content).
    realized_by: { kind: prose-only }
    forms:
      [
        PowerShell,
        selection,
        module,
        user,
        machine,
        content,
        script,
        verify,
        shared,
        file,
        target,
        scan,
        test,
        persistent,
        category,
        global,
        process,
        Pester,
        default,
        install,
        markdown,
        repo,
        lint,
        child,
        environment,
        subscription,
        report,
        tag,
        declared,
        whole,
        top,
        strict,
        isolated,
        discovery,
        glossary,
        deployment,
        infra,
        radius,
        production,
      ]
    verbs: true
  contract:
    key: contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A binding interface at the repository boundary, held under contracts/ in either direction — provided or depended-on — and proven by
      its owning module's tests.
    realized_by: { kind: prose-only }
    contrasts:
      contract asset:
        A contract asset is one file in an owning module's folder of a unit's contracts/ version folder; a contract is the binding interface
        its assets state together.
  provided contract:
    key: provided_contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A contract an outside consumer may rely on — the repository's only public API, kept while a consumer pins that version of its unit.
    realized_by: { kind: prose-only }
    contrasts:
      depended-on contract:
        A depended-on contract is what an outside platform expects of our files and calls, and it follows that platform; a provided contract
        is a promise to a consumer, kept while the consumer pins that version of its unit.
      pin:
        A pin is the consumer's explicit choice of a version that crosses the repository boundary; a provided contract is the promise catzc
        keeps under that pin.
  depended-on contract:
    key: depended_on_contract
    domain: repository
    defined_by: ADR-REPO-CONTRACT-BINDINGINTERFACE
    short:
      A contract an outside platform expects of our files and calls, such as GitHub reading a workflow file; it follows the platform, so a
      platform change is a new draft.
    realized_by: { kind: prose-only }
  contract asset:
    key: contract_asset
    domain: repository
    defined_by: ADR-REPO-CONTRACT-CONTRACTASSET
    short:
      One file in an owning module's folder of a unit's contracts/ version folder, whose path names the real file it constrains and whose
      name picks its kind — a fragment, a schema, a sample payload, or a command contract.
    realized_by: { kind: prose-only }
    contrasts:
      command contract:
        A command contract is the one asset kind that states a command's call interface and is compared with the command's source; a
        contract asset is any file of the five kinds.
      published artifact:
        A published artifact is a file one stage produces and a later stage consumes within a run; a contract asset is a checked-in file
        that states what the repository boundary requires, frozen with its unit's release.
  meta block:
    key: meta_block
    domain: repository
    defined_by: ADR-REPO-FILEMETA-HEADPOLICY
    short:
      The facts the tooling owns about one tracked file, written into the file's carrier, which is the reserved front-matter key catzc of a
      Markdown file, at the top level or nested at the key path its carrier declares, or the meta head of a code file.
    realized_by: { kind: prose-only }
    contrasts:
      meta kind: The meta block is the block in one file; a meta kind is the registry entry that says what goes in that block across files.
      meta head: The meta block is the facts in any file; the meta head is the form they take in a code file.
  meta kind:
    key: meta_kind
    domain: repository
    defined_by: ADR-REPO-FILEMETA-METAKIND
    short:
      One entry of the meta-kind registry, naming a kind of derived fact imprinted into files, or of config contribution gathered out of
      Markdown files, with the files it applies to, the keys it owns and, for a gather kind, the config it feeds.
    realized_by: { kind: prose-only }
    contrasts:
      role: A role is the part one file plays; a meta kind is a registry entry that says which derived fact goes into a head.
  meta head:
    key: meta_head
    domain: repository
    defined_by: ADR-REPO-CODEMETA-CODEFILEHEAD
    short:
      The leading comment of a code file, whose text is a front matter document with the catzc block, that holds the file's derived facts,
      so it is the form a meta block takes in a C# or PowerShell file.
    realized_by: { kind: prose-only }
    contrasts:
      materialization:
        Materialization says when a resource comes into being and how long it holds; a meta head is where a generated file shows its commit
        key, body_sha.
  place facts:
    key: place_facts
    domain: repository
    defined_by: ADR-REPO-FILEMETA-FILEISNODE
    short:
      The facts under the immutable part of a meta block, which are what the repository's own configuration makes of a file's location, such
      as its path, kind, language, track and module, each read from a registry and never from the file's text.
    realized_by: { kind: prose-only }
    contrasts:
      edge:
        The place facts are properties of the file as a node, read from the repository's configuration; an edge is a named relation leaving
        the file, read from its text.
  edge:
    key: meta_edge
    domain: repository
    defined_by: ADR-REPO-FILEMETA-FILEISNODE
    short:
      One named relation under the edges part of a meta block, from the file to a rule code, a file or a URL, such as defines, cites, links,
      page or test, written on its source only.
    realized_by: { kind: prose-only }
  role:
    key: file_role
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short:
      The part a file plays, such as a test, a function, a config or a decision record, named by the file-kinds registry and never by the
      file's language, track or module.
    realized_by: { kind: prose-only }
    contrasts:
      file language: A file language is the sort of text a file holds, named by its extension; a role is what the file is for.
      track: A track is the cluster a file lives in; a role is the part it plays, wherever it lives.
      track type: A track type is the sort of cluster a file lives in; a role is the part the file plays, wherever it lives.
      subkind: A subkind is one narrower role under a role, and a file has at most one; a role is the part itself.
      file type: A file type is how a file's name ends; a role is the part the file plays.
  subkind:
    key: file_subkind
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short: The narrowing of a role, such as a gate among the functions, written under its role in the file-kinds registry.
    realized_by: { kind: prose-only }
    contrasts:
      file type: A file type is how a file's name ends; a subkind is a narrower role, whatever the name.
  file type:
    key: file_type
    domain: repository
    defined_by: ADR-REPO-FILEMETA-ROLE
    short: The extension of a file's name, which tells the sorts of file inside one language apart, such as ps1 from psm1 and psd1.
    realized_by: { kind: prose-only }
    contrasts:
      file language: A file language groups the extensions of one kind of text; a file type is the single extension of one file.
  imprint step:
    key: imprint_step
    domain: repository
    defined_by: ADR-REPO-FORMAT-CONFIGUREDFORMATTERS
    short:
      A step the file-language registry lists under imprint, global or for one language, which Format-Code runs after the formatter to write
      one derived fact into the file.
    realized_by: { kind: prose-only }
  command contract:
    key: command_contract
    domain: repository
    defined_by: ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    short:
      A provided contract asset, `<module>/<Verb-Noun>.command.yml` in a unit's version folder, that states one command's call interface in
      the contract language; a command is public exactly when one names it.
    realized_by: { kind: prose-only }
  contract language:
    key: contract_language
    domain: repository
    defined_by: ADR-REPO-CMDCONTRACT-CONTRACTLANGUAGE
    short:
      The notation a command contract is written in — YAML with one string per parameter (type, mandatory, default, pipeline) and an output
      type, over a closed type set whose defaults are declared once on the ContractCommand type.
    realized_by: { kind: type, pattern: "Catzc.Base.Contracts.ContractCommand" }
    contrasts:
      implementation language:
        An implementation language is the file language a command's source is written in; the contract language is the notation its call
        interface is stated in.
      file language:
        A file language is the kind of text a file holds, named by its extension; the contract language is a notation inside one YAML file,
        not a file language of its own.
