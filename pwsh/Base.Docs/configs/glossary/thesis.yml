concepts:
  source of truth:
    key: source_of_truth
    domain: thesis
    defined_by: TDR-ONETRUTH-ONESTOREDECIDES
    short:
      The one store whose content decides what is true about the delivered system — for catzc, the repository, changed through one change
      process.
    realized_by: { kind: prose-only }
    contrasts:
      adjacent store:
        An adjacent store is a second store driven one way from the trunk's pipelines, a projection of the truth; the source of truth is the
        record it is driven from.
      truth store:
        A truth store is any store of the three kinds; the source of truth is the one truth store that decides inside a responsibility
        domain, the repository.
  adjacent store:
    key: adjacent_store
    domain: thesis
    defined_by: TDR-ONETRUTH-REPOSITORYISRECORD
    short:
      The one legitimate second store — a repository or service, such as a GitOps or configuration repository, or Azure DevOps Services or
      GitHub SaaS, with its own history, driven one way from the trunk's pipelines and never edited beside it.
    realized_by: { kind: prose-only }
    contrasts:
      fact source: A fact source is owned by a state machine and only read; an adjacent store is driven one way from the trunk's pipelines.
  truth store:
    key: truth_store
    domain: thesis
    defined_by: TDR-STORES-THREESTOREKINDS
    short:
      Any store that holds part of the truth about a delivered system — a version-controlled repository, a fact source, or a state machine.
    realized_by: { kind: prose-only }
  version-controlled repository:
    key: version_controlled_repository
    domain: thesis
    defined_by: TDR-STORES-VERSIONEDREPOSITORY
    short: The kind of truth store whose content is a versioned history of reviewed changes; a git repository is one subgroup of it.
    realized_by: { kind: prose-only }
  responsibility domain:
    key: responsibility_domain
    domain: thesis
    defined_by: TDR-STORES-RESPONSIBILITYDOMAIN
    short:
      The organisation, team, product, or person that one repository is the responsibility boundary for, set by where git's hard security
      controls stop.
    realized_by: { kind: prose-only }
  fact source:
    key: fact_source
    domain: thesis
    defined_by: TDR-STORES-FACTSOURCEREADONLY
    short:
      A state store — a database with a reachable live URL holding state about delivery outside the repository, such as the Azure DevOps
      runtime state — whose state catzc reads only.
    realized_by: { kind: prose-only }
    contrasts:
      state machine: A state machine is the application that owns and changes a fact source; a fact source is the store catzc reads.
  state machine:
    key: state_machine
    domain: thesis
    defined_by: TDR-STORES-STATEMACHINE
    short:
      An application that owns fact sources and changes their state by its own rules, met by catzc only at a junction, inbound or outbound.
    realized_by: { kind: prose-only }
  actionable fact:
    key: actionable_fact
    domain: thesis
    defined_by: TDR-STORES-RECONCILEFACTS
    short:
      A fact found by synchronising truth stores that is verifiable, naming the store, address, and moment it was read, and names the one
      change or report it calls for.
    realized_by: { kind: prose-only }
  query surface:
    key: query_surface
    domain: thesis
    defined_by: TDR-ONETRUTH-TRUTHISQUERYABLE
    short:
      The tooling's Get-* cmdlets, each of which also emits its answer as data (JSON), through which every question about the system's state
      is answered.
    realized_by: { kind: prose-only }
  eac normal form:
    key: eac_normal_form
    domain: thesis
    defined_by: TDR-NORMALFORM-ANYCODEHASNORMALFORM
    short:
      The shape in which the repository can verify any code — verifiable within its enabling constraints and uncontested by its formatters,
      tests, and asserts.
    realized_by: { kind: prose-only }
    contrasts:
      repository normal form:
        The repository normal form is the one language-neutral spelling of a name; the eac normal form is the verifiable shape of a whole
        piece of code.
    avoid:
      - { phrase: "eac's normal form", say: "eac normal form (catzc's own term, not the sibling eac repository's form; ADR-REPO-INSPIRE)" }
  unordered code fragment:
    key: unordered_code_fragment
    domain: thesis
    defined_by: TDR-NORMALFORM-ANYCODEHASNORMALFORM
    short: Code from outside the trunk, in whatever shape its origin left it, that is not yet in eac normal form and decides nothing.
    realized_by: { kind: prose-only }
  enabling constraints:
    key: enabling_constraints
    domain: thesis
    defined_by: TDR-NORMALFORM-ENABLINGCONSTRAINTS
    short: What a repository declares about itself — the sensible defaults, the catzc bundle, and the local configs — and nothing else.
    realized_by: { kind: prose-only }
  uncontested:
    key: uncontested
    domain: thesis
    defined_by: TDR-NORMALFORM-UNCONTESTED
    short: Of code, left unchanged by every formatter and failed by no test or assert of the repository; the fixed point of its checks.
    realized_by: { kind: prose-only }
  fragment migration:
    key: fragment_migration
    domain: thesis
    defined_by: TDR-NORMALFORM-MIGRATIONREACHESTHEFORM
    short: Bringing an unordered code fragment into eac normal form through the one change process.
    realized_by: { kind: prose-only }
  product mono-repository:
    key: product_mono_repository
    domain: thesis
    defined_by: TDR-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      One repository that several teams contribute to for one product, bounded into tracks and deployable-units by path filters; catzc is
      one.
    realized_by: { kind: prose-only }
    contrasts:
      trunk:
        The trunk is the one mainline of a product mono-repository, where everything is at HEAD; the product mono-repository is the
        repository as a whole, with its tracks and deployable-units.
  trunk:
    key: trunk
    domain: thesis
    defined_by: TDR-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      The one mainline of a product mono-repository, where everything is at HEAD — no internal versions, and a shared change lands in one
      commit with all its consumers.
    realized_by: { kind: prose-only }
    contrasts:
      pin: A pin is an explicit version at the repository boundary; inside the trunk nothing is pinned, and everything is at HEAD.
  pin:
    key: pin
    domain: thesis
    defined_by: TDR-ONETRUTH-PRODUCTMONOREPOSITORY
    short:
      An explicit version, controlled by the consumer, of a dependency that crosses the repository boundary inward, stitched into an
      immutable artifact at build time.
    realized_by: { kind: prose-only }
