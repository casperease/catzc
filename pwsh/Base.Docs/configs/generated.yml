# What this module's generators write (Get-GeneratedTarget reads every module's generated.yml); the READMEs are declared by readme.yml.
targets:
  - { path: docs/drs/glossary.md, generator: Build-Glossary }
  - { path: .github/README.md, generator: Build-FrontPage }
  - { path: "**/.gitkeep", generator: Build-GitKeep }
