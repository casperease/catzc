# ---
# catzc:
#   docs: "../../../docs/references/pwsh/catzc-base-git/configs/gitignore.yml.md"
#   header: "generated"
# ---

sections:
  - id: local
    title: Local, never-committed files
    why: >
      Per-machine working files: local agent instructions, settings and MCP wiring, scratch folders, editor backups, and the occasional
      bash-on-Windows crash dump.
    patterns:
      - .claude/CLAUDE.local.md
      - .claude/settings.local.json
      - .mcp.json
      - tmp
      - "*.bkp"
      - "*.dtmp"
      - bash.exe.stackdump

  - id: typescript-declarations
    title: TypeScript declarations
    why: >
      The type declarations the js track's types gate checks against (@types/node, @types/vscode) are installed by Install-TypeScript into
      the repository-relative folder javascript.yml declares, so the generated jsconfig.json names the same relative type root on every
      machine; they are per-machine tool output, never committed (ADR-AUTO-JS-TYPESGATE).
    patterns:
      - /.typescript/

  - id: output
    title: Output directory
    why: >
      All generated artifacts land in out/ (see docs/drs/repository/dedicated-output-directory.md). The folder itself is kept so a fresh
      checkout has the anchor; its contents never enter git.
    patterns:
      - out/*
      - { pattern: "!out/.gitkeep", note: "keep the folder, ignore its contents" }

  - id: pdfs
    title: Rendered PDFs
    why: >
      A PDF is rendered from a source, so it is output (docs/drs/repository/dedicated-output-directory.md, rule 11): ignored everywhere. A
      PDF that must be committed opts out here with its own '!' line and a note saying why.
    patterns:
      - "*.pdf"

  - id: manifests
    title: Generated module manifests
    why: >
      Every module's <Module>.psd1 is generated by the loader on import (open-closed architecture) — derived, never committed. Vendored
      third-party modules ship their own authored manifests, and the authored analyzer config and the burst journal's declaration under
      .internal/assets are config files that merely share the extension, so they opt back in past the glob.
    patterns:
      - pwsh/**/*.psd1
      - { pattern: "!pwsh/.vendor/**/*.psd1", note: "vendored modules ship their own manifests" }
      - { pattern: "!pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1", note: "authored analyzer source" }
      - {
          pattern: "!pwsh/.internal/assets/types/burst-journal.psd1",
          note: "authored declaration Invoke-StagedBurst reads, which imports nothing and so cannot parse yml",
        }

  - id: root-config
    title: Managed root-config copies
    why: >
      Repository-root config files fully managed by Catzc.Base.RootConfig — each reproduced on import from its one in-repo source of truth
      (see rootconfig.yml). Edit the source, never the root copy; this list is injected from the registry's committed:false targets and
      never restated by hand. The root catzc.sln, for one, is rendered by New-Solution from every C# project in the tree on every load, so a
      hand edit to the root copy is lost.
    inject: rootconfig-committed-false

  - id: readmes
    title: Generated READMEs
    why: >
      A README.md in a mapped conventional folder is a generated copy of an authored docs source (Build-Readme, Catzc.Base.Docs; see
      docs/drs/repository/generated-readmes.md) — derived artifacts like the module manifests, regenerated on every import. Hand-authored
      READMEs are exactly the unmapped folders and opt back in below. The generated cspell dictionaries under .cspell/ are ignored by the
      folder's own managed .gitignore (a root-config copy), so only that folder's .gitkeep is committed.
    patterns:
      - "**/README.md"
      - "!.github/README.md"
      - "!pwsh/.vendor/**/README.md"
      - "!pwsh/Azure.Templates/tests/assets/README.md"
      - {
          pattern: "!contracts/*/**/README.md",
          note: "a contract asset named README.md pins its target; contracts/README.md stays generated",
        }

  - id: compiled-types
    title: Compiled C# types — a per-machine build, never committed
    why: >
      The combined assembly and its manifest are a per-machine build in the per-user shadow root, keyed by the source hash (see
      docs/drs/automation/caching.md), so git keeps no file under pwsh/.compiled. What a consumer binds to, the types surface, is the
      provided contract in contracts/catzc/0.1.0/pwsh.internal.types/.
    patterns:
      - pwsh/.compiled/

  - id: ide-build
    title: IDE-only C# project build output
    why: >
      The root catzc.sln references pwsh/.internal/assets/Catzc.Types.csproj for editor tooling, and MSBuild emits obj/bin next to that
      project. The runtime never builds it (Add-Type compiles the type sources at import), so its MSBuild artifacts are transient and vscode
      consumed only. The types system builds via the internal builder, no csproj or sln involved.
    patterns:
      - pwsh/.internal/assets/obj/
      - pwsh/.internal/assets/bin/

  - id: agent-hook-build
    title: Agent hook build output
    why: >
      Each Claude Code agent hook is a small C# program (.claude/hooks/<name>/) that Build-AgentHook publishes on import whenever its source
      changes. The published programs and their MSBuild intermediates are per-machine build output, rebuilt from the committed source.
    patterns:
      - .claude/hooks/bin/
      - .claude/hooks/*/obj/
      - .claude/hooks/*/bin/

  - id: go-workspace
    title: Go test workspace sums
    why: >
      The Go test workspace is generated (ADR-AUTO-GO): go.work and each go.mod are managed root-config copies, ignored through their
      rootconfig entries. The checksum files go writes beside them when the Go test bridge downloads modules are per-machine output, never
      committed.
    patterns:
      - /go.work.sum
      - /*/tests/*/go.sum

  - id: python-environment
    title: Python test environment
    why: >
      The Python test workspace is generated (ADR-AUTO-PY): its pyproject.toml files are managed root-config copies, ignored through their
      rootconfig entries. The one environment and lock uv makes beside the workspace root in the Python root (python/ or .python/), and the
      linter's cache, are per-machine output, never committed. Invoke-PythonTest routes Python's bytecode cache to out/pycache, but any
      other run (the editor's Python, a bare pytest) writes __pycache__ beside the sources, so it is ignored wherever it lands. A package
      member installs for editing in strict mode, so the build backend links its package under the member's build/ folder and writes its
      egg-info metadata beside the package.
    patterns:
      - /*/.venv/
      - /*/uv.lock
      - .ruff_cache/
      - __pycache__/
      - /*/*/build/
      - /*/*/*.egg-info/
