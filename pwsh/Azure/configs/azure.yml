# yaml-language-server: $schema=.not-azure-schema.json

# The <org> segment of every Azure resource name; the segment order is the ado_naming variant.
org: zct

# The IDs are placeholders: replace them with the real tenant and subscription IDs of each deployment target.
tenants:
  placeholder:
    id: fa0e0000-7e0a-0700-1d00-000000000000

# Keyed by the readable name, the deploy handle; customers are defined in customer.yml, not here.
environments:
  dev:
    shortcode: de
    region: westeurope
    region_code: weu
  test:
    shortcode: te
    region: westeurope
    region_code: weu
  preprod:
    shortcode: pp
    region: westeurope
    region_code: weu
    staging_for: prod
  prod:
    shortcode: pr
    region: westeurope
    region_code: weu
    # The one production environment: the compliance check's production rules and the production database alerts read this.
    production: true
  # One identity environment per subscription: nsub for the nonprod one, psub for the prod one.
  nsub:
    shortcode: ns
    region: westeurope
    region_code: weu
    per_subscription: true
  psub:
    shortcode: ps
    region: westeurope
    region_code: weu
    per_subscription: true

# A root config's environment resolves to a shared subscription; a configuration/<customer>/ config's to its customer's.
subscriptions:
  shared_nonprod:
    id: 50a0ed00-de00-50b0-0000-000000000000
    tenant: placeholder
    environments:
      - dev
      - test
      - nsub
  shared_prod:
    id: 50a0ed00-000d-50b0-0000-000000000000
    tenant: placeholder
    environments:
      - preprod
      - prod
      - psub
  # A customer subscription names its customer by key or 2-char shortcode; its configs live under configuration/<customer>/.
  apex_nonprod:
    id: a0e00000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: apex
    environments:
      - dev
      - test
      - nsub
  apex_prod:
    id: a0e00000-000d-50b0-0000-000000000000
    tenant: placeholder
    customer: apex
    environments:
      - preprod
      - prod
      - psub
  nova_nonprod:
    id: 000a0000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: nova
    environments:
      - dev
      - test
      - nsub
  flux_nonprod:
    id: f1000000-de00-50b0-0000-000000000000
    tenant: placeholder
    customer: flux
    environments:
      - dev
      - test
      - nsub

# The Entra groups the templates assign built-in roles to, never a user: shared for the shared subscriptions, else the customer key, then
# the environment class. The ids are placeholders: replace them with the tenant's real group object ids.
groups:
  shared:
    nonproduction:
      readers: 50a0ed00-de00-0000-0000-00000000000a
      operators: 50a0ed00-de00-0000-0000-00000000000b
      data_readers: 50a0ed00-de00-0000-0000-00000000000c
      data_writers: 50a0ed00-de00-0000-0000-00000000000d
    production:
      readers: 50a0ed00-000d-0000-0000-00000000000a
      operators: 50a0ed00-000d-0000-0000-00000000000b
      data_readers: 50a0ed00-000d-0000-0000-00000000000c
      data_writers: 50a0ed00-000d-0000-0000-00000000000d
  apex:
    nonproduction:
      readers: a0e00000-de00-0000-0000-00000000000a
      operators: a0e00000-de00-0000-0000-00000000000b
      data_readers: a0e00000-de00-0000-0000-00000000000c
      data_writers: a0e00000-de00-0000-0000-00000000000d
    production:
      readers: a0e00000-000d-0000-0000-00000000000a
      operators: a0e00000-000d-0000-0000-00000000000b
      data_readers: a0e00000-000d-0000-0000-00000000000c
      data_writers: a0e00000-000d-0000-0000-00000000000d
  nova:
    nonproduction:
      readers: 000a0000-de00-0000-0000-00000000000a
      operators: 000a0000-de00-0000-0000-00000000000b
      data_readers: 000a0000-de00-0000-0000-00000000000c
      data_writers: 000a0000-de00-0000-0000-00000000000d
  flux:
    nonproduction:
      readers: f1000000-de00-0000-0000-00000000000a
      operators: f1000000-de00-0000-0000-00000000000b
      data_readers: f1000000-de00-0000-0000-00000000000c
      data_writers: f1000000-de00-0000-0000-00000000000d

tags:
  keys:
    workload: []
    environment: [dev, test, nonprod, preprod, prod]
    owner: []
    cost-center: []
    criticality: [low, medium, high]
    data-classification: [public, internal, confidential, restricted]
  provenance:
    commit: deployed-from-commit
    build_id: deployed-from-buildid
    branch: deployed-from-branch
