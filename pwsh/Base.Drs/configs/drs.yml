# Each kind is a code's first segment: a shared kind's domains each add their code, and a kind one domain owns stands for it.
kinds:
  ADR: { name: Architecture Decision Record, shared: true }
  TDR: { name: Thesis Decision Record }
  PDR: { name: Principle Decision Record }
  WDR: { name: Way-of-working Decision Record }
  DDR: { name: Design Decision Record }
  FDR: { name: Flow Decision Record }
  EDR: { name: External Decision Record }

# The authored domain structure, one domain per docs/drs/<area>/ folder: the single source of how decisions are organised and cited.
domains:
  thesis:
    kind: TDR
    role: framing # what catzc is for and how it solves it — the decision every other domain serves
    description: >-
      What catzc is for and how it solves it: delivery is slow because its truth is spread across disjoint stores, so catzc collapses them
      into one source of truth, the repository, with one change process. The repository is the configuration record and answers queries
      through the tooling; inside the trunk everything is at HEAD, and versions exist only at the repository boundary, as pins. Outside the
      responsibility domain a repository holds, the truth stores are fact sources and state machines, read and reported to at junctions and
      synchronised into actionable facts. Any code, unordered fragments included, has an eac normal form: verifiable within the sensible
      defaults, the bundle, and the local configs, and uncontested by the repository's formatters, tests, and asserts. It describes the
      product and rests on the DORA research, the authoritative source, and the principles state its mechanics, so every other domain cites
      it (`TDR-*`) through them.
    depends_on: [external]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # the thesis spans the whole value chain
    rulesets:
      one-source-of-truth: { external: TDR-ONETRUTH }
      truth-stores: { external: TDR-STORES }
      eac-normal-form: { external: TDR-NORMALFORM }
      closed-loop: { external: TDR-CLOSEDLOOP }

  principles:
    kind: PDR
    role: axioms # the non-negotiable design axioms every other domain specialises
    description: >-
      The design axioms every other domain specialises: everything as code, configure don't program, reduce variability, reduce waste,
      poka-yoke, one living version, and the two names of the system, cats and catzc. They specialise the thesis, catzc's product
      description, and rest on the DORA research, the authoritative source; no domain later in the order overrides them, and every other
      domain cites them (`PDR-*`) as the reason for its own decisions.
    depends_on: [external, thesis]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # axioms every concern specialises
    rulesets:
      everything-as-code: { external: PDR-EAC }
      configure-not-program: { external: PDR-CONFIG, concern: [automation] }
      reduce-variability: { external: PDR-REDUCEVAR }
      reduce-waste: { external: PDR-NOWASTE }
      poka-yoke: { external: PDR-POKAYOKE, concern: [quality-control] }
      one-living-version: { external: PDR-ONELIVE, concern: [release] }
      cats-and-catzc: { external: PDR-CATS }

  process:
    kind: WDR
    # our own continuously-improved way of working ([WDR-KAIZEN](/docs/drs/process/inspect-and-adapt.md)); Design/Exploration + ASM
    role: optimisable
    description: >-
      How the team works: lean flow as the Toyota Production System maps to software, as the external Agile and lean records state it, and
      one shared vocabulary of flow terms. Unlike the fixed axioms, the process is itself inspected and improved (`WDR-KAIZEN`); the design,
      flow, and implementation domains put its practices into effect — stopping the line, building quality in, pulling work, and draining
      queues.
    depends_on: [external, principles]
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # how the team works, along the whole chain
    rulesets:
      process-terms: { external: WDR-LEANTERMS }
      holding-the-line: { external: WDR-ANDON, concern: [quality-control] }
      build-quality-in: { external: WDR-BUILTIN, concern: [quality-control] }
      observe-work: { external: WDR-OBSERVEWIP }
      pull-work: { external: WDR-PULLWORK }
      queues-cost-money: { external: WDR-QUEUECOST }
      inspect-and-adapt: { external: WDR-KAIZEN }

  design:
    kind: DDR
    role: architecture # how the platform is shaped
    description: >-
      How the platform is shaped: tracks as the repository's root concerns, a thin CLI platform over a vendor substrate, safe self-service,
      the audited server remote with pull-request ingress, the visual grammar of the value-chain diagrams, and the toolset's two run modes
      (source and build). It builds on the external records, principles, and process; the flow and implementation domains realise it.
    depends_on: [external, principles, process]
    stack: DSGN
    concern: [automation] # the shape of the platform itself
    rulesets:
      tracks: { external: DDR-TRACK }
      thin-platforms: { external: DDR-THINPLAT, concern: [automation, deploy] }
      self-service: { external: DDR-SELFSERV, concern: [deploy, access] }
      visual-design: { external: DDR-VISUAL, concern: [quality-control, release, deploy] }
      server-remote-integration: { external: DDR-REMOTE, concern: [build, quality-control] }
      run-modes: { external: DDR-RUNMODE, concern: [automation, build] }
      track-types: { external: DDR-TRACKTYPE }
      vendoring: { external: DDR-VENDOR }
      module-types: { external: DDR-MODTYPE }
      module-aspects: { external: DDR-ASPECT, concern: [automation, build] }
      repository-filters: { external: DDR-FILTER }

  flow:
    kind: FDR
    role: architecture # the platform-agnostic flow model that Azure DevOps (ADO) and GitHub (GH) implement
    description: >-
      The vendor-neutral delivery-flow model: what a CI/CD pipeline is, continuous integration as a discipline with a 5–10 minute
      integration budget, the closed set of pipeline types (CRON, CI, CD, CDe, DEPLOY, INPUT) keyed together by one immutable tagged
      artifact, how pipelines invoke automation and detect their context, how globsets project into native trigger filters, and the commit
      lifecycle a promoted commit climbs, with its stable sync point, and the git paths a topic takes to and from the server's main. The ado
      (Azure DevOps) and github domains implement it.
    depends_on: [external, principles, process, design]
    stack: DSGN
    concern: [build, quality-control, release, deploy] # the delivery flow from integration to production
    rulesets:
      cd-discipline-and-promotion-flow: { external: FDR-CD }
      pipeline-types: { external: FDR-TYPE }
      durable-sha-globs: { external: FDR-GLOBS, concern: [automation] }
      pipeline-concept: { external: FDR-PIPELINE }
      commit-lifecycle: { external: FDR-LIFE, concern: [quality-control, release, deploy] }
      manual-queues: { external: FDR-QUEUE, concern: [release, deploy] }
      git-topic-flow: { external: FDR-GIT, concern: [build] }

  automation:
    code: AUTO
    role: implementation # the CLI/module system that enacts the decisions
    description: >-
      The catzc CLI and module system and the rules for building it: devbox/pipeline parity, one function per file, open/closed growth,
      fail-fast assertions, idempotency, caching, path forms, system, module, and internal asset dependencies, the module model, test
      automation, the merged, installable build, the five layers of the automation and the importer that decides a session's mix, stated for
      any execution engine. Language layers live in `go/`, `python/`, and `bash/` (black-box test artifacts); the BCL language of the native
      C# types is the bcl domain. It turns the external, principles, process, and design domains into enforced code; the pwsh domain
      realises it in PowerShell, and the ado, github, and azure domains build on it.
    depends_on: [external, principles, process, design]
    stack: AUTO
    concern: [automation] # the module system: loading, configuration, globsets
    rulesets:
      devbox-pipeline-parity: { external: ADR-AUTO-PARITY }
      uv-python-handler: { external: ADR-AUTO-UVPY, layer: language }
      log-before-invoke: { external: ADR-AUTO-PRELOG }
      retry-as-last-resort: { external: ADR-AUTO-RETRY }
      open-closed-architecture: { external: ADR-AUTO-EXTEND }
      zero-ceremony-poka-yoke: { external: ADR-AUTO-ZERO }
      never-depend-on-pwd: { external: ADR-AUTO-NOPWD }
      avoid-deep-nesting: { external: ADR-AUTO-NONEST }
      test-automation: { external: ADR-AUTO-TEST, concern: [quality-control] }
      cross-platform: { external: ADR-AUTO-XPLAT }
      single-responsibility-functions: { external: ADR-AUTO-ONEJOB }
      caching: { external: ADR-AUTO-CACHE, layer: importer }
      materialization: { external: ADR-AUTO-MATERIAL, concern: [quality-control] }
      tracked-files-from-the-index: { external: ADR-AUTO-TRACKED }
      sensible-defaults: { external: ADR-AUTO-DEFAULT }
      fail-fast-with-asserts: { external: ADR-AUTO-FAILFAST }
      idempotent-state-functions: { external: ADR-AUTO-IDEM }
      use-proper-package-managers: { external: ADR-AUTO-PKGMGR }
      effective-in-enterprises: { external: ADR-AUTO-ENTERP }
      controlling-systemwide-deps: { external: ADR-AUTO-DEPS }
      tool-removal-lifecycle: { external: ADR-AUTO-REMOVE }
      controlling-module-dependencies: { external: ADR-AUTO-DEPM, layer: importer }
      environment-variables: { external: ADR-AUTO-ENVVAR }
      path-representation: { external: ADR-AUTO-PATH }
      managed-guids: { external: ADR-AUTO-GUIDS }
      platform-bundle: { external: ADR-AUTO-BUNDLE, concern: [build, release], layer: importer }
      consumer-overlay: { external: ADR-AUTO-OVERLAY, concern: [build, release], layer: importer }
      internal-asset-dependencies: { external: ADR-AUTO-ASSETDEP, concern: [automation, build], layer: importer }
      console-output-matters: { external: ADR-AUTO-CONSOLE }
      spell-out-names: { external: ADR-AUTO-SPELL, concern: [quality-control] }
      idiomatic-names: { external: ADR-AUTO-IDIOM, concern: [quality-control], layer: language }
      dry-run: { external: ADR-AUTO-DRYRUN }
      file-limits: { external: ADR-AUTO-LIMIT, concern: [quality-control] }
      go-test-artifacts: { external: ADR-AUTO-GO, concern: [quality-control], layer: language }
      python-test-artifacts: { external: ADR-AUTO-PY, concern: [quality-control], layer: language }
      bash-test-artifacts: { external: ADR-AUTO-BASH, concern: [quality-control], layer: language }
      test-artifact-languages: { external: ADR-AUTO-TESTLANG, concern: [quality-control], layer: language }
      javascript-track: { external: ADR-AUTO-JS, concern: [quality-control], layer: language }
      execution-engines: { external: ADR-AUTO-ENGINE, layer: engine }
      module-model: { external: ADR-AUTO-MODULE, concern: [automation, build, quality-control] }
      layers: { external: ADR-AUTO-LAYERS }
      importer: { external: ADR-AUTO-IMPORTER, layer: importer }
      accosted-language: { external: ADR-AUTO-ACCOSTED, concern: [quality-control], layer: contract }
      network-calls: { external: ADR-AUTO-NET }

  bcl:
    code: BCL
    role: implementation # the language of the native C# types
    description: >-
      BCL as a language of catzc's own: C# against the .NET Base Class Library, a subset of .NET, written in the `types/*.cs` sources — one
      type per file, a namespace per module, one combined assembly, the Base Class Library as the whole reference set with each host binding
      a configured exception, and the one build pair of its solution and projects. pwsh is its host, not its owner: how pwsh compiles and
      carries the types is the pwsh domain's.
    depends_on: [external, principles, process, design, automation]
    stack: AUTO
    concern: [automation] # the native types every module may carry
    folder: automation/BCL
    rulesets:
      native-csharp-types: { external: ADR-BCL-TYPES, concern: [automation, build], layer: language }

  pwsh:
    code: PWSH
    role: implementation # one execution engine's realisation of the automation rules
    description: >-
      PowerShell 7 as one of catzc's execution engines: how the automation rules are realised in pwsh — module files and manifests,
      parameter and error design, streams and console output, caching in script scope, working directory and environment mechanics,
      cross-platform pwsh, pipeline detection, the analyzer, and Pester. It applies the engine-agnostic `automation/` rules to one engine
      and never redefines them.
    depends_on: [external, principles, process, design, automation, bcl]
    stack: AUTO
    concern: [automation] # the pwsh engine of the module system
    folder: automation/pwsh
    rulesets:
      pwsh-engine: { external: ADR-PWSH-ENGINE }
      one-function-per-file: { external: ADR-PWSH-ONEFUNC }
      use-ps1-not-psm1: { external: ADR-PWSH-USEPS }
      dynamic-module-manifests: { external: ADR-PWSH-MANIFEST }
      module-path-hygiene: { external: ADR-PWSH-MODPATH }
      vendor-toolset-dependencies: { external: ADR-PWSH-VENDOR }
      prepost-extension-modules: { external: ADR-PWSH-PREPOST }
      error-handling: { external: ADR-PWSH-ERROR }
      assert-idioms: { external: ADR-PWSH-ASSERT }
      announce-state-changes: { external: ADR-PWSH-ANNOUNCE }
      prefer-foreach-over-foreach-object: { external: ADR-PWSH-FOREACH }
      automatic-variable-pitfalls: { external: ADR-PWSH-AUTOVAR }
      respect-pwsh-verb-rules: { external: ADR-PWSH-VERBS }
      prefer-dryrun-over-shouldprocess: { external: ADR-PWSH-DRYRUN }
      identifier-names: { external: ADR-PWSH-NAMES }
      powershell-formatting: { external: ADR-PWSH-FORMAT, concern: [quality-control] }
      environment-variable-mechanics: { external: ADR-PWSH-ENV }
      parameter-design: { external: ADR-PWSH-PARAM }
      bounded-enumeration: { external: ADR-PWSH-ENUM }
      working-directory-mechanics: { external: ADR-PWSH-PWD }
      cross-platform-powershell: { external: ADR-PWSH-XPLAT }
      script-scope-caching: { external: ADR-PWSH-CACHE }
      pester-testing: { external: ADR-PWSH-PESTER, concern: [quality-control] }
      hosting-csharp-types: { external: ADR-PWSH-TYPES, concern: [automation, build] }
      idempotent-state-mechanics: { external: ADR-PWSH-IDEM }
      config-reading: { external: ADR-PWSH-CONFIG }
      run-mode-mechanics: { external: ADR-PWSH-RUNMODE, concern: [automation, build] }
      ado-pipeline-functions: { external: ADR-PWSH-ADOFUNC }
      pipeline-detection: { external: ADR-PWSH-DETECT }

  configuration:
    code: CONF
    role: implementation # how configuration is loaded, addressed, and validated across modules
    description: >-
      How a module's `configs/<name>.yml` files are read, validated, and addressed: one public reader, `Get-Config`, that discovers a config
      by its global name, caches it per file, and validates it in its owning module's scope, plus `global.<config>.<key>` addresses that
      point into committed config by reference, and config values a tracked Markdown file contributes to a config that opted in. It gives
      every implementation domain its single way to read configuration.
    depends_on: [external, principles, automation, bcl]
    stack: AUTO
    concern: [automation] # reading configuration
    rulesets:
      module-config-loading: { external: ADR-CONF-LOADING }
      config-value-addressing: { external: ADR-CONF-ADDRESSING }
      markdown-config-contributions: { external: ADR-CONF-MDCONTRIB }

  ado:
    code: ADO
    role: implementation # minimal ADO extensions over the general flow model (FDR-*)
    description: >-
      The Azure DevOps extensions to the flow model: how ADO REST calls select and prove their credentials, how PowerShell sets ado pipeline
      output variables and which agent variable marks a run, how ado pipelines and template folders are named and placed under
      `.ado/pipelines/`, how they trigger on path filters, build validation, schedules and parameters, and when an ADO YAML template is
      warranted. It binds the vendor-neutral `flow/` rules to Azure DevOps without redefining them; `github/` is its GitHub counterpart.
    depends_on: [external, principles, process, design, automation, flow]
    stack: PIPE
    concern: [build, quality-control, release, deploy] # the Azure DevOps pipelines that carry the delivery flow
    rulesets:
      dual-authentication: { external: ADR-ADO-AUTH, concern: [access] }
      pipeline-variables: { external: ADR-ADO-VAR }
      pipeline-naming-and-placement: { external: ADR-ADO-NAME }
      custom-template-discipline: { external: ADR-ADO-TEMPLATE }
      environment-approvals: { external: ADR-ADO-APPROVAL, concern: [release, deploy] }
      pipeline-runner-pattern: { external: ADR-ADO-RUNNER, concern: [automation] }
      pipeline-triggers: { external: ADR-ADO-TRIGGER }

  github:
    code: GH
    role: implementation # minimal GitHub extensions over the general flow model (.github/workflows placement, etc.)
    description: >-
      The GitHub extensions to the flow model: the manually dispatched release workflow that builds the catzc package and publishes it to
      GitHub Releases, GitHub Packages, and optionally the PowerShell Gallery, and the run mark and `on.*.paths` triggers of a workflow. It
      applies the `flow/` rules to GitHub Actions under `.github/workflows/` and publishes the bundle the automation domain defines; `ado/`
      is its Azure DevOps counterpart.
    depends_on: [external, principles, process, design, automation, flow]
    stack: PIPE
    concern: [build, release] # the workflow that builds and publishes the package
    rulesets:
      github-release: { external: ADR-GH-RELEASE }
      github-actions: { external: ADR-GH-ACTIONS, concern: [build] }

  azure:
    code: AZ
    role: implementation # the Azure vendor substrate model
    description: >-
      The Azure substrate model catzc deploys onto: the identity data model (`azure.yml` tenants, environments, and subscriptions), the
      per-template configuration tree under `infrastructure/templates/`, the customer catalogue (`customer.yml`), the network IP plan
      (`network.yml`), the deterministic resource-naming standard, and the landing zones. It applies the principles and design domains to
      one vendor, enforced by the `Catzc.Azure*` modules. The vendor's own recommendations, the Well-Architected Framework pillars and the
      Cloud Adoption Framework landing-zone design areas, are external records; the decisions here answer them.
    depends_on: [external, principles, design, automation, flow, ado]
    stack: CLOUD
    concern: [deploy] # the substrate catzc deploys onto
    rulesets:
      azure-data-model: { external: ADR-AZ-DATAMOD, concern: [deploy, access] }
      azure-network-model: { external: ADR-AZ-NETWORK }
      azure-naming-standard: { external: ADR-AZ-NAMING }
      prefer-az-cli: { external: ADR-AZ-CLI, concern: [deploy, access] }
      az-session-verification: { external: ADR-AZ-SESSION, concern: [access] }
      azure-customer-model: { external: ADR-AZ-CUSTOMER }
      landing-zones: { external: ADR-AZ-LZ }
      infrastructure-kinds: { external: ADR-AZ-IACKIND, concern: [deploy] }

  repository:
    code: REPO
    role: implementation # how the repository tree itself is organised and generated
    description: >-
      How the repository tree is laid out, formatted, and generated: conventional folder names at every level, the single `out/` output
      directory, one formatting standard for every file type, contracts at the repository boundary, in both directions, under `contracts/`,
      READMEs and root configs generated from one source, fictional documentation examples, the separation of design, test, and live
      vocabulary, the controlled vocabulary of defined terms, the directions a link may point, the reserved meta block in a Markdown file's
      front matter, repo-wide variants, the sub-agent definitions and the rules behind each, sibling repositories read for ideas, never as a
      reference implementation, the session-memory protection that skips a repeated scan over an unchanged globset, and the value-chain map
      that places every decision record on a row and its value-chain concerns.
    depends_on: [external, principles, design, automation, configuration, bcl]
    stack: AUTO
    concern: [automation] # the repository tree the tooling lays out and generates
    rulesets:
      conventional-folders: { external: ADR-REPO-FOLDERS }
      dedicated-output-directory: { external: ADR-REPO-OUTDIR }
      output-formats: { external: ADR-REPO-OUTFMT }
      uniform-formatting: { external: ADR-REPO-FORMAT, concern: [quality-control] }
      api-contracts: { external: ADR-REPO-CONTRACT, concern: [release] }
      command-contracts: { external: ADR-REPO-CMDCONTRACT, concern: [release] }
      generated-readmes: { external: ADR-REPO-README }
      generated-root-configs: { external: ADR-REPO-ROOTCFG }
      documentation-examples: { external: ADR-REPO-EXAMPLE }
      repo-variants: { external: ADR-REPO-VARIANT }
      domain-language-separation: { external: ADR-REPO-LANG }
      controlled-vocabulary: { external: ADR-REPO-VOCAB, concern: [quality-control] }
      markdown-links: { external: ADR-REPO-LINK, concern: [quality-control] }
      links-in-repository: { external: ADR-REPO-LINKS, concern: [quality-control] }
      drs-code-language: { external: ADR-REPO-DRSCODE, concern: [quality-control] }
      comments-in-docs: { external: ADR-REPO-COMMENTS, concern: [quality-control] }
      file-meta: { external: ADR-REPO-FILEMETA, concern: [quality-control] }
      code-file-meta: { external: ADR-REPO-CODEMETA, concern: [quality-control] }
      function-help: { external: ADR-REPO-HELP, concern: [quality-control] }
      agent-definitions: { external: ADR-REPO-AGENTS }
      ai-agent-contract: { external: ADR-REPO-AI }
      inspiration: { external: ADR-REPO-INSPIRE }
      protected-globs: { external: ADR-REPO-PROTGLOB }
      plans: { external: ADR-REPO-PLANS }
      slides-as-markdown: { external: ADR-REPO-SLIDES, concern: [quality-control] }
      repository-kinds: { external: ADR-REPO-REPOKIND }
      drs-value-chain: { external: ADR-REPO-VALUECHAIN }

  external:
    kind: EDR
    role: reference # trusted outside guidance, one record per item: depended-on-by, never a dependency
    description: >-
      The outside guidance catzc rests on or answers item by item, one record per source item, kept apart from catzc's own decisions: the
      DORA research program in `dora/`, the Microsoft Well-Architected Framework in `azure/waf/` and Cloud Adoption Framework in
      `azure/caf/`, the Agile Manifesto in `agile/`, lean theory in `lean/`, and Pester in `pester/`. A code keeps its source path under the
      EDR kind (`EDR-DORA-CI`, `EDR-AZ-CAF-GOV`), and an item keeps the source's own id (a Well-Architected item `RE01`, a Cloud Adoption
      Framework item `R01`). A rule states how catzc reads the item, with a `Source:` line that names it, a Microsoft page as `learn <path>`
      under the one base `https://learn.microsoft.com/en-us`; the `ADR` or `PDR` record that cites the rule holds catzc's own decision.
      Every other domain depends on this one and it depends on none; the others cite the DORA records through their `dora-explains.md` files
      and `EDR-DORA-*` citations.
    depends_on: []
    stack: PRIN
    concern: [automation, build, quality-control, release, deploy, access] # sources measured across the whole chain
    rulesets:
      # The DORA capabilities, one record each, beside the reference in docs/references/dora/.
      ai-accessible-internal-data: { external: EDR-DORA-AIDATA, concern: [access] }
      clear-and-communicated-ai-stance: { external: EDR-DORA-AISTANCE }
      healthy-data-ecosystems: { external: EDR-DORA-DATAECO }
      platform-engineering: { external: EDR-DORA-PLATFORM, concern: [automation] }
      user-centric-focus: { external: EDR-DORA-USERFOCUS }
      version-control: { external: EDR-DORA-VCS, concern: [automation] }
      working-in-small-batches: { external: EDR-DORA-SMALLBATCH }
      code-maintainability: { external: EDR-DORA-MAINTAIN, concern: [automation, build] }
      continuous-delivery: { external: EDR-DORA-CD, concern: [build, quality-control, release, deploy] }
      continuous-integration: { external: EDR-DORA-CI, concern: [build, quality-control] }
      database-change-management: { external: EDR-DORA-DBCHANGE, concern: [deploy] }
      deployment-automation: { external: EDR-DORA-DEPLOY, concern: [deploy] }
      documentation-quality: { external: EDR-DORA-DOCS }
      flexible-infrastructure: { external: EDR-DORA-FLEXINFRA, concern: [deploy] }
      loosely-coupled-teams: { external: EDR-DORA-LOOSETEAMS }
      monitoring-and-observability: { external: EDR-DORA-OBSERV, concern: [access] }
      pervasive-security: { external: EDR-DORA-SECURITY }
      streamlining-change-approval: { external: EDR-DORA-APPROVAL, concern: [release] }
      test-automation: { external: EDR-DORA-TESTAUTO, concern: [quality-control] }
      test-data-management: { external: EDR-DORA-TESTDATA, concern: [quality-control] }
      trunk-based-development: { external: EDR-DORA-TRUNK, concern: [build] }
      customer-feedback: { external: EDR-DORA-FEEDBACK, concern: [access] }
      monitoring-systems: { external: EDR-DORA-MONITOR, concern: [access] }
      proactive-failure-notification: { external: EDR-DORA-FAILALERT, concern: [access] }
      work-visibility-in-value-stream: { external: EDR-DORA-WORKVIS }
      visual-management: { external: EDR-DORA-VISUAL }
      wip-limits: { external: EDR-DORA-WIP }
      teams-empowered-to-choose-tools: { external: EDR-DORA-TOOLCHOICE, concern: [automation] }
      generative-organizational-culture: { external: EDR-DORA-CULTURE }
