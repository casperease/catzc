# Per-executable limits keyed by the bare name (dotnet, not C:\...\dotnet.exe): the tools whose ordinary runs outlast the default.
executables:
  pwsh: 360 # isolated test runs (Test-InIsolation) and snapshot imports — a full snapshot run takes about 250 s
  dotnet: 600 # builds
  npm: 600 # package installs
  npx: 600 # first-run package fetches
  uv: 600 # Python toolchain and package installs
  poetry: 600 # dependency resolution and installs
  python: 600 # arbitrary scripts
  pyspark: 3600 # interactive sessions
  java: 600 # arbitrary programs
  terraform: 1800 # plan / apply
  az: 1800 # deployments
  winget: 1800 # installs
  msiexec: 900 # a registered product's uninstall in Remove-<Tool> -Force; a bundle's own uninstaller takes the same limit
  brew: 1800 # installs
  sudo: 1800 # system package installs
  tar: 300 # archive extraction
  gh: 120 # API calls over the network
  osv-scanner: 120 # advisory database scan over the network
  cspell: 120 # whole-repo spell check: 6.4 s alone, killed at 10 s under the parallel test load (probe 2026-10-14)
  prettier: 120 # whole-repo format check: 4.4 s alone, near the default under load
  markdownlint-cli2: 120 # whole-repo lint: 2.1 s alone, kept clear of the default under load
  bash: 1800 # Linux/macOS install scripts (dotnet-install.sh downloads the SDK)
  dpkg: 600 # Linux package removal
  node: 120 # node --test runs: the lamps' stub-editor scenarios start one node each, about 4 s apiece (2026-10-26)
  bicep: 120 # one build or build-params of the discovery template: 2.9 s alone, killed at the default when a template's seven compiles run side by side (2026-10-29)
  go: 900 # module downloads, go vet and go test runs: the first compile of the Go runtime alone takes over 9 s
commands:
  Build-Diagrams: 300 # a whole -Stale batch of 149 diagrams took 146 s on 3 render workers (2026-10-26, out/step5-measure.ps1)
  Test-FileLimits: 30 # every tracked file in one pass: 5.8 s cold, 3.5 s warm (2026-10-26, out/catzc-5c-widths/measure.ps1)
  Format-FileMeta: 60 # every head-capable file, -NoCache: 5455 files, 1880 heads stripped, 14.3 s (2026-10-26, reference-normal-form 4b)
  Format-Links: 30 # -MoveMap over 4186 files for 1937 moved pages: 4.3 s (2026-10-26, reference-normal-form 4b)
  Update-AzurePriceTable: 120 # one read-only Retail Prices API GET per cost-model meter, each bounded by this limit
tests:
  engine_start_seconds: 150 # one engine start of a black-box test (import plus one command): two starts and a margin stay under pwsh's 360
  run_list_seconds: 300 # one run of a run list under one engine: an engine start and its few commands, under pwsh's 360
# The machine's run lock (Wait-CatzcRunLock.ps1), read before any import; the defaults on TimeoutsConfig, shown here.
run_lock:
  wait_seconds: 120 # how long a run waits past a live holder's deadline, or the end of a burst, before it says run lock busy
  stale_seconds: 720 # a queue ticket older than the longest run is dropped
  # A run's whole budget under its 300 s call: it waits out a holder or a burst until the budget is spent, then says when to retry.
  budget_seconds: 280
