# ---
# catzc:
#   docs: "../../../docs/references/pwsh/catzc-base-reports/configs/output-formats.yml.md"
#   header: "generated"
# ---

# The area sets how long a format's files stay (OutputFormat's area defaults); keep and max_age override it, and Clear-Output applies it.

# Every kind of file under the output root is declared here once, and no two patterns may overlap, so each file has one format.
formats:
  # ---- quality gates and test runs (out/test-<subject>/) ----
  test-report:
    area: run
    patterns: ["test-*/{stamp}/*.md"]
    producer:
      Write-QualityGateReport (a gate's report), and the test-run entry points Test-Automation and Test-CatzcBuild (summary.md,
      rule-coverage.md)
    audience: a person or an agent, in any Markdown viewer
    validator: { kind: md }
  latest-pointer:
    area: run
    patterns: ["test-*/latest.txt"]
    producer: Write-QualityGateReport, and the test-run entry points (Test-Automation, Test-CatzcBuild)
    audience: a person or a script finding the newest run
    validator: { kind: latest-pointer }
  test-run-manifest:
    area: run
    patterns: ["test-automation/{stamp}/run.json", "test-catzc-build/{stamp}/run.json", "test-file/{stamp}/run.json"]
    producer: Test-Automation, Test-CatzcBuild, Invoke-TestFile
    audience: a script or an agent reading the run's facts
    validator: { kind: json, required_keys: [status, startedAt, minLevel, maxLevel, location, failedCount] }
  test-run-results:
    area: run
    patterns: ["test-*/{stamp}/results-shard-*.xml"]
    producer: Test-Automation, Test-CatzcBuild, Invoke-TestFile (one NUnit file per shard)
    audience: a pipeline's test-results publisher, or a script
    validator: { kind: nunit-xml }
  test-run-rows:
    area: run
    patterns: ["test-*/{stamp}/rows-shard-*.json"]
    producer: Test-Automation, Test-CatzcBuild, Invoke-TestFile (one row file per shard)
    audience: the run itself, merging shard results
    validator: { kind: json }
  test-run-shard-files:
    area: run
    patterns: ["test-*/{stamp}/files-shard-*.json"]
    producer: Test-Automation, Test-CatzcBuild, Invoke-TestFile (the test files each shard runs, from New-TestAutomationShardScript)
    audience: the shard worker, and a person re-running one shard
    validator: { kind: json }
  test-run-shard-script:
    area: run
    patterns: ["test-*/{stamp}/shard-*.ps1"]
    producer: Test-Automation, Test-CatzcBuild, Invoke-TestFile (the script each worker runs)
    audience: a person re-running one shard
    validator: { kind: powershell }
  test-run-tests:
    area: run
    patterns: ["test-automation/{stamp}/tests.csv", "test-catzc-build/{stamp}/tests.csv", "test-catzc-build/{stamp}/excluded-tests.csv"]
    producer: Test-Automation, Test-CatzcBuild
    audience: a person, in a spreadsheet; a script
    validator: { kind: csv }
  test-result-marker:
    area: cache
    patterns: ["test-results/**/*.failed"]
    producer: Invoke-TestFile (one marker per failing test file, deleted when the file passes)
    audience: the editor's lamps, which read only a marker's existence and timestamp
    validator: { kind: text }
  test-run-rule-coverage:
    area: run
    patterns: ["test-automation/{stamp}/rule-coverage.csv", "test-catzc-build/{stamp}/rule-coverage.csv"]
    producer: Test-Automation, Test-CatzcBuild
    audience: a person, in a spreadsheet; a script
    validator: { kind: csv }

  # ---- the toolset's build (out/pwsh/) ----
  catzc-bundle:
    area: build
    patterns: ["pwsh/built/*/Catzc/*"]
    target: folder
    producer: Build-Modules
    audience: Install-Catzc, and a person installing the toolset
    validator: { kind: delegate, command: Assert-CatzcBundle }
  catzc-package:
    area: build
    patterns: ["pwsh/packages/*.nupkg"]
    producer: Export-Catzc -To nuget
    audience: a NuGet feed, and Install-Catzc
    validator: { kind: zip, required_entries: ["*.nuspec"] }

  # ---- caches (out/cache/), invalidated by their own keys ----
  run-cache:
    area: cache
    patterns: ["cache/*.json"]
    producer: Format-Code (one file per imprint step), and Get-ScriptAnalyzerDiagnostics (the analyzer result cache)
    audience: the producer's next run, which skips files whose inputs are unchanged
    validator: { kind: json }
  test-duration-history:
    area: cache
    patterns: ["test-automation/durations.json"]
    producer: Save-TestDurationHistory
    audience: Test-Automation, which balances its shards by the last measured durations
    validator: { kind: json }

  # ---- diagrams (out/diagrams/) ----
  drawio-png:
    area: review
    patterns: ["diagrams/**/*.drawio.png"]
    producer: python/diagrams/drawio_png.py
    audience: a person, in any image viewer or in draw.io
    validator: { kind: drawio-png }
  drawio-model:
    area: review
    patterns: ["diagrams/**/*.xml"]
    producer: python/diagrams/drawio_png.py
    audience: draw.io, and a maker editing the drawing
    validator: { kind: drawio-model }
  minimap-stack-png:
    area: review
    patterns: ["diagrams/fan-out/**/*.stack.png"]
    producer: diagram fan-out (Flow B)
    audience: a person, in any image viewer
    validator: { kind: png }
    limits: { width: 480, height: 300 }
  minimap-tree-png:
    area: review
    patterns: ["diagrams/fan-out/**/*.tree.png"]
    producer: diagram fan-out (Flow B)
    audience: a person, in any image viewer
    validator: { kind: png }
    limits: { width: 480, height: 360 }
  review-pdf:
    area: review
    patterns: ["diagrams/*.pdf"]
    producer: python/diagrams/gallery_pdf.py
    audience: a person, in any PDF viewer
    validator: { kind: pdf }
    limits: { min_pages: 1 }
  verify-table:
    area: review
    patterns: ["diagrams/**/*.verify.md"]
    producer: the diagram maker that drew the sibling drawing
    audience: a person reviewing a drawing's claims
    validator:
      kind: md
      table_columns: ["#", Claim, Source, Verdict]
      status_column: Verdict
      statuses: [confirmed, adr-only, contradicted, drift]
  fan-out-index:
    area: review
    patterns: ["diagrams/fan-out/_manifest.json", "diagrams/fan-out/_slugs.json", "diagrams/fan-out/_placements.json"]
    producer: diagram fan-out (Flow A, Flow B)
    audience: the fan-out producers, and the review page
    validator: { kind: json }

  # ---- the comment view (comments.yml view:) ----
  comment-view:
    area: review
    patterns: ["annotated/**/*"]
    producer: Build-CommentView
    audience: a person reading a file with its comment page put back in place
    validator: { kind: text }

  # ---- agent sessions: plans, handoffs, scripts, dumps, logs (the top of out/ and their own folders) ----
  session-document:
    area: session
    # A plan cannot be regenerated, so it never ages out on its own and only a person retires it.
    max_age: none
    patterns: ["*.md"]
    producer: an agent session (plan-*.md and handoff-*.md, where .claude/CLAUDE.md places them, and other notes)
    audience: the user reviewing a plan, and the next session picking up a handoff
    validator: { kind: md }
  session-script:
    area: session
    patterns: ["*.ps1", "*.py", "*.sh"]
    producer: an agent session (a reusable script it runs instead of a sprawling one-liner)
    audience: the session that wrote it, and a person rerunning it
    validator: { kind: text }
  session-data:
    area: session
    patterns: ["*.txt", "*.csv", "*.json", "*.bak"]
    producer: an agent session (dumps, measurements, file lists, backups)
    audience: the session that wrote it
    validator: { kind: text }
  session-log:
    area: log
    max_age: none
    patterns: ["*.log"]
    producer: an agent session's run logs, and the Assert-BashTimeout hook (time-safeguard.log, which stays while it is appended)
    audience: a person tuning timeouts.yml, and the session that wrote it
    validator: { kind: text }
  session-folder:
    area: session
    patterns: ["sessions/**/*", "spike/**/*", "to-scratch-*/**/*"]
    producer: an agent session working in a folder of its own
    audience: the session that wrote it
    validator: { kind: text }

  output-keep:
    area: review
    patterns: [".gitkeep"]
    producer: Build-GitKeep
    audience: git, which keeps the otherwise ignored folder tracked
    validator: { kind: text }
