ado_naming: standard

git_workspace: main-direct

have_customers: all

# A code track's aspects are derived from the layout in languages.yml (Get-Aspect), so only the other deployable tracks declare theirs.
aspects:
  infrastructure:
    - tests: ["**/tests/**"]
    - live: ["**"]

tracks:
  pwsh:
    {
      places: [pwsh],
      type: modules,
      languages: [powershell, csharp, yaml, json, jsonl, bash, xml, css, javascript, solution, stamp, asset],
      execution_engines: [pwsh],
    }
  pwsh-vendor: { places: [pwsh/.vendor], type: vendored-code }
  infrastructure:
    { places: [infrastructure/templates, infrastructure/modules], type: infrastructure, vendor: azure, languages: [bicep, yaml] }
  ado-pipelines: { places: [pipelines], type: pipelines, vendor: ado, languages: [pipeline-yaml, powershell] }
  github-workflows: { places: [.github/workflows], type: pipelines, vendor: github, languages: [yaml] }
  docs: { places: [docs], type: documentation, languages: [markdown, asset] }
  contracts: { places: [contracts], type: contracts, languages: [markdown, pipeline-yaml, yaml, json] }
  go: { places: [go], type: verification, languages: [go] }
  python: { places: [python], type: verification, languages: [python] }
  bash: { places: [bash], type: verification, languages: [bash] }
  bash-vendor: { places: [bash/.vendor], type: vendored-code }
  .github: { places: [.github], type: vendor-settings, vendor: github, languages: [yaml, markdown] }
  .cspell: { places: [.cspell], type: vendor-settings, vendor: cspell }
  .claude: { places: [.claude], type: vendor-settings, vendor: claude, languages: [markdown, python, csharp, json, xml, html, powershell] }
  .claude-kits:
    {
      places: [.claude/drawio, .claude/slides],
      type: vendor-settings,
      vendor: claude,
      languages: [yaml, markdown, python, html, xml, powershell],
    }
  .vscode: { places: [.vscode], type: vendor-settings, vendor: vscode, languages: [json] }
  .unordered: { places: [.unordered], type: unordered, languages: [markdown] }
