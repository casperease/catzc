track_types:
  modules:
    definition:
      Deployable modules of one language's track, collected into the bundles files.yml declares; a module with no package ships nothing.
    role: deployable
    admits: [pwsh-folder, pwsh-psm1, python, go, bash]
  infrastructure:
    definition: Deployable Bicep templates and reusable Bicep modules, delivered per customer and target.
    role: deployable
    admits: [bicep]
  pipelines:
    definition: The pipeline definitions of one platform for this repository, the platform being the track's vendor.
    role: holder
    admits: [pipeline]
  vendor-settings:
    definition: The settings of one tool the repository configures, the tool being the track's vendor.
    role: holder
    admits: [settings]
  vendored-code:
    definition: Code written by a third party that the repository keeps checked in and does not author.
    role: holder
    admits: [pwsh-folder, bash]
  contracts:
    definition: The repository's boundary contracts, in both directions.
    role: holder
    admits: []
  documentation:
    definition: The ADRs, references, guides and diagram assets for the repository's readers.
    role: holder
    admits: []
  unordered:
    definition: Where imports land with their history, one landing address each, until sorted; nothing internal reads or depends on it.
    role: holder
    admits: []
    git:
      attributes: [catzc-unordered]
      why:
        files under the unordered track are imports not yet sorted, held to no domain rule until they move — the content tools (links,
        Markdown titles, source conventions) leave them as they landed (DDR-TRACK-UNORDEREDTRACK).

vendors:
  azure:
    definition: Microsoft Azure, which reads the Bicep templates and modules.
  ado:
    definition: Azure DevOps, which reads the pipeline definitions under pipelines.
  github:
    definition: GitHub, which reads the workflows and the repository settings under .github.
  claude:
    definition: Claude Code, which reads the settings, agents and hooks under .claude.
  cspell:
    definition: The cspell spell checker, which reads the dictionaries under .cspell.
  vscode:
    definition: Visual Studio Code, which reads the workspace settings under .vscode.
