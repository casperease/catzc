host_bindings:
  - file: Base.Asserts/types/ValidatePathGivenAttribute.cs
    host: pwsh
    reason:
      Refuses an empty -Path as a PowerShell parameter attribute (ValidateArgumentsAttribute), so the refusal runs at binding, before any
      command body.
  - file: Base.Docs/types/GlossaryProse.cs
    host: pwsh
    reason: Walks the PowerShell syntax tree (CommandAst, ExpandableStringExpressionAst) to find the prose a glossary term appears in.
  - file: Base.Objects/types/GlobPattern.cs
    host: pwsh
    reason: Matches with PowerShell's WildcardPattern, so a glob means in C# exactly what it means to -Like and -Path.
  - file: Base.ModuleSystem/types/FunctionCallCollector.cs
    host: pwsh
    reason: Visits the PowerShell syntax tree (ScriptBlockAst, FunctionDefinitionAst, CommandAst) to collect the function-call edges.
  - file: Base.QualityGates/types/CommentLexer.cs
    host: pwsh
    reason: Tokenizes a script with the PowerShell Parser, so a comment is found exactly where pwsh would find it.
  - file: Base.QualityGates/types/SourceConventionScan.cs
    host: pwsh
    reason:
      Visits the PowerShell syntax tree once per file (AttributeAst, ArrayLiteralAst, SwitchStatementAst, CommandAst, string constants) to
      collect what the engine-set and neutral-code checks read.
  - file: Base.Repository/types/ParsedScripts.cs
    host: pwsh
    reason: Parses scripts with the PowerShell Parser and caches their ScriptBlockAst and tokens.
  - file: Base.Repository/types/SyntaxSearch.cs
    host: pwsh
    reason: Searches the PowerShell syntax tree (CommandAst, FunctionDefinitionAst, VariableExpressionAst).
  - file: Base.Timeouts/types/PipelineWatchdog.cs
    host: pwsh
    reason: Watches a PowerShell pipeline of the host session and stops it when its time limit passes.
