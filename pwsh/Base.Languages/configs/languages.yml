formatters:
  # Prettier, for every language that names it; the extension reads the same .prettierrc.yml and .editorconfig.
  prettier:
    vscode_extension: esbenp.prettier-vscode
    settings:
      - pwsh/Base.RootConfig/assets/root/.prettierrc.yml
      - pwsh/Base.RootConfig/assets/root/.prettierignore
      - pwsh/Base.RootConfig/assets/root/.editorconfig
      - pwsh/Base.FileLimits/configs/file-limits.yml
      - pwsh/Base.Execution/configs/tools.yml#prettier
      - pwsh/Base.Execution/configs/tools.yml#node_js
  # gofmt through the Go extension, which finds the managed go on PATH and GOROOT, as the terminal does.
  gofmt:
    vscode_extension: golang.go
    settings:
      - pwsh/Base.Execution/configs/tools.yml#go
  # ruff through the Ruff extension, with the pinned ruff from the Python test workspace's environment.
  ruff:
    vscode_extension: charliermarsh.ruff
    settings:
      - pwsh/Base.Languages/configs/python.yml
      - pwsh/Base.Execution/configs/tools.yml#uv
      - pwsh/Base.Execution/configs/tools.yml#python
  psscriptanalyzer:
    vscode_extension: ms-vscode.powershell
    settings:
      - pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1
      - pwsh/.vendor/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1
      - pwsh/Base.RootConfig/assets/root/.editorconfig
      - pwsh/Base.FileLimits/configs/file-limits.yml
  # dotnet format's whitespace pass, driven by .editorconfig — the same rules the C# extension's formatter applies.
  dotnet-format:
    vscode_extension: ms-dotnettools.csharp
    settings:
      - pwsh/Base.RootConfig/assets/root/.editorconfig
      - pwsh/Base.FileLimits/configs/file-limits.yml
      - pwsh/Base.Execution/configs/tools.yml#dotnet
  # The Bicep CLI at the tools.yml pin (Install-Bicep); the Bicep extension runs the same formatter.
  bicep:
    vscode_extension: ms-azuretools.vscode-bicep
    settings:
      - pwsh/Base.Execution/configs/tools.yml#bicep
# Imprint steps run after every language's formatter: the global list over every language, a language's own list over its files only.
imprint: [comments, file-meta]
steps:
  # Before file-meta, so a page the move writes gets its meta block in the same run.
  comments:
    settings:
      - pwsh/Base.QualityGates/configs/comments.yml
      - pwsh/Base.QualityGates/configs/links.yml
      - pwsh/Base.RootConfig/assets/root/.editorconfig
      - pwsh/Base.FileLimits/configs/file-limits.yml
  file-meta:
    settings:
      - pwsh/Base.QualityGates/configs/file-meta.yml
      - pwsh/Base.Languages/configs/file-carriers.yml
      - pwsh/Base.Languages/configs/languages.yml
  # The step counts the plan overlays state, rewritten from each plan's open steps.
  plan-counts:
    settings:
      - pwsh/Base.QualityGates/configs/plans.yml
naming:
  # Assets and vendored modules are named by their source, never by the language's idiom.
  exempt_folders: [assets, .vendor]
  # The one case every name has under the idioms, for contracts, lookups and cross-language tests.
  normal_form: snake
languages:
  powershell:
    extensions: [.ps1, .psm1, .psd1]
    executable: true
    tag: pwsh
    shapes:
      [
        '^[A-Z][a-z]+(To|From)?(-[A-Z][A-Za-z0-9]*)+(\(\)| -.*)?$',
        '^Catzc(\.[A-Z][A-Za-z0-9]*)+$',
        '^\. [\w./-]+\.ps1$',
        '^\$[A-Za-z_][\w.:]*$',
        '^-[A-Za-z][\w-]*$',
      ]
    naming:
      folder: [pascal-dotted, kebab]
      file: [verb-noun, pascal-dotted, pascal]
      function: verb-noun
      type: pascal-dotted
      exempt: [importer.ps1]
    formatter: psscriptanalyzer
    drs_folder: automation/pwsh
    checks: [Test-ScriptAnalyzer, Test-Formatting, Test-Spelling, Test-Links, Test-LinkDirections, Test-Comments, Test-IdiomaticNames]
    imprint: [ps-help]
    layout:
      - { folder: ".", role: public-function, extensions: [.ps1], shipped: false }
      - { folder: ".", role: manifest, extensions: [.psd1], live: false, shipped: false }
      - { folder: private, role: private-function, shipped: false }
      - { folder: extension, role: editor-extension, live: false, shipped: false }
  bcl:
    extensions: [.cs]
    executable: true
    tag: C#
    shapes: ['^[A-Z][A-Za-z0-9]*\.[A-Z][A-Za-z0-9]*(\(.*\))?$', "^[A-Z][a-z0-9]+([A-Z][a-z0-9]+)+$"]
    formatter: dotnet-format
    drs_folder: automation/BCL
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-LinkDirections, Test-Comments, Test-BclReferences]
    imprint: [bcl-namespace]
    layout:
      - { folder: types, role: type }
  pipeline-yaml:
    extensions: [.yaml]
    formatter: prettier
    vscode_language: yaml
    drs_folder: ado
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-LinkDirections, Test-Comments]
  yaml:
    extensions: [.yml]
    tag: yml
    shapes: ['^[A-Za-z_][\w.-]*: [^{].*$']
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-LinkDirections, Test-Comments, Test-AgentDefinitions]
    layout:
      - { folder: configs, role: config }
  accosted:
    extensions: [.accosted.yml]
    tag: contract
    shapes: ["^[a-z][a-z0-9]*(_[a-z0-9]+)+$", '^[a-z][a-z0-9_]*: \{.*\}$']
    formatter: prettier
    drs_folder: automation
    checks: [Test-Formatting, Test-Spelling, Test-Links, Test-LinkDirections, Test-Comments]
    layout:
      - { folder: accosted, role: run-list, live: false, shipped: false }
  markdown:
    extensions: [.md]
    tag: md
    formatter: prettier
    checks:
      [
        Test-Markdownlint,
        Test-MarkdownTitle,
        Test-Formatting,
        Test-Spelling,
        Test-Links,
        Test-LinkDirections,
        Test-AgentDefinitions,
        Test-Plans,
      ]
    check_scopes: { Test-Plans: global.plans.folder }
    imprint: [plan-counts]
    layout:
      - { folder: ".", role: readme, extensions: [.md], live: false, shipped: false }
  bicep:
    extensions: [.bicep, .bicepparam]
    tag: bicep
    formatter: bicep
    checks: [Test-Formatting, Test-Spelling, Test-Comments, Test-BicepApiVersions, Test-BicepLint]
  python:
    extensions: [.py]
    tag: py
    executable: true
    naming: { folder: snake, file: snake, function: snake, type: pascal }
    formatter: ruff
    drs_folder: automation/python
    checks: [Test-PythonLint, Test-PythonTypes, Test-Formatting, Test-Spelling, Test-IdiomaticNames]
    tests: { runner: Invoke-PythonTest, pattern: "test_*.py", tools: [uv, python], executable_parameter: UvExecutable }
    layout:
      - { folder: ".", role: script, extensions: [.py] }
  json:
    extensions: [.json]
    formatter: prettier
    checks: [Test-Formatting, Test-Spelling]
  jsonl:
    extensions: [.jsonl]
    no_formatter: one record per line by definition, so there is no layout to format
  go:
    extensions: [.go]
    tag: go
    executable: true
    naming: { folder: flat, file: snake, function: [pascal, camel], type: [pascal, camel] }
    formatter: gofmt
    drs_folder: automation/go
    checks: [Test-Formatting, Test-Spelling, Test-IdiomaticNames]
    tests: { runner: Invoke-GoTest, pattern: "*_test.go", tools: [go], executable_parameter: GoExecutable }
    layout:
      - { folder: ".", role: source, extensions: [.go] }
  bash:
    extensions: [.sh, .bats]
    tag: bash
    executable: true
    naming: { folder: kebab, file: kebab }
    no_formatter: no engine is configured for Bash yet
    drs_folder: automation/bash
    checks: [Test-ShellScripts, Test-IdiomaticNames]
    tests: { runner: Invoke-BashTest, pattern: "*.bats", engine: bash, executable_parameter: EngineExecutable }
    layout:
      - { folder: ".", role: script, extensions: [.sh] }
  xml:
    extensions: [.ps1xml, .xml, .xsd, .dtd, .csproj]
    checks: [Test-Spelling]
    no_formatter: no engine is configured for XML; .editorconfig and the editor's XML extension cover its layout
  html:
    extensions: [.html]
    formatter: prettier
    checks: [Test-Formatting]
  css:
    extensions: [.css]
    formatter: prettier
    checks: [Test-Formatting]
  javascript:
    extensions: [.js]
    tag: js
    naming: { folder: kebab, file: kebab, function: camel, type: pascal }
    formatter: prettier
    checks: [Test-JavaScriptTypes, Test-Formatting, Test-Spelling]
    tests: { runner: Invoke-JavaScriptTest, pattern: "*.test.js", tools: [node_js], executable_parameter: NodeExecutable }
    layout:
      - { folder: ".", role: source, extensions: [.js] }
  solution:
    extensions: [.sln]
    no_formatter: the Visual Studio solution format is written by Visual Studio and dotnet sln, not formatted by hand
  stamp:
    extensions: [.stamp]
    no_formatter: a build stamp is written whole by the generator that records it
  asset:
    extensions: [.png, .svg, .pdf, .gz]
    no_formatter: binary files
