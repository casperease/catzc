concepts:
  accosted:
    key: accosted
    domain: automation
    defined_by: ADR-AUTO-ACCOSTED-FILEFORM
    short:
      "The cats language of `<name>.accosted.yml` files, a flat list of runs, each a list of harmless contracted commands in the contract
      form with literal arguments, run under every engine; the word is reserved for it."
    realized_by: { kind: type, pattern: "Catzc.Base.Contracts.AccostedFile" }
  go test module:
    key: go_test_module
    domain: automation
    defined_by: ADR-AUTO-GO-GOTESTMODULE
    short:
      The folder `<root>/tests/<module>/` under the Go root — one Go module per catzc module, named for it as one lowercase word
      (`baserepository`), holding its black-box Go tests.
    realized_by: { kind: prose-only }
  python test folder:
    key: python_test_folder
    domain: automation
    defined_by: ADR-AUTO-PY-PYTESTFOLDER
    short:
      The folder `<root>/tests/<module>/` under the Python root — one per catzc module, named for it in snake case
      (`base_repository`), holding its black-box Python tests; each is a member of the one generated uv workspace.
    realized_by: { kind: prose-only }
  repository normal form:
    key: repository_normal_form
    domain: automation
    defined_by: ADR-AUTO-IDIOM-NORMALFORM
    short:
      The one language-neutral spelling of a function, type, parameter or module name, in the naming case the languages config sets as
      `naming.normal_form`, which is `snake` (`get_command_contract`); every language's idiomatic name is a rendering of it.
    realized_by: { kind: prose-only }
  bash test folder:
    key: bash_test_folder
    domain: automation
    defined_by: ADR-AUTO-BASH-BASHTESTFOLDER
    short:
      The folder `<root>/tests/<module>/` under the Bash root — one per catzc module, named for it in kebab case, holding its black-box
      `.bats` tests, which call catzc through `importer.sh` and `cats`.
    realized_by: { kind: prose-only }
