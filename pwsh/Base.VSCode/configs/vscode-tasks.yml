version: "2.0.0"
tasks:
  # The git topic flow, each step at the user's hand: Sync rebases the topic onto the sync point.
  - label: Sync
    type: process
    command: pwsh
    args:
      - -NoProfile
      - -Command
      - . ./importer.ps1; Sync-Topic
    presentation:
      reveal: always
      panel: shared
    problemMatcher: []
  # Commit everything on the topic with the typed message; an empty message becomes "...".
  - label: Save
    type: process
    command: pwsh
    args:
      - -NoProfile
      - -Command
      - . ./importer.ps1; Save-Topic -Message $env:COMMIT_MESSAGE
    options:
      env:
        COMMIT_MESSAGE: ${input:commitMessage}
    presentation:
      reveal: always
      panel: shared
    problemMatcher: []
  # Land the topic: save, squash, rebase onto the current server HEAD, squash again and push by the workspace variant.
  - label: Push
    type: process
    command: pwsh
    args:
      - -NoProfile
      - -Command
      - . ./importer.ps1; Push-Topic -Message $env:COMMIT_MESSAGE
    options:
      env:
        COMMIT_MESSAGE: ${input:commitMessage}
    presentation:
      reveal: always
      panel: shared
    problemMatcher: []
inputs:
  - id: commitMessage
    type: promptString
    description: Commit message (empty = ...)
    default: ""
