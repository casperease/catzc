carried:
  # The track lamps add files.exclude rows at workspace scope and list them under their own key; the render keeps both as they are.
  files.exclude: catzc.trackLamps.owned

# The .editorconfig sections rendered into per-language settings, each glob to its language ids; [*] renders top-level.
editorconfig:
  "*.{ps1,psm1,psd1}": [powershell]
  "*.md": [markdown]
  "*.{yml,yaml}": [yaml]
  "*.{json,jsonl}": [json, jsonc, jsonl]
  "{*.go,go.mod,go.work}": [go, go.mod, go.work]
  "*.py": [python]
  "*.bicep": [bicep]
  "*.{xml,ps1xml,xsd,dtd,csproj}": [xml]

# The editor actions kept off its menus, by menu id; Set-VsCodeHiddenAction writes them to VS Code's state store while it is closed.
hidden_actions:
  ViewTitle:
    - workbench.files.action.createFileFromExplorer
    - workbench.files.action.createFolderFromExplorer
    - workbench.files.action.refreshFilesExplorer
    - workbench.files.action.collapseExplorerFolders

# The one authored source of .vscode/settings.json, a gitignored copy New-VsCodeSettings renders: edit this file, never settings.json.
settings:
  # Markdown settings (built-in preview)
  markdown.preview.fontFamily: "Consolas, 'Courier New', monospace"
  markdown.styles:
    - .vscode/markdown-preview-dark.css
  markdown.preview.lineHeight: 1.6
  markdown.preview.fontSize: 14
  markdown.preview.scrollPreviewWithEditor: true
  markdown.preview.scrollEditorWithPreview: true
  markdown.preview.markEditorSelection: true
  # A double-click in the preview opens the source at that line (.md opens rendered, see workbench.editorAssociations)
  markdown.preview.doubleClickToSwitchToEditor: true

  # Markdown link validation while editing, early feedback for what Test-Links gates; http(s) links are never checked.
  markdown.validate.enabled: true
  markdown.validate.fileLinks.enabled: warning
  markdown.validate.fragmentLinks.enabled: warning
  markdown.validate.fileLinks.markdownFragmentLinks: warning
  # Off: VS Code reads every footnote use as an undefined reference link; markdownlint MD052 gates real reference links.
  markdown.validate.referenceLinks.enabled: ignore
  # Offer to rewrite relative links in .md files when a linked file or folder is moved or renamed
  markdown.updateLinksOnFileMove.enabled: prompt
  markdown.updateLinksOnFileMove.enableForDirectories: true

  # Markdown Preview Enhanced settings

  # PowerShell: use pwsh 7 for the Integrated Console
  powershell.powerShellDefaultVersion: PowerShell (x64)
  # The Extension Terminal starts in the background; the editor keeps full height, the terminal stays one Ctrl+` away
  powershell.integratedConsole.showOnStartup: false

  # PowerShell: use project PSScriptAnalyzer settings for analysis (squiggles)
  powershell.scriptAnalysis.settingsPath: ./pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1

  # Format Document uses these settings, not the psd1, so they match PSScriptAnalyzerSettings.psd1 or formatter and analyzer disagree.
  powershell.codeFormatting.pipelineIndentationStyle: IncreaseIndentationForFirstPipeline
  # Expand aliases on format — the psd1 enforces PSAvoidUsingCmdletAliases.
  powershell.codeFormatting.autoCorrectAliases: true
  # Leave casing alone — PSUseCorrectCasing is disabled in the psd1 (false positives on Pester params).
  powershell.codeFormatting.useCorrectCasing: false
  # Aligned hashtable pairs; the psd1 ignores the assignment operator inside a hashtable, so the analyzer accepts the aligned '='.
  powershell.codeFormatting.alignPropertyValuePairs: true
  # One-line blocks break across lines on format, matching the psd1's IgnoreOneLineBlock = $false.
  powershell.codeFormatting.ignoreOneLineBlock: false
  # XML is never reformatted: no engine formats it, and the editor's XML formatter rewraps element text.
  xml.format.enabled: false
  # Git state on the open file, in the lamps' one mapping.
  git.decorations.enabled: true
  workbench.editor.decorations.colors: true
  workbench.editor.decorations.badges: true
  scm.diffDecorations: all
  scm.diffDecorationsGutterVisibility: always
  workbench.colorCustomizations:
    # Every colour names a lamp-palette shade (palette.<range>.<shade>, '/<aa>' sets the alpha); New-VsCodeSettings resolves it.
    gitDecoration.modifiedResourceForeground: palette.unstaged.text
    gitDecoration.untrackedResourceForeground: palette.unstaged.text
    gitDecoration.stageModifiedResourceForeground: palette.staged.text
    gitDecoration.addedResourceForeground: palette.staged.text
    gitDecoration.stageDeletedResourceForeground: palette.staged.text
    editorGutter.modifiedBackground: palette.unstaged.mark
    editorGutter.addedBackground: palette.unstaged.mark
    editorOverviewRuler.modifiedForeground: palette.unstaged.mark
    editorOverviewRuler.addedForeground: palette.unstaged.mark
    minimapGutter.modifiedBackground: palette.unstaged.mark
    minimapGutter.addedBackground: palette.unstaged.mark
    catzc.gitChanges.stagedBackground: palette.staged.background
    catzc.gitChanges.unstagedBackground: palette.unstaged.background
    diffEditor.insertedLineBackground: palette.unstaged.background
    diffEditor.insertedTextBackground: palette.unstaged.mark/59
    diffEditor.removedLineBackground: palette.staged.mark/26
    diffEditor.removedTextBackground: palette.staged.mark/59

  # The title-row icons of every view show without a hover, so the track lamps in the Explorer's folder row are always visible.
  workbench.view.alwaysShowHeaderActions: true
  # The Explorer's file icons come from the cats icon theme (file-icons.yml), rendered as the catzc-file-icons extension.
  workbench.iconTheme: catzc-file-icons

  files.exclude:
    "**/tmp": true
    "**/*.bkp": true
    "**/*.dtmp": true
    "**/bash.exe.stackdump": true
    "**/.ruff_cache": true
    "go.work.sum": true
    "*/tests/*/go.sum": true
    "*/.venv": true
    "*/uv.lock": true
    pwsh/.compiled/*.tmp: true
    pwsh/.internal/assets/obj: true
    pwsh/.internal/assets/bin: true
    .claude/hooks/bin: true
    .claude/hooks/Assert-BashTimeout/obj: true
    .claude/hooks/Assert-BashTimeout/bin: true

  # Vendored modules and generated manifests stay out of search; the analyzer config is un-excluded, and root-config targets injected.
  search.exclude:
    pwsh/.vendor: true
    pwsh/**/*.psd1: true
    pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1: false

  # Generated manifests and installed tool trees are not watched; the analyzer config and out/ are.
  files.watcherExclude:
    "**/pwsh/**/*.psd1": true
    "**/pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1": false
    "**/python/.venv/**": true
    "**/node_modules/**": true

  # Each language's formatter is injected from languages.yml, so Format Document runs the engine Format-Code runs; no format-on-save.
  "[markdown]":
    editor.quickSuggestions:
      comments: "on"
      strings: "on"
      other: "on"
    editor.wordWrap: "off"

  # LICENSE as plain text, .yml generic and .yaml pipeline YAML, .markdownlintignore as an ignore file, out/ console captures as ansi.
  files.associations:
    "**/LICENSE": plaintext
    "**/.gitkeep": plaintext
    "**/*.yml": yaml
    "**/.markdownlintignore": ignore

  # No extension fetches a schema: every schema the editor checks against is a local file named below.
  yaml.schemaStore.enable: false
  json.schemaDownload.enable: false
  yaml.schemas:
    # Every .yaml in the tree is an Azure Pipelines file, checked against our pipeline schema in contracts/catzc.
    ./contracts/catzc/0.1.0/pwsh.azure.dev_ops/pipeline.yaml.schema.json:
      - "**/*.yaml"
    # A GitHub Actions workflow is checked against our workflow schema in contracts/catzc.
    ./contracts/catzc/0.1.0/pwsh.tooling.github/workflow.yml.schema.json:
      - ".github/workflows/*.yml"

  # A compiled ARM template is checked against our local schema of Azure's template (contracts/catzc), never a download.
  json.schemas:
    - fileMatch:
        - "**/main.json"
      url: ./contracts/catzc/0.1.0/pwsh.azure.templates/arm/main.json.schema.json

  # *.drawio.png opens in the image preview, so git Compare shows a pixel diff; Reopen Editor With edits the diagram.
  workbench.editorAssociations:
    "*.drawio.png": imagePreview.previewEditor
    "*.md": vscode.markdown.preview.editor

  # A click in the Source Control pane opens the file on disk; the diff stays on the right-click menu as "Open Changes".
  git.openDiffOnClick: false

  # Trunk-based fast push: Commit takes the text field, never opens COMMIT_EDITMSG, stages everything when nothing is staged, and pushes.
  git.useEditorAsCommitInput: false
  git.enableSmartCommit: true
  git.suggestSmartCommit: false
  git.smartCommitChanges: all
  git.postCommitCommand: push

  # GOTOOLCHAIN=local: the editor never downloads a toolchain; it runs the managed go the generator injects as go.goroot.
  go.toolsEnvVars:
    GOTOOLCHAIN: local

  # {python.<key>} names a folder of the python config; New-VsCodeSettings resolves it.
  terminal.integrated.env.windows:
    PYTHONPYCACHEPREFIX: ${workspaceFolder}/{python.pycache}
  terminal.integrated.env.linux:
    PYTHONPYCACHEPREFIX: ${workspaceFolder}/{python.pycache}
  terminal.integrated.env.osx:
    PYTHONPYCACHEPREFIX: ${workspaceFolder}/{python.pycache}
  # The interpreter is injected; a terminal is never activated into it, since the tests run through Test-Automation.
  python.terminal.activateEnvironment: false
  python-envs.terminal.autoActivationType: "off"
  # No relaunch when an extension adds environment variables: it would kill an untyped terminal's pwsh and its import.
  terminal.integrated.environmentChangesRelaunch: false
  # The test explorer discovers the Python tests with pytest, from the tests folder of the test project.
  python.testing.pytestEnabled: true
  python.testing.pytestArgs:
    - python/tests
    - -o
    - cache_dir=${workspaceFolder}/{python.pytest_cache}

  # C# Dev Kit loads the IDE-only catzc.sln at the root, never a project it finds on its own.
  dotnet.defaultSolution: catzc.sln

  # Spell checking: the single repository dictionary is /cspell.yml, auto-discovered by Code Spell Checker.
  cSpell.enabled: true
  # Information = blue squiggle (Error = red, Warning = yellow).
  cSpell.diagnosticLevel: Information
