# The settings Test-Plans holds the plans folder to ([ADR-REPO-PLANS](/docs/drs/repository/plans.md)); the defaults are declared once on
# PlansConfig.
folder: .claude/plans
statuses: [active, blocked]
ranks: [highest, high, medium-high, medium, low-medium, low]
head:
  required: [status, value, reviewed, targets]
  allowed: [blocked_on, waits_on, class, next, parent, siblings, role, rule]
sections:
  required: [Open steps]
  carried: Carried
master:
  file: plan-master.md
  sections: [Process, Chunks]
tasks:
  max: 50
names:
  - '^plan-[a-z][a-z0-9]*(-[a-z0-9]+)*\.md$'
  - '^prompt-[a-z][a-z0-9]*(-[a-z0-9]+)*\.md$'
  - '^task-[a-z][a-z0-9]*(-[a-z0-9]+)*\.md$'
  - '^value-of-plan\.md$'
  - '^decisions-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$'
  - '^questionnaire-[a-z0-9]+(-[a-z0-9]+)*\.md$'
