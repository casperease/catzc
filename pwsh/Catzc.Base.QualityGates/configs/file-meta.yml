warning: "Generated Header"

head_policy:
  default: facts
  classes:
    agent: forbidden
    capability: config
    slide: config
    diagram-declaration: forbidden

kinds:
  # The comment page a file points at, only when it exists, as its path from the file's own folder; a test is found by convention, its stem under tests/.
  relative-edges:
    keys: [docs]
    settings:
      relations:
        - name: docs
          link: "{relative_path}"
          rules:
            - { paths: ["{page}"] }
