# Whether a file of a class carries the facts its kinds produce, none at all, or only its authored config part; the first class that matches decides, else the default (facts on the type): a head only when a fact is non-empty.
# The line an authored head opens with, above its edges, naming the command that writes it; a file with no fact still carries no head.
warning: "Header is generated by Format-FileMeta via Format-Code; do not change it"

head_policy:
  default: facts
  classes:
    agent: forbidden
    capability: config
    slide: config
    diagram-declaration: forbidden

kinds:
  # The comment page a file points at, only when it exists, as a link relative to the file's own folder, so it opens in GitHub and an editor; a test is found by convention, its stem under tests/.
  relative-edges:
    section: edges
    keys: [docs]
    settings:
      relations:
        - name: docs
          link: "[{leaf}]({relative_path})"
          rules:
            - { paths: ["{page}"] }

  # The ADR codes a file and its comment page cite, on every authored class, never read back from its head; a code class also lists bare domain codes. A page that renders a registry carries none.
  drs-codes:
    section: edges
    keys: [cites]
    settings:
      domain_classes:
        [type, function, config, hook, module/internal, pipeline, pipeline-template, template, test, fixture, asset, analyzer-rule]
