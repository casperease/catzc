warning: "Header is generated by Format-FileMeta via Format-Code; do not change it"

head_policy:
  default: facts
  classes:
    agent: forbidden
    capability: config
    slide: config
    diagram-declaration: forbidden

kinds:
  # The comment page a file points at, only when it exists, as a link relative to the file's own folder, so it opens in GitHub and an editor; a test is found by convention, its stem under tests/.
  relative-edges:
    section: edges
    keys: [docs]
    settings:
      relations:
        - name: docs
          link: "[{leaf}]({relative_path})"
          rules:
            - { paths: ["{page}"] }

  # The ADR codes the prose of a file and its comment page cites, on every authored class, never read back from its head, and the count of every distinct code the document cites, its yml drawio blocks included; a code class also lists bare domain codes. A page that renders a registry carries none.
  drs-codes:
    section: edges
    keys: [cites, drs_total]
    settings:
      domain_classes:
        [type, function, config, hook, module/internal, pipeline, pipeline-template, template, test, fixture, asset, analyzer-rule]
