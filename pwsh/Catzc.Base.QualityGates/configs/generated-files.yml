writers:
  Build-DrsIndex:
    inputs: [docs/drs/**, pwsh/Catzc.Base.Drs/**]
    outputs: [docs/drs/index.md]
  Build-Glossary:
    inputs: [docs/drs/**, pwsh/*/configs/glossary.yml, pwsh/Catzc.Base.Docs/**]
    outputs: [docs/drs/glossary.md]
  Build-Readme:
    result_path: Readme
    inputs: [docs/references/**, docs/drs/index.md, pwsh/Catzc.Base.Docs/**]
    outputs: ["**/README.md"]
  Build-ContractReference:
    inputs: [contracts/**, docs/drs/repository/*-contracts.md, pwsh/Catzc.Base.Contracts/**]
    outputs: [docs/references/contracts/*.md]
  Build-GitKeep:
    inputs: [pwsh/Catzc.Base.Docs/**]
    outputs: ["**/.gitkeep"]
  Build-TerminologyDictionary:
    inputs: [pwsh/Catzc.Base.QualityGates/**]
    outputs: [".cspell/*.txt"]
  Build-DrsCodeDictionary:
    inputs: [docs/drs/**, pwsh/Catzc.Base.Drs/**]
    outputs: [.cspell/drs-codes.txt]
  Build-EnglishDictionary:
    check: english-dictionary
    inputs: [pwsh/Catzc.Base.Execution/configs/tools.yml, pwsh/Catzc.Base.QualityGates/**]
    outputs: [pwsh/Catzc.Base.QualityGates/assets/english.*]
  Build-RootConfig:
    check: root-config
