analyzers:
  # Custom rules (pwsh/.scriptanalyzer)
  Measure-VariableCasing: [ADR-PWSH-FORMAT-VARIABLECASING]
  Measure-NeverDependOnPwd: [ADR-AUTO-NOPWD-NOWORKINGDIRECTORYPATHS, ADR-PWSH-PWD-RESTORESETLOCATION]
  Measure-FunctionLength: [ADR-AUTO-ONEJOB-NOHIDDENBUNDLING]
  Measure-NoWriteErrorOrWarning: [ADR-PWSH-ERROR-THROWNOTWRITEERROR, ADR-PWSH-ERROR-NOWRITEWARNING]
  Measure-NoAzModuleNaming: [ADR-AZ-CLI-AZURENOUNPREFIX]
  Measure-NoAutomaticVariableMisuse: [ADR-PWSH-AUTOVAR-NOQUESTIONMARKVARIABLE]
  Measure-NoForEachObjectControlFlow: [ADR-PWSH-FOREACH-NOCONTROLFLOWINFOREACHOBJECT]
  Measure-NoRawVsoCommand: [ADR-ADO-VAR-NORAWLOGGINGCOMMANDS]
  Measure-NoRawPipelineDetection: [ADR-FLOW-CD-DETECT-NODIRECTVARIABLECHECK]
  Measure-NoRawInformationStream: [ADR-PWSH-ANNOUNCE-CORRECTSTREAM]
  Measure-NoRawConsoleWrite: [ADR-PWSH-ANNOUNCE-INFORMATIONSTREAMCHOKEPOINT]
  Measure-AnnounceStateChange:
    [
      ADR-PWSH-ANNOUNCE-INFORMATIONRECORD,
      ADR-PWSH-ANNOUNCE-UNANNOUNCEDCHANGES,
      ADR-AUTO-CONSOLE-ANNOUNCELASTINGCHANGES,
      ADR-AUTO-CONSOLE-SILENTTRANSIENTCHANGES,
    ]
  Measure-PersistentWriteThroughSeam: [ADR-AUTO-TEST-SYSTEMTESTSATLTHREE]
  Measure-SpellOutIdentifiers: [ADR-PWSH-NAMES-ANALYZERRULE]
  Measure-NoScriptRootAnchor: [ADR-PWSH-PWD-MODULELOCATESCONTENT, ADR-AUTO-ASSETDEP-INTERNALASSETDEPENDENCY]
  Measure-NoEnvRepositoryRoot: [ADR-AUTO-NOPWD-ONEROOTACCESSOR]
  Measure-ParameterFillIn: [ADR-PWSH-PARAM-RESOLUTIONORDER]
  Measure-PrimaryArgumentPosition: [ADR-PWSH-PARAM-POSITIONALPRIMARY]
  Measure-NoOptionalBooleanParameter: [ADR-PWSH-PARAM-SWITCHNOTBOOL]
  Measure-NoSwitchDefaultOn: [ADR-PWSH-PARAM-SWITCHNOTBOOL]
  Measure-NoUnsafeFirstIndex: [ADR-PWSH-ERROR-STRICTCLEAN]
  Measure-NoCollapsingAssignment: [ADR-PWSH-ERROR-STRICTCLEAN]
  Measure-NoBareCacheEntryRead: [ADR-PWSH-CACHE-STRICTSAFEPROBE]
  Measure-NoUnboundedEnumeration: [ADR-PWSH-ENUM-RAWDOTNETENUMERATION, ADR-PWSH-ENUM-ALWAYSBOUNDED]
  Measure-NoOneLineHashtableIfElse: [ADR-PWSH-FORMAT-MULTILINECONDITIONALHASHTABLE]
  Measure-NoLiteralDefault: [ADR-AUTO-DEFAULT-ONERESOLUTIONORDER, ADR-PRIN-CONFIG-DEFAULTDECLAREDONCE]
  Measure-NoTrackRootLiteral: [ADR-AUTO-LAYERS-TOOLSRUNTHROUGHENGINE]

  # Enabled built-in rules that enforce an ADR
  PSUseApprovedVerbs: [ADR-PWSH-VERBS-APPROVEDVERBS]
  PSAvoidSemicolonsAsLineTerminators: [ADR-PWSH-NOSEMI-NOTRAILINGSEMICOLONS]
  PSPlaceOpenBrace: [ADR-PWSH-FORMAT-KANDRBRACES]
