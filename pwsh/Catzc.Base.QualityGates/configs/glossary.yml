concepts:
  tier:
    key: tier
    domain: automation
    defined_by: ADR-AUTO-TEST-TWOMANDATORYTAGS
    short: A test's level, L0 to L4 — one mandatory tag that sets what the test may touch and when it runs.
    realized_by: { kind: tag, pattern: "L0|L1|L2|L3|L4" }
    contrasts:
      category: A category says what a test reads (logic or integrity); a tier says what it may touch and when it runs.
      phase: A phase is when a test's file runs within a run (parallel, greedy, serial); a tier is what the test may touch.
      test suite: A test suite is a declared selection of modules up to a top tier; a tier is one level a single test carries.
      vertical test:
        A vertical test is an L2 or L3 test that cuts from its ring through to the core; a tier names the ring, any test has one.
    avoid:
      - { phrase: L2 suite, say: the L2 tests / the L2 tier }
      - { phrase: L2 test suite, say: the L2 tests / the L2 tier }
      - { phrase: L3 suites, say: the L3 tests / the L3 tier }
  testing in production:
    key: testing_in_production
    domain: automation
    defined_by: ADR-AUTO-TEST-TESTINGINPRODUCTION
    short: The L4 tier — tests of the released system itself, after final approval, that observe it and create nothing of their own.
    realized_by: { kind: tag, pattern: "L4" }
    contrasts:
      vertical test:
        A vertical test crosses the local-tool or outside-state ring around the code; testing in production checks the released system.
  category:
    key: category
    domain: automation
    defined_by: ADR-AUTO-TEST-ONECATEGORY
    short: A test's kind, logic or integrity — one mandatory tag saying whether it runs on fixtures or reads the shipped assets.
    realized_by: { kind: tag, pattern: "logic|integrity" }
    avoid:
      - { phrase: integrity suite, say: the integrity tests }
  test run:
    key: test_run
    domain: automation
    defined_by: ADR-AUTO-TEST-TESTRUN
    short:
      One invocation of Test-Automation, Test-CatzcBuild, or Invoke-TestFile over a selection of test files, in one location, with one
      report.
    realized_by: { kind: artifact, pattern: "out/test-*/*/run.json" }
    contrasts:
      all tests: All tests is every test in the repository, at rest; a test run executes one selection of them, possibly all.
      test suite: A test suite is a declared selection at rest; a test run executes a selection, a test suite or an ad-hoc one.
    avoid:
      - { phrase: source suite, say: source run }
      - { phrase: build suite, say: build run }
      - { phrase: build suites, say: build runs }
      - { phrase: both suites, say: both runs (the source run and the build run) }
      - { phrase: two suites, say: two test runs (the source run and the build run) }
  gate:
    key: gate
    domain: flow
    defined_by: ADR-FLOW-CD-GATEDEFINED
    short: A check whose verdict decides whether work may proceed — automated (a quality gate, the CI gate) or human (RC, RBC).
    realized_by: { kind: prose-only }
    forms: [quality, CI, AT, RC, RBC, BVT, release, manual, PR, merge, commit, approval, production, push]
    contrasts:
      quality gate: A quality gate is one automated check of the repository; a gate is any decision point, human or automated.
  quality gate:
    key: quality_gate
    domain: automation
    defined_by: ADR-AUTO-TEST-QUALITYGATE
    short:
      A gate checking one property of the whole repository automatically — one `Test-<subject>` function that reports through
      Write-QualityGateReport and throws once with every issue.
    realized_by: { kind: function, pattern: "Write-QualityGateReport" }
    relations:
      kind_of: [gate]
    contrasts:
      build verification test: The BVT is the verification that runs every quality gate together; a quality gate is one check inside it.
    avoid:
      - { phrase: analyzer suite, say: the analyzer quality gate (Test-ScriptAnalyzer) }
  test file:
    key: test_file
    domain: automation
    defined_by: ADR-AUTO-TEST-TESTFILE
    short:
      One file of tests that discovery maps to one catzc module — the unit a test run schedules, never split; in pwsh a Verb-Noun.Tests.ps1
      under tests/.
    realized_by: { kind: file-pattern, pattern: "pwsh/*/tests/**/*.Tests.ps1" }
    contrasts:
      test block: A test block is a Describe or Context inside a test file; a test file is the file that holds them.
    avoid:
      - { phrase: cross-cutting suite, say: cross-cutting test file }
  test block:
    key: test_block
    domain: pwsh
    defined_by: ADR-PWSH-PESTER-TESTISIT
    short: A Describe or Context in a test file — a named group of tests whose tags and setup apply to everything inside it.
    realized_by: { kind: function, pattern: "Describe|Context" }
    relations:
      part_of: [test file]
    contrasts:
      test: A test is one It that passes or fails; a test block groups tests and carries their shared tags and setup.
  test:
    key: test
    domain: automation
    defined_by: ADR-AUTO-TEST-TEST
    short:
      The smallest unit of verification that passes or fails on its own — counted by every report row, rule citation, skip, and timing; in
      pwsh one Pester It.
    realized_by: { kind: function, pattern: "It" }
    relations:
      part_of: [test block]
  phase:
    key: phase
    domain: automation
    defined_by: ADR-AUTO-TEST-ONESCHEDULINGPOOL
    short:
      A test run's scheduling stage — parallel and greedy files share one pool, serial runs last — chosen per file by the serial/greedy
      tags.
    realized_by: { kind: tag, pattern: "serial|greedy" }
    forms: [parallel, serial, greedy, worker, execution, run, test]
  build verification test:
    key: bvt
    domain: automation
    defined_by: ADR-AUTO-TEST-BUILDVERIFICATIONTEST
    short: The BVT — the verification that precedes every promotion and every creation of release artifacts, and that the commit gate runs.
    realized_by: { kind: prose-only }
  all tests:
    key: all_tests
    domain: automation
    defined_by: ADR-AUTO-TEST-ALLTESTS
    short:
      Every test in the repository — every test file of every module, at every tier and category; what a test run selects at its defaults.
    realized_by: { kind: function, pattern: "Test-Automation" }
    contrasts:
      test suite: A test suite is a named selection, usually a few modules up to a tier; all tests is every test there is.
    avoid:
      - { phrase: the test suite, say: all tests }
      - { phrase: pester suite, say: all tests }
      - { phrase: pester test suite, say: all tests }
      - { phrase: full suite, say: all tests }
  test suite:
    key: test_suite
    domain: automation
    defined_by: ADR-AUTO-TEST-TESTSUITE
    short:
      A named, declared selection of tests that runs as one unit — a globset's verify scope in globs.yml (modules up to a tier), run with
      Test-Automation -Suite.
    realized_by: { kind: config-key, pattern: "pwsh/Catzc.Base.Globs/configs/globs.yml" }
  vertical test:
    key: vertical_test
    domain: automation
    defined_by: ADR-AUTO-TEST-ONIONOFRINGS
    short: An L2 or L3 test that cuts from an outer ring of the test onion (local tools; outside state) through to the core, the code alone.
    realized_by: { kind: tag, pattern: "L2|L3" }
  markdown link:
    key: markdown_link
    domain: repository
    defined_by: ADR-REPO-LINK-KINDBYFILE
    short: A link inside a rendered .md file, written relative to that file so it resolves the same on GitHub and in VS Code.
    realized_by: { kind: function, pattern: Test-Links }
    contrasts:
      code link:
        A code link lives in a comment of a non-markdown file and is repository-rooted; a markdown link lives in a .md file and is relative
        to it.
  code link:
    key: code_link
    domain: repository
    defined_by: ADR-REPO-LINK-KINDBYFILE
    short: An ADR citation in a code comment, written as a repository-rooted markdown link whose text is the citation code.
    realized_by: { kind: function, pattern: Format-Links }
  comment page:
    key: comment_page
    domain: repository
    defined_by: ADR-REPO-COMMENTS-ONELINEOFINSIGHT
    short: The Markdown page under docs/references that holds a file's long comments verbatim, one numbered section per comment.
    realized_by: { kind: function, pattern: Export-Comments }
