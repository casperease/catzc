# ---
# catzc:
#   docs: "../../../docs/references/pwsh/catzc-base-root-config/configs/rootconfig.yml.md"
#   warning: "Generated Header"
# ---

files:
  - target: PSScriptAnalyzerSettings.psd1
    source: pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1
    optIn: true
  - target: importer.ps1
    generator: New-Importer
    sources:
      - pwsh/.internal/Catzc.Internal.Importer.psm1
    committed: true
    optIn: true
  - target: importer.sh
    source: pwsh/Catzc.Base.RootConfig/assets/root/importer.sh
    committed: true
    optIn: true
  - target: pwsh/.internal/assets/importer-commands.sh
    generator: New-CatsCommandLookup
    sources:
      - contracts/catzc/0.0.0
    committed: true
    optIn: true
  - target: .vscode/settings.json
    generator: New-VsCodeSettings
    sources:
      - pwsh/Catzc.Base.VSCode/configs/vscode-settings.yml
      - pwsh/Catzc.Base.RootConfig/configs/rootconfig.yml
      - pwsh/Catzc.Base.Languages/configs/languages.yml
      - pwsh/Catzc.Base.Variants/configs/variants.yml
      - pwsh/Catzc.Base.Globs/configs/filters.yml
    carrier: jsonc
    optIn: true
  - target: .vscode/extensions.json
    generator: New-VsCodeExtensions
    sources:
      - pwsh/Catzc.Base.VSCode/configs/vscode-extensions.yml
      - pwsh/Catzc.Base.Languages/configs/languages.yml
    carrier: jsonc
    optIn: true
  - target: .vscode/launch.json
    generator: New-VsCodeLaunch
    sources:
      - pwsh/Catzc.Base.VSCode/configs/vscode-launch.yml
    carrier: jsonc
    optIn: true
  - target: .vscode/tasks.json
    generator: New-VsCodeTasks
    sources:
      - pwsh/Catzc.Base.VSCode/configs/vscode-tasks.yml
    carrier: jsonc
    optIn: true
  - target: .vscode/azure-pipelines-schema.json
    generator: New-VsCodePipelineSchema
    sources:
      - pwsh/Catzc.Base.VSCode/configs/vscode-pipeline-schema.yml
    carrier: json-schema
    optIn: true
  - target: go.work
    generator: New-GoWorkspace
    sources:
      - pwsh/Catzc.Base.Languages/configs/go.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: go-workspace
    optIn: true
  - target: "*/tests/*/go.mod"
    generator: New-GoWorkspace
    sources:
      - pwsh/Catzc.Base.Languages/configs/go.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: go-workspace
    optIn: true
  # A module of the go track is a go.work member with its own go.mod at the module root.
  - target: "*/*/go.mod"
    generator: New-GoWorkspace
    sources:
      - pwsh/Catzc.Base.Languages/configs/go.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: go-workspace
    optIn: true
  - target: "*/pyproject.toml"
    generator: New-PythonProject
    sources:
      - pwsh/Catzc.Base.Languages/configs/python.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: toml
    optIn: true
  - target: "*/tests/*/pyproject.toml"
    generator: New-PythonProject
    sources:
      - pwsh/Catzc.Base.Languages/configs/python.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: toml
    optIn: true
  # A module of the python track is a workspace member with its own pyproject.toml at the module root.
  - target: "*/*/pyproject.toml"
    generator: New-PythonProject
    sources:
      - pwsh/Catzc.Base.Languages/configs/python.yml
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: toml
    optIn: true
  - target: .vscode/markdown-preview-dark.css
    source: pwsh/Catzc.Base.VSCode/assets/markdown-preview-dark.css
    optIn: true
  - target: .editorconfig
    source: pwsh/Catzc.Base.RootConfig/assets/root/.editorconfig
    carrier: dotfile
    optIn: true
  - target: .markdownlint.yml
    source: pwsh/Catzc.Base.RootConfig/assets/root/.markdownlint.yml
    optIn: true
  - target: .markdownlintignore
    source: pwsh/Catzc.Base.RootConfig/assets/root/.markdownlintignore
    carrier: dotfile
    optIn: true
  - target: .prettierrc.yml
    source: pwsh/Catzc.Base.RootConfig/assets/root/.prettierrc.yml
    optIn: true
  - target: .prettierignore
    source: pwsh/Catzc.Base.RootConfig/assets/root/.prettierignore
    carrier: dotfile
    optIn: true
  - target: .cspell/.gitignore
    source: pwsh/Catzc.Base.RootConfig/assets/root/.cspell/.gitignore
    carrier: dotfile
    optIn: true
  - target: cspell.yml
    generator: New-Cspell
    sources:
      - pwsh/Catzc.Base.RootConfig/assets/root/cspell-template.yml
      - pwsh/Catzc.Base.Globs/configs/globs.yml
    optIn: true
  - target: dotnet-tools.json
    source: pwsh/Catzc.Base.RootConfig/assets/root/dotnet-tools.json
    optIn: true
  - target: pwsh/.internal/assets/Catzc.Types.csproj
    source: pwsh/Catzc.Base.TypesSystem/assets/Catzc.Types.csproj.xml
    carrier: msbuild-project
    committed: true
    optIn: true
  # Committed, since the C# Dev Kit restores the solution as the folder opens, before any import: no dotnet run reaches a package source.
  - target: nuget.config
    generator: New-NuGetConfig
    sources:
      - pwsh/Catzc.Base.Languages/New-NuGetConfig.ps1
    carrier: nuget-config
    committed: true
    optIn: true
  - target: Directory.Build.props
    generator: New-DotnetBuildProps
    sources:
      - pwsh/Catzc.Base.Execution/configs/tools.yml
    carrier: msbuild-project
    committed: true
    optIn: true
  - target: catzc.sln
    source: pwsh/Catzc.Base.RootConfig/assets/root/catzc.sln
    optIn: true
  - target: .gitattributes
    generator: New-GitAttributes
    sources:
      - pwsh/Catzc.Base.RootConfig/assets/root/.gitattributes-template
      - pwsh/Catzc.Base.Globs/configs/file-kinds.yml
    carrier: dotfile
    committed: true
    optIn: true
  - target: .gitignore
    generator: New-GitIgnore
    sources:
      - pwsh/Catzc.Base.Git/configs/gitignore.yml
      - pwsh/Catzc.Base.RootConfig/configs/rootconfig.yml
    carrier: dotfile
    committed: true
    optIn: true
