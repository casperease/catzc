writers:
  # A diagram's declaration is its .drawio.yml, or a yml drawio block above its image in an article.
  Build-Diagrams:
    class: rollable
    check: gate
    gate: Test-Diagrams
    outputs:
      - path: docs/**/.assets/*.drawio.png
        inputs: [docs/**/.assets/*.drawio.yml, docs/**/*.md, python/diagrams/configs/drawio.yml, python/diagrams/assets/flow/*.svg]
  # The flow lens's word glyphs, one per flow-glyphs entry of the kit's drawio.yml.
  flow_glyphs.py:
    class: rollable
    check: gate
    # The kit's test_flow_glyphs.py renders each glyph and compares it with the committed svg; Test-PythonTests runs them on python/diagrams/tests.
    gate: Test-PythonTests
    # One run renders every glyph, so the command names no path.
    regenerate: "uv run --no-sync --project python python -m catzc.diagrams.flow_glyphs"
    outputs:
      - path: python/diagrams/assets/flow/*.svg
        inputs: [python/diagrams/configs/drawio.yml, python/diagrams/flow_glyphs.py]
  # A slide's picture, made by its head's picture from its source png (or, redrawn, from that png's declaration), lands where its Image links.
  slide_png picture:
    class: rollable
    check: gate
    gate: Test-Slides
    # The kit's script takes the picture it made in place of its slide.
    regenerate: "uv run --no-sync --project python python -m catzc.diagrams.slide_png picture {path}"
    outputs:
      - path: docs/explanation/flow/*/.assets/*.png
        inputs:
          - docs/explanation/flow/*/*.slide.md
          - docs/**/.assets/*.drawio.png
          - docs/**/.assets/*.drawio.yml
          - python/diagrams/slide_png.py
          - python/diagrams/assets/slides/slides.yml
  # The slide drawn at the deck's size from the slide file and its picture, beside the slide.
  slide_png render:
    class: rollable
    check: gate
    gate: Test-Slides
    regenerate: "uv run --no-sync --project python python -m catzc.diagrams.slide_png render {path}"
    outputs:
      - path: docs/explanation/flow/*/.assets/*.slide.png
        inputs:
          - docs/explanation/flow/*/*.slide.md
          - docs/explanation/flow/*/.assets/*.png
          - python/diagrams/slide_png.py
          - python/diagrams/assets/slides/slides.yml
