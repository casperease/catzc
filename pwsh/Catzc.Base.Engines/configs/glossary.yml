concepts:
  execution engine:
    key: execution_engine
    domain: automation
    defined_by: ADR-AUTO-ENGINE-THREEENGINES
    short:
      One of the three shells the repository's own code runs under:
        pwsh, bash and zsh, declared once with everything that differs between them.
    realized_by: { kind: prose-only }
    contrasts:
      auto: auto is a value that leaves the engine open; an execution engine is the pwsh, bash or zsh it resolves to.
      posix engine:
        A POSIX engine is an execution engine whose importer entry is importer.sh; an execution engine is any one of them, pwsh included.
  engine start environment:
    key: engine_start_environment
    domain: automation
    defined_by: ADR-AUTO-ENGINE-STARTENVIRONMENT
    short:
      The CATZC_ENGINE variables a test runner sets so a black-box test starts the engine from them and never from a hardcoded command, the
      engine's name, its executable, its importer entry and its start arguments.
    realized_by: { kind: prose-only }
    avoid:
      - { phrase: black-box contract, say: engine start environment }
  posix engine:
    key: posix_engines
    domain: automation
    defined_by: ADR-AUTO-ENGINE-IMPORTERENTRY
    short:
      The execution engines whose importer entry is importer.sh, read from the model's ImporterEntry and never listed:
        they share that importer and its cats dispatcher.
    realized_by: { kind: prose-only }
  auto:
    key: auto
    domain: automation
    defined_by: ADR-AUTO-ENGINE-AUTONAMESNOENGINE
    short:
      The engine value that names no particular engine: the caller takes whatever engine the sensible default resolves to.
    realized_by: { kind: prose-only }
