engine_set:
  exempt:
    pwsh/Base.Engines/types/**: the model itself, the one place the engines are declared
    docs/references/pwsh/base-engines/types/**:
      the model's comment pages, its comments moved verbatim (ADR-REPO-COMMENTS-MOVELOSESNOTHING)
    pwsh/Base.Engines/tests/**: the model's own tests pin the names it declares
    "**/tests/assets/engine-cases/**": the engine-case tables carry one column per engine by design
    .unordered/**: imports not yet sorted, held to no domain rule until they move (the catzc-unordered class, DDR-TRACK-UNORDEREDTRACK)
  count_phrases:
    - '\b{count} (?:execution )?engines\b'
  name_phrases:
    - '\b{name}(?:(?:,? and |,? or |, |/| \| ){name})+\b'
    - '\[{name}\]'

neutral_codes:
  exempt:
    pwsh/.scriptanalyzer/tests/NoScriptRootAnchor.Tests.ps1: it asserts the analyzer's exact message, which cites its real rule
    pwsh/Base.Docs/tests/types/AgentsConfig.Tests.ps1: it asserts the type's declared default, which is the real contract code
    pwsh/Base.QualityGates/tests/Test-Plans.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    pwsh/Base.QualityGates/tests/types/FileMetaConfig.Tests.ps1: it asserts the type's exact error message, which cites its real rule
    pwsh/Azure.DevOps/tests/Test-Pipelines.Tests.ps1: it asserts the gate's exact messages, which cite its real rules
    pwsh/Azure.Templates/tests/Build-Bicep.Integrity.Tests.ps1:
      an integrity test over the shipped templates; its -Because message names the real rule they meet
    pwsh/Base.Contracts/tests/Get-ContractFreezeFindings.Tests.ps1: it asserts the findings' exact messages, which cite their real rule
    pwsh/Base.Contracts/tests/Test-Contracts.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    pwsh/Base.Docs/tests/Get-Glossary*Violations.Tests.ps1: they assert the glossary checks' exact messages, which cite their real rules
    pwsh/Base.Drs/tests/Test-DrsRegistry.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    pwsh/Base.Globs/tests/types/GlobsConfig.Tests.ps1: it asserts the config's exact errors, which cite their real rule
    pwsh/Base.Maps/tests/Test-ValueChainMap.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    pwsh/Base.Maps/tests/Test-WorldMap.Tests.ps1: it asserts the gate's exact messages, which cite their real rules
    pwsh/Base.ModuleSystem/tests/Get-UncoveredInternalAssetDependency.Tests.ps1:
      the citation a covering test carries is the real rule the function looks for
    pwsh/Base.Overlay/tests/Assert-CatzcOverlay.Tests.ps1: it asserts the gate's exact message, which names its real ADR

track_root_literal:
  exempt:
    pwsh/.internal/Catzc.Internal.Importer.psm1: the one bootstrap constant, read before any registry loads (ADR-AUTO-LAYERS)
    importer.ps1: the root shim New-Importer renders from the modules folder; it loads the loader before anything can resolve a place
    pwsh/.internal/assets/PSScriptAnalyzerSettings.psd1:
      the analyzer reads its custom rule path relative to the repository root, and a .psd1 data file cannot call a resolver
    pwsh/Base.Repository/Get-CatzcModulesRoot.ps1: the resolver, whose fallback outside an import is the same constant
    pwsh/Base.Repository/Get-CatzcRunMode.ps1: it compares the loaded modules against the source modules folder, which is that constant
    pwsh/Base.Exporter/Build-Modules.ps1:
      its out/ area pwsh/built is named after the track (Q6), renamed with the output-formats.yml areas in P4
    pwsh/Base.Exporter/Export-Catzc.ps1:
      its out/ area pwsh/packages is named after the track (Q6), renamed with the output-formats.yml areas in P4
    pwsh/Base.Exporter/Install-Catzc.ps1:
      its out/ area pwsh/built is named after the track (Q6), renamed with the output-formats.yml areas in P4
    pwsh/Base.Repository/tests/Get-CatzcModulesRoot.Tests.ps1: it proves the resolver's fallback is the bootstrap constant
    pwsh/Base.Repository/tests/Get-CatzcOverlayRoot.Tests.ps1:
      its consumer fixture is a source tree and an overlay named by the bootstrap constant, which the run mode and the overlay compare with
    pwsh/Base.Repository/tests/Get-CatzcRunMode.Tests.ps1:
      it proves the run mode compares against the source modules folder, the same constant
    pwsh/Base.Exporter/tests/Build-Modules.Tests.ps1: it asserts the out/pwsh/built area of its exempt code (Q6)
    pwsh/Base.Exporter/tests/Export-Catzc.Tests.ps1: it asserts the out/pwsh/packages area of its exempt code (Q6)
    pwsh/Base.Exporter/tests/Install-Catzc.Tests.ps1: it asserts the out/pwsh/built area of its exempt code (Q6)
    pwsh/Base.CodeMeta/tests/types/CommentPagesConfig.Tests.ps1:
      it tests CommentPagesConfig.DefaultPages, which mirrors comment-pages.yml and is renamed with it in P4
    pwsh/Base.Globs/tests/PipelineTrigger-Integrity.Tests.ps1: it names the real globset key pwsh, the track's own name
