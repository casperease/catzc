reminders:
  - paths: [".claude/plans/*.md"]
    say: >-
      You edited a plan file. Before you report: run `Format-Code -Path <the files touched>`, then `Test-Plans -Path <the plan files you
      edited>`. Every open step names its check. A new plan also needs its row in value-of-plan.md and its chunk line in plan-master.md.
      Format-Code on a plan also re-wraps plan-master.md, so read the master again before you edit it.
  - paths: ["pwsh/Base.Drs/configs/drs.yml"]
    say: >-
      You edited the ADR registry. Before you report: run `Build-DrsIndex`, then `Test-DrsRegistry`; a new ADR also needs its entry in its
      domain's dora-explains.md (docs/how-to/getting-started/automation/add-a-decision-record.md).
  - paths: ["pwsh/*/configs/glossary.yml", "pwsh/*/configs/glossary/*.yml"]
    say: >-
      You edited a glossary source. Before you report: run `Build-Glossary`, then `Test-Glossary`; a contrast is declared once, on either
      term, and a `short:` value that holds `: ` is quoted.
  - paths: ["pwsh/Base.Timeouts/configs/timeouts.yml"]
    say: >-
      You edited the timeouts config. A new key lands in `TimeoutsConfig.cs` first, then one fresh import (which rebuilds the Bash hook),
      then the yml line.
  - paths: ["pwsh/**/*.ps1"]
    say: >-
      You edited a PowerShell file that every session's next import may dot-source. Parse-check it now, instantly and without an import,
      with `[System.Management.Automation.Language.Parser]::ParseFile`; one parse error breaks every session.
  - paths: ["pwsh/*/configs/*.yml"]
    say: >-
      You edited a config that every session's next import may read. Parse-check it now, instantly and without an import, with
      `ConvertFrom-Yaml`; an unquoted `{placeholder}` in a flow mapping breaks every session.
