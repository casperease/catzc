categories:
  tool:
    description: "An external tool, product, package manager, runtime, or file/data format."
terms:
  tool:
    - term: csharp
      meaning: "C# (the csharp language / file token)"
    - term: msbuild
      meaning: "MSBuild, the .NET build engine whose project files the csproj carrier describes"
    - term: vsixmanifest
      meaning: "the extension.vsixmanifest file inside a VS Code extension package (Build-VsCodeExtension)"
    - term: ildasm
      meaning: "ildasm, the .NET IL disassembler quoted in the unboxing reference"
    - term: editmsg
      meaning: "COMMIT_EDITMSG, the file Git writes the commit message to (vscode-settings.yml)"
    - term: diagnoser
      meaning: "the Diagnoser half of BenchmarkDotNet's MemoryDiagnoser, quoted in the unboxing reference"
    - term: claudecode
      meaning: "the CLAUDECODE environment variable Claude Code sets in its shells (Test-IsRunningAsAgent)"
    - term: levett
      meaning: "the Regex Robin extension's Marketplace publisher (DanLevett.regex-robin), named by the plan that replaced it"
    - term: untracking
      meaning: "removing a committed file from git's index while keeping it on disk (git rm --cached)"
    - term: backticked
      meaning: "set in backticks, Markdown's code-span delimiter"
    - term: heredocs
      meaning: "shell here-documents, the <<EOF blocks a Bash call writes a file with"
    - term: segoe
      meaning: "the Segoe UI font family, named in the font stack of a generated extension's SVG"
    - term: linecap
      meaning: "the SVG stroke-linecap attribute, in a generated extension icon"
    - term: linejoin
      meaning: "the SVG stroke-linejoin attribute, in a generated extension icon"
    - term: tobytes
      meaning: "the NumPy array method that returns an array's raw bytes, used by the diagram kit's PNG shape reader"
    - term: delenv
      meaning: "the pytest fixture method that removes an environment variable in a Python test"
    - term: libyaml
      meaning: "the C YAML library PyYAML binds for its fast loader (yaml.__with_libyaml__), used by the diagram kit"
    - term: dtmp
      meaning: "draw.io desktop's temporary-file extension (*.dtmp), written beside a diagram while it is open; gitignored"
    - term: py
      meaning: "Python (the py file/command token, e.g. PySpark)"
    - term: js
      meaning: "JavaScript (the js token, e.g. NodeJs)"
    - term: puml
      meaning: "PlantUML (.puml diagram source)"
    - term: zsh
      meaning: "the Z shell (zsh) and its .zsh script extension — a shell engine Test-ShellScripts checks"
    - term: csproj
      meaning: "a .csproj MSBuild project file"
    - term: netstandard
      meaning: ".NET Standard's target framework moniker (netstandard2.1), the lib folder a hook's .csproj takes YamlDotNet from"
    - term: yml
      meaning: "a YAML (.yml) file"
    - term: ymls
      meaning: "plural of yml — YAML (.yml) files"
    - term: txt
      meaning: "a plain-text (.txt) file"
    - term: psd
      meaning: "a PowerShell data file (.psd1 manifest)"
    - term: gitignore
      meaning: "a .gitignore file"
    - term: wildmatch
      meaning: "git's wildmatch pattern syntax — the glob dialect .gitignore/.gitattributes patterns use"
    - term: markdownlint
      meaning: "the markdownlint tool"
    - term: artifactory
      meaning: "JFrog Artifactory"
    - term: azps
      meaning: "Azure PowerShell (Az / AzPS)"
    - term: bicep
      meaning: "Azure Bicep infrastructure-as-code language"
    - term: bicepparam
      meaning: "Bicep's parameters file format and its .bicepparam extension"
    - term: securestring
      meaning: "the ARM secureString parameter type, spelled lowercase in a compiled main.json"
    - term: choco
      meaning: "Chocolatey CLI (choco)"
    - term: chocolatey
      meaning: "Chocolatey package manager"
    - term: cspell
      meaning: "cspell spell-checker"
    - term: dbatools
      meaning: "dbatools PowerShell module"
    - term: dearmor
      meaning: "gpg --dearmor"
    - term: devbox
      meaning: "Microsoft Dev Box"
    - term: dotnet
      meaning: ".NET CLI (dotnet)"
    - term: hostfxr
      meaning: ".NET host resolver library (host/fxr/<version>/hostfxr)"
    - term: muxer
      meaning: ".NET muxer — the dotnet executable that dispatches to an SDK or runtime"
    - term: apphost
      meaning: ".NET apphost — a native launcher executable for a .NET application"
    - term: vbcs
      meaning: "the VBCSCompiler.exe Roslyn compiler server"
    - term: iliazeus
      meaning: "publisher of the vscode-ansi VS Code extension (iliazeus.vscode-ansi)"
    - term: dotnettools
      meaning: "the ms-dotnettools VS Code publisher (C# and C# Dev Kit extensions)"
    - term: psscriptanalyzer
      meaning: "the psscriptanalyzer formatter engine name in languages.yml (PSScriptAnalyzer's Invoke-Formatter)"
    - term: bicepconfig
      meaning: "bicepconfig.json, the Bicep CLI's per-folder configuration file"
    - term: osv
      meaning: "OSV (Open Source Vulnerabilities), the advisory database osv-scanner reads lock files against"
    - term: csdevkit
      meaning: "the C# Dev Kit VS Code extension (ms-dotnettools.csdevkit)"
    - term: dpkg
      meaning: "Debian dpkg"
    - term: enduml
      meaning: "PlantUML @enduml directive"
    - term: flux
      meaning: "Flux GitOps toolkit"
    - term: gofmt
      meaning: "Go gofmt formatter"
    - term: msix
      meaning: "MSIX application package format"
    - term: npm
      meaning: "npm package manager"
    - term: nuget
      meaning: "NuGet package manager"
    - term: pester
      meaning: "Pester test framework"
    - term: poetry
      meaning: "Python Poetry"
    - term: pssa
      meaning: "PSScriptAnalyzer (PSSA)"
    - term: pstmn
      meaning: "Postman download host (dl.pstmn.io)"
    - term: askpass
      meaning: "git's credential prompt helper (GIT_ASKPASS), which VS Code points at its own"
    - term: debugpy
      meaning: "debugpy, the Python debugger VS Code's Python extension ships (BUNDLED_DEBUGPY_PATH)"
    - term: pydevd
      meaning: "pydevd, the debugger engine under debugpy (PYDEVD_* variables)"
    - term: pythonstartup
      meaning: "PYTHONSTARTUP, the Python interpreter's start-up script variable"
    - term: pyspark
      meaning: "PySpark"
    - term: roslyn
      meaning: "Roslyn C# compiler"
    - term: ptyhost
      meaning: "VS Code's pty host process and its log (ptyhost.log), the owner of every integrated terminal"
    - term: exthost
      meaning: "VS Code's extension host process and its log (exthost.log), where every extension runs"
    - term: scriptanalyzer
      meaning: "PSScriptAnalyzer ('scriptanalyzer')"
    - term: setuptools
      meaning: "Python setuptools packaging library"
    - term: slnx
      meaning: "Visual Studio .slnx solution format"
    - term: startuml
      meaning: "PlantUML @startuml directive"
    - term: terraform
      meaning: "Terraform"
    - term: winget
      meaning: "winget package manager"
    - term: msiexec
      meaning: "Windows Installer command line (msiexec /x <ProductCode> removes an MSI product)"
    - term: norestart
      meaning: "Windows Installer / installer-bundle switch (/norestart) that suppresses the reboot"
    - term: uv
      meaning: "Astral's uv — Python package/tool manager and Python installer (the standard Python handler)"
    - term: astral
      meaning: "Astral (astral.sh), maker of uv"
    - term: nvm
      meaning: "nvm (Node Version Manager)"
    - term: nodesource
      meaning: "NodeSource — the apt repository (deb.nodesource.com) for pinned Node.js majors (Install-NodeJs)"
    - term: nodistro
      meaning: "the 'nodistro' distribution/suite token in the NodeSource apt source line"
    - term: cpython
      meaning: "CPython (the reference Python implementation; uv installs cpython builds)"
    - term: yaml
      meaning: "YAML"
    - term: vscode
      meaning: "Visual Studio Code (VS Code) — the .vscode/ root folder, the Catzc.Base.VSCode module, and its Vscode*Config config types"
    - term: liquibase
      meaning: "Liquibase — a database schema change/migration tool (DORA database-change-management)"
    - term: autouse
      meaning: "pytest's autouse flag (@pytest.fixture(autouse=True)), a fixture every test in its scope uses"
    - term: ignorecase
      meaning: "git's core.ignorecase config key, which leaves a case-only folder rename unrecorded in the index"
