concepts:
  slide file:
    key: slide_file
    domain: repository
    defined_by: ADR-REPO-SLIDES-SLIDEFILE
    short:
      One markdown file per slide, `<stem>.slide.md`, in a deck folder under docs/explanation; its level-one heading is the title, each
      level-two heading a field, and its head names the pattern, the deck and the order.
    realized_by: { kind: prose-only }
    contrasts:
      deck file: The deck file names the deck's title and sections; a slide file is one slide of it.
      diagram declaration:
        A diagram declaration is yml the kit renders into a draw.io model; a slide file is markdown prose a pattern fills.
  deck file:
    key: deck_file
    domain: repository
    defined_by: ADR-REPO-SLIDES-SLIDEFILE
    short: The `deck.md` of a deck folder — the deck's title and its sections, beside the slide files it gathers.
    realized_by: { kind: prose-only }
  field:
    key: field
    domain: repository
    defined_by: ADR-REPO-SLIDES-SLIDEFILE
    short: One level-two heading of a slide file and the text under it, filled into the placeholder of the same name in the slide's pattern.
    realized_by: { kind: prose-only }
    avoid:
      - { phrase: slot (of a slide), say: field }
  pattern:
    key: pattern
    domain: repository
    defined_by: ADR-REPO-SLIDES-PATTERN
    short:
      One `patterns/<name>.html` file of the slides kit — a section in the slide format whose placeholders name the fields it takes and
      which are required; the layout of one kind of slide.
    realized_by: { kind: prose-only }
  diagram declaration:
    key: diagram_declaration
    domain: repository
    defined_by: ADR-REPO-SLIDES-DECLARATION
    short:
      A diagram's one source, `diagram.drawio.yml` beside its `diagram.drawio.png` — a description, what the diagram shows in the kit's
      closed vocabulary, and where a moved cell sits; put renders it into the drawing and get reads the drawing back into it.
    realized_by: { kind: prose-only }
