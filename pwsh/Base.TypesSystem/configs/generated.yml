writers:
  Catzc.Internal.Loader:
    class: untracked
    check: none
    outputs: [pwsh/.compiled/**]
  # Written by the importer after a compile on a devbox (Import-CSharpTypes); Test-BuildArtifact -Facet Types checks it.
  Write-TypesContract:
    class: import-critical
    check: none
    regenerate: ". ./importer.ps1"
    inputs: [pwsh/*/types/*.cs, pwsh/.internal/assets/types/*.ps1]
    outputs: ["contracts/catzc/0.1.0/*/types.json"]
  dotnet build:
    class: untracked
    check: none
    outputs: [pwsh/.internal/assets/bin/**, pwsh/.internal/assets/obj/**]
  Build-AgentHook:
    class: untracked
    check: none
    outputs: [.claude/hooks/bin/**, ".claude/hooks/*/bin/**", ".claude/hooks/*/obj/**"]
