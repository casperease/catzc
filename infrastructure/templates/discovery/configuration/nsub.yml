# ---
# catzc:
#   derived:
#     path: infrastructure/templates/discovery/configuration/nsub.yml
#     kind: bicep-template-config
# ---

# The hub peers to the nonprod spokes and links its private DNS zones to them; ranges come from network.yml.
# [comment:1](/docs/references/infrastructure/templates/discovery/configuration/nsub.yml.md#comment1)
ParametersFile:
  parameters:
    tags:
      value:
        workload: landing-zone
        environment: nonprod
        owner: platform
        cost-center: platform
        criticality: high
        data-classification: internal
    subscriptions:
      address: global.azure.subscriptions
    networkKind:
      address: global.network.subscriptions.shared_nonprod.kind
    vnetAddressSpace:
      address: global.network.subscriptions.shared_nonprod.vnet_address_space
    subnetPrefixes:
      address: global.network.subscriptions.shared_nonprod.subnets
    resourceGroupName:
      value: nsub-weu-zct-disco-rg
    virtualNetworkName:
      value: nsub-weu-zct-disco-vnet
    networkSecurityGroupNames:
      value:
        shared-services: nsub-weu-zct-disco-ss-nsg
    spokes:
      value:
        - subscription: apex_nonprod
          resourceGroupName: nsub-weu-zct-disco-apex-rg
          virtualNetworkName: nsub-weu-zct-disco-apex-vnet
          peeringName: nsub-weu-zct-disco-ap-peer
        - subscription: nova_nonprod
          resourceGroupName: nsub-weu-zct-disco-nova-rg
          virtualNetworkName: nsub-weu-zct-disco-nova-vnet
          peeringName: nsub-weu-zct-disco-nv-peer
        - subscription: flux_nonprod
          resourceGroupName: nsub-weu-zct-disco-flux-rg
          virtualNetworkName: nsub-weu-zct-disco-flux-vnet
          peeringName: nsub-weu-zct-disco-fl-peer
    logAnalyticsResourceGroupName:
      value: nsub-weu-zct-fnd-rg
    logAnalyticsName:
      value: nsub-weu-zct-fnd-log
    policyEnforcementMode:
      address: global.azure.policy_enforcement.nonproduction
    policyAssignmentNames:
      value:
        allowedLocations: nsub-weu-zct-disco-loc-pa
        requireTag: nsub-weu-zct-disco-tag-pa
        noPublicIp: nsub-weu-zct-disco-pip-pa
    budgetName:
      value: nsub-weu-zct-disco-budg
    budgetAmount:
      value: 500
    budgetStartDate:
      value: "2026-11-01"
