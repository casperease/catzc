steps:
  - pwsh: |
      Set-StrictMode -Version Latest
      Import-Module './pwsh/.internal/Catzc.Internal.Types.psm1'
      Write-Host "##vso[task.setvariable variable=CatzcTypesShadowRoot]$(Get-TypesShadowRoot)"
    displayName: "Resolve the C# types cache folder"

  - task: Cache@2
    displayName: "Cache the C# types build"
    inputs:
      key: 'catzc-types | "$(Agent.OS)" | pwsh/**/types/**/*.cs | pwsh/.internal/assets/Catzc.Types.csproj'
      path: $(CatzcTypesShadowRoot)
