parameters:
  - name: Artifact
    type: string
  - name: ArtifactPipeline
    type: string
    default: ""
  - name: RunId
    type: string
    default: ""

steps:
  - ${{ if eq(parameters.RunId, '') }}:
      - download: current
        artifact: ${{ parameters.Artifact }}
  - ${{ else }}:
      - task: DownloadPipelineArtifact@2
        displayName: "Download ${{ parameters.Artifact }} from ${{ parameters.ArtifactPipeline }} run ${{ parameters.RunId }}"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: ${{ parameters.ArtifactPipeline }}
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.RunId }}
          artifactName: ${{ parameters.Artifact }}
          targetPath: $(Pipeline.Workspace)/${{ parameters.Artifact }}
