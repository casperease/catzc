trigger: none
pr: none

parameters:
  - name: CiRunId
    displayName: "Run id of the certifying cd-shared run (its CI stage built the artifact)"
    type: string
  - name: Target
    displayName: "The rung to deploy"
    type: string
    # rollback runs the prod path with an earlier certifying run: the commit must already be in shared-psub's deployment history.
    values: [release-uat, prod, rollback]

stages:
  - ${{ if eq(parameters.Target, 'release-uat') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: shared
          Expeditions:
            - {
                env: test,
                adoEnvironment: shared-release-uat,
                serviceConnection: sc-shared-nonprod,
                subscriptionIdAssertIs: 50a0ed00-de00-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-shared
          RunId: ${{ parameters.CiRunId }}
  # The shared prod subscription hosts no shared expedition, so its prod rung is the landing zone at psub.
  - ${{ if in(parameters.Target, 'prod', 'rollback') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: shared
          StageSuffix: _prod
          RemoveOrphans: true
          ${{ if eq(parameters.Target, 'rollback') }}:
            CertifiedBy: shared-psub
          Foundations:
            - { env: psub, serviceConnection: sc-shared-prod, subscriptionIdAssertIs: 50a0ed00-000d-50b0-0000-000000000000 }
          Discoveries:
            - { env: psub, serviceConnection: sc-shared-prod, subscriptionIdAssertIs: 50a0ed00-000d-50b0-0000-000000000000 }
          ArtifactPipeline: cd-shared
          RunId: ${{ parameters.CiRunId }}
