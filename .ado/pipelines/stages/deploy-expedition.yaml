parameters:
  - name: Unit
    type: string
  - name: Expeditions
    type: object
  - name: DependsOn
    type: object
    default: []
  - name: Condition
    type: string
    default: succeeded()
  - name: ArtifactPipeline
    type: string
    default: ""
  - name: RunId
    type: string
    default: ""
  - name: StageSuffix
    type: string
    default: ""
  - name: CertifiedBy
    type: string
    default: ""
  - name: RemoveOrphans
    type: boolean
    default: false

stages:
  - stage: Deploy_Expedition${{ parameters.StageSuffix }}
    displayName: "Deploy expedition (${{ parameters.Unit }})"
    dependsOn: ${{ parameters.DependsOn }}
    condition: ${{ parameters.Condition }}
    jobs:
      - ${{ each w in parameters.Expeditions }}:
          - ${{ if w.slot }}:
              - deployment: Expedition_${{ w.env }}_${{ w.slot }}
                displayName: "expedition → ${{ w.env }}-${{ w.slot }}"
                ${{ if w.adoEnvironment }}:
                  environment: ${{ w.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ w.env }}-${{ w.slot }}
                pool:
                  vmImage: ubuntu-latest
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: expedition
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName:
                              "What-if ${{ w.env }} expedition -Slot ${{ w.slot }} (session target, assert ${{ w.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ w.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -Slot ${{ w.slot }} -SubscriptionIdAssertIs ${{
                              w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition" -DryRun'
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName:
                              "Deploy-Bicep ${{ w.env }} expedition -Slot ${{ w.slot }} (session target, assert ${{ w.subscriptionIdAssertIs
                              }})"
                            Mode: azcli
                            ServiceConnection: ${{ w.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -Slot ${{ w.slot }} -SubscriptionIdAssertIs ${{
                              w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition"'
                        - ${{ if parameters.RemoveOrphans }}:
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName:
                                  "List ${{ w.env }} expedition -Slot ${{ w.slot }} orphans (session target, assert ${{
                                  w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ w.env }} -Template expedition -Slot ${{ w.slot }}
                                  -SubscriptionIdAssertIs ${{ w.subscriptionIdAssertIs }} -ArtifactsFolder
                                  "$(Pipeline.Workspace)/expedition" -DryRun'
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName:
                                  "Remove ${{ w.env }} expedition -Slot ${{ w.slot }} orphans (session target, assert ${{
                                  w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ w.env }} -Template expedition -Slot ${{ w.slot }}
                                  -SubscriptionIdAssertIs ${{ w.subscriptionIdAssertIs }} -ArtifactsFolder
                                  "$(Pipeline.Workspace)/expedition"'
          - ${{ else }}:
              - deployment: Expedition_${{ w.env }}
                displayName: "expedition → ${{ w.env }}"
                ${{ if w.adoEnvironment }}:
                  environment: ${{ w.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ w.env }}
                pool:
                  vmImage: ubuntu-latest
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: expedition
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "What-if ${{ w.env }} expedition (session target, assert ${{ w.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ w.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -SubscriptionIdAssertIs ${{
                              w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition" -DryRun'
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "Deploy-Bicep ${{ w.env }} expedition (session target, assert ${{ w.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ w.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -SubscriptionIdAssertIs ${{
                              w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition"'
                        - ${{ if parameters.RemoveOrphans }}:
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName: "List ${{ w.env }} expedition orphans (session target, assert ${{ w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ w.env }} -Template expedition -SubscriptionIdAssertIs ${{
                                  w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition" -DryRun'
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName:
                                  "Remove ${{ w.env }} expedition orphans (session target, assert ${{ w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ w.env }} -Template expedition -SubscriptionIdAssertIs ${{
                                  w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition"'
