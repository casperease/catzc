parameters:
  - name: Unit
    type: string
  - name: Foundations
    type: object
    default: []
  - name: Discoveries
    type: object
    default: []
  - name: Expeditions
    type: object
    default: []
  - name: DependsOn
    type: object
    default: []
  - name: FirstCondition
    type: string
    default: succeeded()
  - name: Condition
    type: string
    default: succeeded()
  - name: ArtifactPipeline
    type: string
    default: ""
  - name: RunId
    type: string
    default: ""
  - name: StageSuffix
    type: string
    default: ""
  # The environment whose deployment history must hold the commit before any job deploys, e.g. `<unit>-pre-prod` for a prod target.
  - name: CertifiedBy
    type: string
    default: ""

stages:
  - ${{ if gt(length(parameters.Foundations), 0) }}:
      - stage: Deploy_Foundation${{ parameters.StageSuffix }}
        displayName: "Deploy foundation (${{ parameters.Unit }})"
        dependsOn: ${{ parameters.DependsOn }}
        condition: ${{ parameters.FirstCondition }}
        jobs:
          - ${{ each f in parameters.Foundations }}:
              - deployment: Foundation_${{ f.env }}
                displayName: "foundation → ${{ f.env }}"
                ${{ if f.adoEnvironment }}:
                  environment: ${{ f.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ f.env }}
                pool:
                  vmImage: ubuntu-latest
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: foundation
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "Deploy-Bicep ${{ f.env }} foundation (session target, assert ${{ f.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ f.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ f.env }} -Template foundation -SubscriptionIdAssertIs ${{
                              f.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/foundation"'

  - ${{ if gt(length(parameters.Discoveries), 0) }}:
      - stage: Deploy_Discovery${{ parameters.StageSuffix }}
        displayName: "Deploy discovery (${{ parameters.Unit }})"
        ${{ if gt(length(parameters.Foundations), 0) }}:
          dependsOn: Deploy_Foundation${{ parameters.StageSuffix }}
          condition: ${{ parameters.Condition }}
        ${{ else }}:
          dependsOn: ${{ parameters.DependsOn }}
          condition: ${{ parameters.FirstCondition }}
        jobs:
          - ${{ each d in parameters.Discoveries }}:
              - deployment: Discovery_${{ d.env }}
                displayName: "discovery → ${{ d.env }}"
                ${{ if d.adoEnvironment }}:
                  environment: ${{ d.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ d.env }}
                pool:
                  vmImage: ubuntu-latest
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: discovery
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "Deploy-Bicep ${{ d.env }} discovery (session target, assert ${{ d.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ d.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ d.env }} -Template discovery -SubscriptionIdAssertIs ${{
                              d.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/discovery"'

  - ${{ if gt(length(parameters.Expeditions), 0) }}:
      - stage: Deploy_Expedition${{ parameters.StageSuffix }}
        displayName: "Deploy expedition (${{ parameters.Unit }})"
        ${{ if gt(length(parameters.Discoveries), 0) }}:
          dependsOn: Deploy_Discovery${{ parameters.StageSuffix }}
          condition: ${{ parameters.Condition }}
        ${{ elseif gt(length(parameters.Foundations), 0) }}:
          dependsOn: Deploy_Foundation${{ parameters.StageSuffix }}
          condition: ${{ parameters.Condition }}
        ${{ else }}:
          dependsOn: ${{ parameters.DependsOn }}
          condition: ${{ parameters.FirstCondition }}
        jobs:
          - ${{ each w in parameters.Expeditions }}:
              - ${{ if w.slot }}:
                  - deployment: Expedition_${{ w.env }}_${{ w.slot }}
                    displayName: "expedition → ${{ w.env }}-${{ w.slot }}"
                    ${{ if w.adoEnvironment }}:
                      environment: ${{ w.adoEnvironment }}
                    ${{ else }}:
                      environment: ${{ parameters.Unit }}-${{ w.env }}-${{ w.slot }}
                    pool:
                      vmImage: ubuntu-latest
                    strategy:
                      runOnce:
                        deploy:
                          steps:
                            - checkout: self
                            - ${{ if parameters.CertifiedBy }}:
                                - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                                  parameters:
                                    Environment: ${{ parameters.CertifiedBy }}
                                    RunId: ${{ parameters.RunId }}
                            - template: /.ado/pipelines/steps/download-artifact.yaml
                              parameters:
                                Artifact: expedition
                                ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                                RunId: ${{ parameters.RunId }}
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName:
                                  "Deploy-Bicep ${{ w.env }} expedition -Slot ${{ w.slot }} (session target, assert ${{
                                  w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -Slot ${{ w.slot }} -SubscriptionIdAssertIs
                                  ${{ w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition"'
              - ${{ else }}:
                  - deployment: Expedition_${{ w.env }}
                    displayName: "expedition → ${{ w.env }}"
                    ${{ if w.adoEnvironment }}:
                      environment: ${{ w.adoEnvironment }}
                    ${{ else }}:
                      environment: ${{ parameters.Unit }}-${{ w.env }}
                    pool:
                      vmImage: ubuntu-latest
                    strategy:
                      runOnce:
                        deploy:
                          steps:
                            - checkout: self
                            - ${{ if parameters.CertifiedBy }}:
                                - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                                  parameters:
                                    Environment: ${{ parameters.CertifiedBy }}
                                    RunId: ${{ parameters.RunId }}
                            - template: /.ado/pipelines/steps/download-artifact.yaml
                              parameters:
                                Artifact: expedition
                                ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                                RunId: ${{ parameters.RunId }}
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName: "Deploy-Bicep ${{ w.env }} expedition (session target, assert ${{ w.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ w.serviceConnection }}
                                RunCommand:
                                  'Deploy-Bicep -Environment ${{ w.env }} -Template expedition -SubscriptionIdAssertIs ${{
                                  w.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/expedition"'
