parameters:
  - name: Unit
    type: string
  - name: Foundations
    type: object
    default: []
  - name: Discoveries
    type: object
    default: []
  - name: Expeditions
    type: object
    default: []
  - name: DependsOn
    type: object
    default: []
  - name: FirstCondition
    type: string
    default: succeeded()
  - name: Condition
    type: string
    default: succeeded()
  - name: ArtifactPipeline
    type: string
    default: ""
  - name: RunId
    type: string
    default: ""
  - name: StageSuffix
    type: string
    default: ""
  # The environment whose deployment history must hold the commit before any job deploys, e.g. `<unit>-pre-prod` for a prod target.
  - name: CertifiedBy
    type: string
    default: ""
  # Set on a DEPLOY's production and rollback paths: after each resource-group deploy, the orphans a revert left are listed, then removed.
  - name: RemoveOrphans
    type: boolean
    default: false

stages:
  - ${{ if gt(length(parameters.Foundations), 0) }}:
      - stage: Deploy_Foundation${{ parameters.StageSuffix }}
        displayName: "Deploy foundation (${{ parameters.Unit }})"
        dependsOn: ${{ parameters.DependsOn }}
        condition: ${{ parameters.FirstCondition }}
        jobs:
          - ${{ each f in parameters.Foundations }}:
              - deployment: Foundation_${{ f.env }}
                displayName: "foundation → ${{ f.env }}"
                ${{ if f.adoEnvironment }}:
                  environment: ${{ f.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ f.env }}
                pool:
                  vmImage: ubuntu-latest
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: foundation
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "What-if ${{ f.env }} foundation (session target, assert ${{ f.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ f.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ f.env }} -Template foundation -SubscriptionIdAssertIs ${{
                              f.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/foundation" -DryRun'
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "Deploy-Bicep ${{ f.env }} foundation (session target, assert ${{ f.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ f.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ f.env }} -Template foundation -SubscriptionIdAssertIs ${{
                              f.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/foundation"'
                        - ${{ if parameters.RemoveOrphans }}:
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName: "List ${{ f.env }} foundation orphans (session target, assert ${{ f.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ f.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ f.env }} -Template foundation -SubscriptionIdAssertIs ${{
                                  f.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/foundation" -DryRun'
                            - template: /.ado/pipelines/steps/invoke-automation.yaml
                              parameters:
                                DisplayName:
                                  "Remove ${{ f.env }} foundation orphans (session target, assert ${{ f.subscriptionIdAssertIs }})"
                                Mode: azcli
                                ServiceConnection: ${{ f.serviceConnection }}
                                RunCommand:
                                  'Remove-BicepOrphanResources -Environment ${{ f.env }} -Template foundation -SubscriptionIdAssertIs ${{
                                  f.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/foundation"'

  - ${{ if gt(length(parameters.Discoveries), 0) }}:
      - stage: Deploy_Discovery${{ parameters.StageSuffix }}
        displayName: "Deploy discovery (${{ parameters.Unit }})"
        ${{ if gt(length(parameters.Foundations), 0) }}:
          dependsOn: Deploy_Foundation${{ parameters.StageSuffix }}
          condition: ${{ parameters.Condition }}
        ${{ else }}:
          dependsOn: ${{ parameters.DependsOn }}
          condition: ${{ parameters.FirstCondition }}
        variables:
          - template: /.ado/pipelines/variables/network-agent-pool.yaml
        jobs:
          - ${{ each d in parameters.Discoveries }}:
              - deployment: Discovery_${{ d.env }}
                displayName: "discovery → ${{ d.env }}"
                ${{ if d.adoEnvironment }}:
                  environment: ${{ d.adoEnvironment }}
                ${{ else }}:
                  environment: ${{ parameters.Unit }}-${{ d.env }}
                # The anomaly seed writes the foundation vault, which has no public network access: an agent inside the network.
                pool:
                  name: ${{ variables.NetworkAgentPool }}
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - ${{ if parameters.CertifiedBy }}:
                            - template: /.ado/pipelines/steps/assert-deployment-history.yaml
                              parameters:
                                Environment: ${{ parameters.CertifiedBy }}
                                RunId: ${{ parameters.RunId }}
                        - template: /.ado/pipelines/steps/download-artifact.yaml
                          parameters:
                            Artifact: discovery
                            ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
                            RunId: ${{ parameters.RunId }}
                        # The secret pipeline variable AnomalyAlertRecipients seeds the secret discovery's anomaly alert references.
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName:
                              "Seed ${{ d.env }} anomaly alert recipients (session target, assert ${{ d.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ d.serviceConnection }}
                            RunCommand:
                              'Set-AnomalyAlertRecipientSecret -Environment ${{ d.env }} -SubscriptionIdAssertIs ${{
                              d.subscriptionIdAssertIs }} -Value "$(AnomalyAlertRecipients)"'
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "What-if ${{ d.env }} discovery (session target, assert ${{ d.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ d.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ d.env }} -Template discovery -SubscriptionIdAssertIs ${{
                              d.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/discovery" -DryRun'
                        - template: /.ado/pipelines/steps/invoke-automation.yaml
                          parameters:
                            DisplayName: "Deploy-Bicep ${{ d.env }} discovery (session target, assert ${{ d.subscriptionIdAssertIs }})"
                            Mode: azcli
                            ServiceConnection: ${{ d.serviceConnection }}
                            RunCommand:
                              'Deploy-Bicep -Environment ${{ d.env }} -Template discovery -SubscriptionIdAssertIs ${{
                              d.subscriptionIdAssertIs }} -ArtifactsFolder "$(Pipeline.Workspace)/discovery"'

  # A second nesting level (ADR-ADO-TEMPLATE-MINIMALNESTING), taken only to keep this file under the config line limit.
  - ${{ if gt(length(parameters.Expeditions), 0) }}:
      - template: /.ado/pipelines/stages/deploy-expedition.yaml
        parameters:
          Unit: ${{ parameters.Unit }}
          Expeditions: ${{ parameters.Expeditions }}
          ${{ if gt(length(parameters.Discoveries), 0) }}:
            DependsOn: Deploy_Discovery${{ parameters.StageSuffix }}
            Condition: ${{ parameters.Condition }}
          ${{ elseif gt(length(parameters.Foundations), 0) }}:
            DependsOn: Deploy_Foundation${{ parameters.StageSuffix }}
            Condition: ${{ parameters.Condition }}
          ${{ else }}:
            DependsOn: ${{ parameters.DependsOn }}
            Condition: ${{ parameters.FirstCondition }}
          ArtifactPipeline: ${{ parameters.ArtifactPipeline }}
          RunId: ${{ parameters.RunId }}
          StageSuffix: ${{ parameters.StageSuffix }}
          CertifiedBy: ${{ parameters.CertifiedBy }}
          RemoveOrphans: ${{ parameters.RemoveOrphans }}
