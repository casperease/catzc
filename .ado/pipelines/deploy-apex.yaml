# ---
# catzc:
#   docs: "../../docs/references/ado/pipelines/deploy-apex.yaml.md"
#   header: "generated"
# ---

trigger: none
pr: none

parameters:
  - name: CiRunId
    displayName: "Run id of the certifying cd-apex run (its CI stage built the artifact)"
    type: string
  - name: Target
    displayName: "The rung to deploy"
    type: string
    values: [release-uat, prod]

stages:
  - ${{ if eq(parameters.Target, 'release-uat') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          Expeditions:
            - {
                env: test,
                adoEnvironment: apex-release-uat,
                serviceConnection: sc-apex-nonprod,
                subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
  - ${{ if eq(parameters.Target, 'prod') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          StageSuffix: _preprod
          Expeditions:
            - {
                env: preprod,
                adoEnvironment: apex-pre-prod,
                serviceConnection: sc-apex-prod,
                subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          StageSuffix: _prod
          Expeditions:
            - {
                env: prod,
                adoEnvironment: apex-prod,
                serviceConnection: sc-apex-prod,
                subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000,
              }
          DependsOn: [Deploy_Expedition_preprod]
          CertifiedBy: apex-pre-prod
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
