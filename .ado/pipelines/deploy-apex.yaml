trigger: none
pr: none

parameters:
  - name: CiRunId
    displayName: "Run id of the certifying cd-apex run (its CI stage built the artifact)"
    type: string
  - name: Target
    displayName: "The rung to deploy"
    type: string
    # rollback runs the prod path with an earlier certifying run: the commit must already be in apex-prod's deployment history.
    values: [release-uat, prod, rollback]

stages:
  - ${{ if eq(parameters.Target, 'release-uat') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          Expeditions:
            - {
                env: test,
                adoEnvironment: apex-release-uat,
                serviceConnection: nsub-weu-zct-ado-apex-wl-sc,
                subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
  - ${{ if in(parameters.Target, 'prod', 'rollback') }}:
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          StageSuffix: _preprod
          RemoveOrphans: true
          ${{ if eq(parameters.Target, 'rollback') }}:
            CertifiedBy: apex-prod
          Foundations:
            - { env: psub, serviceConnection: psub-weu-zct-ado-apex-lz-sc, subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000 }
          Discoveries:
            - { env: psub, serviceConnection: psub-weu-zct-ado-apex-lz-sc, subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000 }
          Expeditions:
            - {
                env: preprod,
                adoEnvironment: apex-pre-prod,
                serviceConnection: psub-weu-zct-ado-apex-wl-sc,
                subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
      - template: /.ado/pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: apex
          StageSuffix: _prod
          RemoveOrphans: true
          Expeditions:
            - {
                env: prod,
                adoEnvironment: apex-prod,
                serviceConnection: psub-weu-zct-ado-apex-wl-sc,
                subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000,
              }
          DependsOn: [Deploy_Expedition_preprod]
          CertifiedBy: apex-pre-prod
          ArtifactPipeline: cd-apex
          RunId: ${{ parameters.CiRunId }}
