trigger:
  branches:
    include: [main]
  paths:
    include:
      - infrastructure/templates/foundation/**
      - infrastructure/modules/**
      - infrastructure/templates/foundation/configuration/*.yml
      - infrastructure/templates/discovery/**
      - infrastructure/templates/discovery/configuration/*.yml
      - infrastructure/templates/expedition/**
      - infrastructure/templates/expedition/configuration/*.yml
    exclude:
      - infrastructure/templates/foundation/configuration/*/**
      - infrastructure/templates/discovery/configuration/*/**
      - infrastructure/templates/expedition/configuration/*/**

pr:
  branches:
    include: [main]
  paths:
    include:
      - infrastructure/templates/foundation/**
      - infrastructure/modules/**
      - infrastructure/templates/foundation/configuration/*.yml
      - infrastructure/templates/discovery/**
      - infrastructure/templates/discovery/configuration/*.yml
      - infrastructure/templates/expedition/**
      - infrastructure/templates/expedition/configuration/*.yml
    exclude:
      - infrastructure/templates/foundation/configuration/*/**
      - infrastructure/templates/discovery/configuration/*/**
      - infrastructure/templates/expedition/configuration/*/**

stages:
  # --- CI engine: build + verify, then publish the immutable artifacts ----------------------------
  - stage: CI
    displayName: "CI engine — build & verify"
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            # Test-GlobSetAffected diffs real refs ([ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT](/docs/adr/flow/durable-sha-globs.md#rule-adr-flow-cd-globs-changecomputedfromgit))
            fetchDepth: 0

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Test-GlobSetAffected shared (AFFECTED)"
              StepName: Changes
              RunCommand: "Set-AdoPipelineVariable AFFECTED (Test-GlobSetAffected shared) -IsOutput"

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Build-Bicep foundation -Shared"
              RunCommand: "Build-Bicep foundation -Shared"
          - publish: out/template/foundation
            artifact: foundation

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Build-Bicep discovery -Shared"
              RunCommand: "Build-Bicep discovery -Shared"
          - publish: out/template/discovery
            artifact: discovery

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Build-Bicep expedition -Shared"
              RunCommand: "Build-Bicep expedition -Shared"
          - publish: out/template/expedition
            artifact: expedition

  # --- Deploy foundation → discovery → expedition, main only: the unit's one deploy path, shared with its DEPLOY ---------------
  - template: /.ado/pipelines/stages/deploy-unit.yaml
    parameters:
      Unit: shared
      Foundations:
        - { env: nsub, serviceConnection: sc-shared-nonprod, subscriptionIdAssertIs: 50a0ed00-de00-50b0-0000-000000000000 }
        - { env: psub, serviceConnection: sc-shared-prod, subscriptionIdAssertIs: 50a0ed00-000d-50b0-0000-000000000000 }
      Discoveries:
        - { env: nsub, serviceConnection: sc-shared-nonprod, subscriptionIdAssertIs: 50a0ed00-de00-50b0-0000-000000000000 }
        - { env: psub, serviceConnection: sc-shared-prod, subscriptionIdAssertIs: 50a0ed00-000d-50b0-0000-000000000000 }
      Expeditions:
        - {
            env: dev,
            adoEnvironment: shared-main-uat,
            serviceConnection: sc-shared-nonprod,
            subscriptionIdAssertIs: 50a0ed00-de00-50b0-0000-000000000000,
          }
        - { env: test, serviceConnection: sc-shared-nonprod, subscriptionIdAssertIs: 50a0ed00-de00-50b0-0000-000000000000 }
      DependsOn: CI
      # Skipped when the shared unit is untouched; the later Deploy stages chain on this one, so they skip with it.
      FirstCondition:
        and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.CI.outputs['Build.Changes.AFFECTED'],
        'True'))
      Condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
