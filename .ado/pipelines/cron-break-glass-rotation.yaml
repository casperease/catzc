trigger: none
pr: none

schedules:
  - cron: "0 3 1 * *"
    displayName: Monthly break-glass rotation
    branches:
      include: [main]
    always: true

variables:
  - template: /.ado/pipelines/variables/network-agent-pool.yaml

jobs:
  - job: rotate
    displayName: Rotate every production break-glass password
    # The rotation writes the foundation vault, which has no public network access: an agent inside the network.
    pool:
      name: ${{ variables.NetworkAgentPool }}
    steps:
      - template: /.ado/pipelines/steps/invoke-automation.yaml
        parameters:
          Mode: azcli
          ServiceConnection: psub-weu-zct-ado-apex-lz-sc
          RunCommand: Invoke-BreakGlassRotation prod
