parameters:
  - name: Customer
    type: string
  - name: Foundations
    type: object # [ {env: nsub, serviceConnection: sc-<owner>-nonprod, subscriptionIdAssertIs: <guid>}, {env: psub, ...} ]
  - name: Discoveries
    type: object # [ {env: nsub, serviceConnection: sc-<owner>-nonprod, subscriptionIdAssertIs: <guid>}, {env: psub, ...} ]
  - name: Expeditions
    type: object # [ {env: dev, serviceConnection: ...}, {env: dev, slot: blu, ...}, ... ] — no slot = base slot; [] = none

stages:
  # --- CI engine: build this customer's slots + publish the immutable artifacts -------------------
  - stage: CI
    displayName: "CI engine — build & verify (${{ parameters.Customer }})"
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            # Test-GlobSetAffected diffs real refs ([FDR-CD-GLOBS-CHANGECOMPUTEDFROMGIT](/docs/drs/flow/durable-sha-globs.md#rule-fdr-cd-globs-changecomputedfromgit))
            fetchDepth: 0

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Test-GlobSetAffected ${{ parameters.Customer }} (AFFECTED)"
              StepName: Changes
              RunCommand: "Set-AdoPipelineVariable AFFECTED (Test-GlobSetAffected ${{ parameters.Customer }}) -IsOutput"

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Build-Bicep foundation -Customers ${{ parameters.Customer }}"
              RunCommand: "Build-Bicep foundation -Customers ${{ parameters.Customer }}"
          - publish: out/template/foundation
            artifact: foundation

          - template: /.ado/pipelines/steps/invoke-automation.yaml
            parameters:
              DisplayName: "Build-Bicep discovery -Customers ${{ parameters.Customer }}"
              RunCommand: "Build-Bicep discovery -Customers ${{ parameters.Customer }}"
          - publish: out/template/discovery
            artifact: discovery

          - ${{ if gt(length(parameters.Expeditions), 0) }}:
              - template: /.ado/pipelines/steps/invoke-automation.yaml
                parameters:
                  DisplayName: "Build-Bicep expedition -Customers ${{ parameters.Customer }}"
                  RunCommand: "Build-Bicep expedition -Customers ${{ parameters.Customer }}"
              - publish: out/template/expedition
                artifact: expedition

  # --- Deploy foundation → discovery → expedition, main only: the unit's one deploy path, shared with its DEPLOY ---------------
  - template: /.ado/pipelines/stages/deploy-unit.yaml
    parameters:
      Unit: ${{ parameters.Customer }}
      Foundations: ${{ parameters.Foundations }}
      Discoveries: ${{ parameters.Discoveries }}
      Expeditions: ${{ parameters.Expeditions }}
      DependsOn: CI
      # Skipped when the customer's unit is untouched; the later Deploy stages chain on this one, so they skip with it.
      FirstCondition:
        and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.CI.outputs['Build.Changes.AFFECTED'],
        'True'))
      Condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
