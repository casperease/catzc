<section
    id="{{@id}}"
    data-transition="fade"
    style="background:{{@token.bg_deep}};color:{{@token.ink}};font-family:{{@face.text}};padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px"
>
    <p style="font-size:{{@scale.caption}}px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:{{@token.accent}}">
        {{eyebrow}}
    </p>
    <h2 style="font-family:{{@face.display}};font-size:{{@scale.h2}}px;font-weight:400;line-height:1.1">{{title}}</h2>
    <div data-field="layers" data-max="6" data-max-words="72" style="display: flex; flex-direction: column; gap: 12px; align-items: center">
        <div data-item style="display: flex; gap: 16px; align-items: center">
            <p style="font-size:{{@scale.small}}px;font-weight:500;background:{{@token.bg_raised}};border-radius:12px;padding:12px 28px">
                {{item}}
            </p>
            <p style="font-size:{{@scale.caption}}px;color:{{@token.ink_muted}}">{{item.lead}}</p>
        </div>
        <x-shape data-separator kind="arrow-down" style="width:36px;height:28px;background:{{@token.ink_muted}}"></x-shape>
    </div>
    <p style="position:absolute;left:128px;bottom:64px;font-size:{{@scale.caption}}px;color:{{@token.ink_muted}}">{{@page}}</p>
    <aside>{{notes?}}</aside>
</section>
