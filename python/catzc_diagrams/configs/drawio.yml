  neutral: 2C3542 # neutral kinds' fill
  neutral-deep: 2F3B4A # the private helper's fill
  neutral-rim: C7D0DB # neutral kinds' rim
  commit: FFE082 # the default commit state's fill (the locked palette, the same in every theme)
  commit-rim: F9A825 # its rim
  map-page: 1C2A24 # a minimap's page
  map-panel: 243229 # an idle minimap cell
  map-rim: 3B4D43 # a minimap cell's border
  map-lit: E6EAF0 # a lit minimap place
