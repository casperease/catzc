minimaps: # the eight minimap ids a declaration may name (declaration.py validates the count and each id); each kind's defaults are maps.yml's
  ids: grid, code-locations, axis, layer-stack, lifecycle-position, track-placement, engine-strip, module-neighbourhood
vocabularies: # the closed lists a span bar's label comes from, with the track names read from variants.yml; a label outside every list fails validation with the lists
  stages: CI, CD, DEPLOY
  pipelines: Authoring, PR+BVT, CI+, RC, RBC, CD+RBC, CDe, DEPLOY-Non Prod, DEPLOY-Prod
  axis: build, qc, release, deploy, access
  rungs: main-uat, release-uat, pre-prod, prod
  layers: language, engine, importer
  iac: templates, configs, modules
