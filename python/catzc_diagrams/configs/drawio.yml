lenses: # the closed set of lenses a diagram is drawn through (its about.lens, the end of its subtitle), each with what it shows; the badge prints the name
  meta: what the decision is and why
  architecture: the parts and how they depend on each other
  implementation: how the code carries it out
  operations: what an operator sets and sees
  governance: which gates check it
  source: one responsibility of one module, drawn from the code
commits: # the locked commit palette ([DDR-VISUAL-FIXEDCOMMITPALETTE](/docs/drs/design/visual-design.md#rule-ddr-visual-fixedcommitpalette)):a commit state's fill, stroke and digit ink, hex without the hash; the first is the default
  bvt: FFE082 F9A825 1E2430
  topic: C4915C 7A4B25 1E2430
  landed: C9CCD1 6B7178 1E2430
  l3: 64B5F6 1565C0 1E2430
  main-uat: DAE8FC 6C8EBF 1E2430
  release-uat: D5E8D4 82B366 1E2430
  prod: 60A917 2D7600 DDE2E9
  discarded: 8E2424 E57373 DDE2E9
layers: # the paint order, back to front: put orders the model's cells by it under each parent, and the raster paints the model's order, as draw.io does
  panels: bands, notes, the legend panel, the sidebar and the map key
  frames: groups, which hold their own layers inside them
  spans: span bars
  lines: gate rules, lane trunks and bypasses, which pass beneath the edges
  edges: every other edge
  glyphs: glyphs, commits and the minimap pictures
  marks: markers and chips
  labels: text, on top of everything
kinds: # the two diagram kinds; each supplies the default three minimaps (minimaps: below)
  explanation: an explanation diagram, embedded by an article under docs/explanation
  reference: a reference diagram, embedded by a page under docs/references or docs/drs
themes: # the themes a diagram renders in, each a theme-<name> token set below; the first is the default and the one whose raster is committed
  dark: the dark page and the light ink of STYLE.md
  light: the light page and the dark ink of the light-era kit, rendered on demand to out/
theme-dark: # every colour a style may name, as a token: a style says @<token>, put writes the theme's hex (no hash, as in commits:)
  page: 1E2430 # the canvas and every rendered output's base layer
  band: 262E3B # band fill
  band-rim: 3A4555 # band border
  band-label: B0BAC7 # band and key labels
  panel: 222A36 # legend and outer panels
  panel-rim: 3A4555 # legend and outer panel border
  sidebar: 2E2823 # the minimap column's backing
  sidebar-rim: 453C33 # its border
  ink: CDD3DC # text
  title: DDE2E9 # the title and on-glyph names
  quiet: 949FAE # legend text and notes
  line: AAB4C3 # flow edges, arrowheads, chip rims, the DRS-only dash
  mark: E6EAF0 # marker disc and badge fill
  mark-ink: 1E2430 # marker digit and rim, badge text
  chip: 262E3B # chip fill
  chip-rim: AAB4C3 # chip rim
  red: 8E2424 # failure fill
  red-rim: E57373 # failure rim and the failure-path edge
  red-ink: EFD4D4 # failure text
  slate: 4E6378 # code unit, store and runner fill
  slate-rim: 9FB3C8 # their rim and slate text
  mauve: 6A567E # mauve structural fill
  mauve-rim: B9A6CC # its rim
  olive: 5B7653 # olive structural fill
  olive-rim: A9C29F # its rim
  green: 2E7D5B # result fill
  green-rim: 7FD3AE # its rim
  neutral: 2C3542 # neutral kinds' fill
  neutral-deep: 2F3B4A # the private helper's fill
  neutral-rim: C7D0DB # neutral kinds' rim
  commit: FFE082 # the default commit state's fill (the locked palette, the same in every theme)
  commit-rim: F9A825 # its rim
  map-page: 1C2A24 # a minimap's page
  map-panel: 243229 # an idle minimap cell
  map-rim: 3B4D43 # a minimap cell's border
  map-lit: E6EAF0 # a lit minimap place
  map-lit-ink: 1E2430 # its name
  map-dim: 7D8C86 # dim minimap ink
  map-caption: CDD3DC # a minimap's question
  map-mention: 737983 # a place a minimap names without lighting it
