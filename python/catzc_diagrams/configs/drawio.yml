renderer:
  page: dark # dark | model. dark: every render sits on the dark page (STYLE.md tokens); model: the model's own background, white allowed. Parameter: --page
  out: out/drawio # where drawio_forward.py lands its artifacts when no <out_dir> argument is given
  carrier: article # where a diagram's declaration lives when carriers: names none. article: a `yml drawio` block directly above the image that embeds its png; file: <name>.drawio.yml beside its png
  role: slide # a diagram's role when roles: names none. slide: its subtitle says `<codes> · <lens>`; legend: it names no ADR and has no subtitle
  word-gap: 3 # px a steep edge's word stands right of its line, left-aligned at the line's middle; written into the model, so draw.io and the painter read the same
roles: # a diagram's role, keyed by its stem's repository path (`.assets/<name>`), only where it is not renderer.role
  docs/explanation/.assets/glyphs: legend # the glyph library, the legend every slide's glyphs come from
carriers: # a diagram's carrier, keyed by its stem's repository path (`.assets/<name>`), only where it is not renderer.carrier
  docs/drs/automation/BCL/.assets/bcl-language: file
  docs/explanation/ado/.assets/configured-credential-proves-its-org: file
  docs/explanation/automation/.assets/a-declared-allow-list-of-layers: file
  docs/explanation/automation/.assets/hook-compiles-module-verdict-and-limits: file
  docs/explanation/automation/.assets/invoke-importer-in-code-order: file
  docs/explanation/automation/.assets/one-out-string-two-places: file
  docs/explanation/repository/.assets/one-source-one-writer-one-boolean: file
  docs/explanation/thesis/product-thesis/.assets/truth-stores: file
  docs/references/pwsh/.assets/tools-yml-install-dispatch: file
  docs/explanation/automation/.assets/reading-an-accosted-file-writes-nothing: file
  docs/explanation/automation/.assets/building-the-english-dictionary-writes-one-stamped-word-list: file
  docs/explanation/repository/.assets/building-the-contract-reference-writes-one-page-per-unit: file
  docs/explanation/automation/.assets/one-command-lays-out-the-python-workspace: file
lenses: # the closed set of lenses a diagram is drawn through (its about.lens, the end of its subtitle), each with what it shows; the badge prints the name
  meta: what the decision is and why
  architecture: the parts and how they depend on each other
  implementation: how the code carries it out
  operations: what an operator sets and sees
  governance: which gates check it
  source: one responsibility of one module, drawn from the code
  action: one action, its cause on the left rim and its effects on rings, in accosted words
  proof: one action's normalized statement, and the words each engine runs it as
commits: # the locked commit palette ([DDR-VISUAL-FIXEDCOMMITPALETTE](/docs/drs/design/visual-design.md#rule-ddr-visual-fixedcommitpalette)):a commit state's fill, stroke and digit ink, hex without the hash; the first is the default
  bvt: FFE082 F9A825 1E2430
  topic: C4915C 7A4B25 1E2430
  landed: C9CCD1 6B7178 1E2430
  l3: 64B5F6 1565C0 1E2430
  main-uat: DAE8FC 6C8EBF 1E2430
  release-uat: D5E8D4 82B366 1E2430
  prod: 60A917 2D7600 DDE2E9
  discarded: 8E2424 E57373 DDE2E9
layers: # the paint order, back to front: put orders the model's cells by it under each parent, and the raster paints the model's order, as draw.io does
  panels: bands, notes, the legend panel, the sidebar and the map key
  frames: groups, which hold their own layers inside them
  spans: span bars
  lines: gate rules, lane trunks and bypasses, which pass beneath the edges
  edges: every other edge
  glyphs: glyphs, commits and the minimap pictures
  marks: markers and chips
  labels: text, on top of everything
kinds: # the two diagram kinds; each supplies the default three minimaps (minimaps: below)
  explanation: an explanation diagram, embedded by an article under docs/explanation
  reference: a reference diagram, embedded by a page under docs/references or docs/drs
wheres: # where an action diagram's effect happens, drawn as its where chip
  local: this machine and this repository
  remote: a service or a machine beyond the repository
# cspell:ignore callsite
action-lens: # what the action lens draws with: its layout numbers in diagram units, the cause's sizes, and its glyph kinds (glyphs.xml ids g-<kind>)
  ring-gap: 240 # the distance from one ring to the next: the note width and 50 clear
  note-width: 190 # the width of an effect's note
  action-width: 300 # the widest action glyph; a longer call wraps inside it
  clearance: 40 # how far the action clears the cause's round, and the first ring the action's right edge
  lane-height: 360 # the invisible centre lane that holds the cause, the action and every effect note
  ring-margin: 70 # the margin above and below the lane where the rings crawl up and down before the frame cuts them
  cause-size: medium # the default size of the cause's half-disc on the left rim
  cause-sizes: smallest 64, small 80, medium 96, large 112, largest 128 # the half-disc's radius for each named size, smallest to largest; a label ending in ! takes the largest
  glyphs: cause, action, callsite, ring, effect
  proof: shown # shown | hidden: whether an action diagram draws its Proof box under the frame, the statement in each engine's words
  where: local # the diagram's default where (one of wheres:); content.where overrides it, and a note draws a chip only where it differs
  show: both # words | call | both: what an effect's note prints, its words, its observation or call, or both; show: on an effect overrides it
  proof-engines: pwsh pascal, bash kebab, zsh kebab # the engines a Proof box prints, each with the idiom its words take
themes: # the themes a diagram renders in, each a theme-<name> token set below; the first is the default and the one whose raster is committed
  dark: the dark page and the light ink of STYLE.md
  light: the light page and the dark ink of the light-era kit, rendered on demand to out/
