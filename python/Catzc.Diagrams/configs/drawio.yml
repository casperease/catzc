renderer:
  page: dark # dark | model. dark: every render sits on the dark page (STYLE.md tokens); model: the model's own background, white allowed. Parameter: --page
  out: out/drawio # where drawio_forward.py lands its artifacts when no <out_dir> argument is given
  role: slide # a diagram folder's role when roles: names none. slide: its subtitle says `<codes> · <lens>`; legend: it names no ADR and has no subtitle
roles: # a diagram folder's role, keyed by its repository path, only where it is not renderer.role
  docs/explanation/.assets/glyphs: legend # the glyph library, the legend every slide's glyphs come from
lenses: # the closed set of lenses a diagram is drawn through (its about.lens, the end of its subtitle), each with what it shows; the badge prints the name
  meta: what the decision is and why
  architecture: the parts and how they depend on each other
  implementation: how the code carries it out
  operations: what an operator sets and sees
  governance: which gates check it
  source: one responsibility of one module, drawn from the code
commits: # the locked commit palette (ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE): a commit state's fill, stroke and digit ink, hex without the hash; the first is the default
  bvt: FFE082 F9A825 1E2430
  topic: C4915C 7A4B25 1E2430
  landed: C9CCD1 6B7178 1E2430
  l3: 64B5F6 1565C0 1E2430
  main-uat: DAE8FC 6C8EBF 1E2430
  release-uat: D5E8D4 82B366 1E2430
  prod: 60A917 2D7600 DDE2E9
  discarded: 8E2424 E57373 DDE2E9
kinds: # the two diagram kinds; each supplies the default three minimaps (minimaps: below)
  explanation: an explanation diagram, embedded by an article under docs/explanation
  reference: a reference diagram, embedded by a page under docs/references or docs/adr
themes: # the token sets a diagram renders in; the first is the default and the one whose raster is committed
  dark: the dark page and the light ink of STYLE.md
minimaps: # the eight minimap ids, and the default three of each kind (declaration.py validates the count and each id)
  ids: grid, code-locations, axis, layer-stack, lifecycle-position, track-placement, engine-strip, module-neighbourhood
  explanation_default: grid, axis, layer-stack
  reference_default: grid, code-locations, track-placement
vocabularies: # the closed lists a span bar's label comes from; a label outside every list fails validation with the lists
  stages: CI, CD, DEPLOY
  axis: build, qc, release, deploy, access
  rungs: main-uat, release-uat, pre-prod, prod
  layers: language, engine, importer
  tracks: pwsh, python, go, bash, infrastructure, pipelines, docs, contracts
  iac: templates, configs, modules
