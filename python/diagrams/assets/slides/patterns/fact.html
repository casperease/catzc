<section
    id="{{@id}}"
    data-transition="fade"
    style="background:{{@token.bg_deep}};color:{{@token.ink}};font-family:{{@face.text}};padding:128px 128px 160px;display:flex;flex-direction:row;gap:64px;align-items:center"
>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 32px; min-width: 0">
        <p style="font-size:{{@scale.caption}}px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:{{@token.accent}}">
            {{eyebrow}}
        </p>
        <h2 style="font-family:{{@face.display}};font-size:{{@scale.h2}}px;font-weight:400;line-height:1.1;color:{{@token.ink}}">
            {{title}}
        </h2>
        <div data-field="lead" data-max="1" data-max-words="45" style="display: flex; flex-direction: column; gap: 24px">
            <p data-item style="font-size:{{@scale.body}}px;line-height:1.4;color:{{@token.ink_soft}};max-width:900px">{{item}}</p>
        </div>
    </div>
    <figure style="flex: 0 0 640px; display: flex; flex-direction: column; gap: 16px; margin: 0">
        <img
            src="{{image}}"
            alt="{{title}}"
            style="max-width: 640px; max-height: 560px; object-fit: contain; image-rendering: pixelated; border-radius: 8px"
        />
        <figcaption style="font-size:{{@scale.caption}}px;line-height:1.4;color:{{@token.ink_muted}}">{{caption?}}</figcaption>
    </figure>
    <p style="position:absolute;left:128px;bottom:64px;font-size:{{@scale.caption}}px;color:{{@token.ink_muted}}">{{@page}}</p>
    <aside>{{notes?}}</aside>
</section>
