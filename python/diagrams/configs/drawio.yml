renderer:
  page: dark # dark | model. dark: every render sits on the dark page (STYLE.md tokens); model: the model's own background, white allowed. Parameter: --page
  out: out/drawio # where drawio_forward.py lands its artifacts when no <out_dir> argument is given
  query-edges-max-nodes: 45 # a C3 or C4 query slide at or under this many cells draws its edges, each in a lane of its own; over it, its cells carry count chips and its edges live one zoom down
  carrier: article # the carrier of a diagram that has neither a yml beside its png nor a block in an article yet (the carrier is otherwise read off the disk). article: a `yml drawio` block directly above the image that embeds its png; file: <name>.drawio.yml beside its png
  role: slide # a diagram's role when roles: names none. slide: its subtitle says `<codes> · <lens>`; legend: it names no ADR and has no subtitle
  edge-label: pill # pill | word: how an edge's word is drawn, every diagram alike. pill: a round-cornered box hugging the word, on the line at the band or ring border it crosses or at its middle, the arrowhead kept clear (a line too short to hold it gets the same pill beside it, word-gap px off the line); word: the word beside its line, a pill only where the line crosses into another band or zone
  edge-label-legend-pill: the word on a line # the meaning in the legend entry `label: <this>` when labels are pills
  edge-label-legend-word: into a new state # the meaning in the legend entry `transition: <this>` when labels are words
  edge-label-tail-clear: 2 # px of line a pill leaves between itself and the end of the line at the tail
  edge-label-head-clear: 12 # px of line a pill leaves between itself and the arrowhead's tip: the head takes about 10
  uniform-label: legend # legend | pills: when every flow edge of a diagram says one word (calls), the plain arrow's legend entry says it once (`flow: calls`) and no edge draws a pill; pills: every edge draws its own; derived at render time, never written back; a count keeps its pill
  edge-route: elbow # elbow | straight: how an edge is routed whose two ends share no x and no y overlap, so no straight line joins them: elbow, one bend (out of the side facing across, into the side facing along); straight, the diagonal. An edge whose ends overlap on an axis is always straight
  findings-fail: yes # yes | no: whether a finding (every one the kit reports: a conflict, a refused put, an undeclared slide, a keep-out hit) fails the run; one setting, no per-finding exception
  word-gap: 3 # px a steep edge's word stands right of its line, left-aligned at the line's middle; written into the model, so draw.io and the painter read the same
  edge-deadzone: 8 # px an edge stops short of every box it starts or ends at, so its line and head never touch the box edge; written into the model as source/targetPerimeterSpacing (draw.io reads it), whatever heads the edge has
  edge-deadzone-min-line: 12 # px of line an edge keeps whatever its deadzone: both ends together take at most the edge's length less this, so the clearance shrinks on a short edge (full below about 2 x edge-deadzone + this) and a line always shows; the model keeps the nominal spacing, which draw.io cannot cap
  wrap-break-glued: / # a wrapped contract line may break after these, and unwrap rejoins them with no space
  wrap-break-spaced: space , # a wrapped contract line may break after these, and unwrap rejoins them with one space (space is the blank)
  wrap-break-late: . # only when a piece is still too long, break after these too; unwrap rejoins them with no space
  word-margin: 3 # px of inner margin a label pill keeps around its word on every side: the smallest flattened ellipse that holds the word
  label-inner-margin: 4 # px between a diamond's label text and the edge of its invisible text rect, every side
  label-outer-margin: 6 # px between the corner of that text rect and the diamond's border, measured square to the border
edge-semantics:
  legend: initiator to receiver # the words of a plain arrow's legend entry, `flow: <this>`; a diagram's own relation replaces them and opts out of the checks below
  code-kinds: code, runner # the glyph kinds that are code blocks: a plain arrow ends on one only from an actor, or labelled as a call
  code-head-labels: calls, feeds # the edge labels that let an arrow end on a code block without an actor: a call into the code, or a feed of what the code takes in
edge-labels: # the words an edge may carry to say something other than the default, each with the end that initiates under it (tail or head)
  calls: tail
  reads: tail
  writes: tail
  feeds: tail
  failed: tail
  else: tail # the tail is tried first; the head is used only when the tail yields nothing
  composes: tail # the tail, a whole, is built from the head, its part
  then: tail # the head comes after the tail: the next rung, the next step, or the form derived from it
  in: tail # the tail lives inside the head, its container
edge-rank: # the rank of a glyph kind as an end of an arrow, lowest first, each rank with its kinds: the lower rank acts on the higher, so an edge between cells of different rank runs from the lower to the higher
  actor: actor, cause
  code: code, runner, private, callsite, action, type, gate
  file: file, env, external
  store: store, set
  result: result, failure, effect
edge-defaults: # the label an oriented edge carries when it declares none, `<tail>><head>` each a glyph kind or a rank name, the kind before the rank; a pair without an entry stays plain
  code>file: reads
  code>set: reads
  code>store: writes
  code>failure: failed
edge-rules: # the rest of the arrow rule's vocabulary
  trusted-kinds: gate # glyph kinds whose unlabelled edges keep the direction the author declared; nothing infers or judges them
roles: # a diagram's role, keyed by its stem's repository path (`.assets/<name>`), only where it is not renderer.role
  docs/explanation/.assets/glyphs: legend # the glyph library, the legend every slide's glyphs come from
lenses: # the closed set of lenses a diagram is drawn through (its about.lens, the end of its subtitle), each with what it shows; the badge prints the name
  meta: what the decision is and why
  architecture: the parts and how they depend on each other
  implementation: how the code carries it out
  operations: what an operator sets and sees
  governance: which gates check it
  source: one responsibility of one module, drawn from the code
  action: one action, its cause on the left rim and its effects on rings, in accosted words
  proof: one action's normalized statement, and the words each engine runs it as
zooms: # the closed ladder of how far out a diagram stands (its optional about.zoom, no default), crossing the lens; the zoom badge prints the level
  C0: landscape, the truth stores around the repository
  C1: context, the repository as one system with its actors
  C2: containers, the tracks crossed with the engines and languages
  C3: components, one container's modules or units and their dependency edges
  C4: code, one module's files and their link edges
commits: # the locked commit palette ([DDR-VISUAL-FIXEDCOMMITPALETTE](/docs/drs/design/visual-design.md#rule-ddr-visual-fixedcommitpalette)):a commit state's fill, stroke and digit ink, hex without the hash; the first is the default
  bvt: FFE082 F9A825 1E2430
  topic: C4915C 7A4B25 1E2430
  landed: C9CCD1 6B7178 1E2430
  l3: 64B5F6 1565C0 1E2430
  main-uat: DAE8FC 6C8EBF 1E2430
  release-uat: D5E8D4 82B366 1E2430
  prod: 60A917 2D7600 DDE2E9
  discarded: 8E2424 E57373 DDE2E9
layers: # the paint order, back to front: put orders the model's cells by it under each parent, and the raster paints the model's order, as draw.io does
  panels: bands, notes, the legend panel, the sidebar and the map key
  frames: groups, which hold their own layers inside them
  spans: span bars
  lines: gate rules, lane trunks and bypasses, which pass beneath the edges
  edges: every other edge
  titles: a band's title, a borderless box of its own, painted over the edges that cross its band so an edge passes under the word
  glyphs: glyphs, commits and the minimap pictures
  marks: markers and chips
  labels: text, on top of everything
lane: # a lane's commits and glyphs, placed by step and row (lanes: in a diagram's declaration)
  slot: centre # left | centre | right: where a commit or glyph stands in its row at its step; two on one row at one step take left and right, side by side
  slot-gap: 56 # px between the centres of a left and a right slot of one step, each standing half of it from the step's centre
span: # a span bar's place over what it covers
  row: auto # auto | 0, 1, 2 ...: auto stacks a span one row above every span it overlaps, the narrow ones first; a number puts it on that row, 0 the row beside its bands
states: a state diagram, its arrows the steps of one thing; only it declares a relation (DDR-VISUAL-ARROWSPOINTATWHATTHEYDEPENDON)
kinds: # the two diagram kinds; each supplies the default three minimaps (minimaps: below)
  explanation: an explanation diagram, embedded by an article under docs/explanation
  reference: a reference diagram, embedded by a page under docs/references or docs/drs
wheres: # where an action diagram's effect happens, drawn as its where chip
  local: this machine and this repository
  remote: a service or a machine beyond the repository
# cspell:ignore callsite
action-lens: # what the action lens draws with: its layout numbers in diagram units, the cause's sizes, and its glyph kinds (glyphs.xml ids g-<kind>)
  ring-gap: 240 # the distance from one ring to the next: the note width and 50 clear
  note-width: 190 # the width of an effect's note
  action-width: 300 # the widest action glyph; a longer call wraps inside it
  clearance: 40 # how far the action clears the cause's round, and the first ring the action's right edge
  lane-height: 360 # the invisible centre lane that holds the cause, the action and every effect note
  ring-margin: 70 # the margin above and below the lane where the rings crawl up and down before the frame cuts them
  cause-size: medium # the default size of the cause's half-disc on the left rim
  cause-sizes: smallest 64, small 80, medium 96, large 112, largest 128 # the half-disc's radius for each named size, smallest to largest; a label ending in ! takes the largest
  glyphs: cause, action, callsite, ring, effect
  proof: shown # shown | hidden: whether an action diagram draws its Proof box under the frame, the statement in each engine's words
  where: local # the diagram's default where (one of wheres:); content.where overrides it, and a note draws a chip only where it differs
  show: both # words | call | both: what an effect's note prints, its words, its observation or call, or both; show: on an effect overrides it
  actor: shown # shown | hidden: the stick man drawn over the finished drawing for the onlooker, the cause's fragment as his head, his body hanging from it
  proof-engines: pwsh pascal, bash kebab, zsh kebab # the engines a Proof box prints, each with the idiom its words take
themes: # the themes a diagram renders in, each a theme-<name> token set below; the first is the default and the one whose raster is committed
  dark: the dark page and the light ink of STYLE.md
  light: the light page and the dark ink of the light-era kit, rendered on demand to out/
