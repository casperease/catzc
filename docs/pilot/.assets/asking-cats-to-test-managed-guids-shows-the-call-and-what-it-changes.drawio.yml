description: "Cat form: Test-ManagedGuids is the quality gate that checks every guid in tracked text is registered, none is denied and every entry is live, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test managed guids shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test managed guids" }
  action:
    call: { test_managed_guids: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject managed-guids with an issue count of 0: no issues"
      proves: { test_managed_guids: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-managed-guids/"
      proves: { get_repository_file: { path: out/test-managed-guids/latest.txt } }
      after: effect-result
