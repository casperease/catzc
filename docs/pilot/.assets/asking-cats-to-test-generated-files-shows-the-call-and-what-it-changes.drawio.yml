description: "Cat form: Test-GeneratedFiles is the quality gate that checks every generated file equals what its generator would write now, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test generated files shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test generated files" }
  action:
    call: { test_generated_files: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject generated-files with an issue count of 0: no issues"
      proves: { test_generated_files: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-generated-files/"
      proves: { get_repository_file: { path: out/test-generated-files/latest.txt } }
      after: effect-result
