description: "Cat form: Test-ShippedTypes is the quality gate that checks every shipped C# type resolves in the session by its module and file name, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
