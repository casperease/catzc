description: "Cat form: Test-GeneratedReadmes is the quality gate that checks every generated README is gitignored, untracked and current, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test generated readmes shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test generated readmes" }
  action:
    call: { test_generated_readmes: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject generated-readmes with an issue count of 0: no issues"
      proves: { test_generated_readmes: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-generated-readmes/"
      proves: { get_repository_file: { path: out/test-generated-readmes/latest.txt } }
      after: effect-result
