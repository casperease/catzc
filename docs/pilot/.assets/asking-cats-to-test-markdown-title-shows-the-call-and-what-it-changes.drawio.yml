description: "Cat form: Test-MarkdownTitle is the quality gate that fails on any in-scope Markdown file whose title or headings are not in normal form, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test markdown title shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test markdown title" }
  action:
    call: { test_markdown_title: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject markdown-title with an issue count of 0: no issues"
      proves: { test_markdown_title: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-markdown-title/"
      proves: { get_repository_file: { path: out/test-markdown-title/latest.txt } }
      after: effect-result
