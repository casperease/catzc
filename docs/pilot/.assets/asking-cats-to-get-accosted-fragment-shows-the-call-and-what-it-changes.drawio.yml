description: "Cat form: Get-AccostedFragment renders the commands of an accosted file as a PowerShell fragment through the one reader (ADR-AUTO-ACCOSTED-ONEREADER)"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to get accosted fragment shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to get accosted fragment" }
  action:
    call: { get_accosted_fragment: { path: pwsh/Catzc.Base.QualityGates/accosted/english-dictionary.accosted.yml } }
  effects:
    - id: effect-fragment
      zone: 1
      says: "The commands of the file are rendered as three PowerShell lines: two Get-RepositoryFile calls and one Test-GeneratedFiles call"
      proves: { get_accosted_fragment: { path: pwsh/Catzc.Base.QualityGates/accosted/english-dictionary.accosted.yml } }
    - id: effect-source
      zone: 2
      says: "The lines are a rendering of the contract-form commands the one reader holds"
      proves: { get_accosted_file: { path: pwsh/Catzc.Base.QualityGates/accosted/english-dictionary.accosted.yml } }
      after: effect-fragment
