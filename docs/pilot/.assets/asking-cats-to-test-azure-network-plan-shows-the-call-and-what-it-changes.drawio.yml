description: "Cat form: Test-AzureNetworkPlan is the quality gate that checks the network plan against the azure config's environments and subscriptions and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test azure network plan shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test azure network plan" }
  action:
    call: { test_azure_network_plan: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject azure-network-plan with an issue count of 0: no issues"
      proves: { test_azure_network_plan: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-azure-network-plan/"
      proves: { get_repository_file: { path: out/test-azure-network-plan/latest.txt } }
      after: effect-result
