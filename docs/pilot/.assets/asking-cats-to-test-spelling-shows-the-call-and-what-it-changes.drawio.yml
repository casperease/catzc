description: "Cat form: Test-Spelling is the quality gate that spell-checks the repository's known file types with cspell, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test spelling shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test spelling" }
  action:
    call: { test_spelling: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject spelling with an issue count of 22: 22 issues"
      proves: { test_spelling: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-spelling/"
      proves: { get_repository_file: { path: out/test-spelling/latest.txt } }
      after: effect-result
