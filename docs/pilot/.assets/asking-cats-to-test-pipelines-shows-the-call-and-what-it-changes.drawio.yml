description: "Cat form: Test-Pipelines is the quality gate that checks the .ado/pipelines/ tree against the naming-and-placement contract and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
