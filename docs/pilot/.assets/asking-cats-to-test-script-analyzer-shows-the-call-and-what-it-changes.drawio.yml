description: "Cat form: Test-ScriptAnalyzer is the quality gate that analyzes the PowerShell with PSScriptAnalyzer, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test script analyzer shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test script analyzer" }
  action:
    call: { test_script_analyzer: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject script-analyzer with an issue count of 0: no issues"
      proves: { test_script_analyzer: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-script-analyzer/"
      proves: { get_repository_file: { path: out/test-script-analyzer/latest.txt } }
      after: effect-result
