description: "Cat form: Test-ShippedConfigs is the quality gate that checks every shipped config has a registered C# config type and loads through it, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test shipped configs shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test shipped configs" }
  action:
    call: { test_shipped_configs: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject shipped-configs with an issue count of 0: no issues"
      proves: { test_shipped_configs: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-shipped-configs/"
      proves: { get_repository_file: { path: out/test-shipped-configs/latest.txt } }
      after: effect-result
