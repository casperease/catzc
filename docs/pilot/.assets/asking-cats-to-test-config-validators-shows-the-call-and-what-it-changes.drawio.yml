description: "Cat form: Test-ConfigValidators is the quality gate that checks every config validator maps to a config of its own module and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test config validators shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test config validators" }
  action:
    call: { test_config_validators: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject config-validators with an issue count of 0: no issues"
      proves: { test_config_validators: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-config-validators/"
      proves: { get_repository_file: { path: out/test-config-validators/latest.txt } }
      after: effect-result
