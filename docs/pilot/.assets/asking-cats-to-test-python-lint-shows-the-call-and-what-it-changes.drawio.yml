description: "Cat form: Test-PythonLint is the quality gate that lints every Python file the repository holds with ruff, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test python lint shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test python lint" }
  action:
    call: { test_python_lint: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject python-lint with an issue count of 0: no issues"
      proves: { test_python_lint: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-python-lint/"
      proves: { get_repository_file: { path: out/test-python-lint/latest.txt } }
      after: effect-result
