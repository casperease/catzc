description: "Cat form: Get-PathFileType names the file type a path resolves to through the file-language registry"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to get path file type shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to get path file type" }
  action:
    call: { get_path_file_type: { path: README.md } }
  effects:
    - id: effect-type
      zone: 1
      says: "The file type of README.md is md"
      proves: { get_path_file_type: { path: README.md } }
    - id: effect-language
      zone: 2
      says: "The type resolves through the file-language registry to the markdown language"
      proves: { get_file_language: { path: README.md } }
      after: effect-type
