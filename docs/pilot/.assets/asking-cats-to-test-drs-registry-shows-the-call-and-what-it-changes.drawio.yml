description: "Cat form: Test-DrsRegistry is the quality gate that checks the ADR registry and the ADR rule files agree and returns its result, with each configured check's findings, under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test drs registry shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test drs registry" }
  action:
    call: { test_drs_registry: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject drs-registry with an issue count of 0: no issues"
      proves: { test_drs_registry: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-drs-registry/"
      proves: { get_repository_file: { path: out/test-drs-registry/latest.txt } }
      after: effect-result
