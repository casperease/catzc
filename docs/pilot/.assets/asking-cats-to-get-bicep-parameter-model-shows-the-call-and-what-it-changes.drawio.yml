description: "Cat form: Get-BicepParameterModel returns a template's Bicep parameter model, every parameter its compiled main.json declares"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to get bicep parameter model shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to get bicep parameter model" }
  action:
    call: { get_bicep_parameter_model: { template: discovery } }
  effects:
    - id: effect-model
      zone: 1
      says: "The compiled parameter model of the discovery template is returned, every parameter its main.json declares, location first"
      proves: { get_bicep_parameter_model: { template: discovery } }
    - id: effect-names
      zone: 2
      says: "The template name is one of the discovered Bicep template names"
      proves: { get_bicep_template_names: }
      after: effect-model
