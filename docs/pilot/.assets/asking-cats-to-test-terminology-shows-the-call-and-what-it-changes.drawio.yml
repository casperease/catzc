description: "Cat form: Test-Terminology is the quality gate that checks the terminology registry has no drift, no orphans and no unjustified entries, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test terminology shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test terminology" }
  action:
    call: { test_terminology: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject terminology with an issue count of 14: 14 issues"
      proves: { test_terminology: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-terminology/"
      proves: { get_repository_file: { path: out/test-terminology/latest.txt } }
      after: effect-result
