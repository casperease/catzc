description: "Cat form: Test-FolderConventions is the quality gate that checks every module folder under pwsh/ follows the folder and file conventions, and returns its result under -PassThru"
about:
  adrs:
    - ADR-REPO-CMDCONTRACT-COMMANDCONTRACT
    - DDR-VISUAL-ACTIONISALENS
  lens: action
content:
  title: "Asking cats to test folder conventions shows the call and what it changes"
  kind: explanation
  cause: { label: "Someone asks cats to test folder conventions" }
  action:
    call: { test_folder_conventions: { pass_thru: true } }
  effects:
    - id: effect-result
      zone: 1
      says: "The gate ran and returned its subject folder-conventions with an issue count of 0: no issues"
      proves: { test_folder_conventions: { pass_thru: true } }
    - id: effect-report
      zone: 2
      says: "Its report is written under out/test-folder-conventions/"
      proves: { get_repository_file: { path: out/test-folder-conventions/latest.txt } }
      after: effect-result
