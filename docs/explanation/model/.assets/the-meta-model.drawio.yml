description: >-
  The meta model in six parts: modules that exist by their layout, one dependency graph, the load order it gives, the engines the modules
  run on, the decision records that govern them, and the glossary of their words.
about:
  adrs:
    [
      ADR-AUTO-MODULE-EXISTSBYLAYOUT,
      ADR-AUTO-DEPM-UNIFIEDGRAPH,
      ADR-AUTO-MODULE-TOPOLOGICALORDER,
      ADR-AUTO-ENGINE-THREEENGINES,
      ADR-REPO-DRSCODE-PATHOFSEGMENTS,
      ADR-REPO-VOCAB-GLOSSARYSOURCE,
    ]
  lens: meta
content:
  title: The meta model is what the files make up and what governs them
  kind: explanation
  flow: left-to-right
  theme: dark
  bands:
    - { id: band-engines, label: RUN BY }
    - { id: band-code, label: CODE }
    - { id: band-governance, label: GOVERNANCE }
  glyphs:
    - { id: m-modules, kind: module, label: Modules, in: band-code }
    - { id: s-graph, kind: set, label: Dependency graph, in: band-code }
    - { id: s-order, kind: result, label: Load order, in: band-code }
    - { id: e-engines, kind: env, label: Engines, in: band-engines }
    - { id: d-records, kind: drsonly, label: Decision records, in: band-governance }
    - { id: f-glossary, kind: file, label: Glossary, in: band-governance }
  edges:
    - { from: s-graph, to: m-modules, kind: read }
    - { from: s-order, to: s-graph, kind: read }
    - { from: e-engines, to: m-modules, kind: flow, label: runs }
    - { from: f-glossary, to: d-records, kind: read }
  markers:
    - { at: m-modules, number: 1 }
    - { at: s-graph, number: 2 }
    - { at: s-order, number: 3 }
    - { at: e-engines, number: 4 }
    - { at: d-records, number: 5 }
    - { at: f-glossary, number: 6 }
  legend: auto
