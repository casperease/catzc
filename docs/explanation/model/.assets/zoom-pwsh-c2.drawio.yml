description: >-
  The pwsh track as a container: its modules, the internal modules that load them, and the vendored modules beside them, run on the
  engines the modules name.
about:
  adrs: [ADR-AUTO-MODULE-EXISTSBYLAYOUT, ADR-AUTO-ENGINE-THREEENGINES, DDR-VISUAL-ZOOMISANAXIS]
  lens: architecture
  zoom: C2
content:
  title: The pwsh track holds its modules, its internals and its vendored code
  kind: explanation
  flow: left-to-right
  theme: dark
  bands:
    - { id: band-track, label: PWSH TRACK }
    - { id: band-engines, label: ENGINES }
  glyphs:
    - { id: m-modules, kind: set, label: Catzc modules, in: band-track }
    - { id: m-internal, kind: module, label: .internal, in: band-track }
    - { id: m-vendor, kind: set, label: .vendor, in: band-track }
    - { id: e-pwsh, kind: env, label: pwsh, in: band-engines }
    - { id: e-bash, kind: env, label: bash, in: band-engines }
    - { id: e-zsh, kind: env, label: zsh, in: band-engines }
  edges:
    - { from: m-internal, to: m-modules, kind: flow, label: loads }
    - { from: m-modules, to: m-vendor, kind: flow, label: calls }
    - { from: e-pwsh, to: m-modules, kind: flow, label: runs }
    - { from: e-bash, to: m-modules, kind: flow, label: runs }
    - { from: e-zsh, to: m-modules, kind: flow, label: runs }
  legend: auto
