description: >-
  The pwsh track as a container: the internal modules load its modules, which call the vendored modules beside them, and the three engines
  run them.
about:
  rules: [ADR-AUTO-MODULE-EXISTSBYLAYOUT, ADR-AUTO-ENGINE-THREEENGINES, DDR-VISUAL-ZOOMISANAXIS]
  lens: architecture
  zoom: C2
content:
  title: The pwsh track holds its modules, its internals and its vendored code
  kind: explanation
  flow: left-to-right
  theme: dark
  bands:
    - { id: band-engines, label: ENGINES }
    - { id: band-load, label: LOADS }
    - { id: band-modules, label: MODULES }
    - { id: band-vendor, label: VENDORED }
  glyphs:
    - { id: e-engines, kind: env, label: pwsh bash zsh, in: band-engines }
    - { id: m-internal, kind: module, label: .internal, in: band-load }
    - { id: m-modules, kind: set, label: Modules, in: band-modules }
    - { id: m-vendor, kind: set, label: .vendor, in: band-vendor }
  edges:
    - { from: e-engines, to: m-internal, kind: flow, label: runs }
    - { from: m-internal, to: m-modules, kind: flow, label: loads }
    - { from: m-modules, to: m-vendor, kind: flow, label: calls }
  legend: auto
