          - ADR-CONF-ADDRESSING-GLOBALADDRESSFORM
          - ADR-CONF-ADDRESSING-RESOLUTIONFAILSFAST
          - ADR-CONF-ADDRESSING-VERSIONCONTROLLEDONLY
      - cell: pwsh/Catzc.Base.Folders/tests/types
