description: Get-ConfigValue and Get-Config resolve a name to one file and answer with the session's cached object; the first
  read parses and types the file, and a bad key, an unknown or ambiguous name or a malformed config throws at the call.
about:
  adrs:
  - ADR-CONF-LOADING-ONEREADER
  - ADR-CONF-LOADING-EXISTENCEDISCOVERED
  - ADR-CONF-LOADING-CACHEBYPATH
  - ADR-CONF-LOADING-CSHARPCONFIGTYPE
  - ADR-CONF-ADDRESSING-RESOLUTIONFAILSFAST
  lens: operations
content:
  title: Ask for a config by name and get the cached object back
  kind: explanation
  flow: left-to-right
  relation: what runs next
  theme: dark
  bands:
  - id: band-run
    label: WHAT YOU RUN
  - id: band-first
    label: FIRST READ
  - id: band-throws
