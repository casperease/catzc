  - id: g-resolve
    kind: code
    label: name -> one file
    in: band-run
  - id: s-cache
    kind: store
    label: session cache
    in: band-run
  - id: r-same
    kind: result
    label: same object
    in: band-run
  - id: g-parsed
    kind: code
    label: parsed and typed
    in: band-first
  - id: f-bad-key
