    - TDR-STORES-RECONCILEFACTS
    - TDR-ONETRUTH-REPOSITORYISCONFIGURATIONRECORD
  lens: architecture
content:
  title: Catzc writes its domain, reads fact sources, meets state machines
  kind: explanation
  flow: left-to-right
  relation: reaches
  theme: dark
  bands:
    - { id: band-domain, label: RESPONSIBILITY DOMAIN }
    - { id: band-adjacent, label: ADJACENT STORE }
    - { id: band-facts, label: FACT SOURCES }
    - { id: band-machines, label: STATE MACHINES }
  glyphs:
