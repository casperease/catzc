description:
  "Four bands left to right: a responsibility domain band holds a store, a code unit and a runner, then an adjacent store band, a fact
  sources band with a store, and a state machines band with two external tools, joined by flow edges."
about:
  adrs:
    - TDR-STORES-THREEKINDS
    - TDR-STORES-RESPONSIBILITYDOMAIN
    - TDR-STORES-FACTSOURCEREADONLY
    - TDR-STORES-STATEMACHINE
    - TDR-STORES-RECONCILEFACTS
    - TDR-ONETRUTH-REPOSITORYISCONFIGURATIONRECORD
  lens: architecture
content:
  title: Catzc writes its domain, reads fact sources, meets state machines
  kind: explanation
  flow: left-to-right
  relation: reaches
  theme: dark
  bands:
    - { id: band-domain, label: RESPONSIBILITY DOMAIN }
    - { id: band-adjacent, label: ADJACENT STORE }
    - { id: band-facts, label: FACT SOURCES }
    - { id: band-machines, label: STATE MACHINES }
  glyphs:
    - { id: s-repo, kind: store, label: repository at one commit, in: band-domain }
    - { id: r-pipelines, kind: runner, label: trunk pipelines, in: band-domain }
    - { id: c-catzc, kind: code, label: catzc, in: band-domain }
    - { id: s-ado-config, kind: store, label: ADO configuration, in: band-adjacent }
    - { id: s-ado-runtime, kind: store, label: ADO runtime state, in: band-facts }
    - { id: x-ado, kind: external, label: Azure DevOps, in: band-machines }
    - { id: x-snow, kind: external, label: ITSM (ServiceNow), in: band-machines }
  edges:
    - { from: s-repo, to: r-pipelines, kind: flow, label: trunk }
    - { from: r-pipelines, to: s-ado-config, kind: thick, label: one way }
    - { from: c-catzc, to: s-repo, kind: flow, label: writes }
    - { from: c-catzc, to: s-ado-runtime, kind: flow, label: reads }
    - { from: x-ado, to: c-catzc, kind: flow, label: verdict }
    - { from: c-catzc, to: x-snow, kind: flow, label: facts }
  legend: auto
  minimaps:
