    - { from: c-catzc, to: s-ado-runtime, kind: flow, label: reads }
    - { from: x-ado, to: c-catzc, kind: flow, label: verdict }
    - { from: c-catzc, to: x-snow, kind: flow, label: facts }
  legend: auto
  minimaps: [axis, lifecycle-position, layer-stack]
