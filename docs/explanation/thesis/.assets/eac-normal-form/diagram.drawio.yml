description:
  "One band holds four groups left to right: a file in the unordered track, a runner and a gate that loops back to it on a failure path,
  and a result that feeds a named set; a group of three named sets stands beneath."
about:
  adrs:
    - ADR-THES-NORMALFORM-ANYCODEHASNORMALFORM
    - ADR-THES-NORMALFORM-ENABLINGCONSTRAINTS
    - ADR-THES-NORMALFORM-UNCONTESTED
    - ADR-THES-NORMALFORM-MIGRATIONREACHESTHEFORM
    - ADR-DSGN-TRACK-UNORDEREDTRACK
    - ADR-DSGN-TRACK-MIGRATEONEFILEPERCOMMIT
  lens: meta
content:
  title: A file leaves the unordered track only in the normal form
  kind: explanation
  flow: left-to-right
  relation: moves on
  theme: dark
  bands:
    - id: band-constraints
      label: INSIDE THE ENABLING CONSTRAINTS
  groups:
    - id: grp-unordered
      label: UNORDERED TRACK
      in: band-constraints
    - id: grp-migration
      label: FRAGMENT MIGRATION
      in: band-constraints
    - id: grp-form
      label: EAC NORMAL FORM
      in: band-constraints
    - id: grp-constraints
      label: ENABLING CONSTRAINTS
      in: band-constraints
  glyphs:
    - id: f-fragment
      kind: file
      label: code fragment
      in: grp-unordered
    - id: r-migration
      kind: runner
      label: one file per commit
      in: grp-migration
    - id: gt-fixed
      kind: gate
      label: own checks
      in: grp-migration
    - id: res-form
      kind: result
      label: in the form
      in: grp-form
    - id: st-home
      kind: set
      label: module or track
      in: grp-form
    - id: st-defaults
      kind: set
      label: sensible defaults
      in: grp-constraints
    - id: st-bundle
      kind: set
      label: catzc bundle
      in: grp-constraints
    - id: st-configs
      kind: set
      label: local configs
      in: grp-constraints
  edges:
    - from: f-fragment
      to: r-migration
      kind: flow
      label: one change
    - from: r-migration
      to: gt-fixed
      kind: flow
      label: ""
    - from: gt-fixed
      to: r-migration
      kind: fail
      label: contested
    - from: gt-fixed
      to: res-form
      kind: thick
      label: uncontested
    - from: res-form
      to: st-home
      kind: flow
      label: leaves
  legend: auto
