description:
  Truth spread across disjoint stores drifts apart, so one version-controlled repository decides what is true about the delivered system.
about:
  adrs:
    - TDR-STORES-VERSIONCONTROLLEDREPOSITORY
    - TDR-ONETRUTH-ONESTOREDECIDES
  lens: architecture
content:
  title: The repository is the one store that decides what is true
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b-drift, label: THE PROBLEM }
    - { id: b-one, label: THE ANSWER }
  glyphs:
    - { id: g-stores, kind: failure, label: "Servers, databases, CMDBs, ticket systems drift apart", in: b-drift }
    - { id: g-repo, kind: set, label: "Version-controlled repository: reviewed history of changes", in: b-one }
    - { id: g-truth, kind: result, label: "One source of truth for the delivered system", in: b-one }
  edges:
    - { from: g-stores, to: g-repo, kind: flow, label: "" }
    - { from: g-repo, to: g-truth, kind: flow, label: "" }
  markers:
    - { at: g-stores, number: 1 }
    - { at: g-repo, number: 2 }
    - { at: g-truth, number: 3 }
  legend: auto
