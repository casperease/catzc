description:
  "The header function's four checks in code order: three return a header, three throw, and no check falls through to the next on failure."
about:
  adrs:
    - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
    - ADR-ADO-AUTH-PROVETARGET
    - ADR-ADO-AUTH-EXPLICITDETECTION
    - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
  lens: implementation
content:
  title: The header function is four checks and three returns, and none falls through on failure
  kind: explanation
  flow: left-to-right
  relation: what comes next
  theme: dark
  bands:
    - id: band-returns
      label: RETURNS
    - id: band-check
      label: CHECK
    - id: band-throws
      label: THROWS
  glyphs:
    - id: g-pipeline
      kind: gate
      label: Test-IsRunningInPipeline
      in: band-check
    - id: g-pat
      kind: gate
      label: $env:AZURE_DEVOPS_PAT
      in: band-check
    - id: g-azcli
      kind: gate
      label: Assert-AzCliConnected
      in: band-check
    - id: g-not-empty
      kind: gate
      label: Assert-NotNullOrWhitespace
      in: band-check
    - id: r-bearer
      kind: result
      label: Bearer SYSTEM_ACCESSTOKEN
      in: band-returns
    - id: r-basic
      kind: result
      label: Basic $base64
      in: band-returns
    - id: r-output
      kind: result
      label: Bearer $result.Output
      in: band-returns
    - id: f-mismatch
      kind: failure
      label: does not match ado.yml
      in: band-throws
    - id: f-context
      kind: failure
      label: Not logged in, wrong context
      in: band-throws
    - id: f-no-token
      kind: failure
      label: No ADO token available
      in: band-throws
  edges:
    - from: g-pipeline
      to: g-pat
      kind: flow
      label: ""
    - from: g-pat
      to: g-azcli
      kind: flow
      label: ""
    - from: g-azcli
      to: g-not-empty
      kind: flow
      label: ""
    - from: g-pipeline
      to: r-bearer
      kind: flow
      label: ""
    - from: g-pat
      to: r-basic
      kind: flow
      label: ""
    - from: g-not-empty
      to: r-output
      kind: flow
      label: ""
    - from: g-pipeline
      to: f-mismatch
      kind: fail
      label: ""
    - from: g-azcli
      to: f-context
      kind: fail
      label: ""
    - from: g-not-empty
      to: f-no-token
      kind: fail
      label: ""
  markers:
    - at: g-pipeline
      number: 1
    - at: f-mismatch
      number: 2
    - at: g-pat
      number: 3
    - at: g-azcli
      number: 4
    - at: f-context
      number: 5
    - at: g-not-empty
      number: 6
    - at: f-no-token
      number: 7
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: docs/-/.
        by:
          - docs/adr/ado/dora-explains.md
          - docs/adr/ado/dual-authentication.md
          - docs/adr/index.md
          - docs/references/pwsh/catzc-azure-dev-ops/Get-AdoAuthorizationHeader.ps1.md
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Get-AdoAuthorizationHeader.ps1
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: pwsh/Catzc.Base.Docs/configs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
    module-neighbourhood:
      - cell: subject/Catzc.Azure.DevOps
        by:
          - pwsh/Catzc.Azure.DevOps/Get-AdoAuthorizationHeader.ps1
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: subject/Catzc.Base.Docs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: subject/pipelines
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
    axis:
      - cell: FLOW/access
        by:
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-EXPLICITDETECTION
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
