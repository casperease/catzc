description:
  "The three Azure DevOps credentials in their fixed order, as a column of gates: each returns one Authorization header or raises its own
  error, and none falls back to the next."
about:
  adrs: [ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE, ADR-ADO-AUTH-PROVETARGET, ADR-ADO-AUTH-ASSERTWHENNOTOKEN]
  lens: meta
content:
  title: The first configured credential wins, and it must prove its org
  kind: explanation
  flow: left-to-right
  relation: what comes next
  theme: dark
  bands:
    - { id: band-returns, label: RETURNS }
    - { id: band-sources, label: FIRST CONFIGURED SOURCE }
    - { id: band-raises, label: RAISES }
  glyphs:
    - { id: g-header, kind: result, label: Authorization header, in: band-returns }
    - { id: g-pipeline, kind: gate, label: Pipeline token, in: band-sources }
    - { id: g-pat, kind: gate, label: Personal access token, in: band-sources }
    - { id: g-login, kind: gate, label: Interactive login, in: band-sources }
    - { id: g-own, kind: failure, label: "Own error, no fallback", in: band-raises }
  edges:
    - { from: g-pipeline, to: g-pat, kind: flow, label: "" }
    - { from: g-pat, to: g-login, kind: flow, label: "" }
    - { from: g-pipeline, to: g-header, kind: flow, label: "" }
    - { from: g-pat, to: g-header, kind: flow, label: "" }
    - { from: g-login, to: g-header, kind: flow, label: "" }
    - { from: g-pipeline, to: g-own, kind: fail, label: "" }
    - { from: g-login, to: g-own, kind: fail, label: "" }
  markers:
    - { at: g-pipeline, number: 1 }
    - { at: g-pat, number: 2 }
    - { at: g-login, number: 3 }
    - { at: g-header, number: 4 }
    - { at: g-own, number: 5 }
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/ado/dora-explains.md
          - docs/drs/ado/dual-authentication.md
          - docs/drs/index.md
          - docs/references/pwsh/catzc-azure-dev-ops/Get-AdoAuthorizationHeader.ps1.md
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Get-AdoAuthorizationHeader.ps1
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
    module-neighbourhood:
      - cell: subject/Catzc.Azure.DevOps
        by:
          - pwsh/Catzc.Azure.DevOps/Get-AdoAuthorizationHeader.ps1
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
      - cell: subject/Catzc.Base.Drs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-ADO-AUTH-ASSERTWHENNOTOKEN
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
    axis:
      - cell: FLOW/access
        by: [ADR-ADO-AUTH-ASSERTWHENNOTOKEN, ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE, ADR-ADO-AUTH-PROVETARGET]
layout:
  band-returns: { x: 20, y: 84, w: 300, h: 360 }
  band-sources: { x: 340, y: 84, w: 620, h: 360 }
  band-raises: { x: 980, y: 84, w: 300, h: 360 }
  g-pipeline: { x: 480, y: 128, w: 340, h: 72 }
  g-pat: { x: 480, y: 238, w: 340, h: 72 }
  g-login: { x: 480, y: 348, w: 340, h: 72 }
  g-header: { x: 60, y: 238, w: 220, h: 72 }
  g-own: { x: 1020, y: 238, w: 220, h: 72 }
