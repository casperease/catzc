description:
  The two ways an Azure DevOps call starts, a pipeline step through invoke-automation.yaml or a developer's shell, both reaching one header
  function whose three credentials each rest on a proof anchored in ado.yml.
about:
  adrs:
    - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
    - ADR-ADO-AUTH-PROVETARGET
    - ADR-ADO-AUTH-SEPARATETOKENFUNCTION
    - ADR-ADO-AUTH-TEMPLATESMAPSYSTEMTOKEN
  lens: architecture
content:
  title: One function owns the credential precedence, and ado.yml anchors every proof
  kind: explanation
  flow: left-to-right
  relation: uses
  theme: dark
  bands:
    - id: band-entry
      label: ENTRY
    - id: band-call
      label: CALL PATH
    - id: band-anchor
      label: WHAT A PROOF RESTS ON
  groups:
    - id: grp-header
      label: Get-AdoAuthorizationHeader
      in: band-call
  glyphs:
    - id: g-developer
      kind: actor
      label: Developer shell
      in: band-entry
    - id: g-pipeline-yaml
      kind: runner
      label: pipeline yaml
      in: band-entry
    - id: g-template
      kind: runner
      label: invoke-automation.yaml
      in: band-entry
    - id: g-api
      kind: code
      label: an ADO API function
      in: band-call
    - id: g-invoke
      kind: code
      label: Invoke-AdoRestMethod
      in: band-call
    - id: g-pipeline
      kind: gate
      label: Pipeline token
      in: grp-header
    - id: g-pat
      kind: gate
      label: PAT
      in: grp-header
    - id: g-azcli
      kind: gate
      label: az CLI
      in: grp-header
    - id: g-ado-yml
      kind: file
      label: ado.yml
      in: band-anchor
    - id: g-cli-module
      kind: code
      label: Catzc.Azure.Cli
      in: band-anchor
  edges:
    - from: g-developer
      to: g-api
      kind: flow
      label: ""
    - from: g-pipeline-yaml
      to: g-template
      kind: flow
      label: ""
    - from: g-template
      to: g-api
      kind: flow
      label: ""
    - from: g-api
      to: g-invoke
      kind: flow
      label: ""
    - from: g-invoke
      to: grp-header
      kind: flow
      label: ""
    - from: g-pipeline
      to: g-template
      kind: flow
      label: ""
    - from: g-pipeline
      to: g-ado-yml
      kind: flow
      label: ""
    - from: g-pat
      to: g-ado-yml
      kind: adr
      label: ""
    - from: g-azcli
      to: g-ado-yml
      kind: flow
      label: ""
    - from: g-azcli
      to: g-cli-module
      kind: flow
      label: ""
  markers:
    - at: g-pipeline-yaml
      number: 1
    - at: g-template
      number: 2
    - at: g-developer
      number: 3
    - at: g-api
      number: 4
    - at: g-invoke
      number: 5
    - at: g-pipeline
      number: 6
    - at: g-pat
      number: 7
    - at: g-azcli
      number: 8
    - at: g-cli-module
      number: 9
    - at: g-ado-yml
      number: 10
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/ado/dora-explains.md
          - docs/drs/ado/dual-authentication.md
          - docs/drs/index.md
          - docs/references/pwsh/catzc-azure-dev-ops/Get-AdoAuthorizationHeader.ps1.md
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
          - ADR-ADO-AUTH-SEPARATETOKENFUNCTION
          - ADR-ADO-AUTH-TEMPLATESMAPSYSTEMTOKEN
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Get-AdoAuthorizationHeader.ps1
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
          - ADR-ADO-AUTH-SEPARATETOKENFUNCTION
          - ADR-ADO-AUTH-TEMPLATESMAPSYSTEMTOKEN
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-ADO-AUTH-FIXEDCREDENTIALPRECEDENCE
          - ADR-ADO-AUTH-PROVETARGET
          - ADR-ADO-AUTH-SEPARATETOKENFUNCTION
          - ADR-ADO-AUTH-TEMPLATESMAPSYSTEMTOKEN
    module-neighbourhood:
