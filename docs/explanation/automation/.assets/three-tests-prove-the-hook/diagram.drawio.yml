      number: 1
    - at: g-decide
      number: 2
    - at: g-hook
      number: 3
    - at: g-logic
      number: 4
    - at: g-parity
      number: 5
    - at: g-published
      number: 6
    - at: a-exemptions
      number: 7
  chips:
    - at: g-config
      kind: rule
      rule: ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
    - at: g-config
      kind: rule
      rule: ADR-AUTO-DEFAULT-ONERESOLUTIONORDER
    - at: g-decide
      kind: rule
      rule: ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
    - at: g-hook
      kind: rule
      rule: ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
    - at: a-exemptions
      kind: rule
      rule: ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
      gated: false
  legend: auto
  minimaps:
