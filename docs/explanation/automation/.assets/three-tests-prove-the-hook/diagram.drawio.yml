description:
  "One rule bounds every agent call: the limits, the verdict and the hook follow it, three tests at three tiers prove the hook, and the
  exemption route has no gate because it exists only in the ADR."
about:
  adrs:
    - ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
    - ADR-AUTO-DEFAULT-ONERESOLUTIONORDER
  lens: governance
content:
  title: One rule bounds every call, three tests prove the hook, and the exemption route is ADR-only
  kind: explanation
  flow: left-to-right
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-limits
      label: LIMITS
    - id: band-verdict
      label: VERDICT
    - id: band-hook
      label: HOOK
    - id: band-no-gate
      label: NO GATE
    - id: band-tests
      label: TESTS
  glyphs:
    - id: g-config
      kind: code
      label: TimeoutsConfig
      in: band-limits
    - id: g-decide
      kind: code
      label: BashSafeguard.Decide
      in: band-verdict
    - id: g-hook
      kind: code
      label: Assert-BashTimeout
      in: band-hook
    - id: a-exemptions
      kind: adronly
      label: timeout-exemptions.yml
      in: band-no-gate
    - id: g-logic
      kind: gate
      label: BashSafeguard (L0 logic)
      in: band-tests
    - id: g-parity
      kind: gate
      label: parity (L1 integrity)
      in: band-tests
    - id: g-published
      kind: gate
      label: published hook (L2 logic)
      in: band-tests
  edges:
