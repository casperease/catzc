description:
  A path to a sibling checkout is written with the first segment workspace, and a busy test run uses a verified snapshot.
about:
  adrs:
    - ADR-AUTO-PATH-WORKSPACEANCHOR
    - ADR-AUTO-TEST-RUNSNEVERWAIT
  lens: architecture
content:
  title: A workspace anchor names the folder beside the repository
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: PATH }
    - { id: b1, label: TEST RUN }
  glyphs:
    - { id: g0, kind: set, label: "workspace: parent folder of the repository root", in: b0 }
    - { id: g1, kind: gate, label: "First segment only, never absolute, never ..", in: b0 }
    - { id: g2, kind: result, label: "Resolved at the point of use, in either shell view", in: b0 }
    - { id: g3, kind: code, label: "First run owns the working folder", in: b1 }
    - { id: g4, kind: code, label: "Busy: runs in a verified snapshot", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g3, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
