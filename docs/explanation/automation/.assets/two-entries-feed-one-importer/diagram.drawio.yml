description:
  Two entry scripts, one per run mode, feed one importer; the importer and its bootstrap are removed once the load is done, and the shared
  internal layer, the vendored modules, the cats modules and the janitor owners stay loaded.
about:
  adrs:
    - ADR-AUTO-BUNDLE-TWOROOTS
    - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
  lens: architecture
content:
  title: Two entry scripts feed one importer, and the importer leaves once the load is done
  kind: explanation
  flow: top-to-bottom
  relation: drives
  theme: dark
  bands:
    - id: band-entry
      label: ENTRY
    - id: band-removed
      label: REMOVED AFTER LOAD
    - id: band-stays
      label: STAYS LOADED
  glyphs:
    - id: g-importer-ps1
      kind: code
      label: importer.ps1
      in: band-entry
    - id: g-import-catzc
      kind: code
      label: Import-Catzc.ps1
      in: band-entry
    - id: g-importer
      kind: code
      label: Catzc.Internal.Importer
      in: band-removed
    - id: g-bootstrap
      kind: code
      label: Catzc.Internal.Bootstrap
      in: band-removed
    - id: s-internal
      kind: set
      label: .internal shared layer
      in: band-stays
    - id: s-vendor
      kind: set
      label: .vendor
      in: band-stays
    - id: s-janitors
      kind: set
      label: Janitor owners
      in: band-stays
    - id: s-modules
      kind: set
      label: Catzc.* modules
      in: band-stays
  edges:
    - from: g-importer-ps1
      to: g-importer
      kind: flow
      label: ""
    - from: g-import-catzc
      to: g-importer
      kind: flow
      label: ""
    - from: g-importer
      to: s-internal
      kind: thick
      label: ""
    - from: g-importer
      to: s-vendor
      kind: thick
      label: ""
    - from: g-importer
      to: s-janitors
      kind: thick
      label: ""
    - from: g-importer
      to: g-bootstrap
      kind: flow
      label: ""
    - from: g-bootstrap
      to: s-modules
      kind: thick
      label: ""
  markers:
    - at: g-importer-ps1
      number: 1
    - at: g-import-catzc
      number: 2
    - at: band-entry
      number: 3
    - at: g-importer
      number: 4
    - at: g-bootstrap
      number: 5
    - at: s-internal
      number: 6
    - at: s-vendor
      number: 7
    - at: s-modules
      number: 8
    - at: s-janitors
      number: 9
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/automation/dora-explains.md
          - docs/drs/automation/platform-bundle.md
          - docs/drs/index.md
          - docs/references/pwsh/catzc-base-exporter/configs/exporter.yml.md
          - docs/references/pwsh/catzc-base-exporter/private/Assert-BundleFootprint.ps1.md
          - docs/references/pwsh/catzc-base-exporter/types/ExporterBundle.cs.md
          - docs/references/pwsh/catzc-base-exporter/types/ExporterConfig.cs.md
          - docs/references/pwsh/internal/Catzc.Internal.Builder.psm1.md
          - docs/references/pwsh/internal/Catzc.Internal.Importer.psm1.md
          - docs/references/pwsh/internal/assets/Import-Catzc.ps1.md
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/Catzc.Base.Exporter/configs
        by:
          - pwsh/Catzc.Base.Exporter/configs/exporter.yml
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/Catzc.Base.Exporter/private
        by:
          - pwsh/Catzc.Base.Exporter/private/Assert-BundleFootprint.ps1
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/Catzc.Base.Exporter/types
        by:
          - pwsh/Catzc.Base.Exporter/types/ExporterBundle.cs
          - pwsh/Catzc.Base.Exporter/types/ExporterConfig.cs
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/Catzc.Internal.Assets/.
        by:
          - pwsh/.internal/assets/Import-Catzc.ps1
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
    grid:
      - cell: docs/markdown
        by:
          - docs/drs/automation/dora-explains.md
          - docs/drs/automation/platform-bundle.md
          - docs/drs/index.md
          - docs/references/pwsh/catzc-base-exporter/configs/exporter.yml.md
          - docs/references/pwsh/catzc-base-exporter/private/Assert-BundleFootprint.ps1.md
          - docs/references/pwsh/catzc-base-exporter/types/ExporterBundle.cs.md
          - docs/references/pwsh/catzc-base-exporter/types/ExporterConfig.cs.md
          - docs/references/pwsh/internal/Catzc.Internal.Builder.psm1.md
          - docs/references/pwsh/internal/Catzc.Internal.Importer.psm1.md
          - docs/references/pwsh/internal/assets/Import-Catzc.ps1.md
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/bcl
        by:
          - pwsh/Catzc.Base.Exporter/types/ExporterBundle.cs
          - pwsh/Catzc.Base.Exporter/types/ExporterConfig.cs
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/powershell
        by:
          - pwsh/.internal/assets/Import-Catzc.ps1
          - pwsh/Catzc.Base.Exporter/private/Assert-BundleFootprint.ps1
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: pwsh/yaml
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - pwsh/Catzc.Base.Exporter/configs/exporter.yml
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: (no track)/powershell
        by:
          - importer.ps1
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
    axis:
      - cell: AUTO/build
        by:
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
      - cell: AUTO/release
        by:
          - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
          - ADR-AUTO-BUNDLE-TWOROOTS
