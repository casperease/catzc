description:
  The secret is a SecureString, masked in output, decrypted only when set, and never kept as state.
about:
  adrs:
    - ADR-PWSH-ENV-SECRETHANDOFF
    - ADR-AUTO-ENVVAR-NOSECRETSTATE
  lens: architecture
content:
  title: Write-EnvironmentSet is the one secret seam
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: SEAM }
    - { id: b1, label: BOUNDARY }
  glyphs:
    - { id: g0, kind: file, label: "Secret as a SecureString", in: b0 }
    - { id: g1, kind: gate, label: "Masked as *** everywhere", in: b0 }
    - { id: g2, kind: code, label: "Decrypted only when it sets the variable", in: b0 }
    - { id: g3, kind: set, label: "Child or external process", in: b1 }
    - { id: g4, kind: failure, label: "Never stored as state our code reads back", in: b1 }
  edges:
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
