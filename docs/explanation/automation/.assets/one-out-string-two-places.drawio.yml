description:
  One stored out/ string is the same on every machine; the output root joins it at the point of use, so it lands in the repository's out
  folder on a devbox and in the staging directory in a pipeline, and a missing staging directory throws.
about:
  adrs: [ADR-AUTO-PATH-BINDINGFORMONLYATBINDING, ADR-AUTO-PATH-OUTANCHOR]
  lens: operations
content:
  title: One stored out/ string lands in {root}/out on a devbox and in the staging directory in a pipeline
  kind: explanation
  flow: left-to-right
  relation: feeds
  theme: dark
  bands:
    - { id: band-communication, label: COMMUNICATION FORM }
    - { id: band-crossers, label: THE TWO CROSSERS }
    - { id: band-binding, label: BINDING FORM }
  groups:
    - { id: grp-bound, label: bound paths, in: band-binding }
  glyphs:
    - { id: r-stored, kind: result, label: out/template/.../main.json, in: band-communication }
    - { id: g-resolve, kind: code, label: Resolve-RepoPath, in: band-crossers }
    - { id: g-output-root, kind: code, label: Get-OutputRoot, in: band-crossers }
    - { id: n-pipeline, kind: runner, label: pipeline job, in: band-crossers }
    - { id: r-devbox, kind: result, label: "{root}/out/.../main.json", in: grp-bound }
    - { id: r-pipeline, kind: result, label: "{staging}/.../main.json", in: grp-bound }
    - { id: f-missing, kind: failure, label: Path does not exist, in: band-binding }
  edges:
    - { from: r-stored, to: g-resolve, kind: flow, label: "" }
    - { from: g-output-root, to: g-resolve, kind: flow, label: "" }
    - { from: n-pipeline, to: g-output-root, kind: flow, label: "" }
    - { from: g-resolve, to: grp-bound, kind: flow, label: "" }
    - { from: g-output-root, to: f-missing, kind: fail, label: "" }
  markers:
    - { at: r-stored, number: 1 }
    - { at: g-resolve, number: 2 }
    - { at: g-output-root, number: 3 }
    - { at: n-pipeline, number: 4 }
    - { at: r-devbox, number: 5 }
    - { at: r-pipeline, number: 6 }
    - { at: f-missing, number: 7 }
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/skills/catzc-module
        by: [.claude/skills/catzc-module/SKILL.md, ADR-AUTO-PATH-BINDINGFORMONLYATBINDING]
      - cell: docs/-/.
        by:
          - docs/drs/automation/dora-explains.md
          - docs/drs/automation/path-representation.md
          - docs/drs/index.md
          - docs/references/pwsh/catzc-base-docs/configs/readme.yml.md
          - docs/references/pwsh/catzc-base-docs/types/DocMapping.cs.md
          - docs/references/pwsh/catzc-base-docs/types/DocPattern.cs.md
          - docs/references/pwsh/catzc-base-module-system/Copy-CatzcModule.ps1.md
          - docs/references/pwsh/catzc-base-objects/types/RepoRelativePath.cs.md
          - docs/references/pwsh/catzc-base-repository/ConvertTo-RepoRelativePath.ps1.md
          - docs/references/pwsh/catzc-base-repository/Resolve-RepoPath.ps1.md
          - docs/references/pwsh/catzc-base-root-config/configs/rootconfig.yml.md
          - docs/references/pwsh/catzc-base-root-config/types/RootConfigFile.cs.md
          - docs/references/pwsh/catzc-tooling-inspiration/private/Resolve-InspirationRoot.ps1.md
          - docs/references/pwsh/catzc-tooling-inspiration/types/InspirationRoot.cs.md
          - ADR-AUTO-PATH-BINDINGFORMONLYATBINDING
          - ADR-AUTO-PATH-OUTANCHOR
      - cell: pwsh/Catzc.Base.Docs/configs
        by: [pwsh/Catzc.Base.Docs/configs/readme.yml, ADR-AUTO-PATH-BINDINGFORMONLYATBINDING, ADR-AUTO-PATH-OUTANCHOR]
      - cell: pwsh/Catzc.Base.Docs/types
        by:
          - pwsh/Catzc.Base.Docs/types/DocMapping.cs
          - pwsh/Catzc.Base.Docs/types/DocPattern.cs
          - ADR-AUTO-PATH-BINDINGFORMONLYATBINDING
          - ADR-AUTO-PATH-OUTANCHOR
      - cell: pwsh/Catzc.Base.Drs/configs
        by: [pwsh/Catzc.Base.Drs/configs/drs.yml, ADR-AUTO-PATH-BINDINGFORMONLYATBINDING, ADR-AUTO-PATH-OUTANCHOR]
      - cell: pwsh/Catzc.Base.ModuleSystem/.
        by: [pwsh/Catzc.Base.ModuleSystem/Copy-CatzcModule.ps1, ADR-AUTO-PATH-BINDINGFORMONLYATBINDING, ADR-AUTO-PATH-OUTANCHOR]
      - cell: pwsh/Catzc.Base.Objects/types
