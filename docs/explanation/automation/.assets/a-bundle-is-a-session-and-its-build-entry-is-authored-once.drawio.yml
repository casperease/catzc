description:
  Loading it makes every error terminate and writes only under out/, through an entry authored once.
about:
  adrs:
    - ADR-AUTO-BUNDLE-BUNDLEISSESSION
    - ADR-PWSH-ENGINE-BUILDENTRY
  lens: architecture
content:
  title: A bundle is a session with one build entry
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: SESSION }
    - { id: b1, label: ENTRY }
  glyphs:
    - { id: g0, kind: gate, label: "Every error and warning terminates", in: b0 }
    - { id: g1, kind: gate, label: "Writes only under out/", in: b0 }
    - { id: g2, kind: file, label: "Import-Catzc.ps1, authored once", in: b1 }
    - { id: g3, kind: code, label: "Copied verbatim into every build", in: b1 }
    - { id: g4, kind: code, label: "Catzc.psm1 dot-sources it", in: b1 }
  edges:
    - { from: g2, to: g3, kind: flow, label: "" }
    - { from: g3, to: g4, kind: flow, label: "" }
    - { from: g4, to: g0, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
