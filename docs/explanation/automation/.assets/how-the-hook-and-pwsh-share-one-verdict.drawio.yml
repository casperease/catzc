    - { from: g-config, to: g-tiers, kind: flow, label: calls }
    - { from: g-safeguard, to: g-config, kind: flow, label: calls }
    - { from: g-safeguard, to: g-bounded, kind: flow, label: calls }
    - { from: g-config, to: g-timeouts, kind: flow, label: "" }
  markers:
    - { at: x-bash, number: 1 }
    - { at: g-hook, number: 2 }
    - { at: g-seconds, number: 3 }
    - { at: g-config, number: 4 }
    - { at: g-timeouts, number: 5 }
    - { at: g-safeguard, number: 6 }
    - { at: g-bounded, number: 7 }
  legend: auto
  minimaps: [code-locations, module-neighbourhood, axis]
