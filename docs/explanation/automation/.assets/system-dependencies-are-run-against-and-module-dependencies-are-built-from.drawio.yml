    - { id: g-tools, kind: file, label: "tools.yml and the Install and Invoke triads", in: b-sys }
    - { id: g-mod, kind: code, label: "Module dependency: an edge among our own modules", in: b-mod }
    - { id: g-dep, kind: file, label: "dependencies.yml", in: b-mod }
    - { id: g-split, kind: gate, label: "ADR-AUTO-DEPS and ADR-AUTO-DEPM stay distinct", in: b-name }
  edges:
