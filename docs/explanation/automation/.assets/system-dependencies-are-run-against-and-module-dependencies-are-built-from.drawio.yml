description:
  A system dependency is what the toolset runs against, a module dependency is what it is built from, and the two names stay distinct.
about:
  adrs:
    - ADR-AUTO-DEPS-TWODEPENDENCYKINDS
    - ADR-AUTO-DEPM-NOTSYSTEMDEPENDENCY
  lens: architecture
content:
  title: Two kinds of dependency, two names
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b-sys, label: RUN AGAINST }
    - { id: b-mod, label: BUILT FROM }
    - { id: b-name, label: TWO NAMES }
  glyphs:
