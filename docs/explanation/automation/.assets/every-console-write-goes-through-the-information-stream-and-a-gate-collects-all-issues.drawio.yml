description:
  One writer chokepoint, and a quality gate collects every issue.
about:
  adrs:
    - ADR-PWSH-ANNOUNCE-INFORMATIONSTREAMCHOKEPOINT
    - ADR-AUTO-TEST-QUALITYGATE
  lens: architecture
content:
  title: Every console write goes through the information stream
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: CONSOLE }
    - { id: b1, label: GATE }
