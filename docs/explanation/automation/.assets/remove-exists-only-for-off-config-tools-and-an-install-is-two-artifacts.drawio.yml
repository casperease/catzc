description:
  Remove-Tool is added only where an eviction hole exists, for tools installed off-config that would shadow the managed build.
about:
  adrs:
    - ADR-AUTO-REMOVE-OFFCONFIGTOOLSONLY
    - ADR-AUTO-BUNDLE-TWOARTIFACTINSTALL
  lens: architecture
content:
