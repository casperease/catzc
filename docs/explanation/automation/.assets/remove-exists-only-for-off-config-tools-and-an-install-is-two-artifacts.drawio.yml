  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: OFF-CONFIG }
    - { id: b1, label: REMOVE }
  glyphs:
    - { id: g0, kind: set, label: "Distro package, pip install, OS stub, hand-built binary", in: b0 }
    - { id: g1, kind: failure, label: "Would shadow the managed build", in: b0 }
    - { id: g2, kind: gate, label: "Remove-Tool only where an eviction hole exists", in: b1 }
    - { id: g3, kind: result, label: "Not minted for every tool", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
