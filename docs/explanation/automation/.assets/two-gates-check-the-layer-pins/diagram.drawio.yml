      to: s-tooling
      kind: thick
      label: ""
    - from: s-azure-ext
      to: s-base
      kind: thick
      label: ""
    - from: s-tooling
      to: s-base
      kind: thick
      label: ""
    - from: g-load
      to: g-quality
      kind: flow
      label: ""
  markers:
