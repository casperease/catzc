      number: 1
    - at: s-tooling
      number: 2
    - at: s-base
      number: 3
    - at: g-load
      number: 4
    - at: g-quality
      number: 5
    - at: a-review
      number: 6
  chips:
    - at: s-azure-ext
      kind: rule
      rule: ADR-AUTO-DEPM-TWOSECTIONS
    - at: s-azure-ext
      kind: rule
      rule: ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - at: s-tooling
      kind: rule
      rule: ADR-AUTO-DEPM-TWOSECTIONS
    - at: s-tooling
      kind: rule
      rule: ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - at: s-base
      kind: rule
      rule: ADR-AUTO-DEPM-TWOSECTIONS
    - at: s-base
      kind: rule
      rule: ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - at: g-load
      kind: rule
      rule: ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - at: g-quality
      kind: rule
      rule: ADR-AUTO-DEPM-CODEBUILTFROM
    - at: g-quality
      kind: rule
      rule: ADR-AUTO-DEPM-UNIFIEDGRAPH
    - at: g-quality
      kind: rule
      rule: ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - at: g-quality
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
    - at: a-review
