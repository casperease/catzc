description:
  Two gates check the layer pins, one against the declaration's own shape at load and one against the real code and the on-disk modules; a
  new edge landing with its code is left to review, because no gate checks it.
about:
  adrs:
    - ADR-AUTO-DEPM-CODEBUILTFROM
    - ADR-AUTO-DEPM-UNIFIEDGRAPH
    - ADR-AUTO-DEPM-TWOSECTIONS
    - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
    - ADR-AUTO-DEPM-EXTENDBYDECLARING
    - ADR-AUTO-TEST-QUALITYGATE
  lens: governance
content:
  title: Two gates check the layer pins, and one rule is left to review
  kind: explanation
  flow: left-to-right
  relation: runs before
  theme: dark
  bands:
    - id: band-top
      label: TOP LAYER
    - id: band-middle
      label: MIDDLE LAYER
    - id: band-foundation
      label: FOUNDATION
    - id: band-load
      label: AT LOAD
    - id: band-repository
      label: AGAINST THE REPOSITORY
    - id: band-no-gate
      label: NO GATE
  glyphs:
    - id: s-azure-ext
      kind: set
      label: AzureExt
      in: band-top
    - id: s-tooling
      kind: set
      label: Tooling
      in: band-middle
    - id: s-base
      kind: set
      label: Base
      in: band-foundation
    - id: g-load
      kind: gate
      label: Load check
      in: band-load
    - id: g-quality
      kind: gate
      label: Quality gate
      in: band-repository
    - id: a-review
      kind: adronly
      label: Same-change review
      in: band-no-gate
  edges:
