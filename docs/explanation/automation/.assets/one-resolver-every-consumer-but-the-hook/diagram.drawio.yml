description:
  One resolver combines the run environment, the typed timeouts config and the exemptions config into one limit for every consumer except
  the hook, which compiles the same config type itself.
about:
  adrs:
    - ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
    - ADR-AUTO-DEFAULT-ONERESOLUTIONORDER
  lens: architecture
content:
  title: One resolver serves every consumer but the hook, which compiles the same config type
  kind: explanation
  flow: left-to-right
  relation: feeds
  theme: dark
  bands:
    - id: band-axes
      label: AXES
    - id: band-limit
      label: LIMIT
    - id: band-raise
      label: RAISE
    - id: band-consumers
      label: CONSUMERS
  groups:
    - id: grp-consumers
      label: bounded runs
      in: band-consumers
  glyphs:
    - id: g-environment
      kind: code
      label: Get-RunEnvironment
      in: band-axes
    - id: g-config
      kind: code
      label: TimeoutsConfig
      in: band-limit
    - id: g-exemptions
      kind: code
      label: TimeoutExemptionsConfig
      in: band-raise
    - id: g-seconds
      kind: code
      label: Get-TimeoutSeconds
      in: band-raise
    - id: g-hook
      kind: gate
      label: Assert-BashTimeout
      in: band-consumers
    - id: g-executable
      kind: code
      label: Invoke-Executable
      in: grp-consumers
    - id: g-with-timeout
      kind: code
      label: Invoke-WithTimeout
      in: grp-consumers
  edges:
    - from: g-environment
      to: g-seconds
      kind: flow
      label: ""
    - from: g-config
      to: g-seconds
      kind: flow
      label: ""
    - from: g-config
      to: g-hook
      kind: flow
      label: ""
    - from: g-exemptions
      to: g-seconds
      kind: flow
      label: ""
    - from: g-seconds
      to: grp-consumers
      kind: flow
      label: ""
  markers:
    - at: g-environment
      number: 1
    - at: g-config
      number: 2
    - at: g-exemptions
      number: 3
    - at: g-seconds
      number: 4
    - at: g-hook
      number: 5
    - at: g-executable
      number: 6
    - at: g-with-timeout
      number: 7
  legend: auto
  minimaps:
    - code-locations
    - module-neighbourhood
    - axis
