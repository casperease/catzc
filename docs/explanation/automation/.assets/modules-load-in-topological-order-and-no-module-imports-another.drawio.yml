description:
  Foundation first, ties broken ordinally, and no module imports another.
about:
  adrs:
    - ADR-AUTO-MODULE-TOPOLOGICALORDER
    - ADR-PWSH-MANIFEST-NOMODULEIMPORTS
  lens: architecture
content:
  title: Modules load in the order of the declared graph
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: GRAPH }
    - { id: b1, label: LOAD }
  glyphs:
    - { id: g0, kind: file, label: "Declared module graph", in: b0 }
    - { id: g1, kind: code, label: "Topological order: foundation first, ties ordinal", in: b0 }
    - { id: g2, kind: gate, label: "No Import-Module, using module or RequiredModules", in: b1 }
    - { id: g3, kind: result, label: "One global function namespace", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
