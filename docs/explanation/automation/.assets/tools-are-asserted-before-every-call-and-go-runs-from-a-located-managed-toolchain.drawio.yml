description:
  "And Go runs from a located, managed toolchain."
about:
  adrs:
    - ADR-AUTO-DEPS-ASSERTBEFOREINVOKE
    - ADR-AUTO-GO-MANAGEDTOOLCHAIN
  lens: architecture
content:
  title: "Tools are asserted before every call"
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: ASSERT }
    - { id: b1, label: GO }
  glyphs:
    - { id: g0, kind: code, label: "Assert-Tool: Assert-Command and Assert-ToolVersion", in: b0 }
    - { id: g1, kind: code, label: "Resolve-ToolExecutable: timed existence check", in: b0 }
    - { id: g2, kind: gate, label: "Managed toolchain located, run by path", in: b1 }
    - { id: g3, kind: failure, label: "Never a bare go off PATH", in: b1 }
    - { id: g4, kind: set, label: "GOTOOLCHAIN=local", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
    - { from: g2, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
