description:
  Citation tags name the rules a test enforces, are validated when present, and are read by a discovery-only pass.
about:
  adrs:
    - ADR-AUTO-TEST-PROVENANCETAGS
    - ADR-PWSH-PESTER-DISCOVERYONLYPASS
  lens: architecture
content:
  title: A test may carry provenance tags
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: TAGS }
    - { id: b1, label: DISCOVERY }
  glyphs:
    - { id: g0, kind: gate, label: "A test may carry ADR citation tags", in: b0 }
    - { id: g1, kind: result, label: "Absence is never a violation", in: b0 }
    - { id: g2, kind: gate, label: "A present citation is validated", in: b0 }
    - { id: g3, kind: code, label: "Discovery-only pass: Run.SkipRun", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g3, to: g2, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
