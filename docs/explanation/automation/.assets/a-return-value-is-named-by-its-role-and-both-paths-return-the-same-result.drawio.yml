description:
  Two blessed locals, ret and found, and both paths of a state function return the same result.
about:
  adrs:
    - ADR-PWSH-NAMES-RETURNVALUEBYROLE
    - ADR-PWSH-IDEM-SAMERESULTBOTHPATHS
  lens: architecture
content:
  title: Name a return value by its role
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: LOCALS }
    - { id: b1, label: PATHS }
  glyphs:
    - { id: g0, kind: code, label: "ret: the return accumulator", in: b0 }
    - { id: g1, kind: code, label: "found: the lookup result", in: b0 }
    - { id: g2, kind: gate, label: "Early return existing", in: b1 }
    - { id: g3, kind: gate, label: "End of the work path", in: b1 }
    - { id: g4, kind: result, label: "Same type, declared in OutputType", in: b1 }
  edges:
    - { from: g2, to: g4, kind: flow, label: "" }
    - { from: g3, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
