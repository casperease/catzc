description:
  No ambient mutation, a temporary change is restored on every path, and some restored changes go unannounced.
about:
  adrs:
    - ADR-AUTO-ONEJOB-EXPLICITSTATECHANGES
    - ADR-PWSH-ANNOUNCE-UNANNOUNCEDCHANGES
  lens: architecture
content:
  title: State changes are explicit
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: EXPLICIT }
    - { id: b1, label: UNANNOUNCED }
  glyphs:
    - { id: g0, kind: gate, label: "No mutation of ambient global state", in: b0 }
    - { id: g1, kind: gate, label: "A temporary change is restored, failure path included", in: b0 }
    - { id: g2, kind: set, label: "Changes restored in a finally block", in: b1 }
    - { id: g3, kind: set, label: "Changes inside Start-Job or ForEach-Object -Parallel", in: b1 }
    - { id: g4, kind: set, label: "LASTEXITCODE", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
    - { from: g1, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
