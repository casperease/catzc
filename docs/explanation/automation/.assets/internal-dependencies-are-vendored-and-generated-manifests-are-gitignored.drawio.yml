description:
  New-DynamicManifest recomputes each psd1 on every import.
about:
  adrs:
    - ADR-AUTO-DEPM-INTERNALVENDORED
    - ADR-PWSH-MANIFEST-MANIFESTSGITIGNORED
  lens: architecture
content:
  title: Manifests are generated, never committed
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: MANIFEST }
    - { id: b1, label: GIT }
  glyphs:
    - { id: g0, kind: code, label: "New-DynamicManifest", in: b0 }
    - { id: g1, kind: file, label: "Module psd1, from the filesystem", in: b0 }
    - { id: g2, kind: gate, label: "Written only when content differs", in: b0 }
    - { id: g3, kind: result, label: "pwsh/**/*.psd1 is gitignored", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
