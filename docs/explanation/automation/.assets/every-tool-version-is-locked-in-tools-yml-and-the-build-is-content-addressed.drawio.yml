    - ADR-AUTO-DEPS-LOCKEDTOOLVERSIONS
    - ADR-AUTO-BUNDLE-IMMUTABLEBUILD
  lens: architecture
content:
  title: Every tool version is locked
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: TOOLS }
    - { id: b1, label: BUILD }
