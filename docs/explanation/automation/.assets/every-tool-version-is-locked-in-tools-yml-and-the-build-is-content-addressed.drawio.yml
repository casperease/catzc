    - { id: g2, kind: set, label: "git and vscode track latest and verify the hash", in: b0 }
    - { id: g3, kind: result, label: "Same commit, byte-identical build", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
