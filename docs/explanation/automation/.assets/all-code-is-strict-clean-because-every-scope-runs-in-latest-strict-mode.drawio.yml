description:
  Every scope runs under Set-StrictMode Latest, so empty results and counts are written to survive it.
about:
  adrs:
    - ADR-PWSH-ERROR-STRICTCLEAN
    - ADR-PWSH-ENGINE-STRICTMODELATEST
  lens: architecture
content:
  title: All code is strict-clean
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: STRICT MODE }
    - { id: b1, label: CLEAN CODE }
  glyphs:
    - { id: g0, kind: gate, label: "Set-StrictMode Latest in every scope catzc owns", in: b0 }
    - { id: g1, kind: failure, label: "A session-level setting does not reach module code", in: b0 }
    - { id: g2, kind: result, label: "Set where the code runs", in: b0 }
    - { id: g3, kind: code, label: "Select-Object -First 1, never @(result)[0]", in: b1 }
    - { id: g4, kind: code, label: "Wrap a producer in @() before reading Count", in: b1 }
  edges:
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
    - { from: g2, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
