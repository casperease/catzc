description:
  New content is new files and folders, and a new root concern is a new track.
about:
  adrs:
    - ADR-AUTO-EXTEND-ADDNOTEDIT
    - ADR-AUTO-MODULE-LANGUAGESFROMFILES
  lens: architecture
content:
  title: Extend by adding, not editing
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: ADD }
    - { id: b1, label: ONE LEVEL UP }
  glyphs:
    - { id: g0, kind: file, label: "New function, module or dependency: a new file or folder", in: b0 }
    - { id: g1, kind: failure, label: "Never edit the importer entries or the bootstrap loader", in: b0 }
    - { id: g2, kind: set, label: "A new root concern is a new track", in: b1 }
    - { id: g3, kind: result, label: "A modules languages come from its files", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
