description:
  "Module dependencies form three layers: the Azure extension group on top, the Azure root and the tooling modules in the middle, and the
  base libraries as the foundation; every allowed edge points down."
about:
  adrs:
    - ADR-AUTO-DEPM-CODEBUILTFROM
    - ADR-AUTO-DEPM-TWOSECTIONS
    - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
  lens: architecture
content:
  title: Module dependencies form three layers, and every edge points down
  kind: explanation
  flow: top-to-bottom
  relation: may depend on
  theme: dark
  bands:
    - id: band-top
      label: TOP LAYER
    - id: band-middle
      label: MIDDLE LAYER
    - id: band-foundation
      label: FOUNDATION
  glyphs:
    - id: s-azure-ext
      kind: set
      label: AzureExt
      in: band-top
    - id: g-azure
      kind: code
      label: Catzc.Azure
      in: band-middle
    - id: g-core
      kind: code
      label: Tooling.Core
      in: band-middle
    - id: s-tooling
      kind: set
      label: Tooling
      in: band-middle
    - id: g-github
      kind: code
      label: Github · KeyHandler
      in: band-middle
    - id: s-base
      kind: set
      label: Base
      in: band-foundation
  edges:
    - from: s-azure-ext
      to: g-azure
      kind: flow
      label: 4/5
    - from: s-azure-ext
      to: s-base
      kind: thick
      label: 5/5
    - from: s-azure-ext
      to: s-tooling
      kind: thick
      label: 3/5
    - from: s-azure-ext
      to: g-core
      kind: flow
      label: ""
    - from: g-azure
      to: s-base
      kind: thick
      label: ""
    - from: s-tooling
      to: s-base
      kind: thick
      label: 6/6
    - from: g-github
      to: s-base
      kind: thick
      label: 2/2
  markers:
    - at: s-azure-ext
      number: 1
    - at: g-azure
      number: 2
    - at: s-tooling
      number: 3
    - at: g-github
      number: 4
    - at: s-base
      number: 5
    - at: g-core
      number: 6
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: docs/-/.
        by:
          - docs/adr/automation/controlling-module-dependencies.md
          - docs/adr/automation/dora-explains.md
          - docs/adr/index.md
          - docs/references/pwsh/catzc-base-maps/Get-ModuleNeighbourhoodMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-module-system/types/DependenciesConfig.cs.md
          - docs/references/pwsh/catzc-base-module-system/types/DependencyGraph.cs.md
          - docs/references/pwsh/catzc-base-module-system/types/ModuleGroup.cs.md
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/Catzc.Base.Docs/configs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/Catzc.Base.Maps/.
        by:
          - pwsh/Catzc.Base.Maps/Get-ModuleNeighbourhoodMinimapData.ps1
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/Catzc.Base.ModuleSystem/types
        by:
          - pwsh/Catzc.Base.ModuleSystem/types/DependenciesConfig.cs
          - pwsh/Catzc.Base.ModuleSystem/types/DependencyGraph.cs
          - pwsh/Catzc.Base.ModuleSystem/types/ModuleGroup.cs
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
    grid:
      - cell: ado-pipelines/pipeline-yaml
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: docs/markdown
        by:
          - docs/adr/automation/controlling-module-dependencies.md
          - docs/adr/automation/dora-explains.md
          - docs/adr/index.md
          - docs/references/pwsh/catzc-base-maps/Get-ModuleNeighbourhoodMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-module-system/types/DependenciesConfig.cs.md
          - docs/references/pwsh/catzc-base-module-system/types/DependencyGraph.cs.md
          - docs/references/pwsh/catzc-base-module-system/types/ModuleGroup.cs.md
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/bcl
        by:
          - pwsh/Catzc.Base.ModuleSystem/types/DependenciesConfig.cs
          - pwsh/Catzc.Base.ModuleSystem/types/DependencyGraph.cs
          - pwsh/Catzc.Base.ModuleSystem/types/ModuleGroup.cs
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/powershell
        by:
          - pwsh/Catzc.Base.Maps/Get-ModuleNeighbourhoodMinimapData.ps1
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
      - cell: pwsh/yaml
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
    axis:
      - cell: AUTO/*
        by:
          - ADR-AUTO-DEPM-CODEBUILTFROM
          - ADR-AUTO-DEPM-GROUPAWAREINTEGRITY
          - ADR-AUTO-DEPM-TWOSECTIONS
