description:
  "An author reads an accosted file through cats: one harmless call, and the observations that show the file and the contract checks are as
  they were."
about:
  adrs:
    - ADR-AUTO-ACCOSTED-HARMLESS
    - ADR-AUTO-ACCOSTED-RUNNER
    - DDR-VISUAL-ACTIONISALENS
    - DDR-VISUAL-PROOFISTHEACCOSTEDFILE
  lens: action
  proves: pwsh/Catzc.Base.Contracts/accosted/contracts.accosted.yml
content:
  title: Reading an accosted file writes nothing and leaves the contract checks as they were
  kind: explanation
  cause: { label: An author }
  action:
    call: { get_accosted_file: { path: pwsh/Catzc.Base.Contracts/accosted/contracts.accosted.yml } }
  effects:
    - id: effect-read
      zone: 1
      where: local
      show: words
      says: The accosted file is read from the repository
      proves: { get_repository_file: { path: pwsh/Catzc.Base.Contracts/accosted/contracts.accosted.yml } }
    - id: effect-unwritten
      zone: 1
      where: local
      show: words
      says: Nothing is written to the file
      proves: { get_repository_file: { path: pwsh/Catzc.Base.Contracts/accosted/contracts.accosted.yml } }
    - id: effect-checks
      zone: 2
      where: local
      says: The contract check results are unchanged
      proves: { get_contract_check_results }
