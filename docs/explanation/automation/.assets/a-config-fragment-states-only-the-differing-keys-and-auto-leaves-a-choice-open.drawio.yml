description:
  A map merges key by key, a scalar or list replaces, and an explicit null removes the key.
about:
  adrs:
    - ADR-AUTO-OVERLAY-CONFIGFRAGMENT
    - ADR-AUTO-LAYERS-AUTOLEAVESCHOICEOPEN
  lens: architecture
content:
  title: A config fragment states only what differs
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: FRAGMENT }
    - { id: b1, label: MERGE }
  glyphs:
    - { id: g0, kind: file, label: "States only the keys that differ", in: b0 }
    - { id: g1, kind: code, label: "Map merges key by key", in: b1 }
    - { id: g2, kind: code, label: "Scalar or list replaces the bundled value", in: b1 }
    - { id: g3, kind: gate, label: "Explicit null removes the key", in: b1 }
    - { id: g4, kind: result, label: "The type default applies", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g0, to: g3, kind: flow, label: "" }
    - { from: g3, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
