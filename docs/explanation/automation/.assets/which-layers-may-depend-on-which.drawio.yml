description:
  One declared allow-list says which layer may depend on which, and every allowed edge points down through the layers to the base libraries,
  which make the last hop to the vendor tool; an edge the declaration does not list fails the build.
about:
  rules: [ADR-AUTO-DEPM-CODEBUILTFROM, ADR-AUTO-DEPM-TWOSECTIONS, ADR-AUTO-DEPM-GROUPAWAREINTEGRITY, ADR-AUTO-DEPM-EXTENDBYDECLARING]
  lens: meta
content:
  title: Which layers may depend on which
  kind: explanation
  flow: top-to-bottom
  theme: dark
  bands:
    - { id: band-top, label: TOP LAYER }
    - { id: band-middle, label: MIDDLE LAYER }
    - { id: band-foundation, label: FOUNDATION }
    - { id: band-vendor, label: LAST HOP }
    - { id: band-invariant, label: INVARIANT }
  glyphs:
    - { id: g-top, kind: set, label: Topmost modules, in: band-top }
    - { id: g-root, kind: code, label: Vendor root module, in: band-middle }
    - { id: g-tools, kind: set, label: Tool managers, in: band-middle }
    - { id: g-base, kind: set, label: Base libraries, in: band-foundation }
    - { id: g-vendor, kind: external, label: Vendor tool, in: band-vendor }
    - { id: f-undeclared, kind: failure, label: Undeclared edge, in: band-invariant }
  edges:
    - { from: g-top, to: g-root, kind: flow, label: calls }
    - { from: g-top, to: g-tools, kind: thick, label: calls }
    - { from: g-top, to: g-base, kind: thick, label: calls }
    - { from: g-root, to: g-base, kind: thick, label: calls }
    - { from: g-tools, to: g-base, kind: thick, label: calls }
    - { from: g-base, to: g-vendor, kind: flow, label: calls }
    - { from: g-base, to: f-undeclared, kind: fail, label: "" }
  markers:
    - { at: g-top, number: 1 }
    - { at: g-root, number: 2 }
    - { at: g-tools, number: 3 }
    - { at: g-base, number: 4 }
    - { at: g-vendor, number: 5 }
    - { at: f-undeclared, number: 6 }
  legend: auto
  minimaps: [code-locations, module-neighbourhood, axis]
layout:
  band-top: { x: 20, y: 84, w: 860, h: 110 }
  band-middle: { x: 20, y: 214, w: 860, h: 130 }
  band-foundation: { x: 20, y: 364, w: 860, h: 110 }
  band-vendor: { x: 20, y: 494, w: 860, h: 110 }
  band-invariant: { x: 900, y: 84, w: 380, h: 520 }
  g-top: { x: 140, y: 130, w: 600, h: 52 }
  g-root: { x: 40, y: 260, w: 340, h: 44 }
  g-tools: { x: 480, y: 260, w: 360, h: 44 }
  g-base: { x: 40, y: 400, w: 800, h: 52 }
  g-vendor: { x: 340, y: 536, w: 200, h: 44 }
  f-undeclared: { x: 960, y: 404, w: 260, h: 44 }
