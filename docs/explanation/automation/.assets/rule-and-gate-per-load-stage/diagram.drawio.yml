description: The cats load runs in six stages; each stage but the last carries the ADR rules it follows and the test or review
  that gates them, and the unload carries neither.
about:
  adrs:
  - ADR-AUTO-BUNDLE-TWOROOTS
  - ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
  - ADR-AUTO-BUNDLE-BUNDLEISSESSION
  - ADR-PWSH-ERROR-STOPONERROR
  - ADR-PRIN-ONELIVE-ONEVERSION
  - ADR-PWSH-TYPES-TYPEACCELERATORATTRIBUTE
  - ADR-REPO-ROOTCFG-FULLYMANAGED
  - ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION
  - ADR-DSGN-RUNMODE-NEVERCOEXIST
  - ADR-AUTO-TYPES-JANITORSBYCALLER
  lens: governance
content:
  title: Every load stage but the unload has an ADR rule and a gate
  kind: explanation
  flow: top-to-bottom
  relation: is checked by
  theme: dark
  bands:
  - id: band-shim
    label: SHIM
  - id: band-session
    label: SESSION
  - id: band-load
    label: LOAD
  - id: band-mode
    label: RUN MODE
  - id: band-janitors
    label: JANITORS
  - id: band-unload
    label: UNLOAD
  glyphs:
  - id: g-shim
    kind: gate
    label: New-Importer.Tests
    in: band-shim
  - id: g-session
    kind: gate
    label: code review
    in: band-session
  - id: g-load
    kind: gate
    label: Import-AllModules.Tests
    in: band-load
  - id: g-mode
    kind: gate
    label: Assert-CatzcRunModeExclusive.Tests
    in: band-mode
  - id: g-janitors
    kind: gate
    label: Invoke-TypeCacheJanitor.Tests
    in: band-janitors
  markers:
  - at: g-shim
    number: 1
  - at: g-session
    number: 2
  - at: g-load
    number: 3
  - at: g-mode
    number: 4
  - at: g-janitors
    number: 5
  - at: band-unload
    number: 6
  chips:
  - at: g-shim
    kind: rule
    rule: ADR-REPO-ROOTCFG-FULLYMANAGED
  - at: g-shim
    kind: rule
    rule: ADR-PRIN-ONELIVE-ONEVERSION
  - at: g-session
    kind: rule
    rule: ADR-PWSH-ERROR-STOPONERROR
  - at: g-session
    kind: rule
    rule: ADR-AUTO-BUNDLE-TWOROOTS
  - at: g-session
    kind: rule
    rule: ADR-AUTO-BUNDLE-BUNDLEISSESSION
  - at: g-load
    kind: rule
    rule: ADR-AUTO-BUNDLE-ONELIVINGIMPORTER
  - at: g-load
    kind: rule
    rule: ADR-PWSH-TYPES-TYPEACCELERATORATTRIBUTE
  - at: g-mode
    kind: rule
    rule: ADR-DSGN-RUNMODE-NEVERCOEXIST
  - at: g-janitors
    kind: rule
    rule: ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION
  - at: g-janitors
    kind: rule
    rule: ADR-AUTO-TYPES-JANITORSBYCALLER
  legend: auto
  minimaps:
  - code-locations
  - grid
  - axis
