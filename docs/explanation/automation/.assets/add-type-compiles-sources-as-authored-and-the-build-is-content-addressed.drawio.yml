description:
  "One compilation unit per file, because a file-scoped namespace is illegal once files are concatenated, and the build is content-addressed."
about:
  adrs:
    - ADR-PWSH-TYPES-ADDTYPECOMPILES
    - ADR-AUTO-BUNDLE-IMMUTABLEBUILD
  lens: architecture
content:
  title: "Add-Type compiles the sources as authored"
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: COMPILE }
    - { id: b1, label: BUILD }
  glyphs:
    - { id: g0, kind: code, label: "Import-CSharpTypes: Add-Type -Path", in: b0 }
    - { id: g1, kind: gate, label: "One compilation unit per file", in: b0 }
    - { id: g2, kind: failure, label: "File-scoped namespace is illegal when concatenated", in: b0 }
    - { id: g3, kind: result, label: "Same commit, byte-identical build, types DLL included", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g2, to: g1, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
