description: >-
  The bundle in code: Build-Modules reads exporter.yml and calls the build engine, Assert-CatzcBundle checks what the engine wrote, and each
  target verifies the build folder again before it copies or packs it whole.
about:
  lens: implementation
  adrs: [ADR-AUTO-BUNDLE-BUNDLEISBUILD, ADR-AUTO-BUNDLE-IMMUTABLEBUILD, ADR-AUTO-BUNDLE-TWOARTIFACTINSTALL, ADR-AUTO-BUNDLE-AUTOVERSION]
  tracks: [pwsh]
  languages: [powershell, yaml]
  modules: [Catzc.Base.Exporter]
  files:
    - pwsh/Catzc.Base.Exporter/configs/exporter.yml
    - pwsh/Catzc.Base.Exporter/Build-Modules.ps1
    - pwsh/Catzc.Base.Exporter/Assert-CatzcBundle.ps1
    - pwsh/Catzc.Base.Exporter/Install-Catzc.ps1
    - pwsh/Catzc.Base.Exporter/private/New-CatzcNuGetPackage.ps1
content:
  title: Build-Modules builds, verifies, and leaves one folder that every target copies whole
  kind: explanation
  relation: feeds or runs the next step
  bands:
    - { id: band-source, label: SOURCE }
    - { id: band-build, label: BUILD }
    - { id: band-bundle, label: BUNDLE }
    - { id: band-targets, label: TARGETS }
  groups:
    - { id: grp-targets, label: " ", in: band-targets }
  glyphs:
    - { id: g-config, kind: file, label: exporter.yml, in: band-source }
    - { id: g-build, kind: code, label: Build-Modules, in: band-build }
    - { id: g-engine, kind: code, label: Invoke-ModuleBuild, in: band-build }
    - { id: g-assert, kind: gate, label: Assert-CatzcBundle, in: band-build }
    - { id: r-folder, kind: result, label: Catzc/6.6.666/, in: band-bundle }
    - { id: g-install, kind: code, label: Install-Catzc, in: grp-targets }
    - { id: g-package, kind: code, label: New-CatzcNuGetPackage, in: grp-targets }
  edges:
    - { from: g-config, to: g-build }
    - { from: g-build, to: g-engine }
    - { from: g-engine, to: g-assert }
    - { from: g-assert, to: r-folder }
    - { from: r-folder, to: grp-targets }
    - { from: g-install, to: g-assert, label: checked again }
  markers:
    - { at: g-config, number: 1 }
    - { at: g-build, number: 2 }
    - { at: g-engine, number: 3 }
    - { at: g-assert, number: 4 }
    - { at: r-folder, number: 5 }
    - { at: g-install, number: 6 }
    - { at: g-package, number: 7 }
    - { at: grp-targets, number: 8 }
  minimaps: [code-locations, module-neighbourhood, axis]
layout:
