description:
  "A maintainer adds a Python folder and runs one command: it renders the uv workspace root and the member's project file from the languages
  configuration, the tree classifies both and holds them to their source, and the Python quality gates pass over the workspace."
about:
  rules:
    - ADR-AUTO-UVPY-UVHANDLESPYTHON
    - ADR-AUTO-PY-PYWORKSPACE
    - ADR-AUTO-PY-ONEPYTHONVERSION
    - ADR-AUTO-PY-EVERYFILETYPECHECKED
    - ADR-AUTO-IDIOM-LANGUAGEIDIOM
  lens: action
  proves: pwsh/Base.Languages/accosted/python-workspace.accosted.yml
content:
  title: How the Python workspace is laid out
  kind: explanation
  cause: { label: A maintainer adds a Python folder }
  action:
    call: { new_python_project: { line_length: 140 } }
  effects:
    - id: effect-root
      zone: 1
      where: local
      show: words
      says: The workspace root is rendered, naming every member and the pinned interpreter
      proves: { get_repository_file: { path: python/pyproject.toml } }
    - id: effect-member
      zone: 1
      where: local
      show: words
      says: The diagram kit's member file is rendered beside its code
      proves: { get_repository_file: { path: python/diagrams/pyproject.toml } }
    - id: effect-kind
      zone: 2
      where: local
      show: words
      says: The root file is a known file kind
      proves: { get_path_file_type: { path: python/pyproject.toml } }
      after: effect-root
    - id: effect-language
      zone: 2
      where: local
      show: words
      says: The member file belongs to the Python language
      proves: { get_file_language: { path: python/diagrams/pyproject.toml } }
      after: effect-member
    - id: effect-drift
      zone: 2
      where: local
      show: words
      says: Test-GeneratedFiles sees no drift for the root configs
      proves: { test_generated_files: { generator: Build-RootConfig } }
      after: effect-root
    - id: effect-types
      zone: 2
      where: local
      show: words
      says: Test-PythonTypes passes over the whole workspace
      proves: { test_python_types }
      after: effect-member
    - id: effect-format
      zone: 2
      where: local
      show: words
      says: Test-Formatting passes for the Python language
      proves: { test_formatting: { language: python } }
      after: effect-member
  minimaps: [code-locations, axis, lifecycle-position]
layout:
  frame: { x: 20, y: 108, w: 1260, h: 620 }
