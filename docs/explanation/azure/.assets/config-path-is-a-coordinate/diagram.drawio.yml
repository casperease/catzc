    to: g-one
    kind: flow
    label: ''
  - from: g-customer
    to: g-one
    kind: flow
    label: ''
  - from: g-one
    to: e-subscription
    kind: flow
    label: ''
  - from: e-subscription
    to: e-group
    kind: flow
    label: ''
  markers:
  - at: g-root
    number: 1
  - at: g-customer
    number: 2
  - at: g-one
    number: 3
  - at: e-subscription
    number: 4
  - at: e-group
    number: 5
  legend: auto
  minimaps:
  - code-locations
  - module-neighbourhood
  - axis
