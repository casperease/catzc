description:
  Four throwing gates hold the rule that the az session is the deploy target; the customer and the resource-group name hold by construction,
  with no gate, and every gate ends in a throw.
about:
  adrs:
    - ADR-AZ-DATAMOD-CUSTOMERAXIS
    - ADR-AZ-DATAMOD-DERIVEDRESOURCEGROUPNAME
    - ADR-AZ-DATAMOD-JOINSINPOWERSHELL
    - ADR-AZ-NAMING-SUBSCRIPTIONNOTCOMPONENT
  lens: governance
content:
  title: Four gates hold the session rule; the customer and the name hold by construction
  kind: explanation
  flow: left-to-right
  relation: runs next
  theme: dark
  bands:
    - id: band-target
      label: TARGET
    - id: band-config
      label: CONFIG + NAMES
    - id: band-outcome
      label: OUTCOME
  glyphs:
    - id: g-pipeline-assert
      kind: gate
      label: assert given in a pipeline
      in: band-target
    - id: g-declared
      kind: gate
      label: subscription declared
      in: band-target
    - id: g-matches
      kind: gate
      label: session matches the assert
      in: band-target
    - id: g-customer
      kind: code
      label: customer from the session
      in: band-config
    - id: g-serves
      kind: gate
      label: serves the env
      in: band-config
    - id: g-group
      kind: code
      label: RG name derived
      in: band-config
    - id: f-throw
      kind: failure
      label: throw
      in: band-outcome
  edges:
    - from: g-pipeline-assert
      to: g-declared
      kind: flow
      label: ""
    - from: g-declared
      to: g-matches
      kind: flow
      label: ""
    - from: g-matches
      to: g-customer
      kind: flow
      label: ""
    - from: g-customer
      to: g-serves
      kind: flow
      label: ""
    - from: g-serves
      to: g-group
      kind: flow
      label: ""
    - from: g-pipeline-assert
      to: f-throw
      kind: fail
      label: ""
    - from: g-declared
      to: f-throw
      kind: fail
      label: ""
    - from: g-matches
      to: f-throw
      kind: fail
      label: ""
    - from: g-serves
      to: f-throw
      kind: fail
      label: ""
  markers:
    - at: g-pipeline-assert
      number: 1
    - at: g-declared
      number: 2
    - at: g-matches
      number: 3
    - at: g-customer
      number: 4
    - at: g-serves
      number: 5
    - at: g-group
      number: 6
    - at: f-throw
      number: 7
  chips:
    - at: g-pipeline-assert
      kind: rule
      rule: ADR-AZ-DATAMOD-JOINSINPOWERSHELL
    - at: g-declared
      kind: rule
      rule: ADR-AZ-DATAMOD-JOINSINPOWERSHELL
    - at: g-matches
      kind: rule
      rule: ADR-AZ-DATAMOD-JOINSINPOWERSHELL
    - at: g-serves
      kind: rule
      rule: ADR-AZ-DATAMOD-JOINSINPOWERSHELL
    - at: band-config
      kind: rule
      rule: ADR-AZ-DATAMOD-CUSTOMERAXIS
      gated: false
    - at: band-config
      kind: rule
      rule: ADR-AZ-DATAMOD-DERIVEDRESOURCEGROUPNAME
      gated: false
    - at: band-config
      kind: rule
      rule: ADR-AZ-NAMING-SUBSCRIPTIONNOTCOMPONENT
      gated: false
  legend: auto
  minimaps:
    - code-locations
    - module-neighbourhood
    - axis
