description:
  Changing one configuration slot edits one file in the configs place of the infrastructure track; only the CD pipeline of the slot's owner
  runs, and the change reaches the one resource group the slot deploys.
about:
  adrs:
    - ADR-AZ-IACKIND-THREEKINDS
    - ADR-AZ-DATAMOD-ONEFILEONESUBSCRIPTION
  lens: operations
content:
  title: Changing one configuration slot runs only its owner's pipeline and reaches only its resource group
  kind: explanation
  flow: left-to-right
  relation: triggers
  theme: dark
  bands:
    - id: band-edit
      label: THE EDIT
    - id: band-pipeline
      label: PIPELINE
    - id: band-deployed
      label: DEPLOYED
  spans:
    - id: span-configs
      label: configs
      over:
        - band-edit
  glyphs:
    - id: g-slot
      kind: file
      label: one slot file
      in: band-edit
    - id: r-owner
      kind: runner
      label: the owner's CD pipeline
      in: band-pipeline
    - id: r-others
      kind: runner
      label: every other CD pipeline
      in: band-pipeline
    - id: e-group
      kind: env
      label: the slot's resource group
      in: band-deployed
  edges:
    - from: g-slot
      to: r-owner
      kind: flow
      label: ""
    - from: r-owner
      to: e-group
      kind: flow
      label: ""
  markers:
    - at: g-slot
      number: 1
    - at: r-owner
      number: 2
    - at: r-others
      number: 3
    - at: e-group
      number: 4
  legend: auto
layout:
  r-owner:
    x: 540
    y: 140
    w: 220
    h: 44
  r-others:
    x: 540
    y: 196
    w: 220
    h: 40
  e-group:
    x: 960
    y: 132
    w: 220
    h: 60
