        - band-edit
  glyphs:
    - id: g-slot
      kind: file
      label: one slot file
      in: band-edit
    - id: r-owner
      kind: runner
      label: the owner's CD pipeline
      in: band-pipeline
    - id: r-others
      kind: runner
      label: every other CD pipeline
      in: band-pipeline
    - id: e-group
      kind: env
      label: the slot's resource group
      in: band-deployed
