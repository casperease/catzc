      kind: file
      label: variants.yml
      in: band-change
    - id: g-options
      kind: file
      label: options.yml
      in: band-change
    - id: g-deploy
      kind: code
      label: Deploy-Bicep
      in: band-run
    - id: g-resource-name
      kind: code
      label: Get-BicepResourceName
      in: band-run
    - id: g-namer
      kind: code
      label: Get-AzureResourceName
      in: band-get
    - id: r-name
      kind: result
      label: dev-001-weu-zct-sidx-rg
      in: band-get
    - id: f-throw
      kind: failure
      label: throw
      in: band-get
  edges:
    - from: g-variants
      to: g-resource-name
      kind: flow
      label: ""
    - from: g-options
      to: g-resource-name
      kind: flow
      label: ""
    - from: g-deploy
      to: g-resource-name
      kind: flow
      label: ""
    - from: g-resource-name
      to: g-namer
      kind: flow
      label: ""
    - from: g-namer
      to: r-name
      kind: flow
      label: ""
    - from: g-namer
      to: f-throw
      kind: fail
      label: ""
  markers:
    - at: g-variants
      number: 1
    - at: g-options
      number: 2
    - at: g-deploy
      number: 3
    - at: g-resource-name
      number: 4
    - at: g-namer
      number: 5
    - at: r-name
      number: 6
    - at: f-throw
