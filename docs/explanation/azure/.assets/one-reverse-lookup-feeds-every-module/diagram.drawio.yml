      kind: flow
      label: ""
    - from: g-azure
      to: g-cli
      kind: flow
      label: ""
    - from: g-cli
      to: g-templates
      kind: flow
      label: ""
    - from: g-azure
      to: g-templates
      kind: flow
      label: ""
    - from: g-tree
      to: g-templates
      kind: flow
      label: ""
    - from: g-templates
      to: r-group
      kind: flow
      label: ""
  markers:
    - at: x-connection
      number: 1
    - at: x-session
      number: 2
    - at: g-cli
      number: 3
    - at: g-azure-file
      number: 4
    - at: g-azure
      number: 5
    - at: g-templates
      number: 6
    - at: g-tree
      number: 7
    - at: r-group
      number: 8
