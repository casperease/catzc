  kind: explanation
  flow: left-to-right
  relation: then
  theme: dark
  bands:
    - id: band-edit
      label: THE NEW FILE
    - id: band-resolved
      label: RESOLVED
    - id: band-deployed
      label: DEPLOYED
  spans:
    - id: span-configs
      label: configs
      over:
        - band-edit
  glyphs:
    - id: g-slot
      kind: file
      label: configuration slot file
      in: band-edit
    - id: g-one
      kind: gate
      label: exactly one subscription
      in: band-resolved
    - id: r-owner
      kind: runner
      label: the owner's CD pipeline
      in: band-deployed
    - id: e-group
      kind: env
      label: a new resource group
      in: band-deployed
  edges:
    - from: g-slot
      to: g-one
      kind: flow
      label: ""
    - from: g-one
      to: r-owner
      kind: flow
      label: ""
    - from: r-owner
      to: e-group
      kind: flow
      label: ""
  markers:
    - at: g-slot
      number: 1
    - at: g-one
      number: 2
    - at: r-owner
      number: 3
    - at: e-group
      number: 4
  legend: auto
