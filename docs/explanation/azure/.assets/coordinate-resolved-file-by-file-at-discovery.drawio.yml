description:
  Discovery parses each config file's name, resolves its (customer, environment) coordinate through the one shared check, and builds a slot
  only when exactly one subscription remains; any violation stops with one invalid-config throw.
about:
  adrs:
    - ADR-AZ-DATAMOD-ONEFILEONESUBSCRIPTION
    - ADR-AZ-DATAMOD-NAMEKEYEDMAPS
    - ADR-AZ-DATAMOD-SCHEMAANDINTEGRITY
    - ADR-AZ-CUSTOMER-TWOBINDINGS
    - ADR-AZ-CUSTOMER-KEYISSUBFOLDER
  lens: implementation
content:
  title: Discovery resolves every config file's coordinate through one shared check
  kind: explanation
  flow: top-to-bottom
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-discovery
      label: DISCOVERY
    - id: band-resolver
      label: RESOLVER
    - id: band-identity
      label: IDENTITY
  glyphs:
    - id: g-config
      kind: file
      label: configuration/apex/nsub.yml
      in: band-discovery
    - id: g-discovery
      kind: code
      label: Get-BicepTemplates
      in: band-discovery
    - id: g-resolve-name
      kind: code
      label: Resolve-BicepConfigName
      in: band-discovery
    - id: g-violations
      kind: gate
      label: Get-BicepSubscriptionConfigViolations
      in: band-discovery
    - id: f-invalid
      kind: failure
      label: has an invalid config
      in: band-discovery
    - id: g-slot
      kind: type
      label: BicepSlot
      in: band-discovery
    - id: g-candidates
      kind: code
      label: Get-BicepConfigSubscriptionCandidates
      in: band-resolver
    - id: g-customer
      kind: code
      label: Get-AzureCustomer
      in: band-resolver
    - id: g-azure
      kind: file
      label: azure.yml
      in: band-identity
    - id: g-customer-file
      kind: file
      label: customer.yml
      in: band-identity
  edges:
    - from: g-config
      to: g-discovery
      kind: flow
      label: ""
    - from: g-discovery
      to: g-resolve-name
      kind: flow
      label: ""
    - from: g-resolve-name
      to: g-violations
      kind: flow
      label: ""
    - from: g-violations
      to: g-slot
      kind: flow
      label: ""
    - from: g-resolve-name
      to: f-invalid
      kind: fail
      label: ""
    - from: g-violations
      to: f-invalid
      kind: fail
      label: ""
    - from: g-candidates
      to: g-violations
      kind: flow
      label: ""
    - from: g-customer
      to: g-candidates
      kind: flow
      label: ""
    - from: g-azure
      to: g-candidates
      kind: flow
      label: ""
    - from: g-customer-file
      to: g-customer
      kind: flow
      label: ""
  markers:
    - at: g-config
      number: 1
    - at: g-discovery
      number: 2
    - at: g-resolve-name
      number: 3
    - at: g-azure
      number: 4
    - at: g-candidates
      number: 5
    - at: g-customer
      number: 6
    - at: g-violations
      number: 7
    - at: f-invalid
      number: 8
    - at: g-slot
      number: 9
  legend: auto
  minimaps:
    code-locations:
