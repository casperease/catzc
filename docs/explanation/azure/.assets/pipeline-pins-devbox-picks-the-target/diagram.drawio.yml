description:
  A pipeline signs in through its service connection and pins the subscription it expects; a developer sets the session with az account set;
  Deploy-Bicep resolves the session, prints the deployment context, or stops with one of three errors.
about:
  adrs:
    - ADR-AZ-DATAMOD-JOINSINPOWERSHELL
  lens: operations
content:
  title: A pipeline pins the subscription it expects; a devbox picks the target with az account set
  kind: explanation
  flow: left-to-right
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-entry
      label: ENTRY
    - id: band-command
      label: COMMAND
    - id: band-outcome
      label: OUTCOME
  groups:
    - id: grp-errors
      label: three errors
      in: band-outcome
  glyphs:
    - id: x-connection
      kind: external
      label: service connection
      in: band-entry
    - id: x-account
      kind: external
      label: az account set
      in: band-entry
    - id: g-deploy
      kind: code
      label: Deploy-Bicep
      in: band-command
    - id: r-context
      kind: result
      label: deployment context
      in: band-outcome
    - id: f-no-assert
      kind: failure
      label: no assert in a pipeline
      in: grp-errors
    - id: f-undeclared
      kind: failure
      label: undeclared subscription
      in: grp-errors
    - id: f-wrong
      kind: failure
      label: wrong subscription
      in: grp-errors
  edges:
    - from: x-connection
      to: g-deploy
      kind: flow
      label: ""
    - from: x-account
      to: g-deploy
      kind: flow
      label: ""
    - from: g-deploy
      to: r-context
      kind: flow
      label: ""
    - from: g-deploy
      to: grp-errors
      kind: fail
      label: ""
  markers:
    - at: x-connection
      number: 1
    - at: x-account
      number: 2
    - at: g-deploy
      number: 3
    - at: r-context
      number: 4
    - at: f-no-assert
      number: 5
    - at: f-undeclared
      number: 6
    - at: f-wrong
      number: 7
