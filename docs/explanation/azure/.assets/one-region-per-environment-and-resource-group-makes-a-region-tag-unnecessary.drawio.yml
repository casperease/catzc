description:
  A resource group never mixes regions, so a region tag is not needed.
about:
  adrs:
    - ADR-AZ-CAF-RESORG-ONEREGIONPERRESOURCEGROUP
    - ADR-AZ-CAF-NAME-TAGREGION
  lens: architecture
content:
  title: One region per environment and resource group
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: REGION }
    - { id: b1, label: TAG }
  glyphs:
    - { id: g0, kind: set, label: "One region per environment", in: b0 }
    - { id: g1, kind: gate, label: "Allowed-locations policy holds every resource in it", in: b0 }
    - { id: g2, kind: result, label: "Resource group never mixes regions", in: b0 }
    - { id: g3, kind: failure, label: "Region tag not adopted: the region code is a name component", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g0, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
