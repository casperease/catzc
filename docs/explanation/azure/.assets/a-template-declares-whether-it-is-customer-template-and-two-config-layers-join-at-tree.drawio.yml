description:
  The customer_deployment bit defaults to the have_customers variant, and identity joins templating through the configuration tree.
about:
  adrs:
    - ADR-AZ-CUSTOMER-CUSTOMERTEMPLATEOPTION
    - ADR-AZ-DATAMOD-TWOCONFIGLAYERS
  lens: architecture
content:
  title: A template declares whether it is for customers
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: TEMPLATE }
    - { id: b1, label: CONFIG LAYERS }
  glyphs:
    - { id: g0, kind: file, label: "options.yml: customer_deployment", in: b0 }
    - { id: g1, kind: gate, label: "Defaults to the have_customers variant", in: b0 }
    - { id: g2, kind: gate, label: "Explicit true only when customers are enabled", in: b0 }
    - { id: g3, kind: set, label: "azure.yml identity and infrastructure/templates joined by the configuration tree", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
