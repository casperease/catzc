description: >-
  The registry and the authored sources feed one writer in the RootConfig module, which reproduces each target through one of two primitives
  in the Files module: a link for some entries, a content write for the rest.
about:
  lens: architecture
  adrs: [ADR-REPO-ROOTCFG-REGISTRY, ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION, ADR-REPO-ROOTCFG-FILESYSTEMLINK]
  tracks: [pwsh]
  languages: [powershell]
  modules: [Catzc.Base.RootConfig, Catzc.Base.Files]
  files:
    - pwsh/Catzc.Base.RootConfig/configs/rootconfig.yml
    - pwsh/Catzc.Base.RootConfig/Build-RootConfig.ps1
    - pwsh/Catzc.Base.Files/Write-FileIfChanged.ps1
content:
  title: One registry, one writer, two write primitives, two kinds of target
  kind: explanation
  relation: feeds the next step
  bands:
    - { id: band-source, label: SOURCE OF TRUTH }
    - { id: band-root-config, label: CATZC.BASE.ROOTCONFIG }
    - { id: band-files, label: CATZC.BASE.FILES }
    - { id: band-target, label: TARGET }
  glyphs:
    - { id: g-sources, kind: file, label: authored source files, in: band-source }
    - { id: g-generators, kind: set, label: generator functions, in: band-source }
    - { id: g-rootconfig-yml, kind: file, label: rootconfig.yml, in: band-source }
    - { id: g-build-root-config, kind: code, label: Build-RootConfig (importer tail), in: band-root-config }
    - { id: g-set-file-link, kind: code, label: Set-FileLink, in: band-files }
    - { id: g-write-if-changed, kind: code, label: Write-FileIfChanged, in: band-files }
    - { id: r-gitignored, kind: result, label: gitignored targets, in: band-target }
    - { id: r-tracked, kind: result, label: tracked targets, in: band-target }
  edges:
    - { from: g-sources, to: g-build-root-config }
    - { from: g-generators, to: g-build-root-config }
    - { from: g-rootconfig-yml, to: g-build-root-config }
    - { from: g-build-root-config, to: g-set-file-link, label: 7/23 }
    - { from: g-build-root-config, to: g-write-if-changed, label: 16/23 }
    - { from: g-set-file-link, to: r-gitignored }
    - { from: g-write-if-changed, to: r-tracked }
  markers:
    - { at: g-sources, number: 1 }
    - { at: g-generators, number: 2 }
    - { at: g-rootconfig-yml, number: 3 }
    - { at: g-build-root-config, number: 4 }
    - { at: g-set-file-link, number: 5 }
    - { at: g-write-if-changed, number: 6 }
    - { at: r-gitignored, number: 7 }
    - { at: r-tracked, number: 8 }
  minimaps: [code-locations, module-neighbourhood, axis]
