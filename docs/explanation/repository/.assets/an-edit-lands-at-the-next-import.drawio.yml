description:
  A variant edit is one key in variants.yml and a re-import; a wrong value fails once at load in the config type, and a guard asked later or
  a committer asking for the workspace stops with a message naming the fix.
about:
  adrs: [ADR-REPO-VARIANT-SESSIONVARIANT, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-HAVECUSTOMERS, ADR-REPO-VARIANT-GITWORKSPACE]
  lens: operations
content:
  title: An edit to a variant lands at the next import, and a wrong value fails once, at load
  kind: explanation
  flow: top-to-bottom
  relation: comes before
  theme: dark
  bands:
    - { id: band-edit, label: EDIT }
    - { id: band-reimport, label: RE-IMPORT }
    - { id: band-load, label: LOAD }
    - { id: band-ask, label: ASK }
  groups:
    - { id: grp-askers, label: askers, in: band-ask }
  glyphs:
    - { id: g-variants-yml, kind: file, label: variants.yml, in: band-edit }
    - { id: g-importer, kind: code, label: importer.ps1, in: band-reimport }
    - { id: g-variants-config, kind: gate, label: VariantsConfig, in: band-load }
    - { id: f-validation, kind: failure, label: validation failed, in: band-load }
    - { id: g-assert-have-customers, kind: gate, label: Assert-HaveCustomers, in: grp-askers }
    - { id: g-sync, kind: code, label: Sync-GeneratedFile, in: grp-askers }
    - { id: f-disabled, kind: failure, label: deployments are disabled, in: band-ask }
    - { id: f-skipped, kind: failure, label: "Skipped: main-via-pr on main", in: band-ask }
  edges:
    - { from: g-variants-yml, to: g-importer, kind: flow, label: "" }
    - { from: g-importer, to: g-variants-config, kind: flow, label: "" }
    - { from: g-variants-config, to: g-assert-have-customers, kind: flow, label: "" }
    - { from: g-variants-config, to: f-validation, kind: fail, label: "" }
    - { from: g-assert-have-customers, to: f-disabled, kind: fail, label: "" }
    - { from: g-sync, to: f-skipped, kind: fail, label: "" }
  markers:
    - { at: g-variants-yml, number: 1 }
    - { at: g-importer, number: 2 }
    - { at: g-variants-config, number: 3 }
    - { at: f-validation, number: 4 }
    - { at: g-assert-have-customers, number: 5 }
    - { at: f-disabled, number: 6 }
    - { at: g-sync, number: 7 }
    - { at: f-skipped, number: 8 }
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/index.md
          - docs/drs/repository/dora-explains.md
          - docs/drs/repository/repo-variants.md
          - docs/references/pwsh/catzc-base-module-system/Sync-GeneratedFile.ps1.md
          - docs/references/pwsh/catzc-base-variants/Get-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/Test-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.ModuleSystem/.
        by: [pwsh/Catzc.Base.ModuleSystem/Sync-GeneratedFile.ps1, ADR-REPO-VARIANT-GITWORKSPACE]
      - cell: pwsh/Catzc.Base.Variants/.
        by:
          - pwsh/Catzc.Base.Variants/Get-AspectDeclaration.ps1
          - pwsh/Catzc.Base.Variants/Test-AspectDeclaration.ps1
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.Variants/configs
        by:
          - pwsh/Catzc.Base.Variants/configs/variants.yml
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.Variants/types
        by:
          - pwsh/Catzc.Base.Variants/types/VariantsConfig.cs
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
    module-neighbourhood:
      - cell: subject/Catzc.Base.Drs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: subject/Catzc.Base.ModuleSystem
        by: [pwsh/Catzc.Base.ModuleSystem/Sync-GeneratedFile.ps1, ADR-REPO-VARIANT-GITWORKSPACE]
      - cell: subject/Catzc.Base.Variants
        by:
          - pwsh/Catzc.Base.Variants/Get-AspectDeclaration.ps1
          - pwsh/Catzc.Base.Variants/Test-AspectDeclaration.ps1
          - pwsh/Catzc.Base.Variants/configs/variants.yml
          - pwsh/Catzc.Base.Variants/types/VariantsConfig.cs
          - ADR-REPO-VARIANT-GITWORKSPACE
          - ADR-REPO-VARIANT-HAVECUSTOMERS
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
    axis:
      - cell: AUTO/*
        by: [ADR-REPO-VARIANT-GITWORKSPACE, ADR-REPO-VARIANT-HAVECUSTOMERS, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
