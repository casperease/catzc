description:
  A sub-agent body is capped at twenty lines, and prose that outgrows a file moves to its comment page.
about:
  adrs:
    - ADR-REPO-AGENTS-ROBOTBODYLIMIT
    - ADR-REPO-COMMENTS-COMMENTPAGEPLACE
  lens: architecture
content:
  title: A robot body has at most twenty lines
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: ROBOT }
    - { id: b1, label: PAGES }
  glyphs:
    - { id: g0, kind: file, label: "Sub-agent file: body after the front matter", in: b0 }
    - { id: g1, kind: gate, label: "At most 20 lines: roofs.agent_body_lines", in: b0 }
    - { id: g2, kind: set, label: "Wrapped continuation counts with its line", in: b0 }
    - { id: g3, kind: result, label: "Comment page under docs/references maps back to one file", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g0, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
