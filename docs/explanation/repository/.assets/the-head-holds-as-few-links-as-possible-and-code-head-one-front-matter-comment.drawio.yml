description:
  The head is a map of facts about its own file, with one relative edge to its comment page, carried as a front matter comment in code.
about:
  adrs:
    - ADR-REPO-FILEMETA-FEWLINKS
    - ADR-REPO-CODEMETA-CODEFILEHEAD
  lens: architecture
content:
  title: A head holds as few links as possible
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: THE HEAD }
    - { id: b1, label: CODE FILE }
  glyphs:
    - { id: g0, kind: gate, label: "As few links to other files as possible", in: b0 }
    - { id: g1, kind: file, label: "One relative edge: docs, the comment page", in: b0 }
    - { id: g2, kind: code, label: "Meta head: one comment of front matter", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g0, to: g2, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
  legend: auto
