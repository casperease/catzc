    - ADR-REPO-HELP-IMPRINTSTEP
    - ADR-REPO-CODEMETA-IMPRINTSTEP
  lens: architecture
content:
  title: "Format-Code checks help and heads as imprint steps"
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: STEPS }
    - { id: b1, label: GATE }
