# ---
# catzc:
#   immutable:
#     with_body_sha: "87e38ea7452c"
# ---

description:
  A repo-wide switch lives in one file, is read through one private reader, is asked through one guard vocabulary, and is called from any
  module above Config.
about:
  adrs: [ADR-REPO-VARIANT-SESSIONVARIANT, ADR-REPO-VARIANT-NODIRECTREADS]
  lens: meta
content:
  title: A repo-wide switch has one home, one read path and one guard vocabulary
  kind: explanation
  flow: top-to-bottom
  relation: feeds
  theme: dark
  bands:
    - { id: band-variant, label: VARIANT }
    - { id: band-reader, label: READER }
    - { id: band-primitives, label: PRIMITIVES }
    - { id: band-callers, label: CALLERS }
  glyphs:
    - { id: g-home, kind: file, label: one home, in: band-variant }
    - { id: g-read-path, kind: code, label: one read path, in: band-reader }
    - { id: g-vocabulary, kind: code, label: one guard vocabulary, in: band-primitives }
    - { id: g-callers, kind: set, label: any module above Config, in: band-callers }
  edges:
    - { from: g-home, to: g-read-path, kind: flow, label: "" }
    - { from: g-read-path, to: g-vocabulary, kind: flow, label: "" }
    - { from: g-vocabulary, to: g-callers, kind: thick, label: "" }
  markers:
    - { at: g-home, number: 1 }
    - { at: g-read-path, number: 2 }
    - { at: g-vocabulary, number: 3 }
    - { at: g-callers, number: 4 }
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/index.md
          - docs/drs/repository/dora-explains.md
          - docs/drs/repository/repo-variants.md
          - docs/references/pwsh/catzc-base-variants/Get-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/Test-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.Drs/configs
        by: [pwsh/Catzc.Base.Drs/configs/drs.yml, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
      - cell: pwsh/Catzc.Base.Variants/.
        by:
          - pwsh/Catzc.Base.Variants/Get-AspectDeclaration.ps1
          - pwsh/Catzc.Base.Variants/Test-AspectDeclaration.ps1
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/Catzc.Base.Variants/configs
        by: [pwsh/Catzc.Base.Variants/configs/variants.yml, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
      - cell: pwsh/Catzc.Base.Variants/types
        by: [pwsh/Catzc.Base.Variants/types/VariantsConfig.cs, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
    grid:
      - cell: docs/markdown
        by:
          - docs/drs/index.md
          - docs/drs/repository/dora-explains.md
          - docs/drs/repository/repo-variants.md
          - docs/references/pwsh/catzc-base-variants/Get-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/Test-AspectDeclaration.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/bcl
        by: [pwsh/Catzc.Base.Variants/types/VariantsConfig.cs, ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
      - cell: pwsh/powershell
        by:
          - pwsh/Catzc.Base.Variants/Get-AspectDeclaration.ps1
          - pwsh/Catzc.Base.Variants/Test-AspectDeclaration.ps1
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
      - cell: pwsh/yaml
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - pwsh/Catzc.Base.Variants/configs/variants.yml
          - ADR-REPO-VARIANT-NODIRECTREADS
          - ADR-REPO-VARIANT-SESSIONVARIANT
    axis:
      - cell: AUTO/*
        by: [ADR-REPO-VARIANT-NODIRECTREADS, ADR-REPO-VARIANT-SESSIONVARIANT]
layout:
  band-variant: { x: 20, y: 84, w: 1240, h: 80 }
  band-reader: { x: 20, y: 184, w: 1240, h: 80 }
  band-primitives: { x: 20, y: 284, w: 1240, h: 80 }
  band-callers: { x: 20, y: 384, w: 1240, h: 80 }
  g-home: { x: 540, y: 112, w: 190, h: 44 }
  g-read-path: { x: 540, y: 212, w: 190, h: 44 }
  g-vocabulary: { x: 540, y: 312, w: 190, h: 44 }
  g-callers: { x: 520, y: 412, w: 230, h: 44 }
