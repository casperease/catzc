    - { at: g-write, kind: rule, rule: ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION, corner: bottom-right }
    - { at: r-managed, kind: rule, rule: ADR-REPO-ROOTCFG-COMMITTEDFLAG, corner: bottom-right }
    - { at: g-generated-files, kind: rule, rule: ADR-REPO-ROOTCFG-THREEWAYAGREEMENT, corner: top-right }
    - { at: g-root-config-files, kind: rule, rule: ADR-REPO-ROOTCFG-COMMITTEDFLAG, corner: top-right }
