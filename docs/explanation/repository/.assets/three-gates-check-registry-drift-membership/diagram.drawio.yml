description:
  "Which rules of the generated-root-configs decision a gate checks: the load-time type gate, the drift gate and the integrity gate, with
  the one clause no gate checks drawn dashed."
about:
  adrs:
    - ADR-REPO-ROOTCFG-FULLYMANAGED
    - ADR-REPO-ROOTCFG-REGISTRY
    - ADR-REPO-ROOTCFG-COMMITTEDFLAG
    - ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION
    - ADR-REPO-ROOTCFG-COMPOSEDROOTFILE
    - ADR-REPO-ROOTCFG-THREEWAYAGREEMENT
    - ADR-REPO-ROOTCFG-HEADEDCOPY
    - ADR-REPO-ROOTCFG-WILDCARDGENERATOR
  lens: governance
content:
  title: Three gates check the registry, the drift and the git membership; one rule has no gate
  kind: explanation
  flow: left-to-right
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-source
      label: SOURCE OF TRUTH
    - id: band-materialise
      label: MATERIALISE
    - id: band-target
      label: TARGET
  groups:
    - id: grp-gates
      label: gates
      in: band-target
  glyphs:
    - id: g-registry
      kind: file
      label: rootconfig.yml
      in: band-source
    - id: g-type
      kind: gate
      label: RootConfigFiles
      in: band-materialise
    - id: g-build
      kind: code
      label: Build-RootConfig
      in: band-materialise
    - id: g-copy-content
      kind: private
      label: Get-RootConfigCopyContent
      in: band-materialise
    - id: g-write
      kind: code
      label: Write-FileIfChanged
      in: band-materialise
    - id: r-managed
      kind: result
      label: managed root files
      in: band-target
    - id: g-generated-files
      kind: gate
      label: Test-GeneratedFiles
      in: grp-gates
    - id: g-root-config-files
      kind: gate
      label: Test-RootConfigFiles
      in: grp-gates
  edges:
    - from: g-registry
      to: g-type
      kind: flow
      label: ""
    - from: g-type
      to: g-build
      kind: flow
      label: ""
    - from: g-build
      to: g-copy-content
      kind: flow
      label: ""
    - from: g-build
      to: g-write
      kind: flow
      label: ""
    - from: g-write
      to: r-managed
      kind: flow
      label: ""
    - from: r-managed
      to: grp-gates
      kind: flow
      label: ""
  markers:
    - at: g-registry
      number: 1
    - at: g-type
      number: 2
    - at: g-build
      number: 3
    - at: g-copy-content
      number: 4
    - at: g-write
      number: 5
    - at: r-managed
      number: 6
    - at: g-generated-files
      number: 7
    - at: g-root-config-files
      number: 8
  chips:
    - at: g-registry
      kind: rule
      rule: ADR-REPO-ROOTCFG-FULLYMANAGED
    - at: g-registry
      kind: rule
      rule: ADR-REPO-ROOTCFG-REGISTRY
      gated: false
      corner: bottom-right
    - at: g-type
      kind: rule
      rule: ADR-REPO-ROOTCFG-FULLYMANAGED
    - at: g-type
      kind: rule
      rule: ADR-REPO-ROOTCFG-WILDCARDGENERATOR
      corner: bottom-right
    - at: g-build
      kind: rule
      rule: ADR-REPO-ROOTCFG-REGISTRY
      corner: top-left
    - at: g-build
      kind: rule
      rule: ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION
      corner: bottom-right
    - at: g-build
      kind: rule
      rule: ADR-REPO-ROOTCFG-COMPOSEDROOTFILE
      corner: bottom-left
    - at: g-copy-content
      kind: rule
      rule: ADR-REPO-ROOTCFG-HEADEDCOPY
      corner: bottom-right
    - at: g-write
      kind: rule
      rule: ADR-REPO-ROOTCFG-IDEMPOTENTGENERATION
      corner: bottom-right
    - at: r-managed
      kind: rule
      rule: ADR-REPO-ROOTCFG-COMMITTEDFLAG
      corner: bottom-right
    - at: g-generated-files
      kind: rule
      rule: ADR-REPO-ROOTCFG-THREEWAYAGREEMENT
    - at: g-root-config-files
      kind: rule
      rule: ADR-REPO-ROOTCFG-COMMITTEDFLAG
    - at: g-root-config-files
      kind: rule
      rule: ADR-REPO-ROOTCFG-THREEWAYAGREEMENT
      corner: bottom-right
    - at: g-root-config-files
      kind: rule
      rule: ADR-REPO-ROOTCFG-HEADEDCOPY
      corner: bottom-left
