description:
  Format-Code writes the head as one global imprint step, and a generated file changes only when its writer renders it again.
about:
  adrs:
    - ADR-REPO-CODEMETA-IMPRINTSTEP
    - ADR-REPO-FILEMETA-INTUNEWITHGENERATOR
  lens: architecture
content:
  title: The head is imprinted and a generated file moves with its generator
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b-fmt, label: FORMATTING }
    - { id: b-gen, label: GENERATING }
  glyphs:
    - { id: g-fmt, kind: code, label: "Format-Code runs the formatter of every language", in: b-fmt }
    - { id: g-imprint, kind: code, label: "Imprint step writes the head, listed once", in: b-fmt }
    - { id: g-render, kind: code, label: "Writer renders the file from the tree", in: b-gen }
    - { id: g-bytes, kind: result, label: "Rendered bytes equal the bytes on disk", in: b-gen }
    - { id: g-hand, kind: failure, label: "A hand edit, or a generator input changed without a render", in: b-gen }
  edges:
    - { from: g-fmt, to: g-imprint, kind: flow, label: "" }
    - { from: g-render, to: g-bytes, kind: flow, label: "" }
    - { from: g-hand, to: g-bytes, kind: flow, label: "" }
  markers:
    - { at: g-fmt, number: 1 }
    - { at: g-imprint, number: 2 }
    - { at: g-render, number: 3 }
    - { at: g-bytes, number: 4 }
    - { at: g-hand, number: 5 }
  legend: auto
