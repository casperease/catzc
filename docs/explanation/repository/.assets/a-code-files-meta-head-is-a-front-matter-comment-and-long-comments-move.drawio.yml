description:
  The head is one comment at the top, and long comments are moved to the page by tool.
about:
  adrs:
    - ADR-REPO-CODEMETA-CODEFILEHEAD
    - ADR-REPO-COMMENTS-MOVEDBYTOOL
  lens: architecture
content:
  title: A code meta head is a front matter comment
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: HEAD }
    - { id: b1, label: COMMENTS }
  glyphs:
    - { id: g0, kind: code, label: "One comment: a front matter document", in: b0 }
    - { id: g1, kind: file, label: "The catzc block, as in Markdown", in: b0 }
    - { id: g2, kind: code, label: "Export-Comments moves every long comment", in: b1 }
    - { id: g3, kind: gate, label: "Test-Comments fails a long comment left in a file", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
