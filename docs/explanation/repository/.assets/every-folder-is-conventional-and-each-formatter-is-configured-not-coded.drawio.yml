description:
  Names carry meaning, and each language formatter is a registry entry.
about:
  adrs:
    - ADR-REPO-FOLDERS-EVERYFOLDERCONVENTIONAL
    - ADR-REPO-FORMAT-CONFIGUREDFORMATTERS
  lens: architecture
content:
  title: Every folder is conventional, every formatter configured
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: FOLDERS }
    - { id: b1, label: FORMATTERS }
  glyphs:
    - { id: g0, kind: set, label: "Name infers contents and purpose", in: b0 }
    - { id: g1, kind: result, label: "No mapping file or README needed", in: b0 }
    - { id: g2, kind: file, label: "languages.yml entry per file language", in: b1 }
    - { id: g3, kind: code, label: "Format-Code runs the engines over tracked files", in: b1 }
  edges:
    - { from: g0, to: g1, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
