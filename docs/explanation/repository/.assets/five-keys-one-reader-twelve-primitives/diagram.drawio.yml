  kind: explanation
  flow: top-to-bottom
  relation: feeds
  theme: dark
  bands:
    - id: band-file
      label: FILE
    - id: band-read-path
      label: READ PATH
    - id: band-accessors
      label: ACCESSORS
    - id: band-guards
      label: GUARDS
  glyphs:
