description:
  "Build-Diagrams as one pipeline of five stages: it finds the diagram folders in the tree, finds every page that embeds each one, writes
  the minimap data of every declared folder, renders or syncs each folder, and reports. Rendering is where a full run spends its time."
about:
  adrs:
    - ADR-REPO-SLIDES-MINIMAPSFROMDATA
  lens: implementation
content:
  title: Build-Diagrams runs five stages, and rendering is the cost
  kind: explanation
  flow: left-to-right
  relation: then
  theme: dark
  bands:
    - id: band-pipeline
      label: BUILD-DIAGRAMS
  glyphs:
    - id: g-folders
      kind: set
      label: diagram folders
      in: band-pipeline
    - id: g-articles
      kind: file
      label: articles
      in: band-pipeline
    - id: g-minimaps
      kind: code
      label: minimap data
      in: band-pipeline
    - id: g-render
      kind: runner
      label: render or sync
      in: band-pipeline
    - id: g-report
      kind: result
      label: report
      in: band-pipeline
  edges:
    - from: g-folders
      to: g-articles
      kind: flow
      label: ""
    - from: g-articles
      to: g-minimaps
      kind: flow
      label: ""
    - from: g-minimaps
      to: g-render
      kind: flow
      label: ""
    - from: g-render
      to: g-report
      kind: flow
      label: ""
  markers:
    - at: g-render
      number: 1
  legend: auto
  minimaps:
    axis:
      - cell: AUTO/quality-control
        by:
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
    layer-stack:
      - cell: automation
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - .claude/plans/plan-minimap-reasons-gate.md
          - docs/drs/index.md
          - docs/drs/repository/dora-explains.md
          - docs/drs/repository/slides-as-markdown.md
          - docs/references/pwsh/catzc-base-slides.md
          - docs/references/pwsh/catzc-base-slides/Build-Diagrams.ps1.md
          - docs/references/python/catzc_diagrams.md
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - pwsh/Catzc.Base.Maps/tests/Get-GridMinimapData.Tests.ps1
          - pwsh/Catzc.Base.Slides/Build-Diagrams.ps1
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
    grid:
      - cell: .claude/markdown
        by:
          - .claude/plans/plan-minimap-reasons-gate.md
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
      - cell: ado-pipelines/pipeline-yaml
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
      - cell: docs/markdown
        by:
          - docs/drs/index.md
          - docs/drs/repository/dora-explains.md
          - docs/drs/repository/slides-as-markdown.md
          - docs/references/pwsh/catzc-base-slides.md
          - docs/references/pwsh/catzc-base-slides/Build-Diagrams.ps1.md
          - docs/references/python/catzc_diagrams.md
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
      - cell: pwsh/powershell
        by:
          - pwsh/Catzc.Base.Maps/tests/Get-GridMinimapData.Tests.ps1
          - pwsh/Catzc.Base.Slides/Build-Diagrams.ps1
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
      - cell: pwsh/yaml
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-REPO-SLIDES-MINIMAPSFROMDATA
layout:
