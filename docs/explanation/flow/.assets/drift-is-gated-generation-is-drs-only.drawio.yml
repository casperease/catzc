description:
  The flattened scan program feeds the GitHub paths and the Azure DevOps include and exclude lists, and three quality gates check those
  projections; the generation of the YAML filters is drawn dashed because no code and no gate holds it.
about:
  adrs:
    - FDR-CD-GLOBS-TRACKEDFILESONLY
    - FDR-CD-GLOBS-NATIVEPATHFILTER
    - FDR-CD-GLOBS-COMPOSESETS
    - ADR-AUTO-TEST-QUALITYGATE
  lens: governance
content:
  title: Three gates check the projection, while generation is held by the ADR alone
  kind: explanation
  flow: left-to-right
  relation: feeds
  theme: dark
  bands:
    - id: band-compose
      label: COMPOSE
    - id: band-projection
      label: PROJECTION
    - id: band-checked
      label: CHECKED BY
  glyphs:
    - id: r-flattened
      kind: result
      label: flattened scan program
      in: band-compose
    - id: r-github
      kind: result
      label: GitHub paths
      in: band-projection
    - id: r-ado
      kind: result
      label: ADO include and exclude
      in: band-projection
    - id: a-generated
      kind: drsonly
      label: generated YAML filters
      in: band-projection
    - id: g-github-gate
      kind: gate
      label: Test-GitHubWorkflowTriggerGlob
      in: band-checked
    - id: g-ado-gate
      kind: gate
      label: Test-AdoPipelineTriggerGlob
      in: band-checked
    - id: g-coverage-gate
      kind: gate
      label: Test-GlobSetTriggerCoverage
      in: band-checked
  edges:
    - from: r-flattened
      to: r-github
      kind: flow
      label: ""
    - from: r-flattened
      to: r-ado
      kind: flow
      label: ""
    - from: r-ado
      to: a-generated
      kind: adr
      label: ""
    - from: r-github
      to: g-github-gate
      kind: flow
      label: ""
    - from: r-ado
      to: g-ado-gate
      kind: flow
      label: ""
    - from: r-ado
      to: g-coverage-gate
      kind: flow
      label: ""
  markers:
    - at: r-flattened
      number: 1
    - at: r-github
      number: 2
    - at: r-ado
      number: 3
    - at: a-generated
      number: 4
    - at: g-github-gate
      number: 5
    - at: g-ado-gate
      number: 6
    - at: g-coverage-gate
      number: 7
  chips:
    - at: r-flattened
      kind: rule
      rule: FDR-CD-GLOBS-COMPOSESETS
    - at: r-flattened
      kind: rule
      rule: FDR-CD-GLOBS-TRACKEDFILESONLY
      gated: false
    - at: r-github
      kind: rule
      rule: FDR-CD-GLOBS-NATIVEPATHFILTER
    - at: r-ado
      kind: rule
      rule: FDR-CD-GLOBS-NATIVEPATHFILTER
    - at: a-generated
      kind: rule
      rule: FDR-CD-GLOBS-NATIVEPATHFILTER
      gated: false
    - at: g-github-gate
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
    - at: g-ado-gate
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
    - at: g-coverage-gate
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - ADR-AUTO-TEST-QUALITYGATE
          - FDR-CD-GLOBS-COMPOSESETS
          - FDR-CD-GLOBS-NATIVEPATHFILTER
          - FDR-CD-GLOBS-TRACKEDFILESONLY
      - cell: .claude/.claude/agents
        by:
          - .claude/agents/test-optimization.md
          - ADR-AUTO-TEST-QUALITYGATE
      - cell: .claude/.claude/skills/test-speed
        by:
          - .claude/skills/test-speed/SKILL.md
          - ADR-AUTO-TEST-QUALITYGATE
      - cell: ado-pipelines/pipelines/.
        by:
