description:
  Two environment variables are read in one function, Test-IsRunningInPipeline; callers ask it, and one analyzer rule, loaded through the
  one settings file, turns any other read of those variables into an error.
about:
  adrs:
    - FDR-CD-DETECT-NODIRECTVARIABLECHECK
    - FDR-CD-DETECT-BOOLEANNOTMODAL
    - FDR-CD-DETECT-FASTDETECTION
  lens: implementation
content:
  title: Two variables, one reader, 24 callers, and one analyzer rule for every other read
  kind: explanation
  flow: left-to-right
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-platform
      label: PLATFORM
    - id: band-loader
      label: LOADER
    - id: band-consumers
      label: CONSUMERS
    - id: band-analyzer
      label: ANALYZER
  groups:
    - id: grp-callers
      label: callers of the detector
      in: band-consumers
  glyphs:
    - id: r-azure-agent
      kind: runner
      label: Azure DevOps agent
      in: band-platform
    - id: r-github-runner
      kind: runner
      label: GitHub Actions runner
      in: band-platform
    - id: c-detector
      kind: code
      label: Test-IsRunningInPipeline
      in: band-loader
    - id: c-output-root
      kind: code
      label: Get-OutputRoot
      in: grp-callers
    - id: c-run-environment
      kind: code
      label: Get-RunEnvironment
      in: grp-callers
    - id: c-change-range
      kind: code
      label: Get-GlobSetChangeRange
      in: grp-callers
    - id: c-set-variable
      kind: code
      label: Set-AdoPipelineVariable
      in: grp-callers
    - id: f-settings
      kind: file
      label: PSScriptAnalyzerSettings.psd1
      in: band-analyzer
    - id: c-rules
      kind: code
      label: CatzcRules.psm1
      in: band-analyzer
    - id: g-rule
      kind: gate
      label: Measure-NoRawPipelineDetection
      in: band-analyzer
  edges:
    - from: r-azure-agent
      to: c-detector
      kind: flow
      label: TF_BUILD
    - from: r-github-runner
      to: c-detector
      kind: flow
      label: GITHUB_ACTIONS
    - from: c-detector
      to: grp-callers
      kind: flow
      label: ""
    - from: f-settings
      to: c-rules
      kind: flow
      label: ""
    - from: c-rules
      to: g-rule
      kind: flow
      label: ""
  markers:
    - at: r-azure-agent
      number: 1
    - at: r-github-runner
      number: 2
    - at: c-detector
      number: 3
    - at: c-output-root
      number: 4
    - at: c-run-environment
      number: 5
    - at: c-change-range
      number: 6
    - at: c-set-variable
      number: 7
    - at: f-settings
      number: 8
    - at: c-rules
      number: 9
    - at: g-rule
      number: 10
  chips:
    - at: grp-callers
      kind: count
      text: "24"
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: docs/-/.
        by:
          - docs/drs/flow/dora-explains.md
          - docs/drs/flow/pipeline-detection.md
          - docs/drs/index.md
          - docs/how-to/automation/apply-environment-approvals.md
          - docs/references/pwsh/.assets/protected-module-skip-by-hash/diagram.drawio.yml
          - docs/references/pwsh/catzc-azure-dev-ops/Sync-AdoEnvironmentApprovals.ps1.md
          - docs/references/pwsh/catzc-azure-templates/Get-BicepDeploymentName.ps1.md
          - docs/references/pwsh/catzc-base-drs/types/DrsConfig.cs.md
          - docs/references/pwsh/catzc-base-globs/Get-GlobSetChangeRange.ps1.md
          - docs/references/pwsh/catzc-base-globs/tests/Get-GlobSetChangeRange.Tests.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-LifecyclePositionMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-ValueChainHighlight.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-WorldMapHighlight.ps1.md
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Sync-AdoEnvironmentApprovals.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Azure.Templates/.
        by:
          - pwsh/Catzc.Azure.Templates/Get-BicepDeploymentName.ps1
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Drs/types
        by:
          - pwsh/Catzc.Base.Drs/types/DrsConfig.cs
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Globs/.
        by:
          - pwsh/Catzc.Base.Globs/Get-GlobSetChangeRange.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Globs/tests
        by:
          - pwsh/Catzc.Base.Globs/tests/Get-GlobSetChangeRange.Tests.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Maps/.
        by:
          - pwsh/Catzc.Base.Maps/Get-LifecyclePositionMinimapData.ps1
          - pwsh/Catzc.Base.Maps/Get-ValueChainHighlight.ps1
          - pwsh/Catzc.Base.Maps/Get-WorldMapHighlight.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.Maps/tests
        by:
          - pwsh/Catzc.Base.Maps/tests/Get-WorldMapHighlight.Tests.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: pwsh/Catzc.Base.QualityGates/configs
        by:
          - pwsh/Catzc.Base.QualityGates/configs/analyzer-drs-map.yml
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
    module-neighbourhood:
      - cell: subject/.claude
        by:
          - .claude/CLAUDE.md
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Azure.DevOps
        by:
          - pwsh/Catzc.Azure.DevOps/Sync-AdoEnvironmentApprovals.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Azure.Templates
        by:
          - pwsh/Catzc.Azure.Templates/Get-BicepDeploymentName.ps1
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Base.Drs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - pwsh/Catzc.Base.Drs/types/DrsConfig.cs
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Base.Globs
        by:
          - pwsh/Catzc.Base.Globs/Get-GlobSetChangeRange.ps1
          - pwsh/Catzc.Base.Globs/tests/Get-GlobSetChangeRange.Tests.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Base.Maps
        by:
          - pwsh/Catzc.Base.Maps/Get-LifecyclePositionMinimapData.ps1
          - pwsh/Catzc.Base.Maps/Get-ValueChainHighlight.ps1
          - pwsh/Catzc.Base.Maps/Get-WorldMapHighlight.ps1
          - pwsh/Catzc.Base.Maps/tests/Get-WorldMapHighlight.Tests.ps1
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: subject/Catzc.Base.QualityGates
        by:
          - pwsh/Catzc.Base.QualityGates/configs/analyzer-drs-map.yml
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
    axis:
      - cell: DSGN/*
        by:
          - FDR-CD-DETECT-BOOLEANNOTMODAL
          - FDR-CD-DETECT-FASTDETECTION
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
