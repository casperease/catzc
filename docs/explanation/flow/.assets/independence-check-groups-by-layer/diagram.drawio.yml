    to: g-overlaps-units
    kind: flow
    label: ''
  - from: s-module-layer
    to: g-overlaps-modules
    kind: flow
    label: ''
  - from: g-overlaps-units
    to: g-report
    kind: flow
    label: ''
  - from: g-overlaps-modules
    to: g-report
    kind: flow
    label: ''
  - from: g-report
    to: f-throw
    kind: fail
    label: ''
  markers:
  - at: s-deployable-units
    number: 1
  - at: s-declared-loose
    number: 2
  - at: s-reserved-names
    number: 3
  - at: s-module-layer
    number: 4
  - at: g-overlaps-units
    number: 5
  - at: g-overlaps-modules
    number: 6
  - at: g-report
    number: 7
  - at: f-throw
    number: 8
  legend: auto
  minimaps:
  - code-locations
  - module-neighbourhood
  - axis
