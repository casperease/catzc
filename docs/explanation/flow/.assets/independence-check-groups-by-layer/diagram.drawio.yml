description: The independence gate groups every declared and derived globset by layer, skips the loose-fileset group, tests
  each same-layer pair for a shared file, writes a report, and throws once with one line per overlapping pair.
about:
  adrs:
  - ADR-FLOW-CD-GLOBS-EVERYSETHASLAYER
  - ADR-FLOW-CD-GLOBS-NOOVERLAPWITHINLAYER
  lens: implementation
content:
  title: Test-GlobSetIndependence groups every set by layer and tests each same-layer pair
  kind: explanation
  flow: left-to-right
  relation: in code order
  theme: dark
  bands:
  - id: band-deployable-unit
    label: DEPLOYABLE-UNIT
  - id: band-loose-fileset
    label: LOOSE-FILESET
  - id: band-module
    label: MODULE
  glyphs:
  - id: s-deployable-units
    kind: set
    label: deployable-unit sets
    in: band-deployable-unit
  - id: g-overlaps-units
    kind: gate
    label: Overlaps per pair
    in: band-deployable-unit
  - id: s-declared-loose
    kind: set
    label: declared loose-filesets
    in: band-loose-fileset
  - id: s-reserved-names
    kind: set
    label: ReservedNames umbrellas
    in: band-loose-fileset
  - id: g-report
    kind: code
    label: Write-QualityGateReport
    in: band-loose-fileset
  - id: f-throw
    kind: failure
    label: One throw lists every pair
    in: band-loose-fileset
  - id: s-module-layer
    kind: set
    label: module-layer sets
    in: band-module
  - id: g-overlaps-modules
    kind: gate
    label: Overlaps per pair
    in: band-module
  edges:
