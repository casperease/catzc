description:
  "The one crossing from pipeline YAML into PowerShell: root pipelines call one step template, the template selects one task, the task calls
  one runner script that loads the importer, and a developer reaches the same importer from a terminal."
about:
  adrs:
    - ADR-FLOW-CD-RUNNER-NOINLINEPOWERSHELL
    - ADR-FLOW-CD-RUNNER-IMPORTONCE
    - ADR-FLOW-CD-RUNNER-THINSTEPTEMPLATES
  lens: architecture
content:
  title: The runner is the only seam from pipeline YAML into PowerShell
  kind: explanation
  flow: left-to-right
  relation: calls
  theme: dark
  bands:
    - id: band-yaml
      label: YAML
    - id: band-task
      label: ADO TASK
    - id: band-powershell
      label: POWERSHELL
    - id: band-developer
      label: DEVELOPER
  glyphs:
    - id: f-pipeline-yaml
      kind: file
      label: pipeline YAML
      in: band-yaml
    - id: f-template
      kind: file
      label: invoke-automation.yaml
      in: band-yaml
    - id: r-task
      kind: runner
      label: task by Mode
      in: band-task
    - id: c-runner
      kind: code
      label: Invoke-AdoScript.ps1
      in: band-powershell
    - id: c-importer
      kind: code
      label: importer.ps1
      in: band-powershell
    - id: a-developer
      kind: actor
      label: developer
      in: band-developer
  edges:
    - from: f-pipeline-yaml
      to: f-template
      kind: flow
      label: ""
    - from: f-template
      to: r-task
      kind: flow
      label: ""
    - from: r-task
      to: c-runner
      kind: flow
      label: ""
    - from: c-runner
      to: c-importer
      kind: flow
      label: ""
    - from: a-developer
      to: c-importer
      kind: flow
      label: ""
  markers:
    - at: f-pipeline-yaml
      number: 1
    - at: f-template
      number: 2
    - at: r-task
      number: 3
    - at: c-runner
      number: 4
    - at: c-importer
      number: 5
    - at: a-developer
      number: 6
  chips:
    - at: f-pipeline-yaml
      kind: count
      text: 6/7
  legend: auto
  minimaps:
    - code-locations
    - grid
    - axis
