description: >-
  CI, CD and DEPLOY are separate pipeline kinds keyed together by one tagged artifact that CI builds once; the two release gates sit between
  the kinds, and the CD run's own path to production runs below them.
about:
  lens: architecture
  adrs:
    - ADR-FLOW-CD-SEPARATEPIPELINEKINDS
    - ADR-FLOW-CD-CDCONTAINSCI
    - ADR-FLOW-CD-CDSTAYSINNONPROD
    - ADR-FLOW-CD-TWORELEASEGATES
    - ADR-FLOW-CD-PREPRODRUNG
  tracks: [docs]
  languages: []
  modules: []
  files:
    - docs/adr/flow/cd-discipline-and-promotion-flow.md
content:
  title: CI, CD and DEPLOY are separate pipeline kinds keyed together by one artifact
  kind: explanation
  relation: the artifact moves on
  bands:
    - { id: band-cd, label: CD }
    - { id: band-non-prod, label: DEPLOY-NON-PROD }
    - { id: band-prod, label: DEPLOY-PROD }
  spans:
    - { id: span-cd, label: CD, over: [band-cd] }
    - { id: span-ci, label: CI, over: [g-ci, g-artifact] }
    - { id: span-deploy, label: DEPLOY, over: [band-non-prod, band-prod] }
  glyphs:
    - { id: g-ci, kind: runner, label: CI component, in: band-cd }
    - { id: g-artifact, kind: result, label: tagged artifact, in: band-cd }
    - { id: g-main-uat, kind: env, label: main-uat, in: band-cd }
    - { id: g-rc, kind: adronly, label: RC, in: band-cd }
    - { id: g-release-uat, kind: env, label: release-uat, in: band-non-prod }
    - { id: g-rbc, kind: adronly, label: RBC, in: band-non-prod }
    - { id: g-pre-prod, kind: env, label: pre-prod, in: band-prod }
    - { id: g-production, kind: env, label: production, in: band-prod }
  edges:
    - { from: g-ci, to: g-artifact }
    - { from: g-artifact, to: g-main-uat }
    - { from: g-main-uat, to: g-rc, kind: adr }
    - { from: g-rc, to: g-release-uat, kind: adr }
    - { from: g-release-uat, to: g-rbc, kind: adr }
    - { from: g-rbc, to: g-pre-prod, kind: adr }
    - { from: g-pre-prod, to: g-production, kind: adr }
    - { from: g-artifact, to: g-production, via: [[265, 262], [1195, 262]] }
  markers:
    - { at: g-ci, number: 1 }
    - { at: g-artifact, number: 2 }
    - { at: g-main-uat, number: 3 }
    - { at: g-rc, number: 4 }
    - { at: g-release-uat, number: 5 }
    - { at: g-rbc, number: 6 }
    - { at: g-pre-prod, number: 7 }
    - { at: g-production, number: 8, corner: bottom-right }
  minimaps: [code-locations, grid, axis]
layout:
  band-cd: { x: 20, y: 108, w: 520, h: 180 }
  band-non-prod: { x: 640, y: 108, w: 200, h: 180 }
