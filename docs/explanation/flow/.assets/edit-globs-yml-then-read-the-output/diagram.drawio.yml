    label: ''
  - from: g-config-load
    to: g-changed
    kind: flow
    label: ''
  - from: g-config-load
    to: g-automation
    kind: flow
    label: ''
  - from: g-trigger
    to: r-projected
    kind: flow
    label: ''
  - from: g-changed
    to: r-touched
    kind: flow
    label: ''
  - from: g-automation
    to: r-skip
    kind: flow
    label: ''
  markers:
  - at: f-globs
    number: 1
  - at: g-config-load
    number: 2
  - at: g-trigger
    number: 3
  - at: g-changed
    number: 4
  - at: g-automation
    number: 5
  - at: r-projected
    number: 6
  - at: r-touched
    number: 7
  - at: r-skip
    number: 8
  legend: auto
  minimaps:
