description:
  "What a pipeline stage sees from one call to Test-GlobSetAffected: a boolean, at most one printed message, and one possible throw; only
  false returns early, true and a doubt both proceed."
about:
  adrs:
    - ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
  lens: operations
content:
  title: A stage returns only on $false; a doubt prints a message and proceeds; a typo throws
  kind: explanation
  flow: top-to-bottom
  relation: produces
  theme: dark
  bands:
    - id: band-who
      label: WHO RUNS IT
    - id: band-call
      label: THE CALL
    - id: band-returns
      label: WHAT IT RETURNS AND PRINTS
  glyphs:
    - id: a-stage
      kind: adronly
      label: a unit's pipeline stage
      in: band-who
    - id: c-affected
      kind: code
      label: Test-GlobSetAffected apex
      in: band-call
    - id: x-undeclared
      kind: failure
      label: not a declared globset
      in: band-call
    - id: r-false
      kind: result
      label: $false, return
      in: band-returns
    - id: r-true
      kind: result
      label: $true, proceed
      in: band-returns
    - id: r-message
      kind: result
      label: fail-open message
      in: band-returns
  edges:
    - from: a-stage
      to: c-affected
      kind: adr
      label: ""
    - from: c-affected
      to: r-false
      kind: flow
      label: ""
    - from: c-affected
      to: r-true
      kind: flow
      label: ""
    - from: c-affected
      to: r-message
      kind: flow
      label: ""
    - from: c-affected
      to: x-undeclared
      kind: fail
      label: ""
  markers:
    - at: a-stage
      number: 1
    - at: c-affected
      number: 2
    - at: r-false
      number: 3
    - at: r-true
      number: 4
    - at: r-message
      number: 5
    - at: x-undeclared
      number: 6
  legend: auto
  minimaps:
    - code-locations
    - module-neighbourhood
    - axis
