description:
  The globs module projects the flattened scan program into a GitHub list and an Azure DevOps include and exclude pair; the branch policy
  reads the GitHub list in code, while workflows and pipelines declare the lists by hand, drawn dashed.
about:
  adrs:
    - FDR-CD-GLOBS-NATIVEPATHFILTER
    - FDR-CD-GLOBS-COMPOSESETS
  lens: architecture
content:
  title: Catzc.Base.Globs projects the program, and workflows, pipelines and the branch policy only read it
  kind: explanation
  flow: left-to-right
  relation: feeds
  theme: dark
  bands:
    - id: band-compose
      label: COMPOSE
    - id: band-projection
      label: PROJECTION
    - id: band-trigger
      label: TRIGGER
  glyphs:
    - id: f-globs
      kind: file
      label: globs.yml
      in: band-compose
    - id: g-globset
      kind: code
      label: GlobSet
      in: band-compose
    - id: g-trigger
      kind: code
      label: Get-GlobSetTrigger
      in: band-projection
    - id: r-github
      kind: result
      label: ordered GitHub paths
      in: band-projection
    - id: r-ado
      kind: result
      label: ADO include and exclude
      in: band-projection
    - id: g-path-filter
      kind: code
      label: Get-BuildValidationPathFilter
      in: band-trigger
    - id: f-workflows
      kind: file
      label: .github/workflows/*.yml
      in: band-trigger
    - id: f-pipelines
      kind: file
      label: .ado/pipelines/*.yaml
      in: band-trigger
  edges:
    - from: f-globs
      to: g-globset
      kind: flow
      label: ""
    - from: g-globset
      to: g-trigger
      kind: flow
      label: ""
    - from: g-trigger
      to: r-github
      kind: flow
      label: ""
    - from: g-trigger
      to: r-ado
      kind: flow
      label: ""
    - from: r-github
      to: g-path-filter
      kind: flow
      label: ""
    - from: r-github
      to: f-workflows
      kind: adr
      label: ""
    - from: r-ado
      to: f-pipelines
      kind: adr
      label: ""
  markers:
    - at: f-globs
      number: 1
    - at: g-globset
      number: 2
    - at: g-trigger
      number: 3
    - at: r-github
      number: 4
    - at: r-ado
      number: 5
    - at: g-path-filter
      number: 6
    - at: f-workflows
      number: 7
    - at: f-pipelines
      number: 8
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - FDR-CD-GLOBS-COMPOSESETS
          - FDR-CD-GLOBS-NATIVEPATHFILTER
      - cell: ado-pipelines/pipelines/.
