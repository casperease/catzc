description:
  A globset flows from the registry through the validated config load into the scan program and from there into the native projection, the
  git reflection and the live identity; gates check the source and the trigger projection, while the git reflection and the identity are
  held by the ADR rules alone.
about:
  adrs:
    - FDR-CD-GLOBS-NAMEDGLOBSETS
    - FDR-CD-GLOBS-REPOSITORYRELATIVEPATTERNS
    - FDR-CD-GLOBS-MALFORMEDPATTERNREJECTED
    - FDR-CD-GLOBS-TRACKEDFILESONLY
    - FDR-CD-GLOBS-DURABLESHAIDENTITY
    - FDR-CD-GLOBS-NATIVEPATHFILTER
    - FDR-CD-GLOBS-EVERYSETHASLAYER
    - FDR-CD-GLOBS-COMPOSESETS
    - FDR-CD-GLOBS-CHANGECOMPUTEDFROMGIT
    - FDR-CD-GLOBS-NOOVERLAPWITHINLAYER
    - ADR-AUTO-TEST-QUALITYGATE
  lens: governance
content:
  title: Gates check the source of each globset and the trigger, but not the git reflection or the identity
  kind: explanation
  flow: top-to-bottom
  relation: output read by the next
  theme: dark
  bands:
    - id: band-source
      label: SOURCE
    - id: band-load
      label: LOAD
    - id: band-flatten
      label: FLATTEN
    - id: band-roles
      label: ROLES
    - id: band-checked
      label: CHECKED BY
  glyphs:
    - id: f-registry
      kind: file
      label: Registry
      in: band-source
    - id: g-independence
      kind: gate
      label: Test-GlobSetIndependence
      in: band-source
    - id: g-config-load
      kind: gate
      label: Config load
      in: band-load
    - id: g-scan-program
      kind: code
      label: Scan program
      in: band-flatten
    - id: g-projection
      kind: code
      label: Native projection
      in: band-roles
    - id: g-git-reflection
      kind: code
      label: Git reflection
      in: band-roles
    - id: g-live-identity
      kind: code
      label: Live identity
      in: band-roles
    - id: g-trigger-gates
      kind: gate
      label: Trigger gates
      in: band-checked
  edges:
    - from: f-registry
      to: g-independence
      kind: flow
      label: ""
    - from: f-registry
      to: g-config-load
      kind: flow
      label: ""
    - from: g-config-load
      to: g-scan-program
      kind: flow
      label: ""
    - from: g-scan-program
      to: g-projection
      kind: flow
      label: ""
    - from: g-scan-program
      to: g-git-reflection
      kind: flow
      label: ""
    - from: g-scan-program
      to: g-live-identity
      kind: flow
      label: ""
    - from: g-projection
      to: g-trigger-gates
      kind: flow
      label: ""
  markers:
    - at: f-registry
      number: 1
    - at: g-independence
      number: 2
    - at: g-config-load
      number: 3
    - at: g-scan-program
      number: 4
    - at: g-projection
      number: 5
    - at: g-trigger-gates
      number: 6
    - at: g-git-reflection
      number: 7
    - at: g-live-identity
      number: 8
  chips:
    - at: f-registry
      kind: rule
      rule: FDR-CD-GLOBS-NAMEDGLOBSETS
    - at: f-registry
      kind: rule
      rule: FDR-CD-GLOBS-EVERYSETHASLAYER
    - at: f-registry
      kind: rule
      rule: FDR-CD-GLOBS-NOOVERLAPWITHINLAYER
    - at: g-independence
      kind: rule
      rule: FDR-CD-GLOBS-NOOVERLAPWITHINLAYER
    - at: g-independence
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
    - at: g-config-load
      kind: rule
      rule: FDR-CD-GLOBS-MALFORMEDPATTERNREJECTED
    - at: g-config-load
      kind: rule
      rule: FDR-CD-GLOBS-COMPOSESETS
    - at: g-scan-program
      kind: rule
      rule: FDR-CD-GLOBS-REPOSITORYRELATIVEPATTERNS
    - at: g-scan-program
      kind: rule
      rule: FDR-CD-GLOBS-TRACKEDFILESONLY
    - at: g-scan-program
      kind: rule
      rule: FDR-CD-GLOBS-COMPOSESETS
    - at: g-projection
      kind: rule
      rule: FDR-CD-GLOBS-NATIVEPATHFILTER
    - at: g-git-reflection
      kind: rule
      rule: FDR-CD-GLOBS-CHANGECOMPUTEDFROMGIT
      gated: false
    - at: g-live-identity
      kind: rule
      rule: FDR-CD-GLOBS-DURABLESHAIDENTITY
      gated: false
    - at: g-trigger-gates
      kind: rule
      rule: FDR-CD-GLOBS-NATIVEPATHFILTER
    - at: g-trigger-gates
      kind: rule
      rule: ADR-AUTO-TEST-QUALITYGATE
