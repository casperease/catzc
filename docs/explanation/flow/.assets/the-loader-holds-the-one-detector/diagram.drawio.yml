description:
  "Where the pipeline detector lives: the CI platforms set the variables, one loader function reads them, the bootstrap, the builder and the
  modules ask that function, an analyzer rule bans a raw read, and only the C# hook repeats the test."
about:
  adrs:
    - FDR-CD-DETECT-NODIRECTVARIABLECHECK
  lens: architecture
content:
  title: The detector lives in the loader, which both run modes import first and keep loaded
  kind: explanation
  flow: left-to-right
  relation: feeds the next step
  theme: dark
  bands:
    - id: band-platform
      label: PLATFORM
    - id: band-loader
      label: LOADER
    - id: band-callers
      label: CALLERS
    - id: band-hook
      label: HOOK
    - id: band-enforcement
      label: ENFORCEMENT
  groups:
    - id: grp-platforms
      label: sets TF_BUILD or GITHUB_ACTIONS
      in: band-platform
    - id: grp-callers
      label: ask the one detector
      in: band-callers
  glyphs:
    - id: r-azure-agent
      kind: runner
      label: Azure DevOps agent
      in: grp-platforms
    - id: r-github-runner
      kind: runner
      label: GitHub Actions runner
      in: grp-platforms
    - id: c-detector
      kind: code
      label: Test-IsRunningInPipeline
      in: band-loader
    - id: c-bootstrap
      kind: code
      label: Catzc.Internal.Bootstrap
      in: grp-callers
    - id: c-builder
      kind: code
      label: Catzc.Internal.Builder
      in: grp-callers
    - id: s-modules
      kind: set
      label: Catzc modules
      in: grp-callers
    - id: c-hook
      kind: code
      label: Assert-BashTimeout
      in: band-hook
    - id: g-analyzer-rule
      kind: gate
      label: Measure-NoRawPipelineDetection
      in: band-enforcement
  edges:
    - from: grp-platforms
      to: c-detector
      kind: flow
      label: ""
    - from: c-detector
      to: grp-callers
      kind: flow
      label: ""
    - from: grp-platforms
      to: c-hook
      kind: flow
      label: ""
    - from: grp-callers
      to: g-analyzer-rule
      kind: flow
      label: ""
  markers:
    - at: r-azure-agent
      number: 1
    - at: r-github-runner
      number: 2
    - at: c-detector
      number: 3
    - at: c-bootstrap
      number: 4
    - at: c-builder
      number: 5
    - at: s-modules
      number: 6
    - at: g-analyzer-rule
      number: 7
    - at: c-hook
      number: 8
  chips:
    - at: s-modules
      kind: count
      text: "22"
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - FDR-CD-DETECT-NODIRECTVARIABLECHECK
      - cell: docs/-/.
        by:
          - docs/adr/flow/dora-explains.md
          - docs/adr/flow/pipeline-detection.md
          - docs/adr/index.md
          - docs/how-to/automation/apply-environment-approvals.md
          - docs/references/pwsh/.assets/protected-module-skip-by-hash/diagram.drawio.yml
          - docs/references/pwsh/catzc-azure-dev-ops/Sync-AdoEnvironmentApprovals.ps1.md
          - docs/references/pwsh/catzc-azure-templates/Get-BicepDeploymentName.ps1.md
          - docs/references/pwsh/catzc-base-docs/types/AdrsConfig.cs.md
          - docs/references/pwsh/catzc-base-globs/Get-GlobSetChangeRange.ps1.md
          - docs/references/pwsh/catzc-base-globs/tests/Get-GlobSetChangeRange.Tests.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-LifecyclePositionMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-ValueChainHighlight.ps1.md
