description:
  "Every globset carries one of three layers: deployable-unit and loose-fileset sets are declared in globs.yml, module sets are derived from
  the folders under pwsh; the reserved umbrellas are derived loose-filesets, and compose is the only edge between sets."
about:
  adrs:
    - ADR-FLOW-CD-GLOBS-EVERYSETHASLAYER
    - ADR-FLOW-CD-GLOBS-COMPOSESETS
    - ADR-FLOW-CD-GLOBS-NOOVERLAPWITHINLAYER
  lens: architecture
content:
  title: Every globset carries one of three layers, and only two are declared
  kind: explanation
  flow: top-to-bottom
  relation: composes
  theme: dark
  bands:
    - id: band-unit
      label: DEPLOYABLE-UNIT
    - id: band-loose
      label: LOOSE-FILESET
    - id: band-module
      label: MODULE
  groups:
    - id: grp-unit-declared
      label: declared in globs.yml
      in: band-unit
    - id: grp-loose-declared
      label: declared in globs.yml
      in: band-loose
    - id: grp-loose-derived
      label: derived
      in: band-loose
    - id: grp-module-derived
      label: derived
      in: band-module
  glyphs:
    - id: g-configured
      kind: set
      label: Configured units
      in: grp-unit-declared
    - id: g-base
      kind: set
      label: Base unit
      in: grp-unit-declared
    - id: g-declared-loose
      kind: set
      label: Declared loose-filesets
      in: grp-loose-declared
    - id: g-umbrellas
      kind: set
      label: Reserved umbrellas
      in: grp-loose-derived
    - id: g-modules
      kind: set
      label: Module sets
      in: grp-module-derived
    - id: g-leftovers
      kind: set
      label: module-leftovers
      in: grp-module-derived
  edges:
    - from: g-configured
      to: g-base
      kind: thick
      label: compose
  markers:
    - at: g-configured
      number: 1
    - at: g-base
      number: 2
    - at: g-declared-loose
      number: 3
    - at: g-umbrellas
      number: 4
    - at: g-modules
      number: 5
    - at: g-leftovers
      number: 6
  chips:
    - at: g-configured
      kind: count
      text: 4/4
  legend: auto
  minimaps:
    - code-locations
    - module-neighbourhood
    - axis
