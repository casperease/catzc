      kind: rule
      rule: FDR-CD-GLOBS-CHANGECOMPUTEDFROMGIT
    - at: c-affected
      kind: rule
      rule: ADR-AUTO-FAILFAST-USEASSERTIONLIBRARY
      gated: false
    - at: c-change-range
      kind: rule
      rule: FDR-CD-GLOBS-CHANGECOMPUTEDFROMGIT
    - at: c-in-pipeline
      kind: rule
      rule: FDR-CD-DETECT-NODIRECTVARIABLECHECK
    - at: c-fetch-depth
