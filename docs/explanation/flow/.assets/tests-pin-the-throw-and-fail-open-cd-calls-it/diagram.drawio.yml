      kind: rule
      rule: ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
    - at: c-affected
      kind: rule
      rule: ADR-AUTO-FAILFAST-USEASSERTIONLIBRARY
      gated: false
    - at: c-change-range
      kind: rule
      rule: ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
    - at: c-in-pipeline
      kind: rule
      rule: ADR-FLOW-CD-DETECT-NODIRECTVARIABLECHECK
    - at: c-fetch-depth
      kind: rule
      rule: ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
      gated: false
    - at: c-changes-step
      kind: rule
      rule: ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
      gated: false
