    - at: g-affected-tests
      number: 2
    - at: c-change-range
      number: 3
    - at: g-range-tests
      number: 4
    - at: c-in-pipeline
      number: 5
    - at: g-analyzer
      number: 6
    - at: c-fetch-depth
      number: 7
    - at: c-changes-step
      number: 8
  chips:
