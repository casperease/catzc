  adrs:
  - ADR-FLOW-CD-GLOBS-NAMEDGLOBSETS
  - ADR-FLOW-CD-GLOBS-CHANGECOMPUTEDFROMGIT
  - ADR-FLOW-CD-DETECT-NODIRECTVARIABLECHECK
  lens: architecture
content:
