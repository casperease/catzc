      kind: flow
      label: ""
    - from: r-expedition
      to: g-deploy-expedition
      kind: flow
      label: ""
    - from: g-deploy-foundation
      to: g-deploy-discovery
      kind: flow
      label: ""
    - from: g-deploy-discovery
      to: g-deploy-expedition
      kind: flow
      label: ""
    - from: g-deploy-foundation
      to: e-non-prod
      kind: flow
      label: ""
    - from: g-deploy-expedition
      to: e-prod-tier
      kind: flow
      label: ""
  markers:
