    label: main-UAT
    in: band-climb
    state: main-uat
  - id: c-release-uat
    kind: commit
    label: release-uat
    in: band-climb
    state: release-uat
  - id: c-pre-prod
    kind: commit
    label: pre-prod
    in: band-climb
    state: prod
  - id: c-production
    kind: commit
    label: production
    in: band-climb
    state: prod
  - id: c-superseded
    kind: commit
    label: superseded
    in: band-superseded
    state: release-uat
    ghost: true
  - id: c-discarded
    kind: commit
    label: discarded
