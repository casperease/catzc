    label: CI
    over:
    - c-landed
    - c-bvt
  - id: span-cd
    label: CD
    over:
    - c-l3
  - id: span-deploy
    label: DEPLOY
    over:
    - c-main-uat
    - c-release-uat
    - c-pre-prod
    - c-production
