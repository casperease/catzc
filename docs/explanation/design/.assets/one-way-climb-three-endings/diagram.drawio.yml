  - from: c-release-uat
    to: c-pre-prod
    kind: adr
    label: ''
  - from: c-pre-prod
    to: c-production
    kind: adr
    label: ''
  - from: c-release-uat
    to: c-superseded
    kind: adr
    label: ''
  - from: c-bvt
    to: c-discarded
    kind: fail
    label: ''
  - from: c-production
    to: c-retired
    kind: adr
    label: ''
  markers:
