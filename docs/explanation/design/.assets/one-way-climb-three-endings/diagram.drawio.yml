description: 'The eight rungs a commit climbs, one at a time and never backward, and its three endings off the ladder: superseded,
  drawn as a ghost of its last colour, discarded in red at a gate, and retired from production in its kept green.'
about:
  adrs:
  - ADR-FLOW-CD-LIFE-ONESTATEADVANCESONERUNG
  - ADR-FLOW-CD-LIFE-DISCARDISTERMINAL
  - ADR-FLOW-CD-LIFE-RETIREMENTISNOTDISCARD
  - ADR-FLOW-CD-LIFE-SUPERSESSIONABANDONSOVERTAKEN
  - ADR-FLOW-CD-LIFE-FAILEDSTAYSUPSTREAM
  lens: meta
content:
  title: A commit only climbs, then ends in one of three ways
  kind: explanation
  flow: left-to-right
  relation: climbs one rung
  theme: dark
  bands:
  - id: band-climb
    label: THE CLIMB
  - id: band-superseded
    label: SUPERSEDED
  - id: band-ended
    label: DISCARDED / RETIRED
  spans:
