description: >-
  The eight rungs a commit climbs, one at a time and never backward, and its three endings off the ladder: superseded, drawn as a ghost of
  its last colour, discarded in red at a gate, and retired from production in its kept green.
about:
  lens: meta
  adrs:
    - ADR-FLOW-CD-LIFE-ONESTATEADVANCESONERUNG
    - ADR-FLOW-CD-LIFE-DISCARDISTERMINAL
    - ADR-FLOW-CD-LIFE-RETIREMENTISNOTDISCARD
    - ADR-FLOW-CD-LIFE-SUPERSESSIONABANDONSOVERTAKEN
    - ADR-FLOW-CD-LIFE-FAILEDSTAYSUPSTREAM
  tracks: [docs]
  files:
    - docs/adr/flow/commit-lifecycle.md
content:
  title: A commit only climbs, then ends in one of three ways
  kind: explanation
  relation: climbs one rung
  bands:
    - { id: band-climb, label: THE CLIMB }
    - { id: band-superseded, label: SUPERSEDED }
    - { id: band-ended, label: DISCARDED / RETIRED }
  spans:
    - { id: span-ci, label: CI, over: [c-landed, c-bvt] }
    - { id: span-cd, label: CD, over: [c-l3] }
    - { id: span-deploy, label: DEPLOY, over: [c-main-uat, c-release-uat, c-pre-prod, c-production] }
  glyphs:
    - { id: c-topic, kind: commit, label: topic, state: topic, in: band-climb }
    - { id: c-landed, kind: commit, label: landed, state: landed, in: band-climb }
    - { id: c-bvt, kind: commit, label: BVT, in: band-climb }
    - { id: c-l3, kind: commit, label: L3, state: l3, in: band-climb }
    - { id: c-main-uat, kind: commit, label: main-UAT, state: main-uat, in: band-climb }
    - { id: c-release-uat, kind: commit, label: release-uat, state: release-uat, in: band-climb }
    - { id: c-pre-prod, kind: commit, label: pre-prod, state: prod, in: band-climb }
    - { id: c-production, kind: commit, label: production, state: prod, in: band-climb }
    - { id: c-superseded, kind: commit, label: superseded, state: release-uat, ghost: true, in: band-superseded }
    - { id: c-discarded, kind: commit, label: discarded, state: discarded, in: band-ended }
    - { id: c-retired, kind: commit, label: retired, state: prod, in: band-ended }
  edges:
    - { from: c-topic, to: c-landed }
    - { from: c-landed, to: c-bvt }
    - { from: c-bvt, to: c-l3, kind: adr }
    - { from: c-l3, to: c-main-uat, kind: adr }
    - { from: c-main-uat, to: c-release-uat, kind: adr }
    - { from: c-release-uat, to: c-pre-prod, kind: adr }
    - { from: c-pre-prod, to: c-production, kind: adr }
    - { from: c-release-uat, to: c-superseded, kind: adr }
    - { from: c-bvt, to: c-discarded, kind: fail }
    - { from: c-production, to: c-retired, kind: adr }
  markers:
    - { at: band-climb, number: 1, corner: top-right }
    - { at: c-superseded, number: 2 }
    - { at: c-discarded, number: 3 }
    - { at: c-retired, number: 4 }
  minimaps: [code-locations, grid, axis]
layout:
  band-climb: { x: 20, y: 84, w: 1260, h: 120 }
  band-superseded: { x: 20, y: 224, w: 1260, h: 110 }
  band-ended: { x: 20, y: 354, w: 1260, h: 130 }
