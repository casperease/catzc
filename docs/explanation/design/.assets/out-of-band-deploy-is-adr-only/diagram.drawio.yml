description: >-
  The out-of-band deploy of a topic commit, which no gate checks, beside the one gate in code on deploys, main-only, and the climb from the
  topic commit through main and the BVT to a BVT-verified commit.
about:
  lens: governance
  adrs:
    - ADR-FLOW-CD-LIFE-ONESTATEADVANCESONERUNG
    - ADR-FLOW-CD-LIFE-TOPICDEPLOYSOUTOFBAND
    - ADR-DSGN-VISUAL-BRANCHDIRECTIONISROLE
    - ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE
    - ADR-DSGN-VISUAL-ENVIRONMENTISCONTAINER
  tracks: [docs, ado-pipelines]
  languages: [markdown, pipeline-yaml]
  modules: []
  files:
    - docs/adr/flow/commit-lifecycle.md
    - docs/adr/design/visual-design.md
content:
  title: No gate checks the out-of-band deploy rule, and the only gate on deploys in code is main-only
  kind: explanation
  relation: lands, then climbs
  bands:
    - { id: band-topic, label: TOPIC }
    - { id: band-out-of-band, label: OUT-OF-BAND }
    - { id: band-main, label: MAIN }
    - { id: band-after, label: AFTER LANDING }
  spans:
    - { id: span-ci, label: CI, over: [band-main, band-after] }
  glyphs:
    - { id: c-topic, kind: commit, label: topic, state: topic, in: band-topic }
    - { id: a-deploy, kind: adronly, label: out-of-band deploy, in: band-out-of-band }
    - { id: e-environment, kind: env, label: environment, in: band-out-of-band }
    - { id: c-occupant, kind: commit, state: topic, in: e-environment, label: topic }
    - { id: c-main, kind: commit, label: main, state: landed, in: band-main }
    - { id: g-main-only, kind: gate, label: main only, in: band-main }
    - { id: g-bvt, kind: gate, label: BVT, in: band-after }
    - { id: c-verified, kind: commit, label: BVT-verified, in: band-after }
  edges:
    - { from: c-topic, to: c-main }
    - { from: c-topic, to: a-deploy, kind: adr, via: [[105, 312]] }
    - { from: a-deploy, to: e-environment, kind: adr }
    - { from: c-main, to: g-main-only }
    - { from: c-main, to: g-bvt }
    - { from: g-bvt, to: c-verified }
  markers:
    - { at: c-topic, number: 1 }
    - { at: a-deploy, number: 2 }
    - { at: e-environment, number: 3 }
    - { at: c-main, number: 4 }
    - { at: g-main-only, number: 5 }
    - { at: g-bvt, number: 6 }
  chips:
    - { at: c-topic, kind: rule, rule: ADR-DSGN-VISUAL-BRANCHDIRECTIONISROLE, gated: false }
    - { at: c-topic, kind: rule, rule: ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, gated: false, corner: bottom-right }
    - { at: a-deploy, kind: rule, rule: ADR-FLOW-CD-LIFE-TOPICDEPLOYSOUTOFBAND, gated: false, corner: bottom-right }
    - { at: e-environment, kind: rule, rule: ADR-DSGN-VISUAL-ENVIRONMENTISCONTAINER, gated: false }
    - { at: c-main, kind: rule, rule: ADR-FLOW-CD-LIFE-ONESTATEADVANCESONERUNG, gated: false, corner: bottom-right }
    - { at: c-verified, kind: rule, rule: ADR-DSGN-VISUAL-FIXEDCOMMITPALETTE, gated: false }
  minimaps: [code-locations, grid, axis]
layout:
  band-topic: { x: 20, y: 124, w: 170, h: 380 }
  band-out-of-band: { x: 210, y: 124, w: 420, h: 380 }
  band-main: { x: 650, y: 124, w: 200, h: 380 }
  band-after: { x: 870, y: 124, w: 410, h: 380 }
  c-topic: { x: 40, y: 186, w: 130, h: 44 }
  a-deploy: { x: 330, y: 290, w: 180, h: 44 }
  e-environment: { x: 300, y: 390, w: 240, h: 72 }
  c-occupant: { x: 460, y: 412, w: 64, h: 28 }
  c-main: { x: 700, y: 186, w: 100, h: 44 }
  g-main-only: { x: 700, y: 290, w: 100, h: 68 }
  g-bvt: { x: 930, y: 174, w: 100, h: 68 }
  c-verified: { x: 1090, y: 186, w: 150, h: 44 }
