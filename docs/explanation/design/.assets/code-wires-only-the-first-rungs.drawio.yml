description:
  "The pipelines wire only the first three rungs of the commit lifecycle: a pull request, the merge, and the CD run's own CI engine; past
  the build validation commit the deploy stages follow the template, not a rung."
about:
  adrs:
    - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
  lens: implementation
content:
  title: The pipelines wire only topic, landed and BVT; past BVT there is no ladder
  kind: explanation
  flow: left-to-right
  relation: runs next
  theme: dark
  bands:
    - id: band-pre
      label: PRE-COMMIT
    - id: band-post
      label: POST-COMMIT
    - id: band-validation
      label: BVT
    - id: band-deploy
      label: DEPLOY STAGES
  spans:
    - id: span-integration
      label: CI
      over:
        - band-pre
        - band-post
    - id: span-delivery
      label: CD
      over:
        - band-validation
        - band-deploy
  glyphs:
    - id: c-topic
      kind: commit
      label: topic
      in: band-pre
      state: topic
    - id: r-pull-request
      kind: runner
      label: "pr: [main]"
      in: band-pre
    - id: c-landed
      kind: commit
      label: landed
      in: band-post
      state: landed
    - id: r-trigger
      kind: runner
      label: "trigger: [main]"
      in: band-post
    - id: r-stage
      kind: runner
      label: CD stage CI
      in: band-validation
    - id: c-verified
      kind: commit
      label: BVT
      in: band-validation
    - id: a-level-three
      kind: adronly
      label: L3 run
      in: band-validation
    - id: r-automation
      kind: runner
      label: ci-pwsh
      in: band-validation
    - id: r-infrastructure
      kind: runner
      label: ci-infrastructure
      in: band-validation
    - id: r-foundation
      kind: runner
      label: Deploy_Foundation
      in: band-deploy
    - id: r-discovery
      kind: runner
      label: Deploy_Discovery
      in: band-deploy
    - id: r-expedition
      kind: runner
      label: Deploy_Expedition
      in: band-deploy
  edges:
    - from: c-topic
      to: r-pull-request
      kind: flow
      label: ""
    - from: r-pull-request
      to: c-landed
      kind: flow
      label: ""
    - from: c-landed
      to: r-trigger
      kind: flow
      label: ""
    - from: r-trigger
      to: r-stage
      kind: flow
      label: ""
    - from: r-stage
      to: c-verified
      kind: flow
      label: ""
    - from: c-verified
      to: r-foundation
      kind: flow
      label: ""
    - from: c-verified
      to: a-level-three
      kind: adr
      label: ""
    - from: r-foundation
      to: r-discovery
      kind: flow
      label: ""
    - from: r-discovery
      to: r-expedition
      kind: flow
      label: ""
  markers:
    - at: r-pull-request
      number: 1
    - at: r-trigger
      number: 2
    - at: r-stage
      number: 3
    - at: r-automation
      number: 4
    - at: r-infrastructure
      number: 5
    - at: a-level-three
      number: 6
    - at: r-foundation
      number: 7
    - at: r-discovery
      number: 8
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
      - cell: docs/-/.
        by:
          - docs/drs/flow/.assets/commit-promotion-states/diagram.drawio.yml
          - docs/drs/flow/.assets/sync-point/diagram.drawio.yml
          - docs/drs/flow/commit-lifecycle.md
          - docs/drs/flow/dora-explains.md
          - docs/drs/index.md
          - docs/how-to/automation/apply-environment-approvals.md
          - docs/references/pwsh/catzc-azure-dev-ops/Sync-AdoEnvironmentApprovals.ps1.md
          - docs/references/pwsh/catzc-base-drs/types/DrsConfig.cs.md
          - docs/references/pwsh/catzc-base-maps/Get-LifecyclePositionMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-ValueChainHighlight.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-WorldMapHighlight.ps1.md
          - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Sync-AdoEnvironmentApprovals.ps1
          - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
      - cell: pwsh/Catzc.Base.Drs/configs
