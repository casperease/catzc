description:
  "Which rules that keep the platform thin have a gate: the function naming rule, the configuration check and the az version pin do, while
  no reimplementation, everything as code and the swappable substrate are held by review alone."
about:
  adrs:
    - DDR-THINPLAT-THINPLATFORM
    - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
    - DDR-THINPLAT-PLATFORMASCLI
    - DDR-THINPLAT-REPRESENTEDASCODE
    - DDR-THINPLAT-SWAPPABLESUBSTRATE
    - ADR-AZ-CLI-AZBYDEFAULT
    - ADR-AZ-CLI-ASSERTAZ
    - ADR-AZ-CLI-NOAZMODULEIMPORT
  lens: governance
content:
  title: Three gates guard the CLI and az, but nothing checks that cats stays thin
  kind: explanation
  flow: left-to-right
  relation: guards
  theme: dark
  bands:
    - id: band-surface
      label: CLI SURFACE
    - id: band-catzc
      label: CATZC
    - id: band-delegated
      label: DELEGATED
    - id: band-substrate
      label: VENDOR SUBSTRATE
  glyphs:
    - id: g-naming
      kind: gate
      label: NoAzModuleNaming
      in: band-surface
    - id: g-functions
      kind: code
      label: Verb-Noun functions
      in: band-surface
    - id: g-config
      kind: gate
      label: config validation
      in: band-surface
    - id: g-everything-code
      kind: adronly
      label: everything is code
      in: band-catzc
    - id: g-assert-tool
      kind: gate
      label: Assert-Tool 'az_cli'
      in: band-catzc
    - id: g-no-reimplementation
      kind: adronly
      label: no reimplementation
      in: band-delegated
    - id: g-az-cli
      kind: external
      label: az CLI
      in: band-delegated
    - id: g-substrate
      kind: adronly
      label: swappable substrate
      in: band-substrate
  edges:
    - from: g-naming
      to: g-functions
      kind: flow
      label: ""
    - from: g-config
      to: g-functions
      kind: flow
      label: ""
    - from: g-everything-code
      to: g-functions
      kind: adr
      label: ""
    - from: g-assert-tool
      to: g-az-cli
      kind: flow
      label: ""
    - from: g-no-reimplementation
      to: g-az-cli
      kind: adr
      label: ""
    - from: g-substrate
      to: g-az-cli
      kind: adr
      label: ""
  markers:
    - at: g-naming
      number: 1
    - at: g-functions
      number: 2
    - at: g-config
      number: 3
    - at: g-everything-code
      number: 4
    - at: g-assert-tool
      number: 5
    - at: g-no-reimplementation
      number: 6
    - at: g-az-cli
      number: 7
    - at: g-substrate
      number: 8
  chips:
    - at: g-naming
      kind: rule
      rule: ADR-AZ-CLI-NOAZMODULEIMPORT
    - at: g-functions
      kind: rule
      rule: DDR-THINPLAT-PLATFORMASCLI
      gated: false
    - at: g-config
      kind: rule
      rule: DDR-THINPLAT-THINPLATFORM
    - at: g-everything-code
      kind: rule
      rule: DDR-THINPLAT-REPRESENTEDASCODE
      gated: false
    - at: g-assert-tool
      kind: rule
      rule: ADR-AZ-CLI-ASSERTAZ
    - at: g-no-reimplementation
      kind: rule
      rule: DDR-THINPLAT-DELEGATENOTREIMPLEMENT
      gated: false
    - at: g-az-cli
      kind: rule
      rule: ADR-AZ-CLI-AZBYDEFAULT
      gated: false
    - at: g-substrate
      kind: rule
      rule: DDR-THINPLAT-SWAPPABLESUBSTRATE
      gated: false
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
      - cell: docs/-/.
        by:
          - docs/adr/azure/dora-explains.md
          - docs/adr/azure/prefer-az-cli.md
          - docs/adr/design/dora-explains.md
          - docs/adr/design/thin-platforms.md
          - docs/adr/index.md
          - docs/references/pwsh/.assets/az-cli-test-assert-share-one-state/diagram.drawio.yml
          - docs/references/pwsh/catzc-azure-cli/Assert-AzCliBicep.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Assert-AzCliCanAccess.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Assert-AzCliSubscriptionAccessible.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Get-AzCliSubscriptionAccessState.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Install-AzCliBicep.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Test-AzCliBicep.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Test-AzCliCanAccess.ps1.md
          - docs/references/pwsh/catzc-azure-cli/Test-AzCliSubscriptionAccessible.ps1.md
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
      - cell: pwsh/Catzc.Azure.Cli/.
        by:
          - pwsh/Catzc.Azure.Cli/Assert-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Assert-AzCliCanAccess.ps1
          - pwsh/Catzc.Azure.Cli/Assert-AzCliSubscriptionAccessible.ps1
          - pwsh/Catzc.Azure.Cli/Get-AzCliSubscriptionAccessState.ps1
          - pwsh/Catzc.Azure.Cli/Install-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliCanAccess.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliSubscriptionAccessible.ps1
          - ADR-AZ-CLI-AZBYDEFAULT
      - cell: pwsh/Catzc.Base.Docs/configs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
      - cell: pwsh/Catzc.Base.QualityGates/configs
        by:
          - pwsh/Catzc.Base.QualityGates/configs/terminology.yml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
    module-neighbourhood:
      - cell: subject/Catzc.Azure.Cli
        by:
          - pwsh/Catzc.Azure.Cli/Assert-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Assert-AzCliCanAccess.ps1
          - pwsh/Catzc.Azure.Cli/Assert-AzCliSubscriptionAccessible.ps1
          - pwsh/Catzc.Azure.Cli/Get-AzCliSubscriptionAccessState.ps1
          - pwsh/Catzc.Azure.Cli/Install-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliBicep.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliCanAccess.ps1
          - pwsh/Catzc.Azure.Cli/Test-AzCliSubscriptionAccessible.ps1
          - ADR-AZ-CLI-AZBYDEFAULT
      - cell: subject/Catzc.Base.Docs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
      - cell: subject/Catzc.Base.QualityGates
        by:
          - pwsh/Catzc.Base.QualityGates/configs/terminology.yml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
      - cell: subject/pipelines
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-AZ-CLI-ASSERTAZ
          - ADR-AZ-CLI-AZBYDEFAULT
          - ADR-AZ-CLI-NOAZMODULEIMPORT
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
    axis:
      - cell: DSGN/deploy
        by:
          - DDR-THINPLAT-DELEGATENOTREIMPLEMENT
          - DDR-THINPLAT-PLATFORMASCLI
          - DDR-THINPLAT-REPRESENTEDASCODE
          - DDR-THINPLAT-SWAPPABLESUBSTRATE
          - DDR-THINPLAT-THINPLATFORM
      - cell: CLOUD/deploy
        by:
