description:
  A file belongs to the track whose place is longest, so .github/workflows is pipelines and the rest of .github is vendor-settings.
about:
  adrs:
    - DDR-TRACKTYPE-LONGESTPLACEWINS
    - DDR-TRACK-TRACKISPLACEDCLUSTER
  lens: architecture
content:
  title: The longest place wins
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: PLACES }
    - { id: b1, label: WINNER }
  glyphs:
    - { id: g0, kind: file, label: ".github/workflows", in: b0 }
    - { id: g1, kind: file, label: ".github", in: b0 }
    - { id: g2, kind: gate, label: "Longest place containing the file wins", in: b1 }
    - { id: g3, kind: result, label: "pipelines track", in: b1 }
    - { id: g4, kind: result, label: "vendor-settings track", in: b1 }
  edges:
    - { from: g0, to: g2, kind: flow, label: "" }
    - { from: g1, to: g2, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
    - { from: g2, to: g4, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
    - { at: g4, number: 5 }
  legend: auto
