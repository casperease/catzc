      kind: adronly
      label: upstream integrator
      in: band-external
    - id: g-production
      kind: env
      label: production
      in: band-ladder
    - id: c-production
      kind: commit
      label: "4"
      in: g-production
      state: prod
    - id: g-pre-prod
      kind: env
      label: pre-prod
      in: band-ladder
    - id: c-pre-prod
      kind: commit
      label: P
      in: g-pre-prod
      state: prod
    - id: g-release-uat
      kind: env
      label: release-uat
      in: band-ladder
    - id: c-release-uat
      kind: commit
      label: "5"
      in: g-release-uat
      state: release-uat
    - id: g-main-uat
      kind: env
      label: main-UAT
      in: band-ladder
    - id: c-main-uat
      kind: commit
      label: "6"
      in: g-main-uat
      state: main-uat
    - id: c-dirty
      kind: commit
      label: "10"
      in: grp-dirty
      state: l3
  edges:
    - from: x-integrator
      to: g-main-uat
      kind: adr
      label: ""
    - from: g-main-uat
      to: g-release-uat
      kind: adr
      label: ""
    - from: g-release-uat
      to: g-pre-prod
      kind: adr
      label: ""
    - from: g-pre-prod
      to: g-production
      kind: adr
      label: ""
    - from: g-main-uat
      to: grp-dirty
      kind: fail
      label: ""
  markers:
    - at: x-integrator
      number: 1
    - at: g-main-uat
      number: 2
    - at: g-release-uat
      number: 3
    - at: g-pre-prod
      number: 4
    - at: g-production
      number: 5
    - at: grp-dirty
      number: 6
      corner: top-right
