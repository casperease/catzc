  kind: explanation
  flow: top-to-bottom
  relation: promotes to
  theme: dark
  bands:
    - id: band-external
      label: EXTERNAL
    - id: band-ladder
      label: PROMOTION LADDER
    - id: band-tip
      label: TIP OF MAIN
  groups:
    - id: grp-dirty
      label: dirty HEAD
      in: band-tip
  glyphs:
