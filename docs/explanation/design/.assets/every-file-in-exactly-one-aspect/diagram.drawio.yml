description:
  "Every file of a module folder goes to exactly one aspect by ordered first match: live first by a closed convention, tests as the
  remainder, and each aspect has its own sha lock."
about:
  adrs:
    - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
    - DDR-ASPECT-ASPECTSAREDERIVED
    - DDR-ASPECT-ASPECTISAGLOBSET
    - DDR-ASPECT-PARTITIONISCHECKED
  lens: meta
content:
  title: Every module file is in exactly one aspect
  kind: explanation
  flow: left-to-right
  relation: to a named set, first match
  theme: dark
  bands:
    - id: band-folder
      label: FOLDER
    - id: band-match
      label: FIRST MATCH
    - id: band-locks
      label: LOCKS
  glyphs:
    - id: c-folder
      kind: code
      label: Module folder
      in: band-folder
    - id: s-live
      kind: set
      label: live
      in: band-match
    - id: s-tests
      kind: set
      label: tests
      in: band-match
    - id: a-live-lock
      kind: adronly
      label: live lock
      in: band-locks
    - id: a-tests-lock
      kind: adronly
      label: tests lock
      in: band-locks
  edges:
    - from: c-folder
      to: s-live
      kind: thick
      label: ""
    - from: c-folder
      to: s-tests
      kind: thick
      label: ""
    - from: s-live
      to: a-live-lock
      kind: adr
      label: ""
    - from: s-tests
      to: a-tests-lock
      kind: adr
      label: ""
  markers:
    - at: c-folder
      number: 1
    - at: s-live
      number: 2
    - at: s-tests
      number: 3
    - at: a-live-lock
      number: 4
    - at: a-tests-lock
      number: 5
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-ASPECT-ASPECTISAGLOBSET
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
          - DDR-ASPECT-PARTITIONISCHECKED
      - cell: docs/-/.
        by:
          - docs/drs/design/dora-explains.md
          - docs/drs/design/module-aspects.md
          - docs/drs/index.md
          - docs/references/pwsh/.assets/protected-module-skip-by-hash/diagram.drawio.yml
          - docs/references/pwsh/catzc-base-globs/Get-ModuleGlobSet.ps1.md
          - docs/references/pwsh/catzc-base-globs/tests/types/Aspect.Tests.ps1.md
          - docs/references/pwsh/catzc-base-globs/types/Aspect.cs.md
          - docs/references/pwsh/catzc-base-modules/Get-Aspect.ps1.md
          - docs/references/pwsh/catzc-base-quality-gates/private/Get-ModuleProtectionIdentity.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantAspect.cs.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - DDR-ASPECT-ASPECTISAGLOBSET
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
          - DDR-ASPECT-PARTITIONISCHECKED
      - cell: pwsh/Catzc.Base.Docs/configs
