description: >-
  Who takes which commit: the upstream integrator takes the commit the main-UAT environment holds, each rung of the promotion ladder takes
  its commit from the rung before it, and the dirty head at the tip of main, which failed in main-UAT, is taken by nobody.
about:
  lens: architecture
  adrs:
    - ADR-DSGN-LIFE-ONECOMMITPERENVIRONMENT
    - ADR-DSGN-LIFE-SYNCFROMMAINUAT
    - ADR-DSGN-LIFE-DIRTYHEADUNSAFE
    - ADR-DSGN-LIFE-FAILEDSTAYSUPSTREAM
    - ADR-FLOW-CD-TWORELEASEGATES
    - ADR-FLOW-CD-PREPRODRUNG
  tracks: [docs]
  files:
    - docs/adr/design/commit-lifecycle.md
    - docs/adr/flow/cd-discipline-and-promotion-flow.md
content:
  title: Upstream integrators depend on the main-UAT occupant, never on the tip of main
  kind: explanation
  relation: takes its commit from
  flow: top-to-bottom
  bands:
    - { id: band-external, label: EXTERNAL }
    - { id: band-ladder, label: PROMOTION LADDER }
    - { id: band-tip, label: TIP OF MAIN }
  groups:
    - { id: grp-dirty, label: dirty HEAD, in: band-tip }
  glyphs:
    - { id: x-integrator, kind: adronly, label: upstream integrator, in: band-external }
    - { id: g-production, kind: env, label: production, in: band-ladder }
    - { id: c-production, kind: commit, label: "4", state: prod, in: g-production }
    - { id: g-pre-prod, kind: env, label: pre-prod, in: band-ladder }
    - { id: c-pre-prod, kind: commit, label: P, state: prod, in: g-pre-prod }
    - { id: g-release-uat, kind: env, label: release-uat, in: band-ladder }
    - { id: c-release-uat, kind: commit, label: "5", state: release-uat, in: g-release-uat }
    - { id: g-main-uat, kind: env, label: main-UAT, in: band-ladder }
    - { id: c-main-uat, kind: commit, label: "6", state: main-uat, in: g-main-uat }
    - { id: c-dirty, kind: commit, label: "10", state: l3, in: grp-dirty }
  edges:
    - { from: x-integrator, to: g-main-uat, kind: adr }
    - { from: g-production, to: g-pre-prod, kind: adr }
    - { from: g-pre-prod, to: g-release-uat, kind: adr }
    - { from: g-release-uat, to: g-main-uat, kind: adr }
    - { from: g-main-uat, to: grp-dirty, kind: fail }
  markers:
    - { at: x-integrator, number: 1 }
    - { at: g-production, number: 2 }
    - { at: g-pre-prod, number: 3 }
    - { at: g-release-uat, number: 4 }
    - { at: g-main-uat, number: 5 }
    - { at: grp-dirty, number: 6, corner: top-right }
  minimaps: [code-locations, grid, axis]
