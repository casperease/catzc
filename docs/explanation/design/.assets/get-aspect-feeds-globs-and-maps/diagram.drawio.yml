description:
  Get-Aspect returns a track's ordered aspects from the validated variants config; Globs compiles them into derived globsets and Maps only
  classifies a file as live or not.
about:
  adrs:
    - DDR-ASPECT-ASPECTSAREDERIVED
    - DDR-ASPECT-TRACKPICKSCATCHALL
    - DDR-ASPECT-ASPECTISAGLOBSET
  lens: implementation
content:
  title: Get-Aspect feeds Globs, which compiles the aspects into sets, and Maps, which only classifies live
  kind: explanation
  flow: left-to-right
  relation: feeds
  theme: dark
  bands:
    - id: band-config
      label: THE CONFIG
    - id: band-code
      label: PWSH
    - id: band-deployment
      label: INFRASTRUCTURE
  glyphs:
    - id: f-variants
      kind: file
      label: variants.yml
      in: band-config
    - id: c-variants-config
      kind: type
      label: VariantsConfig
      in: band-config
    - id: f-last-aspect
      kind: failure
      label: the last aspect must be '**'
      in: band-config
    - id: c-get-aspect
      kind: code
      label: Get-Aspect
      in: band-config
    - id: c-glob-set
      kind: code
      label: Get-ModuleGlobSet
      in: band-code
    - id: c-compile
      kind: type
      label: AspectPartition.Compile
      in: band-code
    - id: s-live
      kind: set
      label: catzc-base-globs-live
      in: band-code
    - id: s-tests
      kind: set
      label: catzc-base-globs-tests
      in: band-code
    - id: c-world-map
      kind: code
      label: Get-WorldMap
      in: band-deployment
    - id: c-is-live
      kind: type
      label: WorldMapBuilder.IsLive
      in: band-deployment
  edges:
    - from: f-variants
      to: c-variants-config
      kind: flow
      label: ""
    - from: c-variants-config
      to: f-last-aspect
      kind: fail
      label: ""
    - from: c-variants-config
      to: c-get-aspect
      kind: flow
      label: ""
    - from: c-get-aspect
      to: c-glob-set
      kind: flow
      label: ""
    - from: c-get-aspect
      to: c-world-map
      kind: flow
      label: ""
    - from: c-glob-set
      to: c-compile
      kind: flow
      label: ""
    - from: c-compile
      to: s-live
      kind: thick
      label: ""
    - from: c-compile
      to: s-tests
      kind: thick
      label: ""
    - from: c-world-map
      to: c-is-live
      kind: flow
      label: ""
  markers:
    - at: f-variants
      number: 1
    - at: c-variants-config
      number: 2
    - at: f-last-aspect
      number: 3
    - at: c-get-aspect
      number: 4
    - at: c-glob-set
      number: 5
    - at: c-compile
      number: 6
    - at: s-live
      number: 7
    - at: s-tests
      number: 8
    - at: c-world-map
      number: 9
    - at: c-is-live
      number: 10
  legend: auto
  minimaps:
    code-locations:
      - cell: docs/-/.
        by:
          - docs/drs/design/dora-explains.md
          - docs/drs/design/module-aspects.md
          - docs/drs/index.md
          - docs/references/pwsh/.assets/protected-module-skip-by-hash/diagram.drawio.yml
          - docs/references/pwsh/catzc-base-globs/Get-ModuleGlobSet.ps1.md
          - docs/references/pwsh/catzc-base-globs/tests/types/Aspect.Tests.ps1.md
          - docs/references/pwsh/catzc-base-globs/types/Aspect.cs.md
          - docs/references/pwsh/catzc-base-modules/Get-Aspect.ps1.md
          - docs/references/pwsh/catzc-base-quality-gates/private/Get-ModuleProtectionIdentity.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantAspect.cs.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - DDR-ASPECT-ASPECTISAGLOBSET
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-TRACKPICKSCATCHALL
