description:
  One key in globs.yml, pipeline:, binds a globset to the pipeline file that carries its trigger; the unit sets bind their own CD pipelines,
  which extend one shared customer template.
about:
  adrs:
    - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
    - DDR-TRACK-DEPLOYABLEUNIT
  lens: implementation
content:
  title: One field in globs.yml, pipeline:, binds a set to its pipeline file
  kind: explanation
  flow: left-to-right
  relation: names the next file by key
  theme: dark
  bands:
    - id: band-registry
      label: THE REGISTRY
    - id: band-pipelines
      label: PIPELINES
  glyphs:
    - id: f-registry
      kind: file
      label: globs.yml
      in: band-registry
    - id: s-automation
      kind: set
      label: "pwsh:"
      in: band-registry
    - id: s-infrastructure
      kind: set
      label: "infrastructure:"
      in: band-registry
    - id: s-units
      kind: set
      label: "nova: · apex: · flux: · shared:"
      in: band-registry
    - id: s-foundation
      kind: set
      label: foundation base unit
      in: band-registry
    - id: r-automation
      kind: runner
      label: ci-pwsh.yaml
      in: band-pipelines
    - id: r-infrastructure
      kind: runner
      label: ci-infrastructure.yaml
      in: band-pipelines
    - id: r-unit
      kind: runner
      label: cd-<unit>.yaml
      in: band-pipelines
    - id: r-extends
      kind: runner
      label: extends/cd-customer.yaml
      in: band-pipelines
  edges:
    - from: s-automation
      to: r-automation
      kind: flow
      label: ""
    - from: s-infrastructure
      to: r-infrastructure
      kind: flow
      label: ""
    - from: s-units
      to: r-unit
      kind: flow
      label: ""
    - from: s-foundation
      to: s-units
      kind: thick
      label: ""
    - from: r-unit
      to: r-extends
      kind: flow
      label: ""
  markers:
    - at: f-registry
      number: 1
    - at: s-automation
      number: 2
    - at: s-infrastructure
      number: 3
    - at: s-units
      number: 4
    - at: s-foundation
      number: 5
    - at: r-unit
      number: 6
    - at: r-extends
      number: 7
  chips:
    - at: r-extends
      kind: count
      text: 3/4
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: docs/-/.
        by:
          - docs/drs/design/dora-explains.md
          - docs/drs/design/tracks.md
          - docs/drs/glossary.md
          - docs/drs/index.md
          - docs/references/note-file-kind.md
          - docs/references/pwsh/catzc-base-globs/configs/globs.yml.md
          - docs/references/pwsh/catzc-base-maps/Get-TrackPlacementMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-variants/Get-Track.ps1.md
          - docs/references/pwsh/catzc-base-variants/Get-TrackPlace.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantTrack.cs.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.Docs/configs
