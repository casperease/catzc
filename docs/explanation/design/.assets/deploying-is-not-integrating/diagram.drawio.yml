      to: a-deploy
      kind: adr
      label: ""
    - from: a-deploy
      to: e-environment
      kind: adr
      label: ""
    - from: c-topic
      to: c-main
      kind: flow
      label: ""
    - from: c-main
      to: g-validation
      kind: flow
      label: ""
    - from: g-validation
      to: c-verified
      kind: flow
      label: ""
  markers:
    - at: c-topic
      number: 1
    - at: a-deploy
      number: 2
    - at: e-environment
      number: 3
    - at: c-main
      number: 4
    - at: g-validation
      number: 5
