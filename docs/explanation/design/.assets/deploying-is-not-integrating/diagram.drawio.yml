    - id: band-out-of-band
      label: OUT-OF-BAND
    - id: band-main
      label: MAIN
    - id: band-landing
      label: AFTER LANDING
  spans:
    - id: span-integration
      label: CI
      over:
        - band-main
        - band-landing
  glyphs:
    - id: c-topic
      kind: commit
      label: topic commit
      in: band-topic
