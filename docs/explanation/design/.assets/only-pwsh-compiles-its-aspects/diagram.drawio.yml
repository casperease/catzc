    - from: g-variants-yml
      to: g-variants
      kind: flow
      label: ""
    - from: g-variants
      to: g-globs
      kind: flow
      label: ""
    - from: g-variants
      to: g-maps
      kind: flow
      label: ""
    - from: g-globs
      to: grp-globsets
      kind: thick
      label: ""
    - from: g-maps
      to: r-world-map
      kind: flow
      label: ""
  markers:
    - at: g-variants-yml
      number: 1
    - at: g-variants
      number: 2
    - at: g-globs
      number: 3
    - at: g-live
      number: 4
    - at: g-tests
      number: 5
    - at: g-maps
      number: 6
    - at: r-world-map
      number: 7
