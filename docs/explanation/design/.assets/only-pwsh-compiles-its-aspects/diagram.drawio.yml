      label: two globsets per module
      in: band-pwsh
  glyphs:
    - id: g-variants-yml
      kind: file
      label: variants.yml
      in: band-declared
    - id: g-variants
      kind: code
      label: Catzc.Base.Variants
      in: band-declared
    - id: g-globs
      kind: code
      label: Catzc.Base.Globs
