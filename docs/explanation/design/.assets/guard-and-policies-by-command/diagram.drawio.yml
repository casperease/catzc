description:
  A person turns on the local guard by setting one variant and re-running the importer, which then skips the generated-file commit on main;
  an admin syncs the server's branch policies with one command and lists what the server holds.
about:
  adrs:
    - DDR-REMOTE-INTEGRATEFROMVERIFIED
    - DDR-REMOTE-PULLREQUESTISINGRESS
  lens: operations
content:
  title: A person turns on the local guard with one variant; an admin syncs the server policies with one command
  kind: explanation
  flow: top-to-bottom
  relation: then
  theme: dark
  bands:
    - id: band-clone
      label: ON A CLONE
    - id: band-admin
      label: ADMIN
  glyphs:
    - id: f-variants
      kind: file
      label: variants.yml
      in: band-clone
    - id: c-importer
      kind: code
      label: importer.ps1
      in: band-clone
    - id: c-sync
      kind: code
      label: Sync-GeneratedFile
      in: band-clone
    - id: f-skipped
      kind: failure
      label: Skipped on main
      in: band-clone
    - id: c-validations
      kind: code
      label: Sync-AdoBuildValidations
      in: band-admin
    - id: g-policy
      kind: gate
      label: ADO branch policy
      in: band-admin
    - id: c-list
      kind: code
      label: Get-AdoBuildValidations
      in: band-admin
  edges:
    - from: f-variants
      to: c-importer
      kind: flow
      label: ""
    - from: c-importer
      to: c-sync
      kind: flow
      label: ""
    - from: c-sync
      to: f-skipped
      kind: fail
      label: ""
    - from: c-validations
      to: g-policy
      kind: flow
      label: ""
    - from: g-policy
      to: c-list
      kind: flow
      label: ""
  markers:
    - at: f-variants
      number: 1
    - at: c-importer
      number: 2
    - at: c-sync
      number: 3
    - at: f-skipped
      number: 4
    - at: c-validations
      number: 5
    - at: g-policy
      number: 6
    - at: c-list
      number: 7
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
      - cell: docs/-/.
        by:
          - docs/adr/design/dora-explains.md
          - docs/adr/design/server-remote-integration.md
          - docs/adr/flow/.assets/sync-point/diagram.drawio.yml
          - docs/adr/index.md
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
      - cell: pwsh/Catzc.Base.Docs/configs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
    module-neighbourhood:
      - cell: subject/Catzc.Base.Docs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
      - cell: subject/pipelines
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
    axis:
      - cell: DSGN/build
        by:
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
      - cell: DSGN/quality-control
        by:
          - DDR-REMOTE-INTEGRATEFROMVERIFIED
          - DDR-REMOTE-PULLREQUESTISINGRESS
