description:
  A PowerShell module is a folder or one psm1 file, a Bicep module a template folder or file, and a holder module is the holder.
about:
  adrs:
    - DDR-MODTYPE-MODULEISPLACEDUNIT
    - DDR-TRACKTYPE-LONGESTPLACEWINS
  lens: architecture
content:
  title: A module is a named unit placed in a track
  kind: explanation
  flow: left-to-right
  relation: leads to
  theme: dark
  bands:
    - { id: b0, label: UNITS }
    - { id: b1, label: PLACED }
  glyphs:
    - { id: g0, kind: file, label: "PowerShell: a folder under pwsh/ or one psm1", in: b0 }
    - { id: g1, kind: file, label: "Bicep: a template folder or one bicep file", in: b0 }
    - { id: g2, kind: set, label: "Holder track: the holder itself", in: b0 }
    - { id: g3, kind: result, label: "A module placed in a track", in: b1 }
  edges:
    - { from: g0, to: g3, kind: flow, label: "" }
    - { from: g1, to: g3, kind: flow, label: "" }
    - { from: g2, to: g3, kind: flow, label: "" }
  markers:
    - { at: g0, number: 1 }
    - { at: g1, number: 2 }
    - { at: g2, number: 3 }
    - { at: g3, number: 4 }
  legend: auto
