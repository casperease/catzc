description:
  A pull request starts a build that skips every deploy stage and a hand-started release builds a package, while only completing the pull
  request into main starts the run that deploys; a topic deploy has no pipeline behind it.
about:
  adrs:
    - FDR-CD-LIFE-TOPICDEPLOYSOUTOFBAND
  lens: operations
content:
  title: Merging to main is what deploys; there is no run that deploys a topic
  kind: explanation
  flow: left-to-right
  relation: starts a run
  theme: dark
  bands:
    - id: band-topic
      label: TOPIC
    - id: band-out-of-band
      label: OUT-OF-BAND
    - id: band-main
      label: MAIN
    - id: band-after
      label: AFTER LANDING
  spans:
    - id: span-ci
      label: CI
      over:
        - band-out-of-band
    - id: span-cd
      label: CD
      over:
        - band-after
  glyphs:
    - id: g-push
      kind: commit
      label: push topic, open PR
      in: band-topic
      state: topic
    - id: g-pr-build
      kind: runner
      label: ADO PR build
      in: band-out-of-band
    - id: g-release
      kind: runner
      label: "Release: Run workflow"
      in: band-out-of-band
    - id: g-deploy-topic
      kind: adronly
      label: deploy topic
      in: band-out-of-band
    - id: g-complete
      kind: commit
      label: complete PR
      in: band-main
      state: landed
    - id: g-cd-run
      kind: runner
      label: ADO CD run
      in: band-after
    - id: g-environment
      kind: env
      label: <Customer>-<env>[-<slot>]
      in: band-after
  edges:
    - from: g-push
      to: g-pr-build
      kind: flow
      label: ""
    - from: g-push
      to: g-release
      kind: flow
      label: ""
    - from: g-push
      to: g-deploy-topic
      kind: adr
      label: ""
    - from: g-push
      to: g-complete
      kind: flow
      label: ""
    - from: g-complete
      to: g-cd-run
      kind: flow
      label: ""
    - from: g-cd-run
      to: g-environment
      kind: flow
      label: ""
  markers:
    - at: g-push
      number: 1
    - at: g-pr-build
      number: 2
    - at: g-release
      number: 3
    - at: g-deploy-topic
      number: 4
    - at: g-complete
      number: 5
    - at: g-cd-run
      number: 6
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - FDR-CD-LIFE-TOPICDEPLOYSOUTOFBAND
      - cell: docs/-/.
        by:
          - docs/drs/flow/commit-lifecycle.md
          - docs/drs/flow/dora-explains.md
          - docs/drs/index.md
          - docs/how-to/automation/apply-environment-approvals.md
          - docs/references/pwsh/catzc-azure-dev-ops/Sync-AdoEnvironmentApprovals.ps1.md
          - docs/references/pwsh/catzc-base-drs/types/DrsConfig.cs.md
          - docs/references/pwsh/catzc-base-maps/Get-LifecyclePositionMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-ValueChainHighlight.ps1.md
          - docs/references/pwsh/catzc-base-maps/Get-WorldMapHighlight.ps1.md
          - FDR-CD-LIFE-TOPICDEPLOYSOUTOFBAND
      - cell: pwsh/Catzc.Azure.DevOps/.
        by:
          - pwsh/Catzc.Azure.DevOps/Sync-AdoEnvironmentApprovals.ps1
          - FDR-CD-LIFE-TOPICDEPLOYSOUTOFBAND
      - cell: pwsh/Catzc.Base.Drs/configs
        by:
          - pwsh/Catzc.Base.Drs/configs/drs.yml
          - FDR-CD-LIFE-TOPICDEPLOYSOUTOFBAND
      - cell: pwsh/Catzc.Base.Drs/types
