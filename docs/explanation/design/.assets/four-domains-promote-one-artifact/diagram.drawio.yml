description: >-
  The ladder of commit states cut into its domains: GIT, then the pipeline kinds CI, CD, DEPLOY-Non-Prod and DEPLOY-Prod, each always-on
  environment holding one commit as its occupant, and the tagged artifact CI built once that every later domain promotes.
about:
  lens: architecture
  adrs:
    - ADR-DSGN-LIFE-ONECOMMITPERENVIRONMENT
    - ADR-DSGN-LIFE-SYNCFROMVERIFIEDHEAD
    - ADR-DSGN-LIFE-DIRTYHEADUNSAFE
    - ADR-DSGN-LIFE-FAILEDSTAYSUPSTREAM
  tracks: [docs]
  files:
    - docs/adr/design/commit-lifecycle.md
content:
  title: Four pipeline kinds promote one artifact that CI built once
  kind: explanation
  relation: promotes, or builds
  bands:
    - { id: band-git, label: GIT }
    - { id: band-ci, label: CI }
    - { id: band-cd, label: CD }
    - { id: band-non-prod, label: DEPLOY-NON-PROD }
    - { id: band-prod, label: DEPLOY-PROD }
  spans:
    - { id: span-ci, label: CI, over: band-ci }
    - { id: span-cd, label: CD, over: band-cd }
    - { id: span-deploy, label: DEPLOY, over: [band-non-prod, band-prod] }
  glyphs:
    - { id: c-topic, kind: commit, label: topic, state: topic, in: band-git }
    - { id: c-main, kind: commit, label: main, state: landed, in: band-git }
    - { id: g-engine, kind: runner, label: CI engine, in: band-ci }
    - { id: c-bvt, kind: commit, label: BVT, in: band-ci }
    - { id: g-on-demand, kind: env, label: on-demand env, in: band-cd }
    - { id: c-l3, kind: commit, label: L3, state: l3, in: g-on-demand }
    - { id: g-main-uat, kind: env, label: main-uat, in: band-non-prod }
    - { id: c-main-uat, kind: commit, label: M, state: main-uat, in: g-main-uat }
    - { id: g-release-uat, kind: env, label: release-uat, in: band-non-prod }
    - { id: c-release-uat, kind: commit, label: R, state: release-uat, in: g-release-uat }
    - { id: g-pre-prod, kind: env, label: pre-prod, in: band-prod }
    - { id: c-pre-prod, kind: commit, label: P, state: prod, in: g-pre-prod }
    - { id: g-production, kind: env, label: production, in: band-prod }
    - { id: c-production, kind: commit, label: P, state: prod, in: g-production }
    - { id: s-artifact, kind: store, label: tagged artifact, in: band-ci }
  edges:
    - { from: c-topic, to: c-main }
    - { from: c-main, to: g-engine }
    - { from: g-engine, to: c-bvt }
    - { from: c-bvt, to: g-on-demand }
    - { from: g-on-demand, to: g-main-uat }
    - { from: g-main-uat, to: g-release-uat }
    - { from: g-release-uat, to: g-pre-prod }
    - { from: g-pre-prod, to: g-production }
    - { from: g-engine, to: s-artifact }
  markers:
    - { at: band-git, number: 1, corner: top-right }
    - { at: g-engine, number: 2 }
    - { at: g-on-demand, number: 3 }
    - { at: g-main-uat, number: 4 }
    - { at: g-release-uat, number: 5 }
    - { at: band-prod, number: 6, corner: top-right }
    - { at: s-artifact, number: 7 }
  minimaps: [code-locations, grid, axis]
