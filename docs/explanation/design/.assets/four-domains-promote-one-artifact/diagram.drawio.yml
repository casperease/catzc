description:
  "The ladder of commit states cut into its domains: GIT, then the pipeline kinds CI, CD, DEPLOY-Non-Prod and DEPLOY-Prod, each always-on
  environment holding one commit as its occupant, and the tagged artifact CI built once that every later domain promotes."
about:
  adrs:
    - FDR-CD-LIFE-ONECOMMITPERENVIRONMENT
    - FDR-CD-LIFE-SYNCFROMVERIFIEDHEAD
    - FDR-CD-LIFE-DIRTYHEADUNSAFE
    - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
  lens: architecture
content:
  title: Four pipeline kinds promote one artifact that CI built once
  kind: explanation
  flow: left-to-right
  relation: promotes, or builds
  theme: dark
  bands:
    - id: band-git
      label: GIT
    - id: band-ci
      label: CI
    - id: band-cd
      label: CD
    - id: band-non-prod
      label: DEPLOY-NON-PROD
    - id: band-prod
      label: DEPLOY-PROD
  spans:
    - id: span-ci
      label: CI
      over:
        - band-ci
    - id: span-cd
      label: CD
      over:
        - band-cd
    - id: span-deploy
      label: DEPLOY
      over:
        - band-non-prod
        - band-prod
  glyphs:
    - id: c-topic
      kind: commit
      label: topic
      in: band-git
      state: topic
    - id: c-main
      kind: commit
      label: main
      in: band-git
      state: landed
    - id: g-engine
      kind: runner
      label: CI engine
      in: band-ci
    - id: c-bvt
      kind: commit
      label: BVT
      in: band-ci
    - id: g-on-demand
      kind: env
      label: on-demand env
      in: band-cd
    - id: c-l3
      kind: commit
      label: L3
      in: g-on-demand
      state: l3
    - id: g-main-uat
      kind: env
      label: main-uat
      in: band-non-prod
    - id: c-main-uat
      kind: commit
      label: M
      in: g-main-uat
      state: main-uat
    - id: g-release-uat
      kind: env
      label: release-uat
      in: band-non-prod
    - id: c-release-uat
      kind: commit
      label: R
      in: g-release-uat
      state: release-uat
    - id: g-pre-prod
      kind: env
      label: pre-prod
      in: band-prod
    - id: c-pre-prod
      kind: commit
      label: P
      in: g-pre-prod
      state: prod
    - id: g-production
      kind: env
      label: production
      in: band-prod
    - id: c-production
      kind: commit
      label: P
      in: g-production
      state: prod
    - id: s-artifact
      kind: store
      label: tagged artifact
      in: band-non-prod
  edges:
    - from: c-topic
      to: c-main
      kind: flow
      label: ""
    - from: c-main
      to: g-engine
      kind: flow
      label: ""
    - from: g-engine
      to: c-bvt
      kind: flow
      label: ""
    - from: c-bvt
      to: g-on-demand
      kind: flow
      label: ""
    - from: g-on-demand
      to: g-main-uat
      kind: flow
      label: ""
    - from: g-main-uat
      to: g-release-uat
      kind: flow
      label: ""
    - from: g-release-uat
      to: g-pre-prod
      kind: flow
      label: ""
    - from: g-pre-prod
      to: g-production
      kind: flow
      label: ""
    - from: g-engine
      to: s-artifact
      kind: flow
      label: ""
  markers:
    - at: band-git
      number: 1
      corner: top-right
    - at: g-engine
      number: 2
    - at: g-on-demand
      number: 3
    - at: g-main-uat
      number: 4
    - at: g-release-uat
      number: 5
    - at: band-prod
      number: 6
      corner: top-right
    - at: s-artifact
      number: 7
