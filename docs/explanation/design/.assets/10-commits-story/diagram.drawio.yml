    - gate-commit
    - gate-l3
    - gate-main-at
    - gate-release-at
    - gate-pre-prod
    - gate-production
  - id: span-cd
    label: CD
    over:
    - gate-precommit
    - gate-commit
    - gate-l3
    - gate-main-at
  - id: span-authoring
    label: Authoring
    over:
    - gate-precommit
  - id: span-pr-bvt
    label: PR+BVT
    over:
    - gate-commit
  - id: span-ci-plus
    label: CI+
    over:
    - gate-l3
  - id: span-rc
    label: RC
    over:
    - gate-main-at
  - id: span-rbc
    label: RBC
    over:
    - gate-release-at
  - id: span-deploy-prod
    label: DEPLOY-Prod
    over:
    - gate-pre-prod
    - gate-production
