description: 'Ten commits climb the promotion ladder at once: each stage gate passes some on and discards others, every environment
  holds one occupant, and git keeps the whole history, with the dirty heads called out.'
about:
  adrs:
  - FDR-CD-LIFE-ONESTATEADVANCESONERUNG
  - FDR-CD-LIFE-ONECOMMITPERENVIRONMENT
  - FDR-CD-LIFE-DISCARDISTERMINAL
  - FDR-CD-LIFE-DIRTYHEADUNSAFE
  - FDR-CD-LIFE-SYNCFROMVERIFIEDHEAD
  - FDR-CD-TWORELEASEGATES
  lens: architecture
content:
  title: Ten commits climb at once; each gate passes some on and discards others, and git keeps every one
  kind: explanation
  flow: top-to-bottom
  relation: advances to
  bands:
  - id: band-pipeline
    label: PIPELINE GATES
  - id: band-candidates
    label: CANDIDATES
  - id: band-discarded
    label: DISCARDED
  - id: band-envs
    label: ENVIRONMENTS
  - id: band-git
    label: GIT
  spans:
  - id: span-ci
    label: CI
    over:
    - gate-precommit
    - gate-commit
  - id: span-deploy-nonprod
    label: DEPLOY-Non Prod
    over:
    - gate-l3
    - gate-main-at
    - gate-release-at
  - id: span-cd-rbc
    label: CD+RBC
    over:
    - gate-precommit
    - gate-commit
    - gate-l3
    - gate-main-at
    - gate-release-at
  - id: span-cde
