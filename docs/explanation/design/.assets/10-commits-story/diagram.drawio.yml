      label: '9'
      state: discarded
      from: git-8
    - id: git-10
      step: 11
      label: '10'
      state: discarded
      from: git-7
    marks:
    - at: git-7
      text: REAL DIRTY HEAD, still unverified
    - at: git-10
      text: SYNC-HEAD DIRTY, verified dirty
