description:
  "A changed file fires only the pipelines whose globset holds it: pwsh and infrastructure changes reach their pipelines, and a drift gate
  fails a trigger that no longer matches its globset's projection."
about:
  adrs:
    - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
    - DDR-TRACK-DEPLOYABLEUNIT
  lens: operations
content:
  title: A push starts only the pipelines whose globset it touches
  kind: explanation
  flow: left-to-right
  relation: a change here fires the next
  theme: dark
  bands:
    - id: band-change
      label: YOU CHANGE
    - id: band-units
      label: DEPLOYABLE-UNITS
    - id: band-pipelines
      label: PIPELINES
    - id: band-drift
      label: TRIGGER DRIFT
  glyphs:
    - id: s-powershell
      kind: set
      label: pwsh/**
      in: band-change
    - id: s-infrastructure
      kind: set
      label: infrastructure/**
      in: band-change
    - id: s-units
      kind: set
      label: nova · apex · flux · shared
      in: band-units
    - id: r-automation
      kind: runner
      label: ci-pwsh
      in: band-pipelines
    - id: r-infrastructure
      kind: runner
      label: ci-infrastructure
      in: band-pipelines
    - id: r-unit
      kind: runner
      label: cd-<unit>
      in: band-pipelines
    - id: g-drift
      kind: gate
      label: Test-AdoPipelineTriggerGlob
      in: band-drift
    - id: f-drifted
      kind: failure
      label: trigger drifted
      in: band-drift
  edges:
    - from: s-powershell
      to: r-automation
      kind: flow
      label: ""
    - from: s-infrastructure
      to: r-infrastructure
      kind: flow
      label: ""
    - from: s-infrastructure
      to: s-units
      kind: thick
      label: ""
    - from: s-units
      to: r-unit
      kind: flow
      label: ""
    - from: g-drift
      to: f-drifted
      kind: fail
      label: ""
  markers:
    - at: s-powershell
      number: 1
    - at: r-automation
      number: 2
    - at: r-infrastructure
      number: 3
    - at: s-units
      number: 4
    - at: r-unit
      number: 5
    - at: g-drift
      number: 6
    - at: f-drifted
      number: 7
  legend: auto
  minimaps:
    code-locations:
      - cell: ado-pipelines/pipelines/.
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: docs/-/.
        by:
          - docs/drs/design/dora-explains.md
          - docs/drs/design/tracks.md
          - docs/drs/glossary.md
          - docs/drs/index.md
          - docs/references/note-file-kind.md
          - docs/references/pwsh/catzc-base-globs/configs/globs.yml.md
          - docs/references/pwsh/catzc-base-maps/Get-TrackPlacementMinimapData.ps1.md
          - docs/references/pwsh/catzc-base-variants/Get-Track.ps1.md
          - docs/references/pwsh/catzc-base-variants/Get-TrackPlace.ps1.md
          - docs/references/pwsh/catzc-base-variants/configs/variants.yml.md
          - docs/references/pwsh/catzc-base-variants/types/VariantTrack.cs.md
          - docs/references/pwsh/catzc-base-variants/types/VariantsConfig.cs.md
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.Docs/configs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.Globs/configs
        by:
          - pwsh/Catzc.Base.Globs/configs/globs.yml
          - DDR-TRACK-DEPLOYABLEUNIT
      - cell: pwsh/Catzc.Base.Globs/tests/types
        by:
          - pwsh/Catzc.Base.Globs/tests/types/GlobsConfig.Tests.ps1
          - DDR-TRACK-DEPLOYABLEUNIT
      - cell: pwsh/Catzc.Base.Maps/.
        by:
          - pwsh/Catzc.Base.Maps/Get-TrackPlacementMinimapData.ps1
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.ModuleSystem/configs
        by:
          - pwsh/Catzc.Base.ModuleSystem/configs/glossary.yml
          - DDR-TRACK-DEPLOYABLEUNIT
      - cell: pwsh/Catzc.Base.Variants/.
        by:
          - pwsh/Catzc.Base.Variants/Get-Track.ps1
          - pwsh/Catzc.Base.Variants/Get-TrackPlace.ps1
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.Variants/configs
        by:
          - pwsh/Catzc.Base.Variants/configs/variants.yml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: pwsh/Catzc.Base.Variants/types
        by:
          - pwsh/Catzc.Base.Variants/types/VariantTrack.cs
          - pwsh/Catzc.Base.Variants/types/VariantsConfig.cs
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
    module-neighbourhood:
      - cell: subject/Catzc.Base.Docs
        by:
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: subject/Catzc.Base.Globs
        by:
          - pwsh/Catzc.Base.Globs/configs/globs.yml
          - pwsh/Catzc.Base.Globs/tests/types/GlobsConfig.Tests.ps1
          - DDR-TRACK-DEPLOYABLEUNIT
      - cell: subject/Catzc.Base.Maps
        by:
          - pwsh/Catzc.Base.Maps/Get-TrackPlacementMinimapData.ps1
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: subject/Catzc.Base.ModuleSystem
        by:
          - pwsh/Catzc.Base.ModuleSystem/configs/glossary.yml
          - DDR-TRACK-DEPLOYABLEUNIT
      - cell: subject/Catzc.Base.Variants
        by:
          - pwsh/Catzc.Base.Variants/Get-Track.ps1
          - pwsh/Catzc.Base.Variants/Get-TrackPlace.ps1
          - pwsh/Catzc.Base.Variants/configs/variants.yml
          - pwsh/Catzc.Base.Variants/types/VariantTrack.cs
          - pwsh/Catzc.Base.Variants/types/VariantsConfig.cs
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
      - cell: subject/pipelines
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
    axis:
      - cell: DSGN/*
        by:
          - DDR-TRACK-DEPLOYABLEUNIT
          - DDR-TRACK-SUBSCRIBABLENOTPATHCOUPLED
