      in: band-after
    - id: g-run-mode
      kind: code
      label: Get-CatzcRunMode
      in: band-after
    - id: g-build-kinds
      kind: adronly
      label: Three build kinds
      in: band-after
  edges:
    - from: g-test-automation
      to: g-importer
      kind: flow
      label: ""
    - from: g-test-build
      to: g-import-catzc
      kind: flow
      label: ""
    - from: g-importer
      to: g-exclusive
      kind: flow
      label: ""
    - from: g-import-catzc
      to: g-exclusive
      kind: flow
      label: ""
    - from: g-source-tree
      to: g-run-mode
      kind: flow
      label: ""
