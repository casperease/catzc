  kind: explanation
  flow: top-to-bottom
  relation: a commit moves to
  theme: dark
  bands:
    - id: band-in
      label: IN
    - id: band-request
      label: PULL REQUEST
    - id: band-remote
      label: SERVER REMOTE
    - id: band-out
      label: OUT
  glyphs:
    - id: s-clone
      kind: store
      label: local clone
      in: band-in
    - id: g-identity
      kind: adronly
      label: identity model
      in: band-request
    - id: g-policy
      kind: gate
      label: branch policy
      in: band-request
    - id: c-head
      kind: commit
      label: HEAD
      in: band-remote
      state: landed
    - id: c-verified
      kind: commit
      label: verified point
      in: band-remote
    - id: s-consumers
      kind: store
      label: consumer clones
      in: band-out
  edges:
    - from: s-clone
      to: g-identity
      kind: adr
      label: ""
    - from: g-identity
      to: g-policy
      kind: adr
      label: ""
    - from: g-policy
      to: c-head
      kind: flow
      label: ""
    - from: c-verified
      to: s-consumers
      kind: adr
      label: ""
  markers:
    - at: s-clone
      number: 1
    - at: g-identity
      number: 2
    - at: g-policy
      number: 3
    - at: c-head
      number: 4
    - at: c-verified
      number: 5
    - at: s-consumers
      number: 6
