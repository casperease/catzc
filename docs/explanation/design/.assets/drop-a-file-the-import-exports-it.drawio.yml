          - pwsh/Catzc.Base.Variants/types/VariantAspect.cs
          - pwsh/Catzc.Base.Variants/types/VariantsConfig.cs
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
    axis:
      - cell: DSGN/build
        by:
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
