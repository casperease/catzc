          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
      - cell: pwsh/Catzc.Base.Globs/tests/types
        by:
          - pwsh/Catzc.Base.Globs/tests/types/Aspect.Tests.ps1
          - DDR-ASPECT-ASPECTSAREDERIVED
          - DDR-ASPECT-MODULESPARTITIONINTOASPECTS
      - cell: pwsh/Catzc.Base.Globs/types
