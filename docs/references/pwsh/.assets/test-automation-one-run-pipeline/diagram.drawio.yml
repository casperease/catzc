description:
  "Both kinds of test run share one harness: it discovers the tests once, checks their tags before any run directory exists, splits the
  files into three phases, drops protected modules, runs the workers and derives one verdict; a finally stamps run.json."
about:
  adrs:
    - ADR-AUTO-TEST
    - ADR-REPO-PROTGLOB
  lens: source
content:
  title: One discovery feeds three phases; finally stamps run.json
  kind: reference
  flow: top-to-bottom
  relation: runs next (code order)
  theme: dark
  bands:
    - id: band-entry
      label: ENTRY
    - id: band-before
      label: BEFORE TRY
    - id: band-try
      label: TRY
    - id: band-finally
      label: FINALLY
  glyphs:
    - id: g-automation
      kind: code
      label: Test-Automation
      in: band-entry
    - id: g-build
      kind: code
      label: Test-CatzcBuild
      in: band-entry
    - id: g-run
      kind: private
      label: Invoke-TestRun
      in: band-before
    - id: g-discovery
      kind: private
      label: Get-TestDiscovery
      in: band-before
    - id: g-tag-gate
      kind: gate
      label: Assert-TestTagGate
      in: band-before
    - id: g-split
      kind: private
      label: Split-TestAutomationFiles
      in: band-try
    - id: s-parallel
      kind: set
      label: Parallel
      in: band-try
    - id: s-greedy
      kind: set
      label: Greedy
      in: band-try
    - id: s-serial
      kind: set
      label: Serial
      in: band-try
    - id: g-select
      kind: private
      label: Select-ProtectedTestFile
      in: band-try
    - id: g-workers
      kind: private
      label: Invoke-TestAutomationWorkers
      in: band-try
    - id: g-verdict
      kind: private
      label: Get-TestAutomationVerdict
      in: band-try
    - id: f-run-json
      kind: file
      label: run.json
      in: band-finally
  edges:
    - from: g-automation
      to: g-run
      kind: flow
      label: ""
    - from: g-build
      to: g-run
      kind: flow
      label: ""
    - from: g-run
      to: g-discovery
      kind: flow
      label: ""
    - from: g-discovery
      to: g-tag-gate
      kind: flow
      label: ""
    - from: g-tag-gate
      to: g-split
      kind: flow
      label: ""
    - from: g-split
      to: g-select
      kind: flow
      label: ""
    - from: g-select
      to: g-workers
      kind: flow
      label: ""
    - from: g-workers
      to: g-verdict
      kind: flow
      label: ""
  markers:
    - at: g-run
      number: 1
    - at: g-discovery
      number: 2
    - at: g-tag-gate
      number: 3
    - at: g-split
      number: 4
    - at: g-select
      number: 5
    - at: g-workers
      number: 6
    - at: g-verdict
      number: 7
    - at: f-run-json
      number: 8
  chips:
    - at: g-discovery
      kind: count
      text: "4"
  legend: auto
  minimaps:
    code-locations:
      - cell: .claude/.claude/.
        by:
          - .claude/CLAUDE.md
          - ADR-AUTO-TEST
      - cell: .claude/.claude/agents
