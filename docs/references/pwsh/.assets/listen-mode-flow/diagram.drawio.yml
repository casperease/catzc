description:
  "The listen mode: each writer leaves its trace in a ledger, the listener notes every settled change with who wrote it, and the processor
  plans from the editor's notes alone."
about:
  adrs:
    - ADR-REPO-AI-EDITORISFACT
    - ADR-AUTO-FAILFAST-BOUNDEVERYWAIT
  lens: meta
content:
  title: Every writer leaves a trace; the listener notes all changes, and the processor plans from the editor's alone
  kind: explanation
  flow: left-to-right
  relation: what comes next
  theme: dark
  bands:
    - id: band-writers
      label: WRITERS
    - id: band-ledgers
      label: LEDGERS
    - id: band-listener
      label: LISTENER
    - id: band-processor
      label: PROCESSOR
  glyphs:
    - id: a-editor
      kind: actor
      label: the editor (VS Code)
      in: band-writers
    - id: a-agents
      kind: actor
      label: agent sessions
      in: band-writers
    - id: s-saves
      kind: store
      label: editor-saves.jsonl
      in: band-ledgers
    - id: s-writes
      kind: store
      label: agent-writes.jsonl
      in: band-ledgers
    - id: r-listener
      kind: runner
      label: Start-DocListener
      in: band-listener
    - id: f-notes
      kind: file
      label: notes, tagged by source
      in: band-listener
    - id: g-editor-only
      kind: gate
      label: editor notes only
      in: band-processor
    - id: r-processor
      kind: runner
      label: the processor
      in: band-processor
    - id: r-plans
      kind: result
      label: plan-listen-*.md
      in: band-processor
  edges:
    - from: a-editor
      to: s-saves
      kind: flow
      label: save
    - from: a-agents
      to: s-writes
      kind: flow
      label: write
    - from: s-saves
      to: r-listener
      kind: flow
      label: ""
    - from: s-writes
      to: r-listener
      kind: flow
      label: ""
    - from: r-listener
      to: f-notes
      kind: flow
      label: ""
    - from: f-notes
      to: g-editor-only
      kind: flow
      label: ""
    - from: g-editor-only
      to: r-processor
      kind: flow
      label: ""
    - from: r-processor
      to: r-plans
      kind: thick
      label: plans
