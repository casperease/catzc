    - ADR-PWSH-DRYRUN-SUPPRESSSHOULDPROCESS
    - ADR-PWSH-PREPOST
  tracks: [pwsh]
  languages: [powershell, csharp]
  modules: [Catzc.Azure.Templates, Catzc.Azure.Cli]
