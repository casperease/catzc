description: >-
  tools.yml is the one locked list of tools; three readers take its typed map, and the devbox install walks the keys in dependency order and
  dispatches each to the install function whose name it derives, throwing when none exists.
about:
  lens: source
  adrs: [ADR-AUTO-DEPS-INSTALLORDERINCONFIG, ADR-AUTO-PKGMGR, ADR-AUTO-ENGINE, ADR-AUTO-BASH-SHELLSCRIPTSCHECKED]
  tracks: [pwsh]
  languages: [powershell, csharp]
  modules: [Catzc.Base.Execution, Catzc.Tooling.Core, Catzc.Tooling.Provisioning]
  files:
    - pwsh/Catzc.Base.Execution/configs/tools.yml
    - pwsh/Catzc.Base.Execution/types/ToolsConfig.cs
    - pwsh/Catzc.Tooling.Provisioning/Get-ToolsStatus.ps1
    - pwsh/Catzc.Tooling.Provisioning/types/ToolStatus.cs
    - pwsh/Catzc.Tooling.Core/Get-ToolInstallOrder.ps1
    - pwsh/Catzc.Tooling.Core/Get-ToolConfig.ps1
    - pwsh/Catzc.Tooling.Core/Get-ToolCommandSuffix.ps1
    - pwsh/Catzc.Tooling.Provisioning/Install-DevBoxTools.ps1
content:
  title: tools.yml is the one locked list; dispatch is by key name
  kind: reference
  relation: feeds (data moves)
  bands:
    - { id: band-config, label: CONFIG }
    - { id: band-read, label: READ }
    - { id: band-dispatch, label: DISPATCH }
  groups:
    - { id: grp-execution, label: Catzc.Base.Execution, in: band-config }
    - { id: grp-core, label: Catzc.Tooling.Core, in: band-read }
  glyphs:
    - { id: f-tools-yml, kind: file, label: tools.yml, in: grp-execution }
    - { id: t-config, kind: type, label: ToolsConfig, in: grp-execution }
    - { id: g-status, kind: code, label: Get-ToolsStatus, in: band-read }
    - { id: t-status, kind: type, label: ToolStatus, in: band-read }
    - { id: g-order, kind: code, label: Get-ToolInstallOrder, in: grp-core }
    - { id: g-tool-config, kind: code, label: Get-ToolConfig, in: grp-core }
    - { id: g-suffix, kind: code, label: Get-ToolCommandSuffix, in: grp-core }
    - { id: g-install, kind: code, label: Install-DevBoxTools, in: band-dispatch }
    - { id: s-installers, kind: set, label: "Install-<Suffix>", in: band-dispatch }
    - { id: f-missing, kind: failure, label: No Install function found, in: band-dispatch }
  edges:
    - { from: f-tools-yml, to: t-config }
    - { from: t-config, to: g-status }
    - { from: t-config, to: g-order }
    - { from: t-config, to: g-tool-config }
    - { from: t-config, to: g-suffix }
    - { from: g-status, to: t-status }
    - { from: t-status, to: g-install }
    - { from: g-order, to: g-install }
    - { from: g-tool-config, to: g-install }
    - { from: g-suffix, to: g-install }
    - { from: g-install, to: s-installers }
    - { from: g-install, to: f-missing, kind: fail }
  markers:
    - { at: f-tools-yml, number: 1 }
    - { at: t-config, number: 2 }
    - { at: g-status, number: 3 }
    - { at: g-order, number: 4 }
    - { at: g-tool-config, number: 5 }
    - { at: g-suffix, number: 6 }
    - { at: g-install, number: 7 }
    - { at: s-installers, number: 8 }
    - { at: f-missing, number: 9 }
  chips:
    - { at: s-installers, kind: count, text: "16" }
  minimaps: [code-locations, module-neighbourhood, axis]
layout:
  band-config: { x: 20, y: 84, w: 310, h: 344 }
  band-read: { x: 350, y: 84, w: 490, h: 344 }
  band-dispatch: { x: 860, y: 84, w: 420, h: 344 }
  grp-execution: { x: 40, y: 116, w: 270, h: 240 }
  f-tools-yml: { x: 105, y: 158, w: 140, h: 52 }
  t-config: { x: 100, y: 282, w: 150, h: 40 }
  g-status: { x: 440, y: 130, w: 150, h: 40 }
  t-status: { x: 640, y: 130, w: 130, h: 40 }
  grp-core: { x: 405, y: 190, w: 245, h: 210 }
  g-order: { x: 440, y: 232, w: 190, h: 40 }
  g-tool-config: { x: 440, y: 292, w: 190, h: 40 }
  g-suffix: { x: 440, y: 352, w: 190, h: 40 }
  g-install: { x: 880, y: 236, w: 170, h: 40 }
