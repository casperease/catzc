description: 'Every Invoke-Tool wrapper asserts the locked version before it runs the tool: Assert-Tool either probes for
  the executable or checks the command and reads its version, and Test-Tool shares the same pieces as a boolean.'
about:
  adrs:
  - ADR-AUTO-DRYRUN-BRANCHBEFORESIDEEFFECT
  - ADR-PWSH-CACHE-STRICTSAFEPROBE
  - ADR-CONF-LOADING-READINGISGLOBAL
  lens: source
