description:
  "Every Invoke-Tool wrapper asserts the locked version before it runs the tool: Assert-Tool either probes for the executable or checks the
  command and reads its version, and Test-Tool shares the same pieces as a boolean."
about:
  adrs:
    - ADR-AUTO-DRYRUN-BRANCHBEFORESIDEEFFECT
    - ADR-PWSH-CACHE-STRICTSAFEPROBE
    - ADR-CONF-LOADING-READINGISGLOBAL
  lens: source
content:
  title: Each tool wrapper asserts the locked version before it runs
  kind: reference
  flow: left-to-right
  relation: calls
  theme: dark
  bands:
    - id: band-entry
      label: ENTRY
    - id: band-core
      label: TOOLING CORE
    - id: band-execution
      label: CATZC.BASE.EXECUTION
  glyphs:
    - id: g-wrappers
      kind: set
      label: Invoke-<Tool>
      in: band-entry
    - id: g-assert-tool
      kind: code
      label: Assert-Tool
      in: band-core
    - id: g-assert-version
      kind: private
      label: Assert-ToolVersion
      in: band-core
    - id: g-get-version
      kind: code
      label: Get-ToolVersion
      in: band-core
    - id: g-test-tool
      kind: code
      label: Test-Tool
      in: band-core
    - id: g-resolve
      kind: private
      label: Resolve-ToolExecutable
      in: band-execution
    - id: f-tools-yml
      kind: file
      label: tools.yml
      in: band-execution
    - id: g-invoke
      kind: code
      label: Invoke-Executable
      in: band-execution
  edges:
    - from: g-wrappers
      to: g-assert-tool
      kind: flow
      label: ""
    - from: g-wrappers
      to: g-invoke
      kind: flow
      label: ""
    - from: g-assert-tool
      to: g-assert-version
      kind: flow
      label: ""
    - from: g-assert-tool
      to: g-resolve
      kind: flow
      label: ""
    - from: g-assert-version
      to: g-get-version
      kind: flow
      label: ""
    - from: g-get-version
      to: g-invoke
      kind: flow
      label: ""
    - from: g-test-tool
      to: g-get-version
      kind: flow
      label: ""
    - from: g-test-tool
      to: g-resolve
      kind: flow
      label: ""
  markers:
    - at: g-wrappers
      number: 1
    - at: g-assert-tool
      number: 2
    - at: g-resolve
      number: 3
    - at: g-assert-version
      number: 4
    - at: g-get-version
      number: 5
    - at: f-tools-yml
      number: 6
    - at: g-invoke
      number: 7
    - at: g-test-tool
      number: 8
  chips:
    - at: g-wrappers
      kind: count
      text: "10"
