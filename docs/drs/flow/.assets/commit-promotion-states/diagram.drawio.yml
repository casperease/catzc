description:
  "The promotion ladder of a commit, left to right and never backward: each rung a state in the locked commit palette, the superseded ghost
  above every rung a newer commit rolled over, and the three terminal endings below, discarded at a named gate or retired once a successor
  took over production."
about:
  adrs:
    - FDR-CD-LIFE-ONESTATEADVANCESONERUNG
    - FDR-CD-LIFE-DISCARDISTERMINAL
    - FDR-CD-LIFE-RETIREMENTISNOTDISCARD
    - FDR-CD-LIFE-SUPERSESSIONABANDONSOVERTAKEN
    - FDR-CD-LIFE-FAILEDSTAYSUPSTREAM
    - DDR-VISUAL-DISTINCTENDINGS
  lens: architecture
content:
  title: A commit only climbs; it ends discarded, retired or superseded, and a new attempt is a new commit
  kind: reference
  flow: left-to-right
  relation: advances one rung
  theme: dark
  bands:
    - id: band-superseded
      label: SUPERSEDED
    - id: band-ladder
      label: PROMOTION LADDER
    - id: band-endings
      label: DISCARDED AND RETIRED
  glyphs:
    - id: ghost-landed
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      state: landed
      ghost: true
    - id: ghost-bvt
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      ghost: true
    - id: ghost-l3
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      state: l3
      ghost: true
    - id: ghost-main-uat
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      state: main-uat
      ghost: true
    - id: ghost-release-uat
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      state: release-uat
      ghost: true
    - id: ghost-pre-prod
      kind: commit
      label: superseded
      in: band-superseded
      shape: box
      state: prod
      ghost: true
    - id: rung-topic
      kind: commit
      label: "topic

        off-main"
      in: band-ladder
      shape: box
      state: topic
    - id: rung-landed
      kind: commit
      label: landed on main
      in: band-ladder
      shape: box
      state: landed
    - id: rung-bvt
      kind: commit
      label: BVT-verified
      in: band-ladder
      shape: box
    - id: rung-l3
      kind: commit
      label: L3-verified
      in: band-ladder
      shape: box
      state: l3
    - id: rung-main-uat
      kind: commit
      label: "main-UAT

        main-AT (RC)"
      in: band-ladder
      shape: box
      state: main-uat
    - id: rung-release-uat
      kind: commit
      label: "release-uat

        release-AT (RBC)"
      in: band-ladder
      shape: box
      state: release-uat
    - id: rung-pre-prod
      kind: commit
      label: "pre-prod

        staged, not live"
      in: band-ladder
      shape: box
      state: prod
    - id: rung-production
      kind: commit
      label: production
      in: band-ladder
      shape: box
      state: prod
    - id: discard-bvt
      kind: commit
      label: discarded at BVT
      in: band-endings
      shape: box
      state: discarded
    - id: discard-l3
      kind: commit
      label: discarded at L3
      in: band-endings
      shape: box
      state: discarded
    - id: discard-main-uat
      kind: commit
      label: discarded at main-UAT
      in: band-endings
      shape: box
      state: discarded
    - id: discard-release-uat
      kind: commit
      label: discarded at release-uat
      in: band-endings
      shape: box
      state: discarded
    - id: retired
      kind: commit
      label: "retired

        successor took over"
      in: band-endings
      shape: box
      state: prod
  edges:
    - from: rung-topic
      to: rung-landed
      kind: flow
      label: ""
    - from: rung-landed
      to: rung-bvt
      kind: flow
      label: ""
    - from: rung-bvt
      to: rung-l3
      kind: flow
      label: ""
    - from: rung-l3
      to: rung-main-uat
      kind: flow
      label: ""
    - from: rung-main-uat
      to: rung-release-uat
      kind: flow
      label: ""
    - from: rung-release-uat
      to: rung-pre-prod
      kind: flow
      label: ""
    - from: rung-pre-prod
      to: rung-production
      kind: flow
      label: ""
    - from: rung-landed
      to: ghost-landed
      kind: adr
      label: ""
    - from: rung-bvt
      to: ghost-bvt
      kind: adr
      label: ""
    - from: rung-l3
      to: ghost-l3
      kind: adr
      label: ""
    - from: rung-main-uat
      to: ghost-main-uat
      kind: adr
      label: ""
    - from: rung-release-uat
      to: ghost-release-uat
      kind: adr
      label: ""
    - from: rung-pre-prod
      to: ghost-pre-prod
      kind: adr
      label: ""
    - from: rung-bvt
      to: discard-bvt
      kind: fail
      label: auto-rejected
    - from: rung-l3
      to: discard-l3
      kind: fail
      label: auto-rejected
    - from: rung-main-uat
      to: discard-main-uat
      kind: fail
      label: fails there
    - from: rung-release-uat
      to: discard-release-uat
      kind: fail
      label: manual reject at RBC
    - from: rung-production
      to: retired
      kind: flow
      label: decommissioned
