description:
  "BCL as two things: the language, whose type sources reference only the Base Class Library and whose projects build the one pair BclConfig
  defaults; and its use inside pwsh, which compiles the types in the session's own runtime, unwraps the values its callers pass, and lets a
  type bind to the host only by a bcl.yml row that the gate checks."
about:
  adrs: [ADR-BCL-TYPES-REFERENCESET, ADR-BCL-TYPES-DEBUGANYCPU, ADR-PWSH-TYPES-HOSTGUARANTEEDASSEMBLIES, ADR-PWSH-TYPES-ADDTYPECOMPILES]
  lens: architecture
content:
  title: BCL is a language; pwsh hosts it, and binds only by row
  kind: reference
  flow: left-to-right
  theme: dark
  bands:
    - { id: band-language, label: THE BCL LANGUAGE }
    - { id: band-host, label: ITS USE INSIDE THE PWSH HOST }
  glyphs:
    - id: g-types
      kind: file
      label: "types/*.cs

        334 sources"
      in: band-language
    - { id: g-library, kind: set, label: Base Class Library, in: band-language }
    - id: g-bcl-yml
      kind: file
      label: "bcl.yml

        8 host rows"
      in: band-language
    - id: g-projects
      kind: file
      label: "catzc.sln + .csproj

        Debug | Any CPU"
      in: band-language
    - id: g-import
      kind: code
      label: "Import-CSharpTypes

        Add-Type, in-process"
      in: band-host
    - { id: g-unwrap, kind: code, label: ConvertTo-BclValue, in: band-host }
    - id: g-sma
      kind: set
      label: "System.Management

        .Automation"
      in: band-host
    - { id: g-gate, kind: gate, label: Test-BclReferences, in: band-host }
  edges:
    - { from: g-types, to: g-library, kind: flow, label: references }
    - { from: g-import, to: g-types, kind: flow }
    - { from: g-types, to: g-sma, kind: flow, label: only by a row }
    - { from: g-bcl-yml, to: g-gate, kind: flow, label: rows }
    - { from: g-gate, to: g-sma, kind: flow, label: checks }
  legend: auto
  minimaps: [track-placement, engine-strip, module-neighbourhood]
layout:
  band-language: { x: 20, y: 84, w: 1260, h: 150 }
  band-host: { x: 20, y: 284, w: 1260, h: 170 }
  g-types: { x: 40, y: 134, w: 560, h: 60 }
  g-library: { x: 700, y: 134, w: 160, h: 60 }
  g-bcl-yml: { x: 900, y: 134, w: 150, h: 60 }
  g-projects: { x: 1140, y: 134, w: 130, h: 60 }
  g-import: { x: 40, y: 344, w: 200, h: 60 }
  g-unwrap: { x: 260, y: 344, w: 200, h: 60 }
  g-sma: { x: 480, y: 344, w: 200, h: 60 }
  g-gate: { x: 900, y: 330, w: 150, h: 90 }
