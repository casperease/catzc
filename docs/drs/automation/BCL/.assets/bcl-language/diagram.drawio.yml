          - docs/drs/automation/BCL/.assets/bcl-language/diagram.drawio.yml
          - docs/drs/automation/BCL/dora-explains.md
          - docs/drs/automation/BCL/native-csharp-types.md
          - docs/drs/automation/pwsh/dora-explains.md
          - docs/drs/automation/pwsh/hosting-csharp-types.md
          - docs/drs/index.md
          - docs/references/pwsh/.assets/bicep-template-is-a-folder/diagram.drawio.yml
          - docs/references/pwsh/catzc-base-contracts/types/ContractSchema.cs.md
          - docs/references/pwsh/catzc-base-docs/types/AdrRuleSet.cs.md
          - docs/references/pwsh/catzc-base-languages/types/BclConfig.cs.md
