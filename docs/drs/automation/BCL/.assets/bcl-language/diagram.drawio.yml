          - .claude/plans/value-of-plan.md
          - ADR-BCL-TYPES-BCLREFERENCESET
          - ADR-BCL-TYPES-DEBUGANYCPU
          - ADR-PWSH-TYPES-ADDTYPECOMPILES
          - ADR-PWSH-TYPES-HOSTGUARANTEEDASSEMBLIES
    engine-strip:
