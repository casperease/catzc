description:
  "BCL as two things: the language, whose type sources reference only the Base Class Library and whose projects build the one pair bcl.yml
  declares; and its use inside pwsh, which compiles the types in the session's own runtime, unwraps the values its callers pass, and lets a
  type bind to the host only by a bcl.yml row that the gate checks."
about:
  adrs:
    - ADR-BCL-TYPES-BCLREFERENCESET
    - ADR-BCL-TYPES-DEBUGANYCPU
    - ADR-PWSH-TYPES-HOSTGUARANTEEDASSEMBLIES
    - ADR-PWSH-TYPES-ADDTYPECOMPILES
  lens: architecture
content:
  title: BCL is a language; pwsh hosts it, and binds only by row
  kind: reference
  flow: left-to-right
  relation: uses
  theme: dark
  bands:
    - id: band-language
      label: THE BCL LANGUAGE
    - id: band-host
      label: ITS USE INSIDE THE PWSH HOST
  glyphs:
    - id: g-types
      kind: type
      label: "types/*.cs

        316 sources"
      in: band-language
    - id: g-library
      kind: set
      label: Base Class Library
      in: band-language
    - id: g-bcl-yml
      kind: file
      label: "bcl.yml

        pair + 7 rows"
      in: band-language
    - id: g-projects
      kind: file
      label: "catzc.sln + .csproj

        Debug | Any CPU"
      in: band-language
    - id: g-import
      kind: code
      label: "Import-CSharpTypes

        Add-Type, in-process"
      in: band-host
    - id: g-unwrap
      kind: code
      label: ConvertTo-BclValue
      in: band-host
    - id: g-sma
      kind: set
      label: "System.Management

        .Automation"
      in: band-host
    - id: g-gate
      kind: gate
      label: Test-BclReferences
      in: band-host
  edges:
    - from: g-types
      to: g-library
      kind: flow
      label: references
    - from: g-bcl-yml
      to: g-projects
      kind: flow
      label: one pair
    - from: g-import
      to: g-types
      kind: flow
      label: compiles
    - from: g-unwrap
      to: g-types
      kind: flow
      label: plain values
    - from: g-types
      to: g-sma
      kind: flow
      label: only by a row
    - from: g-bcl-yml
      to: g-gate
      kind: flow
      label: rows
    - from: g-gate
      to: g-sma
      kind: flow
      label: checks
  legend: auto
  minimaps:
    track-placement:
      - cell: modules/pwsh
        by:
          - pwsh/Catzc.Base.Contracts/types/ContractSchema.cs
          - pwsh/Catzc.Base.Docs/configs/adrs.yml
          - pwsh/Catzc.Base.Docs/types/AdrCodeForm.cs
          - pwsh/Catzc.Base.Docs/types/AdrRuleSet.cs
          - pwsh/Catzc.Base.Languages/tests/types/BclConfig.Tests.ps1
          - pwsh/Catzc.Base.Languages/types/BclConfig.cs
          - pwsh/Catzc.Base.Languages/types/BclHostBinding.cs
          - pwsh/Catzc.Base.Maps/types/HelveticaMetrics.cs
          - pwsh/Catzc.Base.Maps/types/PdfDocument.cs
          - pwsh/Catzc.Base.Maps/types/PdfPage.cs
          - pwsh/Catzc.Base.Maps/types/SquarifiedTreemap.cs
          - pwsh/Catzc.Base.QualityGates/types/GzipText.cs
          - pwsh/Catzc.Base.QualityGates/types/SentenceGuid.cs
          - pwsh/Catzc.Base.TypesSystem/Invoke-BuildForVSCode.ps1
          - ADR-BCL-TYPES-BCLREFERENCESET
          - ADR-BCL-TYPES-DEBUGANYCPU
          - ADR-PWSH-TYPES-ADDTYPECOMPILES
          - ADR-PWSH-TYPES-HOSTGUARANTEEDASSEMBLIES
      - cell: pipelines/ado-pipelines
        by:
          - .ado/pipelines/ci-pwsh.yaml
          - ADR-BCL-TYPES-BCLREFERENCESET
          - ADR-BCL-TYPES-DEBUGANYCPU
          - ADR-PWSH-TYPES-ADDTYPECOMPILES
          - ADR-PWSH-TYPES-HOSTGUARANTEEDASSEMBLIES
      - cell: documentation/docs
