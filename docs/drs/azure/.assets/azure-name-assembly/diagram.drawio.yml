          - pwsh/Catzc.Azure.Templates/Get-AzureResourceTypeSet.ps1
          - pwsh/Catzc.Azure.Templates/Get-BicepResourceName.ps1
          - pwsh/Catzc.Azure.Templates/Get-BicepTemplates.ps1
          - ADR-AZ-NAMING
      - cell: pwsh/Catzc.Azure.Templates/tests
