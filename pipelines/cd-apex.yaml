# CD pipeline for customer apex — thin root that extends the shared customer CD template.
#
# Supplies only meta selection criteria: the customer key and the per-deployment env/slot/service-
# connection/assert map. All structure (CI build, foundation -> discovery -> expedition ordering) lives
# in /pipelines/extends/cd-customer.yaml. apex has both tiers, and the lists name exactly apex's configs:
# foundation and discovery (the apex spoke) at nsub and psub; expedition at dev, the special slot
# dev-blu, and prod. The target subscription is what each service connection logs into; the
# subscriptionIdAssertIs GUID (from azure.yml) pins it. Triggers live here because they are honored
# only at the pipeline root.
#
# Reference shape: 'sc-apex-*' are illustrative until real service connections + a non-placeholder
# azure.yml exist.

# Trigger = the 'apex' globset projected into ADO-native path filters (Get-GlobSetTrigger,
# [ADR-FLOW-CD-GLOBS](/docs/adr/flow/durable-sha-globs.md)):
# the foundation, discovery, and expedition templates + modules, plus apex's own configuration subfolder of
# each, minus the other deployments' config. A deeper-folder include (configuration/apex/**) over the broader
# exclude, so ADO keeps it.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - infrastructure/templates/foundation/**
      - infrastructure/modules/**
      - infrastructure/templates/discovery/**
      - infrastructure/templates/expedition/**
      - infrastructure/templates/foundation/configuration/apex/**
      - infrastructure/templates/discovery/configuration/apex/**
      - infrastructure/templates/expedition/configuration/apex/**
    exclude:
      - infrastructure/templates/foundation/configuration/*.yml
      - infrastructure/templates/foundation/configuration/*/**
      - infrastructure/templates/discovery/configuration/*.yml
      - infrastructure/templates/discovery/configuration/*/**
      - infrastructure/templates/expedition/configuration/*.yml
      - infrastructure/templates/expedition/configuration/*/**

pr:
  branches:
    include: [main]
  paths:
    include:
      - infrastructure/templates/foundation/**
      - infrastructure/modules/**
      - infrastructure/templates/discovery/**
      - infrastructure/templates/expedition/**
      - infrastructure/templates/foundation/configuration/apex/**
      - infrastructure/templates/discovery/configuration/apex/**
      - infrastructure/templates/expedition/configuration/apex/**
    exclude:
      - infrastructure/templates/foundation/configuration/*.yml
      - infrastructure/templates/foundation/configuration/*/**
      - infrastructure/templates/discovery/configuration/*.yml
      - infrastructure/templates/discovery/configuration/*/**
      - infrastructure/templates/expedition/configuration/*.yml
      - infrastructure/templates/expedition/configuration/*/**

extends:
  template: /pipelines/extends/cd-customer.yaml
  parameters:
    Customer: apex
    Foundations:
      - { env: nsub, serviceConnection: sc-apex-nonprod, subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000 }
      - { env: psub, serviceConnection: sc-apex-prod, subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000 }
    Discoveries:
      - { env: nsub, serviceConnection: sc-apex-nonprod, subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000 }
      - { env: psub, serviceConnection: sc-apex-prod, subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000 }
    Expeditions:
      - { env: dev, serviceConnection: sc-apex-nonprod, subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000 }
      - { env: dev, slot: blu, serviceConnection: sc-apex-nonprod, subscriptionIdAssertIs: a0e00000-de00-50b0-0000-000000000000 }
      - { env: prod, serviceConnection: sc-apex-prod, subscriptionIdAssertIs: a0e00000-000d-50b0-0000-000000000000 }
