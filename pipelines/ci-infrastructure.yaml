# catzc:
#   derived:
#     path: pipelines/ci-infrastructure.yaml
#     kind: pipeline
# ---

# Build and verify only, no artifact and no deploy; az bicep build is offline, so Mode stays none and no auth is needed.
# [ADR-FLOW-CD-TYPE](/docs/adr/flow/pipeline-types.md),
# [ADR-FLOW-CD-GLOBS](/docs/adr/flow/durable-sha-globs.md) [comment:1](/docs/references/pipelines/ci-infrastructure.yaml.md#comment1)

trigger:
  branches:
    include: [main]
  paths:
    include: [infrastructure/**]

pr:
  branches:
    include: [main]
  paths:
    include: [infrastructure/**]

jobs:
  - job: CI
    displayName: "CI engine — validate & build foundation / discovery / expedition"
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Assert-BicepTemplate foundation"
          RunCommand: "Assert-BicepTemplate foundation"
      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Build-Bicep foundation (compile + render + verify)"
          RunCommand: "Build-Bicep foundation"

      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Assert-BicepTemplate discovery"
          RunCommand: "Assert-BicepTemplate discovery"
      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Build-Bicep discovery (compile + render + verify)"
          RunCommand: "Build-Bicep discovery"

      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Assert-BicepTemplate expedition"
          RunCommand: "Assert-BicepTemplate expedition"
      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Build-Bicep expedition (compile + render + verify)"
          RunCommand: "Build-Bicep expedition"

      # The L2 test builds every shipped template and checks its rendered parameter files against the compiled parameter model.
      # [ADR-AUTO-TEST#37](/docs/adr/automation/test-automation.md#rule-adr-auto-test37),
      # [ADR-AZ-DATAMOD#9](/docs/adr/azure/azure-data-model.md#rule-adr-az-datamod9)
      # [comment:2](/docs/references/pipelines/ci-infrastructure.yaml.md#comment2)
      - template: /pipelines/steps/invoke-automation.yaml
        parameters:
          DisplayName: "Test-Automation -Suite infrastructure"
          RunCommand: "Test-Automation -Suite infrastructure"
