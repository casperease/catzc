trigger: none
pr: none

parameters:
  - name: CiRunId
    displayName: "Run id of the certifying cd-nova run (its CI stage built the artifact)"
    type: string
  - name: Target
    displayName: "The rung to deploy"
    type: string
    values: [release-uat]

stages:
  # release-uat is test; the RC approval check on nova-release-uat holds the job for its certifier (ADR-FLOW-CD-TWORELEASEGATES).
  - ${{ if eq(parameters.Target, 'release-uat') }}:
      - template: /pipelines/stages/deploy-unit.yaml
        parameters:
          Unit: nova
          Expeditions:
            - {
                env: test,
                adoEnvironment: nova-release-uat,
                serviceConnection: sc-nova-nonprod,
                subscriptionIdAssertIs: 000a0000-de00-50b0-0000-000000000000,
              }
          ArtifactPipeline: cd-nova
          RunId: ${{ parameters.CiRunId }}
