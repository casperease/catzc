# Each fragment and file schema of what GitHub reads, with the repository files it binds.
applies_to:
  README.md:
    - ".github/README.md"
  workflows/workflow.yml.schema.json:
    - ".github/workflows/*.yml"
  workflows/ci-pwsh.yml:
    - ".github/workflows/ci-pwsh.yml"
  workflows/release-automation.yml:
    - ".github/workflows/release-automation.yml"
