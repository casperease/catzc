# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-BuildArtifact, the quality gate that builds the selected
# modules once into a temporary destination, verifies the built artifact by facet, and returns its result under -PassThru.
parameters:
  Module: string[]
  ModuleProfile: string
  Facet: string[]
  OutputFolder: string
  PassThru: switch
output: Catzc.Base.Reports.QualityGateResult
