# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-Spelling, the quality gate that spell-checks the
# repository's known file types with cspell, and returns its result under -PassThru.
parameters:
  Path: string[]
  Exclude: string[]
  OutputFolder: string
  PassThru: switch
output: Catzc.Base.Reports.QualityGateResult
