# Provided command contract (ADR-REPO-CMDCONTRACT#1): the call interface of Format-MarkdownTitle, which makes the H1 of every
# in-scope Markdown file its title. RepositoryRoot defaults to the repository root, a computed default the contract does not restate.
parameters:
  Path: string[]
  RepositoryRoot: string
  DryRun: switch
  PassThru: switch
output: string[]
