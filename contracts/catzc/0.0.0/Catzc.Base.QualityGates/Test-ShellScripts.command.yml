# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-ShellScripts, the quality gate that checks every shell
# script for LF line endings, the executable bit and its syntax check, and returns its result under -PassThru.
parameters:
  ShellCheckExclude: string[]
  OutputFolder: string
  PassThru: switch
output: Catzc.Base.Reports.QualityGateResult
