# Provided command contract (ADR-REPO-CMDCONTRACT#1): the call interface of Test-Contracts, the quality gate that checks the repository
# honours every binding contract asset and every released folder is unchanged, and returns its result under -PassThru.
parameters:
  Version: string = 0.0.0
  RepositoryRoot: string
  OutputFolder: string
  PassThru: switch
output: Catzc.Base.Reports.QualityGateResult
