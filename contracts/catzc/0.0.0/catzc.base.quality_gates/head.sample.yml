# Provided sample of a file's meta head
# ([ADR-REPO-CONTRACT-CONTRACTASSET](/docs/drs/repository/api-contracts.md#rule-adr-repo-contract-contractasset)): the shape a tool may rely on when it reads the
# `catzc.immutable` and `catzc.edges` parts of a head. A head has two shapes. The navigation head of an authored code or config file, this
# sample, holds `with_body_sha` and the edges: the ADR codes it cites, its comment page (`docs`), its test (`test`), and on a test the file it
# tests (`code`). A generated file's head holds `with_body_sha`, `warning`, `role`, `track`, `generator` and `source`. Every other fact about
# a file is derived on demand, never shown. Only `with_body_sha` is required, and a fact a file has no value for is left out. Its schema,
# head.schema.json, lists the keys of both shapes.
catzc:
  immutable:
    with_body_sha: 3fa91c0d2b7e
  edges:
    test: pwsh/Catzc.Widget/tests/Get-Gadget.Tests.ps1
    docs: "[Get-Gadget.ps1.md](docs/references/pwsh/catzc-widget/Get-Gadget.ps1.md)"
    cites:
      - ADR-WIDGET-GADGET-SPINS
      - ADR-WIDGET-GADGET-STOPS
      - ADR-WIDGET-SPINNER
