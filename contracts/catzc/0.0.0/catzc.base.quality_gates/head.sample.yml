# Provided sample of a file's meta head
# ([ADR-REPO-CONTRACT-CONTRACTASSET](/docs/drs/repository/api-contracts.md#rule-adr-repo-contract-contractasset)): the shape a tool may rely on when it reads the
# `catzc.immutable` and `catzc.edges` parts of a head. A head has two shapes. The head of an authored file, this sample, holds edges only:
# its comment page (`docs`) and the ADR codes it cites (`cites`); a file with neither carries no head. A generated file's head holds
# `warning`, and `with_body_sha` while git tracks the file. Every other fact about a file is derived on demand, never shown. No key is
# required, and a fact a file has no value for is left out. Its schema, head.schema.json, lists the keys of both shapes.
catzc:
  edges:
    docs: "[Get-Gadget.ps1.md](docs/references/pwsh/catzc-widget/Get-Gadget.ps1.md)"
    cites:
      - ADR-WIDGET-GADGET-SPINS
      - ADR-WIDGET-GADGET-STOPS
      - ADR-WIDGET-SPINNER
