# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Get-AccostedFragment, which renders the commands of an
# accosted file as a PowerShell fragment through the one reader (ADR-AUTO-ACCOSTED-ONEREADER). RepositoryRoot defaults to the repository root,
# a computed default the contract does not restate.
parameters:
  path: string!
  run_number: int
  command_number: int
  repository_root: string
output: string
