# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Invoke-GoTest, the Go test runner of one module. Engine
# defaults to the pwsh engine of the engine registry, a computed default the contract does not restate.
parameters:
  Module: string!
  EntryScript: string
  GoExecutable: string
  Engine: string
  EngineExecutable: string
  Folder: string
output: Catzc.Base.Languages.GoTestResult
