# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Invoke-PythonTest, the Python test runner of one
# module. Engine defaults to the pwsh engine of the engine registry, a computed default the contract does not restate.
parameters:
  module: string!
  entry_script: string
  uv_executable: string
  engine: string
  engine_executable: string
  folder: string
output: catzc.base.languages.python_test_result
