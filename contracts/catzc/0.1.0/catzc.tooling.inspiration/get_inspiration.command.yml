# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Get-Inspiration, which lists the inspirations
# catzc reads for ideas: all of them, one by id, or a count of them at random with an optional seed.
parameters:
  id: string! in id
  count: int! in random
  seed: int in random
  include_unavailable: switch in all,random
output: catzc.tooling.inspiration.inspiration
default_set: all
