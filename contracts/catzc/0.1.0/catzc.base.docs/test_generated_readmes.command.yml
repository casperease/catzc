# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-GeneratedReadmes, the quality gate that
# checks every generated README is gitignored, untracked and current, and returns its result under -PassThru.
parameters:
  output_folder: string
  pass_thru: switch
output: catzc.base.reports.quality_gate_result
