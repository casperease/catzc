# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Register-AdoBuildValidation, which creates or
# updates the build-validation branch policy tied to a globset. Branch, Project, Organization and RepositoryName default to the configured
# values, computed defaults the contract does not restate; DryRun reports the change instead of making it.
parameters:
  glob_set: string!
  pipeline: string
  branch: string
  project: string
  organization: string
  repository_name: string
  dry_run: switch
