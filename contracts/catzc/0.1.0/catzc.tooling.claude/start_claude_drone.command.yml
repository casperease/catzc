# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Start-ClaudeDrone, which opens Count new Claude
# Code drone sessions in terminals of their own, in the repository root. Agent and Launcher default to the claude-drone config; Model is
# passed only when given; DryRun starts nothing and returns each launch's command line, PassThru returns each command line after it started.
parameters:
  agent: string
  model: string
  prompt: string
  count: int = 1
  launcher: string
  pass_thru: switch
  dry_run: switch
output: string[]
