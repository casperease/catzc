# Each fragment and file schema of the provided contracts, with the repository files it binds. A schema that sits beside a sample
# payload applies to that sample, and a command contract to its command's file, so neither is named here.
applies_to:
  catzc.azure.dev_ops/pipeline.yaml.schema.json:
    - ".ado/pipelines/**/*.yaml"
  catzc.azure.templates/main.json.schema.json:
    - "pwsh/Azure.Templates/tests/assets/parameter-model/main.json"
  catzc.tooling.github/workflow.yml.schema.json:
    - ".github/workflows/*.yml"
  catzc.base.globs/file-kinds.yml:
    - "pwsh/Base.Globs/configs/file-kinds.yml"
