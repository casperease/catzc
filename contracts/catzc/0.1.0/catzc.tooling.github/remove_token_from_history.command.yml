# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Remove-TokenFromHistory, which scrubs a token from a git
# history's blob content and commit messages. RepositoryPath defaults to the repository root, a computed default the contract does not
# restate; SkipMessages leaves the commit messages alone, and DryRun reports what would change.
parameters:
  token: string!
  replace_with: string = ***REMOVED***
  skip_messages: switch
  repository_path: string
  dry_run: switch
