# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Uninstall-Java, which uninstalls Java through the
# platform package manager. Version defaults to the version tools.yml locks, a computed default the contract does not restate; Remove
# escalates to Remove-Java for an off-config install, and Force confirms that destructive step (ADR-AUTO-REMOVE-DOUBLYGUARDED).
parameters:
  version: string
  remove: switch
  force: switch
