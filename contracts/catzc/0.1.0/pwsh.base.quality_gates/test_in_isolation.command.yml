# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-InIsolation, which copies a module profile or
# named modules into a sandbox, runs their tests there and returns the run's result under -PassThru.
parameters:
  module_profile: string = minimal in module_profile
  modules: string[]! in modules
  isolation: string = Process
  category: string = Logic
  max_level: int = 1
  min_level: int = 0
  destination: string
  keep_sandbox: switch
  pass_thru: switch
output: catzc.base.reports.isolation_run_result
default_set: module_profile
