description: Copies a module profile into a temporary sandbox and runs its tests in isolation, in a clean child pwsh or the current session, so a subset of the toolset is verified deterministically.
parameters:
  module_profile: string = minimal in module_profile
  modules: string[]! in modules
  isolation: string = Process
  category: string = Logic
  max_level: int = 1
  min_level: int = 0
  destination: string
  keep_sandbox: switch
  pass_thru: switch
output: catzc.base.reports.isolation_run_result
default_set: module_profile
