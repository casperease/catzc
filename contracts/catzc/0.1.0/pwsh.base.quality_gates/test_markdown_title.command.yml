# Provided command contract (ADR-REPO-CMDCONTRACT-COMMANDCONTRACT): the call interface of Test-MarkdownTitle, the quality gate that fails on
# any in-scope Markdown file whose title or headings are not in normal form, and returns its result under -PassThru.
parameters:
  path: string[]
  repository_root: string
  output_folder: string
  pass_thru: switch
output: catzc.base.reports.quality_gate_result
