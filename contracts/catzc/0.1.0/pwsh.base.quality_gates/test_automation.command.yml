description: Runs all Pester tests found across the catzc modules, sharded across parallel worker processes.
parameters:
  min_level: int = 0
  max_level: int = 3
  modules: string[]
  category: string = Both
  workers: int = 0
  greedy_group_size: int = 0
  timeout_seconds: int
  output: string = Detailed
  pass_thru: switch
  enforce_timings: switch
  rule: string[]
  suite: string
  output_folder: string
  isolated: switch
  keep_sandbox: switch
output: catzc.base.reports.test_run_result
