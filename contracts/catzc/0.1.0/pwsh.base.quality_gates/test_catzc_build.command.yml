description: Runs a build run, the same tests as Test-Automation, against a fresh build of the selected modules.
parameters:
  module: string[]
  module_profile: string
  min_level: int = 0
  max_level: int = 3
  category: string = Both
  workers: int = 0
  output: string = Detailed
  pass_thru: switch
output: catzc.base.reports.test_run_result
