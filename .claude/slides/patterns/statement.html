<section
    id="{{@id}}"
    data-transition="fade"
    style="background:{{@token.bg_raised}};color:{{@token.ink}};font-family:{{@face.text}};padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:center;gap:40px"
>
    <p style="font-size:{{@scale.caption}}px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:{{@token.accent}}">
        {{eyebrow}}
    </p>
    <h2 style="font-family:{{@face.display}};font-size:{{@scale.h2}}px;font-weight:400;line-height:1.1;color:{{@token.accent}}">
        {{title}}
    </h2>
    <div data-field="lead" data-max="1" data-max-words="45" style="display: flex; flex-direction: column; gap: 24px">
        <p data-item style="font-size:{{@scale.h3}}px;line-height:1.3;max-width:1600px">{{item}}</p>
    </div>
    <div data-field="body" data-optional data-max="1" data-max-words="45" style="display: flex; flex-direction: column; gap: 24px">
        <p data-item style="font-size:{{@scale.body}}px;line-height:1.4;color:{{@token.ink_soft}};max-width:1500px">{{item}}</p>
    </div>
    <p style="position:absolute;left:128px;bottom:64px;font-size:{{@scale.caption}}px;color:{{@token.ink_muted}}">{{@page}}</p>
    <aside>{{notes?}}</aside>
</section>
