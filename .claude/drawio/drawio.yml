# The draw.io kit's sensible defaults, declared once; a script parameter overrides an entry for one run, never the file.
# Two-level mapping only: a section, then key: value. drawio_png.py reads it without a YAML library.
renderer:
  page: dark          # dark | model. dark: every render sits on the dark page (STYLE.md tokens); model: the model's own background, white allowed. Parameter: --page
  out: out/drawio     # where drawio_forward.py lands its artifacts when no <out_dir> argument is given
